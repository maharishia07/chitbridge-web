<!doctype html>
<html lang="en" data-tokens="list">
<head>
<meta charset="utf-8">
<script src="/config.js"></script>   <!-- HX1: window.CB_API — this deploy's one api address -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CB Operations</title>
<!-- ⭐ CB Operations — Stock and Suppliers as a small app (T3-OPS, 2026-10-14; Home's "CB Operations" door, docs/design/INDEX-NOT-APP.md).
     The FRAME is CBFrame's standard skeleton (sidebar + full-width main, page-frame.js + page-skeleton.css), as settings.html and tasks.html.
     The SCREENS are modules, never drawn here:
       Stock     → app/cap-stock.js     (on hand per product from the ONE stock reader, api lib/stock-store.onHand; batches + expiry; least first)
       Suppliers → app/cap-suppliers.js (the supplier list, can-you-order readiness, add · link · remove; supName/supKindOf/isUserId moved there from app.html)
     Both lists are CBList; every write is CBAction (M64); who may write is the server's answer (a refusal is painted in its own words).
     NOT HERE YET: the certificate check against what you require of a supplier (OPS-S2) — each supplier row says so. Linked from Home, never from app.html. -->
<link rel="stylesheet" href="/app/page-skeleton.css">   <!-- the standard page skeleton (sidebar + main pane), drawn by CBFrame -->
<style>
/* the Cream values of the names the lists and the skeleton paint with (tasks.html's set); a chosen theme re-points them (data-themed below) */
:root{ --ink:#2a2418; --muted:#5c5240; --grey:#5c5240; --line:#e6dcc6; --line-3:#d8ccb0; --surface:#fffdf8; --card:#fffdf8; --ground:#fbf6ec; --paper:#fbf6ec; --hover:#f3ead7; --accent:#1f5f5b; --accent-ink:#fbf6ec;
  --green-t:#E8F4ED; --green-b:#A9D3BC; --green-d:#0D4A2B; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205; --red-t:#FBEAE3; --red-b:#E7B9A8; --red-i:#8E3517;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif; }
/* a chosen theme (CBAvatar stamps data-themed) re-points this page's names at the theme's own — as settings.html / finance.html; Cream is untouched */
:root[data-themed]{--side:var(--card);--line-side:var(--line);--ink-2:var(--ink);--muted-2:var(--grey);--muted:var(--grey);--hover-nav:color-mix(in srgb,var(--ink) 8%,var(--card));--surface:var(--card);--ground:var(--paper);--line-3:var(--line);
  --accent:var(--blue-2,var(--blue));--accent-text:var(--blue-d,var(--blue));--accent-ink:var(--card);
  --green-t:var(--ok-tint);--green-b:var(--line);--green-d:var(--ok-2);--amber-t:var(--warn-tint);--amber-b:var(--gold-line,var(--line));--amber-i:var(--warn-2);
  --red-t:var(--danger-tint,var(--card));--red-b:var(--line)}
/* the red that carries WORDS (as crm.html's --red-text): the avatar's list rule points --red-i at the theme's --disp-2, a BORDER red (3:1 in Dark) —
   re-pointed here at the theme's own --disp toward the ink, one step more specific than the avatar's rule */
html:root[data-tokens="list"][data-themed]{--red-i:color-mix(in srgb,var(--disp,#8e3517) 70%,var(--ink))}
*{box-sizing:border-box}
body{margin:0;background:var(--ground,#fbf6ec);color:var(--ink,#2a2418);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
.sub{color:var(--muted,#5c5240);font-size:13px}
.cbsk .screen > #ops{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#ops > .op-list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.op-lot{padding:3px 0}
.op-kind{border:0;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 18px}
.op-kind legend{padding:0}
.op-kind label{display:inline-flex;align-items:center;gap:6px;min-height:40px;cursor:pointer}
.op-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.fl{display:block;font-size:13.5px;font-weight:600;margin:12px 0 4px;color:var(--ink,#2a2418)}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border:1px solid var(--accent,#1f5f5b);border-radius:9px;background:var(--accent,#1f5f5b);color:var(--accent-ink,#fbf6ec);font-size:14px;font-weight:600}
.act.quiet{background:transparent;border-color:var(--line-3,#d8ccb0);color:var(--ink,#2a2418)}
.cbl:not(#_) .act{color:var(--accent-ink,#fbf6ec)}.cbl:not(#_) .act.quiet{color:var(--ink,#2a2418)}   /* CBList weighs its rules with :not(#_) and sets button{color:inherit}; the page's one action keeps its own ink (as crm.html :not(#_)) */
.act[disabled]{cursor:not-allowed}
.act[data-action-state="busy"]{opacity:.7}
.inp{width:100%;border:1px solid var(--line-3,#d8ccb0);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;background:var(--surface,#fffdf8);color:var(--ink,#2a2418)}
.err{font-size:13.5px;color:var(--red-i,#8E3517);margin-top:10px}
.err:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line-3,#d8ccb0);background:var(--surface,#fffdf8);color:var(--ink,#2a2418);font-size:12px;font-weight:600;white-space:normal}
.tag.green{background:var(--green-t,#E8F4ED);border-color:var(--green-b,#A9D3BC);color:var(--green-d,#0D4A2B)}
.tag.amber{background:var(--amber-t,#FDF3DC);border-color:var(--amber-b,#EFD39A);color:var(--amber-i,#7A5205)}
.tag.red{background:var(--red-t,#FBEAE3);border-color:var(--red-b,#E7B9A8);color:var(--red-i,#8E3517)}
.empty{margin:20px;padding:40px 20px;text-align:center;border:1px dashed var(--line-3,#d8ccb0);border-radius:14px;color:var(--muted,#5c5240);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .t{font-family:var(--serif);font-size:19px;color:var(--ink,#2a2418);font-weight:700}
.loadwrap{display:flex;align-items:center;gap:10px;color:var(--muted,#5c5240);padding:18px 20px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line-3,#d8ccb0);border-top-color:var(--accent,#1f5f5b);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
dialog.sheet{border:1px solid var(--line,#e6dcc6);border-radius:14px;padding:20px;width:min(560px,96vw);max-height:92vh;overflow:auto;background:var(--surface,#fffdf8);color:var(--ink,#2a2418);position:relative}
dialog.sheet::backdrop{background:var(--scrim,rgba(42,36,24,.4))}
dialog.sheet h2{margin:0 0 4px;font-family:var(--serif);font-size:21px;padding-right:28px}
dialog.sheet .mx{position:absolute;right:8px;top:8px;border:0;background:transparent;font-size:18px;color:inherit;min-width:40px;min-height:40px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:min(520px,92vw)}
#toast .toast{background:var(--ink,#2a2418);color:var(--ground,#fbf6ec);padding:12px 16px;border-radius:10px;font-size:14px}
#netpill{position:fixed;right:12px;bottom:12px;font-size:12px;color:var(--muted,#5c5240)}
</style>
</head>
<body>
<div id="ops" data-testid="ops-screen"><div class="loadwrap"><span class="spin"></span> Loading</div></div>
<div id="toast"></div>
<script>
'use strict';
/* ── the host globals core.js and the modules expect (as tasks.html / settings.html declare them) ── */
const CFG = { API_BASE: window.CB_API };
let SESSION = { token: null, role: null, name: null, entity: null, bridgeId: null };
const EP = {};
function go(){ if (window.CBFrame) CBFrame.ended(); }   /* api()'s 401 → drop the session, the one sign-in window shows (page-frame.js) */
</script>
<script src="/engine/screen.js"></script>
<script src="/app/edition.js"></script>
<script src="/app/avatar.js"></script>
<script src="/engine/signin.js"></script>
<script src="/app/signin-ui.js"></script>
<script src="/app/one-person.js"></script>
<script src="/app/core.js"></script>            <!-- api() + the registry -->
<script src="/app/accounts-shell.js"></script>  <!-- CBAction (M64) · tx · txf · toast · CBConfirm · CB_PARTY_EP (supList · supAdd · supPatch · supDel) -->
<script>Object.assign(EP, CB_PARTY_EP);</script>
<script src="/app/locale.js"></script>          <!-- CBLocale: numbers and dates in the reader's format -->
<script src="/app/helpers.js"></script>         <!-- esc · taxIdWord (the pack's word: GSTIN · ABN · TRN · "Tax number" with no pack) -->
<script src="/engine/tax.js"></script>          <!-- CBRegulation: the packs taxIdWord reads -->
<script src="/app/rail-bell.js"></script>
<script src="/app/shell.js"></script>
<script src="/app/page-frame.js"></script>
<script src="/app/list-ctl.js"></script>        <!-- CBList: the one list control -->
<script src="/app/cap-stock.js"></script>       <!-- Stock -->
<script src="/app/cap-suppliers.js"></script>   <!-- Suppliers -->
<script>
'use strict';
(function () {
  if (window.CBShell && CBShell.apiBase) CFG.API_BASE = CBShell.apiBase() || CFG.API_BASE;
  var SECTIONS = [
    { k: 'stock',     label: 'Stock',     icon: 'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10' },
    { k: 'suppliers', label: 'Suppliers', icon: 'M3 20V9l6 4V9l6 4V5h6v15zM7 17h2M12 17h2M17 17h2' },
  ];
  var host = document.getElementById('ops'), frame = null;
  function secOf(){ var h = (location.hash || '').replace(/^#\/?/, '').split(/[?&]/)[0]; return SECTIONS.some(function (s) { return s.k === h; }) ? h : 'stock'; }
  function paint(k){
    if (frame && frame.skeleton) frame.skeleton.setActive(k);
    if (location.hash !== '#/' + k) { try { history.replaceState(null, '', '#/' + k); } catch (e) { if (typeof cblog === 'function') cblog('info', 'operations: hash not kept — ' + e.message); } }
    if (k === 'suppliers') CBSuppliers.mount(host); else CBStock.mount(host);
  }
  frame = CBFrame.mount({ app: 'operations', work: host,   /* no kural: app/kurals.json has no operations route yet (picking one is the owner's) */
    skeleton: { name: 'CB Operations', icon: 'M12 15a3 3 0 1 0 0-6a3 3 0 0 0 0 6M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1',
      sections: SECTIONS, active: secOf(), onSection: paint } });
  var sess = frame.session;
  if (!sess || !sess.token) { host.innerHTML = '<div class="empty" data-testid="ops-signin"><div class="t">Sign in above</div></div>'; return; }
  SESSION = Object.assign({}, SESSION, { token: sess.token, role: sess.role, name: sess.name, entity: sess.entity, bridgeId: sess.bridgeId });
  window.addEventListener('hashchange', function () { paint(secOf()); });
  paint(secOf());
})();
</script>
</body>
</html>
