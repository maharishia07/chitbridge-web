# ChitBridge web — the site as vercel.json serves it (HX0): a file that exists is served; a path with NO file extension (an app-shell route) → /index.html;
# a path WITH an extension that is not a file is a real 404 (ERR-3: a missing /app/x.js used to answer 200 text/html and the browser blocked it as a script).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # the pages and their scripts change with every deploy — the browser asks again (Vercel's default for a static file is the same)
  add_header Cache-Control "public, max-age=0, must-revalidate" always;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  # HX1: /.well-known/ is never the app — a peer asking for ctp.json gets the file or a 404, never index.html (CTP discovery lives on
  # the api's own name: api docs/HOSTING.md, CTP)
  location ^~ /.well-known/ { try_files $uri =404; }
  location ~ \.[A-Za-z0-9]+$ { try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
