<!doctype html>
<html lang="en" data-tokens="list">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employees</title>
<!-- ⭐ Employees — the shop's people as a small app (P1). The FRAME is CBFrame's (the shell header, Home, the avatar, the one sign-in window — page-frame.js);
     the LIST is CBList; every write goes through CBAction. The screens are app/cap-employees.js; this page is the gate and the frame only.
     Which actions are open is the server's answer (GET /api/people). ?embed=1&view=add|onduty draws the same screens with no frame, for another page
     to open in a dialog (app/embed-host.js) — it tells its host { cb: 'employees', event: 'added' | 'changed' | 'close' }. No HR or payroll here. -->
<style>
:root{ --ink:#2a2418; --muted:#5c5240; --line:#e6dcc6; --line-3:#d8ccb0; --surface:#fffdf8; --ground:#fbf6ec; --hover:#f3ead7; --accent:#1f5f5b; --accent-ink:#fbf6ec;
  --green-t:#E8F4ED; --green-b:#A9D3BC; --green-d:#0D4A2B; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205; --red-i:#8E3517;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif; }
*{box-sizing:border-box}
body{margin:0;background:var(--ground,#fbf6ec);color:var(--ink,#2a2418);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
.sub{color:var(--muted,#5c5240);font-size:13px}
#emp{display:flex;flex-direction:column;gap:12px;padding:16px 20px 40px;min-height:60vh}
body.embed #emp{padding:14px 16px}
.emp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.emp-count{font-size:15px;padding-top:8px}
.emp-count b{font-size:22px}
.emp-list{flex:1;min-height:420px;display:flex;flex-direction:column}
.emp-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 0}
.emp-act .why{font-size:13px;color:var(--muted,#5c5240)}
.emp-act.no .act{opacity:.55;cursor:not-allowed}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border:1px solid var(--accent,#1f5f5b);border-radius:9px;background:var(--accent,#1f5f5b);color:var(--accent-ink,#fbf6ec);font-size:14px;font-weight:600}
.act.quiet{background:transparent;border-color:var(--line-3,#d8ccb0);color:var(--ink,#2a2418)}
.act[disabled]{cursor:not-allowed}
.act[data-action-state="busy"]{opacity:.7}
.inp{width:100%;border:1px solid var(--line-3,#d8ccb0);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;background:var(--surface,#fffdf8);color:var(--ink,#2a2418)}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line-3,#d8ccb0);background:var(--surface,#fffdf8);font-size:12px;font-weight:600}
.tag.green{background:var(--green-t,#E8F4ED);border-color:var(--green-b,#A9D3BC);color:var(--green-d,#0D4A2B)}
.tag.amber{background:var(--amber-t,#FDF3DC);border-color:var(--amber-b,#EFD39A);color:var(--amber-i,#7A5205)}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line-3,#d8ccb0);border-radius:14px;color:var(--muted,#5c5240);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .t{font-family:var(--serif);font-size:19px;color:var(--ink,#2a2418);font-weight:700}
.loadwrap{display:flex;align-items:center;gap:10px;color:var(--muted,#5c5240);padding:18px 0}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line-3,#d8ccb0);border-top-color:var(--accent,#1f5f5b);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
dialog.sheet{border:1px solid var(--line,#e6dcc6);border-radius:14px;padding:20px;width:min(520px,96vw);max-height:92vh;overflow:auto;background:var(--surface,#fffdf8);color:var(--ink,#2a2418);position:relative}
dialog.sheet::backdrop{background:var(--scrim,rgba(42,36,24,.4))}
dialog.sheet h2{margin:0 0 4px;font-family:var(--serif);font-size:21px}
dialog.sheet .mx{position:absolute;right:8px;top:8px;border:0;background:transparent;font-size:18px;color:inherit}
.emp-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.emp-out{min-height:20px;margin:6px 0;font-weight:600;color:var(--green-d,#0D4A2B)}
.emp-out[data-tone="error"]{color:var(--red-i,#8E3517)}
.emp-acts{display:flex;flex-direction:column;gap:6px}
.emp-panel,.emp-form{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line,#e6dcc6)}
.emp-form label{font-size:13px;font-weight:600;margin-top:4px}
.emp-opt{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line,#e6dcc6);border-radius:9px}
.emp-duty-row{padding:10px 2px;border-bottom:1px solid var(--line,#e6dcc6)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:min(520px,92vw)}
#toast .toast{background:var(--ink,#2a2418);color:var(--ground,#fbf6ec);padding:12px 16px;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<div id="emp" data-testid="emp-screen"><div class="loadwrap"><span class="spin"></span> Loading</div></div>
<div id="toast"></div>
<script src="/engine/screen.js"></script>
<script src="/app/avatar.js"></script>
<script src="/engine/signin.js"></script>
<script src="/app/signin-ui.js"></script>
<script src="/app/one-person.js"></script>
<script src="/app/accounts-shell.js"></script>
<script src="/app/rail-bell.js"></script>
<script src="/app/shell.js"></script>
<script src="/app/kural.js"></script>   <!-- CBKural: the one kural footer band; CBFrame hands it to the shell (never in an embed) -->
<script src="/app/page-frame.js"></script>
<script src="/app/list-ctl.js"></script>   <!-- CBList: the one list control -->
<script src="/app/cap-employees.js"></script>
<script>
'use strict';
(function () {
  var q = new URLSearchParams(location.search), embed = q.get('embed') === '1', view = q.get('view') || '';
  var API = q.get('api') || (window.CBShell && CBShell.apiBase && CBShell.apiBase()) || 'https://chitbridge-api-production.up.railway.app';
  var host = document.getElementById('emp');
  if (embed) document.body.classList.add('embed');
  /* embed: no frame. A host page (the till, signed in under its own shop-scoped store) is asked for its person's token over postMessage -
     kept in memory only, never stored - so the form never acts as another shop's saved login. A host that says it has none: refused politely; one that
     does not answer: the browser's own saved session, as before. */
  function start(token) {
    if (!token) { host.innerHTML = '<div class="empty" data-testid="emp-signin"><div class="t">' + (embed ? 'Sign in first' : 'Sign in above') + '</div></div>'; return; }
    CBEmployees.mount(host, { token: token, base: API, embed: embed, view: view, onEnded: function () { embed ? start(null) : CBFrame.ended(); } });
  }
  if (!embed) { start(CBFrame.mount({ app: 'employees', kural: 'employees', work: host }).token); return; }
  var own = (CBFrame.session() || {}).token;
  if (!window.parent || window.parent === window) { start(own); return; }
  var done = false;
  function give(t) { if (done) return; done = true; window.removeEventListener('message', heard); start(t); }
  function heard(e) {
    var m = e.data;
    if (e.source === window.parent && e.origin === location.origin && m && m.cb === 'host' && m.event === 'session') give(m.token || null);
  }
  window.addEventListener('message', heard);
  window.parent.postMessage({ cb: 'employees', event: 'need-session' }, location.origin);
  setTimeout(function () { give(own || null); }, 2500);   /* a host that does not answer: the browser's own saved session, as before */
})();
</script>
</body>
</html>
