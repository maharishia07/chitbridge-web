<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offer Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --page:#FCFAF5; --card:#FFFFFF; --panel:#F3EFE6;
  --line:#DDD6C6; --line-soft:#E6E0D2; --hair:#F0ECE2;
  --ink:#1D1B16; --muted:#5E594D; --faint:#8A8374; --ghost:#A8A295;
  --green:#16693F; --green-d:#0D4A2B; --green-t:#E8F4ED; --green-b:#A9D3BC;
  --amber:#E0A020; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205;
  --red:#C4562F; --red-t:#FBEAE3; --red-b:#E7B9A8; --red-i:#8E3517;
  --blue:#2F74C9; --blue-t:#E4EEFA; --blue-b:#B9D2EF; --blue-i:#174A87;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:20px 22px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.title{font-family:'Bricolage Grotesque',sans-serif;font-size:25px;font-weight:800;letter-spacing:-.02em;margin:0}
.grow{flex:1}
.chip{height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.bizSw{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:4px}
.bizSw button{height:30px;padding:0 12px;border-radius:7px;border:0;background:transparent;
  font-size:12.5px;font-weight:600;color:var(--muted)}
.bizSw button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}

.strip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:11px;padding:9px 14px;margin-bottom:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.strip b{color:var(--ink)}
.strip button{margin-left:auto;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:600}

.steps{display:flex;gap:8px;margin-bottom:16px}
.stp{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;text-align:left}
.stp .n{width:27px;height:27px;border-radius:8px;background:var(--panel);color:var(--muted);
  font-size:13px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.stp .t{display:block;font-size:13.5px;font-weight:700}
.stp .v{display:block;font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.stp.on .n{background:var(--green);color:#fff}
.stp.done .n{background:var(--green-t);color:var(--green-d)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.h{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800;margin:0}
.hs{font-size:13px;color:var(--muted);margin:4px 0 0}
.lbl{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--faint);margin-top:5px;line-height:1.35}
.screen{display:none} .screen.on{display:block}
/**
 * ── ⭐⭐⭐ [2026-09-26] SETTINGS SCREEN REBUILT PER SPEC — from Athi's own design doc
 * (offer-lab-settings.md.docx): "The screen you built is ~1,300 px tall, six cards, three yellow strips and
 * two competing action rows. The new one is one card, 281 px. Nothing was lost; things were put where they
 * belong." Reuses .inp/.two/.lbl/.seg/.btn/.acts/.chip already in this file (the doc built its prototype
 * against these exact tokens); only what's genuinely new gets a new class below.
 */
.loyrow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);
  border-radius:11px;height:50px;padding:0 13px}
.loyrow.on{border-color:var(--blue-b);background:var(--blue-t)}
.loyrow .sm{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;
  background:var(--card);height:34px;margin-left:auto}
.loyrow .sm input{border:0;outline:0;background:transparent;width:46px;padding:0 0 0 9px;
  font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;text-align:right}
.loyrow .sm span{padding:0 9px;color:var(--faint);font-size:13px;font-weight:600}
.loyrow .off{margin-left:auto;font-size:13px;color:var(--ghost);font-weight:600}
.now{font-size:13px;color:var(--muted);margin-top:9px}
.now b{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--ink)}
.now i{font-style:normal;color:var(--ghost)}
/* the fine print: one line, everything that is already fine, until "Change" opens it */
.fine{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;
  padding-top:15px;border-top:1px solid var(--hair);font-size:13px;color:var(--muted)}
.fine .dot{color:var(--ghost)}
.fine button{margin-left:auto;height:32px;padding:0 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600}
.open{display:none;margin-top:16px;border-top:1px solid var(--hair);padding-top:16px}
.open.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.fld>span.lbl{margin-bottom:6px}
.sub{font-size:12px;color:var(--ghost);margin-top:6px}
/* ⭐ "Tools become icon-only (labels drop, icons grow)" — the top-bar's .chip.tool buttons, per the spec's own
   phone rule. `.g` is the icon glyph, `.tx` its label; only .tx hides. */
.tool .g{font-size:14px;color:var(--faint);line-height:1}
@media(max-width:760px){
  .fine button{margin-left:0;width:100%}
  .grid{grid-template-columns:1fr}
  .tool{flex:1;justify-content:center;padding:0 8px}
  .tool .tx{display:none}
  .tool .g{font-size:17px}
}
.cols{display:grid;gap:16px}
@media(min-width:900px){ .c-2{grid-template-columns:1fr 1fr} }

.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
.goal{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;text-align:left;
  display:flex;gap:12px;align-items:flex-start;min-height:74px}
.goal.on{border:2px solid var(--green);background:var(--green-t);padding:13px}
.goal .gi{width:38px;height:38px;border-radius:10px;background:var(--panel);display:grid;place-items:center;
  font-size:19px;flex:0 0 auto}
.goal.on .gi{background:var(--green);color:#fff}
.goal b{display:block;font-size:14.5px;line-height:1.25}
.goal .ex{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;font-family:'IBM Plex Mono',monospace}
.grouphead{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--muted);margin:9px 0 -2px;
  display:flex;align-items:center;gap:9px}
.grouphead i{flex:1;height:1px;background:var(--line-soft);font-style:normal}

.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);font-size:14px;font-weight:600}
.seg button.on{background:var(--green);border-color:var(--green);color:#fff}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--card);
  overflow:hidden;height:48px}
.inp span{padding:0 11px;color:var(--faint);font-weight:600;font-size:14px;flex:0 0 auto;white-space:nowrap}
.inp input,.inp select{border:0;outline:0;padding:0 11px;height:100%;width:100%;background:transparent;
  font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600}
.inp select{font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500}
.inp:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-t)}
.f{margin-bottom:14px}
/* ⭐⭐⭐ [2026-09-26] item/category pickers now open #priceOverlay in a picking mode (see openPickOverlay,
   selectOf) instead of a dropdown of their own — no picker-specific CSS needed here any more. */
.ovlpickrow:hover{background:var(--green-t)}
/**
 * ── ⭐⭐⭐ [2026-09-26] "WORK IT OUT" REBUILT PER ATHI'S OWN offer-lab-workitout.html — the two discounts as a
 * side-by-side pair, a live combined-rate line, and the result as a MODAL over the controls rather than pushed
 * in below them. Reuses .headline/.res/.ovlx (already this file's own — the doc's prototype was built against
 * them); only .pair/.box/.num/.sum/.scrim/.sheet/.shhd/.tag/.shbd/.shft are genuinely new.
 * ⚠️ "Apply it to" (scopeRow()) stays the REAL picker built and tested over this whole session — checkboxes,
 * select-all, dynamic-category, clash-highlighting — not the doc's own plain <select>, which named only 4
 * illustrative options out of 7 categories and 31 products. That control was standing in for "a picker goes
 * here," the same way the Settings doc's "61%" stood in for a live number, not a literal instruction to
 * replace a working, tested mechanism with one that cannot check a box.
 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-top:16px}
.box{border:1px solid var(--line);border-radius:12px;padding:13px 15px;min-height:96px}
/**
 * ⭐⭐⭐ [found live, 2026-09-26] "take off, everyone pay this, alignment is not same as the other box" — real
 * cause, not just a styling gap: the loyalty box carried classes `box loy`, and `.loy` ALREADY existed as a
 * completely different, older component (the full-width "loyalty bar", `display:flex;align-items:center`) —
 * so the loyalty box silently inherited a flex-ROW layout that laid its header/field/hint out side by side,
 * while the plain "Take off" box (just `.box`, no such collision) stacked the same three pieces vertically.
 * Two boxes meant to be a matched pair, rendering with two different internal layouts. Renamed to `.box.on`
 * (the same plain modifier `.quick button.on`/`.pnl button.on` already use elsewhere) so nothing but THIS
 * rule ever matches it again.
 */
.box.on{border-color:var(--blue-b);background:var(--blue-t)}
.boxhd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.boxhd .t{font-size:13.5px;font-weight:700}
.num{display:inline-flex;align-items:baseline;gap:2px}
.num input{width:78px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  height:52px;padding:0 10px;text-align:right;outline:0;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:700}
.num input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-t)}
.num .u{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--faint)}
.hint.bad{color:var(--red-i);font-weight:600}
.sum{display:flex;align-items:baseline;gap:10px;margin-top:16px;padding:13px 16px;
  background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;flex-wrap:wrap}
.sum .big{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;letter-spacing:-.01em}
.sum .wd{font-size:13px;color:var(--muted)}
/* the result, as an overlay — never pushed in below the controls */
.scrim{position:fixed;inset:0;background:rgba(29,27,22,.45);display:none;
  align-items:center;justify-content:center;padding:24px;z-index:50}
.scrim.on{display:flex}
/* ⭐ [found live, 2026-09-26] "a resizable window" — native CSS resize, no JS: drag the bottom-right corner.
   min-width/min-height stop it collapsing onto its own header. */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;
  width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;
  box-shadow:0 18px 48px rgba(29,27,22,.22);overflow:hidden;resize:both;min-width:460px;min-height:340px}
/* ⭐ [found live, 2026-09-26] "it is not movable, i should be able to drag anywhere as i want" — the header
   is the drag handle (dragSheetStart()); its own buttons keep a normal pointer cursor, see the rule below. */
.shhd{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--hair);flex-wrap:wrap;
  cursor:grab;user-select:none}
.shhd:active{cursor:grabbing}
.shhd button{cursor:pointer}
.shhd h3{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;margin:0}
.tag{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;
  background:var(--green-t);color:var(--green-d);border:1px solid var(--green-b);border-radius:8px;padding:2px 9px}
.shbd{overflow:auto;padding:0}
.shft{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--hair);background:var(--page);flex-wrap:wrap;align-items:center}
.why{font-size:12.5px;color:var(--faint)}
/**
 * ── ⭐⭐⭐ [2026-09-26] THE CONTROLS, PER ATHI'S OWN offer-lab-controls_1.html — its own review corrects the
 * compact formula row this session had just shipped: "the combined figure is a sentence, not a formula ——
 * `10% + 10% off = 19%` reads like broken arithmetic — anyone checking it gets 20." One row per real number
 * (margin threshold / take off / loyalty bonus), a big typed field, and shortcut buttons that write into that
 * field and light up only while they match it — "not a second control." Reuses .sum/.sw/.note.n-bad already
 * in this file (the doc's own `.out`/`.warn` match them closely enough that a second copy would just be the
 * same tokens under a different name); `.row`/`.fld`/`.quick` are genuinely new.
 */
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--hair)}
.row:first-child{padding-top:0}
.row:last-of-type{border-bottom:0}
.row .lab{width:150px;flex:0 0 auto;font-size:13.5px;font-weight:700}
.row .lab small{display:block;font-size:11.5px;font-weight:500;color:var(--faint);margin-top:1px}
.fld{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--card);height:48px;overflow:hidden;flex:0 0 auto}
.fld input{border:0;outline:0;background:transparent;width:74px;padding:0 4px 0 12px;text-align:right;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:24px;font-weight:700}
.fld .u{padding:0 12px 0 3px;color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:700}
.fld:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-t)}
.fld.off{opacity:.4}
.quick{display:flex;gap:5px;flex-wrap:wrap}
.quick button{height:34px;min-width:52px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:700;color:var(--muted)}
.quick button.on{background:var(--green);border-color:var(--green);color:#fff}
.quick button:hover:not(.on){border-color:var(--ghost)}
@media(max-width:640px){
  .row{gap:10px}
  .row .lab{width:100%}
  .quick{width:100%} .quick button{flex:1}
}
/**
 * ── ⭐⭐⭐ [2026-09-26] THE RESULT PANEL, PER ATHI'S OWN offer-lab-result.html — a verdict said in words before
 * any table, a per-row "meets your margin?" answer with a computed "only up to N% off" fix, and a second,
 * genuinely NEW panel: what the CUSTOMER sees, cost and margin absent from it entirely, not hidden — never
 * sent there at all. Scoped `.vtbl` (not bare `table`/`td`) so this doesn't collide with `.res`/`.ovltbl`/`.g3`,
 * the other tables already on this page for other goal kinds. `.pri`/`.disabled` styling reuses `.btn` already
 * declared above.
 */
.pnl{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line-soft);border-radius:9px;padding:3px;margin-left:6px}
.pnl button{height:28px;padding:0 11px;border-radius:6px;border:0;background:transparent;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pnl button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/**
 * ⭐ [2026-09-26, holistic pass] "look at the whole as one piece again... a bit more aesthetic." Was edge-to-
 * edge with square corners while .sum (right above it) is an inset, rounded, bordered card — two different
 * visual languages stacked directly on each other, a real seam from being assembled across several docs. Now
 * matches .sum's own treatment (inset, rounded, a full border in its own colour) so the two read as one flow.
 */
.verdict{display:flex;align-items:center;gap:14px;padding:14px 17px;margin-top:12px;border-radius:12px;border:1px solid}
.verdict .mk{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;font-weight:800;flex:0 0 auto;color:#fff}
.verdict .tx b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.verdict .tx span{display:block;font-size:13px;margin-top:2px;opacity:.9}
.verdict.pass{background:var(--green-t);border-color:var(--green-b);color:var(--green-d)}
.verdict.pass .mk{background:var(--green)}
.verdict.some{background:var(--amber-t);border-color:var(--amber-b);color:var(--amber-i)}
.verdict.some .mk{background:var(--amber-i)}
.verdict.fail{background:var(--red-t);border-color:var(--red-b);color:var(--red-i)}
.verdict.fail .mk{background:var(--red-i)}
.vtbl{width:100%;border-collapse:collapse;font-size:14px}
/* ⭐ "only the products should scroll" — the whole <thead> (both its rows) stays pinned while tbody scrolls
   beneath it; the verdict above the table is pinned separately, outside the scroll entirely (see
   percentVerdictHTML/paintWork). */
.vtbl thead{position:sticky;top:0;z-index:2}
.vtbl thead th{padding:10px 12px;background:var(--panel);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ghost);font-weight:700;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
.vtbl thead th:first-child{text-align:left}
.vtbl thead th.grp{text-align:center;border-left:1px solid var(--line-soft)}
.vtbl thead tr.sub th{padding:5px 12px 8px;font-size:9.5px;background:var(--panel);border-bottom:1px solid var(--line-soft);color:var(--ghost)}
.vtbl tbody td{padding:11px 12px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:14.5px}
.vtbl tbody td:first-child{text-align:left;font-family:'IBM Plex Sans',sans-serif;font-weight:600}
.vtbl tbody td.grp{border-left:1px solid var(--hair)}
.vtbl tbody tr:hover{background:var(--page)}
.vtbl .pay{display:block;font-size:16px;font-weight:700}
.vtbl .mgn{display:block;font-size:12.5px;font-weight:600;margin-top:1px}
.vtbl .mgn.ok{color:var(--green-d)} .vtbl .mgn.bad{color:var(--amber-i)} .vtbl .mgn.loss{color:var(--red-i)}
.costin{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--card);height:34px;overflow:hidden}
.costin span{padding:0 6px 0 8px;color:var(--faint);font-size:12px}
.costin input{border:0;outline:0;background:transparent;width:56px;padding:0 8px 0 0;text-align:right;
  font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600}
.costin:focus-within{border-color:var(--green);box-shadow:0 0 0 2px var(--green-t)}
.ans{font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;
  gap:6px;border-radius:8px;padding:4px 9px;white-space:nowrap}
.ans .g{font-family:'IBM Plex Mono',monospace;font-weight:800}
.ans.ok{background:var(--green-t);color:var(--green-d);border:1px solid var(--green-b)}
.ans.trim{background:var(--amber-t);color:var(--amber-i);border:1px solid var(--amber-b)}
.ans.never{background:var(--red-t);color:var(--red-i);border:1px solid var(--red-b)}
.vtbl tfoot td{padding:13px 12px;background:var(--panel);font-weight:700;text-align:right;
  font-family:'IBM Plex Mono',monospace;border-top:1px solid var(--line-soft);white-space:nowrap}
.vtbl tfoot td:first-child{text-align:left;font-family:'IBM Plex Sans',sans-serif}
.vtbl tfoot td.grp{border-left:1px solid var(--line-soft)}
/* panel 2 — the customer's own bill. no cost, no margin, anywhere. */
.billhd{padding:15px 20px 4px}
.billhd b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:800}
.billhd span{display:block;font-size:12.5px;color:var(--faint);margin-top:3px}
.bill{padding:12px 20px 20px}
.rcpt{max-width:520px;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.rcpt .ln{display:flex;align-items:baseline;gap:12px;padding:11px 16px;border-bottom:1px solid var(--hair)}
.rcpt .ln .nm{flex:1;font-size:14.5px}
.rcpt .ln .old{font-family:'IBM Plex Mono',monospace;color:var(--ghost);text-decoration:line-through;font-size:13px}
.rcpt .ln .new{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:700;min-width:62px;text-align:right}

/**
 * ⭐⭐⭐ [2026-09-26] PRINTABLE — Athi: "if it is printable, that will be good." Only the offer's own name/rate
 * and its verdict+table print; the editable controls (.no-print — margin/discount/loyalty fields, the toggle,
 * every quick-preset) and the footer's own action buttons have no place on paper. `position:sticky` is reset
 * to static for print — sticky is a screen-scrolling behaviour, and printed pages have no "scroll" to stick
 * within, only page breaks (a stuck header would otherwise repeat mid-table or clip a row behind it).
 */
@media print{
  body *{visibility:hidden}
  .scrim, .scrim *{visibility:visible}
  .scrim{position:static;background:none;display:block;padding:0}
  /* !important on position/left/top/margin: a dragged sheet carries those as INLINE styles (dragSheetStart()),
     which beat a plain stylesheet rule — without !important a print taken mid-drag would print at that fixed
     screen spot instead of full-width on the page. */
  .sheet{position:static!important;left:auto!important;top:auto!important;margin:0!important;
    width:100%;max-height:none;height:auto;box-shadow:none;border:0;resize:none;overflow:visible}
  .no-print, .shft, .ovlx, #workPnl{display:none!important}
  .shbd{overflow:visible!important}
  .vtbl thead{position:static}
  .scroll{overflow:visible!important}
}

/**
 * ── ⭐⭐⭐ THE PRICE LIST OVERLAY — ONE WINDOW, BUILT ONCE, REUSABLE (Athi: "this will help when we enable
 * other icons, it can work perfectly as a separate window") ──────────────────────────────────────────────
 * A real modal: dimmed backdrop, a fixed header with the close button, a fixed search/category toolbar, and
 * only the ROW LIST scrolls — never the whole page. Every "icon" that later wants to work against the full
 * product list (not just the ones missing a cost) opens the SAME panel; only #ovlBody's row-renderer differs.
 */
.ovl{position:fixed;inset:0;background:rgba(29,27,22,.5);z-index:200;display:none;
  align-items:center;justify-content:center;padding:24px}
.ovl.on{display:flex}
.ovlpanel{background:var(--card);border-radius:var(--r);width:min(920px,100%);max-height:min(760px,92vh);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(29,27,22,.35)}
.ovlhead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
.ovlhead h2{margin:0;font-size:18px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;flex:1}
.ovlhead .hs{margin:0}
.ovlx{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-size:16px;line-height:1;color:var(--muted);flex:0 0 auto}
.ovlx:hover{background:var(--panel)}
.ovltools{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.ovltools input[type=text],.ovltools input[type=search]{width:100%;height:42px;border:1px solid var(--line);
  border-radius:10px;padding:0 14px;font-size:14px;background:var(--card)}
.ovltools input:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 3px var(--green-t)}
.ovlcats{display:flex;gap:6px;flex-wrap:wrap}
.ovlchip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:600;color:var(--muted)}
.ovlchip.on{background:var(--green);border-color:var(--green);color:#fff}
.ovlbody{overflow:auto;flex:1 1 auto}
.ovltbl{width:100%;border-collapse:collapse;font-size:14px}
.ovltbl thead th{position:sticky;top:0;background:var(--card);text-align:left;font-size:10.5px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ghost);font-weight:700;
  padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.ovltbl td{padding:8px 14px;border-bottom:1px solid var(--hair)}
.ovltbl tr:last-child td{border-bottom:0}
.ovltbl .ovlname{font-weight:600}
.ovltbl .ovlcat{color:var(--muted);font-size:12.5px}
/* ⭐ the sale price — read-only, right-aligned like every other money figure on this page, for scale against the cost typed beside it */
.ovltbl th.ovlpriceh,.ovltbl td.ovlprice{text-align:right;font-family:'IBM Plex Mono',monospace}
.ovltbl .inp{height:36px;width:118px;margin-left:auto}
.ovlfoot{padding:10px 20px;border-top:1px solid var(--line);flex:0 0 auto;font-size:12.5px;color:var(--muted)}
@media(max-width:620px){
  .ovl{padding:0}
  .ovlpanel{width:100%;max-height:100dvh;height:100dvh;border-radius:0}
  .ovltbl .ovlcat{display:none}
}

/**

 * Athi: "if it reuses what is being used in cart, then there should not be any difference at all." The
 * markup comes from the ONE shared CBVariant.chooserHTML() (lib/variant.js) — till.html's modPaint() calls
 * the exact same function. Only the CSS below is page-specific, mapped onto Offer Lab's own tokens

   IF A NUMBER NEEDS TO KNOW HOW MUCH YOU SELL, IT IS NOT IN HERE.
   No units sold, no period, no average basket. Sales-against-volume is a
   separate feature for when real data has accumulated.

     two percentages per item, compounded, and the margin that leaves you.
       final  = price x (1 - offer%) x (1 - loyalty%)
       margin = (final - cost) / final          <- Shopify's formula, verbatim

     at three sightlines, because the cost is flat and only its SHARE moves.

     Shopify        cost -> profit + margin, live, and the margin formula
     Tally / Vyapar "Profit" for rupees, "Margin" for the percent, adjacent

     Lightspeed     cost / margin / price as linked fields on a single item
     Odoo           Min. Quantity ladders; rule on one side, effect on the other
     Cin7           N/A when there is no cost
     Fulfilment-lab free-delivery threshold: flat cost, shrinking share
     Shopify guides discount profitability as a ladder to break-even

     - No stacked cost/profit bar. Not one commercial product uses one.
     - "Markup" appears nowhere. It is the number most confused with margin.

/**

 * refresh again only 25 appearing, not 50." Real — S.margin/S.cap/etc. lived only in memory, and applyBiz()
 * (run on every load, and again every time "Use my catalogue" or the biz switcher runs) always overwrote them

var SETTINGS_KEYS=['margin','cap','custOn','belowAct','round','costSource'];
/** ⭐⭐⭐ scoped to the signed-in shop, never global — [[feedback-shop-scoped-local-store]]: settings typed for
 * one shop must not silently apply to whatever shop is tested next on the same machine. Falls back to one
 * shared 'demo' bucket only when nobody is signed in (the two sample books have no shop of their own). */
function labSettingsKey(){
  var sess=null; try{ sess=JSON.parse(localStorage.getItem('cb_sess')||'null'); }catch(_){}
  return 'cb_offerlab_settings_'+((sess&&(sess.entity||sess.name))||'demo');
}
function labSaveSettings(){
  try{
    var out={}; SETTINGS_KEYS.forEach(function(k){ out[k]=S[k]; });
    localStorage.setItem(labSettingsKey(), JSON.stringify(out));
  }catch(_){ /* a settings save that fails costs nothing beyond this one refresh not remembering it */ }
}
function labLoadSettings(){
  try{
    var raw=localStorage.getItem(labSettingsKey()); if(!raw) return;
    var saved=JSON.parse(raw);
    SETTINGS_KEYS.forEach(function(k){ if(saved[k]!==undefined) S[k]=saved[k]; });
  }catch(_){}
}
function applyBiz(id){
  var B=BIZ[id];
  CATS=B.cats.map(function(c){return {id:c[0],name:c[1]};});
  /* ⭐ modifiers, the 6th tuple slot — [] for every sample/import row, the real shape for a real catalogue */
  P=B.prods.map(function(p){return {id:p[0],name:p[1],cat:p[2],price:p[3],cost:p[4],modifiers:Array.isArray(p[5])?p[5]:[]};});
  S=Object.assign({},FRESH,{biz:id,margin:B.margin,cap:B.cap},
    JSON.parse(JSON.stringify(B.d)));
  labLoadSettings();
  /**
   * ⚠️⚠️ [found live, 2026-09-26] "if the previous panel loyalty bonus and the percentage is set, it has to
   * come to this panel automatically, why it is not cascading?" Real gap: S.custOn/S.cap (screen 0, shop-wide)
   * and S.loyOn/S.loyPct (screen 2, per-offer) are two different flags, and the per-offer one was hardcoded to
   * start off/0 in FRESH regardless of what screen 0 said. An offer now starts with loyalty inherited from the
   * shop-wide setting — still a per-offer toggle after this, loyBar() lets it be turned off or re-percented for
   * just this one offer, exactly as before; only the STARTING point cascades now.
   */
  S.loyOn = S.custOn;
  S.loyPct = S.cap;
}
function setBiz(id){var st=S.step; applyBiz(id); S.step=st; S.applied=false; render();}
function num(v){var n=parseFloat(v); return isFinite(n)?n:0;}
function R2(n){return Math.round(n*100)/100;}
function byId(id){for(var i=0;i<P.length;i++) if(P[i].id===id) return P[i]; return null;}
function catName(id){for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i].name; return '';}
function M0(n){ if(n==null||isNaN(n)) return '—';
  var neg=n<-0.004; n=Math.abs(n);
  return (neg?'−₹':'₹')+Math.round(n).toLocaleString('en-IN'); }
function PC(n){ if(n==null||!isFinite(n)) return '—';
  return (Math.round(n*10)/10)+'%'; }
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function marginPct(price,cost){return price>0?Math.round(((price-cost)/price)*100):0;}
function roundDown(v,cap){
  var r=String(S.round);
  if(r==='0') v=Math.floor(v*100)/100;
  else if(r==='1') v=Math.floor(v);
  else if(r==='5') v=Math.floor(v/5)*5;
  else if(r==='10') v=Math.floor(v/10)*10;
  return Math.min(v,cap);
}
/* the catalogue's own average margin, as a fraction. Used only where the basket
   is genuinely unknowable, and always labelled as an average when it is. */
function avgM(){var pb=0,cb=0;
  P.forEach(function(p){ if(p.cost==null) return; pb+=p.price; cb+=p.cost; });
  return pb>0?(pb-cb)/pb:0;}
function catItems(id){return P.filter(function(p){return p.cat===id;});}
/* ⭐ scope='item' now means "one or more specific items" — S.itemIds, not S.itemId. items() already returned
 * an array either way, so this is the only line the multi-item picker needed to change in the engine itself. */
function items(){ return S.scope==='item' ? (S.itemIds||[]).map(byId).filter(Boolean) : catItems(S.catId); }
function goalOf(id){for(var i=0;i<GOALS.length;i++) if(GOALS[i].id===id) return GOALS[i];}

/**
 * ── ⭐⭐⭐ EVERY NUMBER FIELD REBUILT ITSELF MID-KEYSTROKE (Athi: "couldn't edit loyalty bonus in setting
 * page, something happening there") ────────────────────────────────────────────────────────────────────────
 *
 * Not just loyalty — every input on every screen calls edit() on oninput, and render() replaces the WHOLE
 * screen's innerHTML on every call, including the very input being typed into. Destroying and recreating a
 * focused DOM node drops focus and the cursor, so typing a second digit ("15" after "1") landed nowhere —
 * indistinguishable from "the field will not take more than one character", which is exactly what was seen.
 * One character worked; anything real to type in did not.
 * ⭐ THE FIX KEEPS THE LIVE-AS-YOU-TYPE FEEL (the whole point of a lab — "flick it and watch the numbers
 * move"), rather than falling back to onchange (fires once, on blur) and losing that. Each affected input
 * carries `data-key` naming the same field edit() writes; refocus the one with a matching key after the
 * rebuild, and put the cursor back where it was.
 */
function edit(k,v){
  var af=document.activeElement, key=af&&af.getAttribute&&af.getAttribute('data-key'), start=af&&af.selectionStart, end=af&&af.selectionEnd;
  S[k]=v; S.applied=false;
  if(SETTINGS_KEYS.indexOf(k)>=0) labSaveSettings();   /* margin, cap, loyalty on/off, etc. survive a refresh */
  render();
  if(key){ var el=document.querySelector('[data-key="'+key+'"]'); if(el){ el.focus(); try{ el.setSelectionRange(start,end); }catch(_){} } }
}
function editKeep(k,v){ S[k]=v; render(); }
function go(n){ S.step=n; render(); window.scrollTo({top:0,behavior:'smooth'});
  if(n===3 && savedLive()) loadSaved();   /* the shelf may have changed on another tab/device since last look */
  closeWork();   /* navigating away from "Work it out" must not leave its result floating over the next screen */
}
function pickGoal(id){ S.goal=id; S.applied=false; S.step=2; render(); }
/**
 * ⭐⭐⭐ [2026-09-26, per offer-lab-workitout.html] THE RESULT IS A MODAL NOW, NOT A PANEL PUSHED IN BELOW THE
 * CONTROLS — Athi's own doc: "the result, as an overlay — never pushed in below the controls." `S.applied`
 * keeps its existing meaning (has this configuration been worked out at least once — still what "Work it out
 * again" / "Save for review"'s visibility key off elsewhere); `paintWork()`/`closeWork()` separately control
 * whether the modal is CURRENTLY open, so closing it to tweak a number and reopening doesn't lose that state.
 */
function apply(){
  /* fresh open always starts centred — a drag from a PREVIOUS open must not carry over */
  var sheet=document.querySelector('#workScrim .sheet');
  if(sheet){ sheet.style.position=''; sheet.style.left=''; sheet.style.top=''; sheet.style.margin=''; }
  S.applied=true; WORK_PANEL=1; SHOW_MARKUP=false; render(); paintWork();
}
function closeWork(){ var el=document.getElementById('workScrim'); if(el) el.classList.remove('on'); document.body.style.overflow=''; }
/**
 * ⭐ [found live, 2026-09-26] "it is not movable, i should be able to drag anywhere as i want" — resize:both
 * (the corner handle, added earlier) only ever changes SIZE. Dragging the header now moves the sheet itself:
 * on pointerdown it leaves the scrim's centering flex layout for `position:fixed` at its own current spot (so
 * there's no jump), then tracks the pointer until release. Bails out on a click that started on one of the
 * header's own buttons (Close, the panel tabs) so those keep working exactly as before.
 */
function dragSheetStart(e){
  if(e.target.closest('button,input,select,textarea')) return;
  var sheet=e.currentTarget.parentElement; if(!sheet||!sheet.classList.contains('sheet')) return;
  var r=sheet.getBoundingClientRect(), offX=e.clientX-r.left, offY=e.clientY-r.top;
  sheet.style.position='fixed'; sheet.style.margin='0';
  sheet.style.left=r.left+'px'; sheet.style.top=r.top+'px';
  function move(ev){
    var x=Math.min(Math.max(0,ev.clientX-offX), window.innerWidth-72);
    var y=Math.min(Math.max(0,ev.clientY-offY), window.innerHeight-48);
    sheet.style.left=x+'px'; sheet.style.top=y+'px';
  }
  function up(){ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); }
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
}
/**
 * ── ⭐⭐⭐ [2026-09-26] THE RESULT PANEL, per Athi's own offer-lab-result.html — scoped to the 'percent' goal,
 * exactly what the doc covers. Every other goal kind keeps the PREVIOUS doc's plain modal (outHTML(), "Change
 * it" to close). Reuses row() TWICE per item (once at the base rate, once at the combined rate) rather than
 * reimplementing the pricing math the doc's own prototype does from scratch — so below-cost handling
 * (S.belowAct) and rounding stay exactly as correct here as everywhere else on this page.
 */
var WORK_PANEL=1;   /* 1 = "Your margin" (cost/verdict), 2 = "On a bill" (what the customer sees) — resets to 1 each open */
var SHOW_MARKUP=false;   /* the header's own "Markup" toggle — a display preference for THIS table, not part
  of the offer, so it is never saved with it; resets to off each open, same as WORK_PANEL */
function toggleMarkup(){ SHOW_MARKUP=!SHOW_MARKUP; paintWork(); }
/**
 * ⭐⭐⭐ [found by review, 2026-09-26] A LOYALTY CUSTOMER CAN NEVER PAY MORE THAN EVERYONE ELSE. row('exclude')
 * means "leave this item's price alone rather than sell it below cost" — read literally, "alone" is the
 * item's own FULL price, which is correct for row() taken on its own. But taken as the LOYALTY price
 * specifically, on an item whose base offer alone is still fine (didn't need excluding), "leave it alone" can
 * land ABOVE the base-offer price — a loyalty bonus that charges the loyalty customer MORE than a regular one
 * for the identical item, and percentDecide() then picked whichever margin was BETTER, silently reporting a
 * pass on an item that just overcharged its own loyalty customer. Never possible under 'cap' (settles at cost,
 * always <= the base price) or 'warn' (never reverts at all) — only 'exclude', the shop's own default.
 * Capped once, here, so every reader of `.all` downstream (the table, the totals, the bill) sees the same,
 * correct number without needing its own copy of this check.
 */
function percentRows(){
  return items().map(function(p){
    var pub=row(p, offerFrac(p));
    var all=(loyMode()==='pct') ? row(p, combo(offerFrac(p), loyFrac())) : pub;
    if(all.shown>pub.shown){
      all=Object.assign({},all,{shown:pub.shown,status:pub.status,
        margin:p.cost==null?null:marginPct(pub.shown,p.cost),
        profit:p.cost==null?null:R2(pub.shown-p.cost)});
    }
    return {p:p, pub:pub, all:all};
  });
}
/** ⭐ the WORST of the two decides — "judged on what a loyalty customer pays, the lower of the two" */
function percentDecide(r){ return r.all.margin!=null ? r.all.margin : r.pub.margin; }
function percentAnswer(r){
  var target=num(S.margin);
  if(r.p.cost==null) return '<span class="ans" style="background:var(--panel);color:var(--muted);border:1px solid var(--line-soft)">— no cost</span>';
  var m=percentDecide(r), fullM=marginPct(r.p.price, r.p.cost);
  if(m>=target) return {cls:'ok', html:'<span class="ans ok">✓ yes</span>'};
  if(fullM<target) return {cls:'never', html:'<span class="ans never">✗ never · <span class="g">'+fullM+'%</span> at full price</span>'};
  var minP=r.p.cost/(1-target/100), maxOff=Math.floor((1-minP/r.p.price)*100);
  return {cls:'trim', html:'<span class="ans trim">✗ only up to <span class="g">'+Math.max(0,maxOff)+'%</span> off</span>'};
}
function percentVerdict(rs){
  var priced=rs.filter(function(r){return r.p.cost!=null;});
  var n=priced.length, pass=0, never=0, worst=null;
  priced.forEach(function(r){
    var m=percentDecide(r), fullM=marginPct(r.p.price, r.p.cost);
    if(m>=num(S.margin)) pass++; else if(fullM<num(S.margin)) never++;
    if(worst===null||m<worst.m) worst={n:r.p.name, m:m};
  });
  if(!n) return {cls:'some', html:'<span class="mk">!</span><span class="tx"><b>No priced items to judge</b><span>Add a cost to see whether this offer clears your margin.</span></span>', save:'Save anyway'};
  if(pass===n) return {cls:'pass', html:'<span class="mk">✓</span><span class="tx"><b>All '+n+' clear your '+num(S.margin)+'%</b>'+
    '<span>Lowest is '+esc(worst.n)+' at '+worst.m+'%.</span></span>', save:'Save for review'};
  if(pass>0) return {cls:'some', html:'<span class="mk">!</span><span class="tx"><b>'+(n-pass)+' of '+n+' fall under your '+num(S.margin)+'%</b>'+
    '<span>Worst is '+esc(worst.n)+' at '+worst.m+'%. Each row says what would fix it.</span></span>', save:'Save anyway'};
  return {cls:'fail', html:'<span class="mk">✗</span><span class="tx"><b>None of these '+n+' clear your '+num(S.margin)+'%</b>'+
    '<span>'+(never===n?'Not one of them reaches '+num(S.margin)+'% even at full price — the threshold, not the offer, is the problem.'
      :'Worst is '+esc(worst.n)+' at '+worst.m+'%.')+'</span></span>', save:'Save anyway'};
}

function percentTableHTML(rs){

  var h='<div class="scroll" style="overflow-x:auto"><table class="vtbl"><thead><tr>'+

    '</tr><tr class="sub">'+

      (showLoy?'<th class="grp">after '+(Math.round(combo(num(S.pctOff)/100,loyFrac())*1000)/10)+'%</th>':'')+
    '</tr></thead><tbody>'+
    rs.map(function(r){
      var ans=percentAnswer(r), ansHtml=(typeof ans==='string')?ans:ans.html;
      var mk=markupPct(r.p.price, r.p.cost);
      return '<tr>'+

          (r.p.cost==null?'':r.p.cost)+'" placeholder="?" onchange="setCost(\''+r.p.id+'\',this.value)"></span></td>'+
        '<td data-l="Price now">'+M0(r.p.price)+'</td>'+
        (SHOW_MARKUP?'<td data-l="Markup">'+(mk==null?'—':mk+'%')+'</td>':'')+
        '<td class="grp" data-l="Everyone pays"><span class="pay">'+M0(r.pub.shown)+'</span>'+
          (r.pub.margin!=null?'<span class="mgn '+(r.pub.margin<0?'loss':r.pub.margin<num(S.margin)?'bad':'ok')+'">'+r.pub.margin+'% margin</span>':'')+'</td>'+
        (showLoy?'<td class="grp" data-l="Loyalty pays"><span class="pay">'+M0(r.all.shown)+'</span>'+
          (r.all.margin!=null?'<span class="mgn '+(r.all.margin<0?'loss':r.all.margin<num(S.margin)?'bad':'ok')+'">'+r.all.margin+'% margin</span>':'')+'</td>':'')+
        '<td class="grp" data-l="Meets your '+num(S.margin)+'%">'+ansHtml+'</td></tr>';
    }).join('')+'</tbody>'+
    percentFootHTML(rs, showLoy)+
    '</table></div>';

}
function percentFootHTML(rs, showLoy){
  var priced=rs.filter(function(r){return r.p.cost!=null;});
  var tc=0,tp=0,tpub=0,tall=0;
  priced.forEach(function(r){ tc+=r.p.cost; tp+=r.p.price; tpub+=r.pub.shown; tall+=r.all.shown; });
  var tmPub=tpub>0?Math.round((tpub-tc)/tpub*100):0, tmAll=tall>0?Math.round((tall-tc)/tall*100):0;
  var tmk=tc>0?Math.round((tp-tc)/tc*100):null;
  var decide=showLoy?tmAll:tmPub, target=num(S.margin);
  return '<tfoot><tr><td>All '+rs.length+'</td><td>'+M0(tc)+'</td><td>'+M0(tp)+'</td>'+

    '<td class="grp">'+M0(tpub)+' <span class="mgn" style="display:inline">'+tmPub+'%</span></td>'+
    (showLoy?'<td class="grp">'+M0(tall)+' <span class="mgn" style="display:inline">'+tmAll+'%</span></td>':'')+
    '<td class="grp">'+(decide>=target?'<span class="ans ok">✓ yes</span>':'<span class="ans '+(decide<0?'never':'trim')+'">✗ '+decide+'%</span>')+'</td>'+
    '</tr></tfoot>';
}

          '<td class="ovlprice" style="color:'+(mk==null?'inherit':(mk<0?'var(--red-i)':'var(--green-d)'))+'">'+(costBlind?'🔒':(mk==null?'—':mk+'%'))+'</td></tr>';
      }).join('')+'</tbody></table>';
  if(foot){

/* ── the engine: two percentages, compounded ───────────────────────────── */
function offerFrac(p){
  if(S.goal==='percent') return Math.min(.99,num(S.pctOff)/100);
  if(S.goal==='amount')  return p.price>0?Math.min(1,num(S.rsOff)/p.price):0;
  return 0;
}
function loyMode(){
  if(!S.custOn || !S.loyOn) return 'none';
  if(S.goal==='percent'||S.goal==='amount') return 'pct';
  if(S.goal==='qty') return 'top';
  if(S.goal==='free') return (S.freeShape==='same'||S.freeShape==='cheapest')?'top':'either';
  if(S.goal==='bundle') return 'either';
  return 'na';
}
function loyFrac(){ return loyMode()==='pct' ? Math.min(.95,num(S.loyPct)/100) : 0; }
function combo(a,b){ return 1-(1-a)*(1-b); }
/**
 * ⭐⭐⭐ THE ONE PLACE THE REAL ENGINE ANSWERS "WHAT DOES A % OFF COME TO" (Phase: offer-lab adoption).
 * `frac` is already the combined offer+loyalty fraction (combo(), above) — a single percent_off asked of
 * CBOffers.evaluate() at that percentage is mathematically identical to price*(1-frac), and provably so:
 * verified against the spec's own §10 checks (10% off ₹70 → ₹63, compounded 10%+10% → 19% not 20%) before
 * this file was written. The difference from computing it locally is provenance, not the number — every
 * "final price" on this screen now comes from the same call the till and the storefront make, so a future
 * change to how the engine rounds or stacks reaches this page automatically instead of silently diverging.
 * ⚠️ ROUNDING AND THE BELOW-COST FLOOR STAY HERE, NOT IN THE ENGINE. They are this LAB's own policy — "never
 * show a price you would not actually charge" — not a fact about the offer, and the engine correctly knows
 * nothing about either.
 */
function engineFinal(unitPrice, frac){
  if(!(window.CBOffers && window.CBOffers.evaluate)) return R2(unitPrice*(1-frac));   /* engine missing: never blank the screen */
  var pct=Math.min(99,Math.max(0,frac*100));
  if(pct<=0) return R2(unitPrice);
  var r=CBOffers.evaluate({ lines:[{key:'x',qty:1,unitPrice:unitPrice}],
    offers:[{id:'preview',kind:'percent_off',percent:pct,scope:'line'}] });
  return R2(r.line_net.x);
}
/** ⭐ buy N of ONE item, get 1 more free (or at a %) — same-item buy_x_get_y, N+1 units on one line */
function engineBuyGetPay(unitPrice, buy, get, getPercent){
  if(!(window.CBOffers && window.CBOffers.evaluate)) return R2(unitPrice*buy);
  var r=CBOffers.evaluate({ lines:[{key:'x',qty:buy+get,unitPrice:unitPrice}],
    offers:[{id:'preview',kind:'buy_x_get_y',buy:buy,get:get,get_percent:getPercent==null?100:getPercent,scope:'line'}] });
  return R2(r.line_net.x);
}
/** ⭐ buy A, get B free (or at a %) — buy_x_get_y with a DIFFERENT reward item, exactly the cross-item shape
 * lib/offers-engine.js added for "buy rice, get oil free". Returns what is paid for A; B's line (if it were on
 * the same basket) would show as free — the wizard only ever prices the pair it was given, per spec §4. */
function engineBuyGetPayCross(aItemId, aPrice, bItemId, bQty, getPercent){
  if(!(window.CBOffers && window.CBOffers.evaluate)) return R2(aPrice);
  /* ⚠️ applies_to.item_ids RESTRICTS "BUY" TO A SPECIFICALLY, or the engine would count B's own line towards
     the purchase requirement too — the exact cross-item wiring lib/offers-engine.js was built for. */
  var r=CBOffers.evaluate({ lines:[{key:'a',item_id:aItemId,qty:1,unitPrice:aPrice},{key:'b',item_id:bItemId,qty:bQty,unitPrice:0}],
    offers:[{id:'preview',kind:'buy_x_get_y',buy:1,get:bQty,get_item_id:bItemId,get_percent:getPercent==null?100:getPercent,
             scope:'line',applies_to:{item_ids:[aItemId]}}] });
  return R2(r.line_net.a);
}
/** ⭐ buy a FEW, the cheapest of them is free — mix_and_match, one line of N units of a single item. What N of
 * ONE product pays after the cheapest of the N is free, the same kind the cheapest-of-a-mixed-shelf save uses. */
function engineMixMatchPay(unitPrice, n){
  if(!(window.CBOffers && window.CBOffers.evaluate)) return R2(unitPrice*(n-1));
  var r=CBOffers.evaluate({ lines:[{key:'x',qty:n,unitPrice:unitPrice}],
    offers:[{id:'preview',kind:'mix_and_match',buy:n-1,get:1,get_percent:100,scope:'line'}] });
  return R2(r.line_net.x);
}

/**
 * ⭐⭐⭐ [2026-09-26, per design doc] THE TOGGLE WAS REDUNDANT WITH ITS OWN THIRD OPTION. `S.belowCost:false`
 * and `S.belowAct==='warn'` always produced the identical result: neither branch here ever ran, `want` stayed
 * unchanged, and line ~1098's own after-the-fact check still caught it as 'loss' if it genuinely landed below
 * cost — the same outcome either way. So the toggle was a second way to say what the third segmented option
 * already said. Collapsed to one 3-way choice ("When an offer goes below cost": Leave it out / Sell it at
 * cost / Do it anyway); FRESH's default ('exclude') keeps the exact behaviour a shop had before this change.
 */
function row(p,frac){
  var base=p.price, want=engineFinal(base,frac), status='ok';
  if(p.cost==null) status='nocost';
  else if(want < p.cost-0.005){
    if(S.belowAct==='exclude'){ status='left'; want=base; }
    else if(S.belowAct==='cap'){ status='capped'; want=p.cost; }
    else status='loss';
  }
  var shown=R2(status==='left'?base:roundDown(want,base));
  if(p.cost!=null && shown<p.cost-0.005) status='loss';
  return {p:p, base:base, shown:shown, status:status,
    profit: p.cost==null?null:R2(shown-p.cost),
    margin: p.cost==null?null:marginPct(shown,p.cost),
    wasProfit: p.cost==null?null:R2(base-p.cost),
    wasMargin: p.cost==null?null:marginPct(base,p.cost)};
}
/* "as if one of each" — there is no volume in here, ever */
function totals(rs){
  var pb=0,pa=0,cb=0,n=0,blind=0;
  rs.forEach(function(r){ if(r.p.cost==null){blind++;return;}
    n++; pb+=r.base; pa+=r.shown; cb+=r.p.cost; });
  return {n:n, blind:blind, priceBefore:R2(pb), priceAfter:R2(pa), cost:R2(cb),
    profitBefore:R2(pb-cb), profitAfter:R2(pa-cb),
    marginBefore: pb>0?Math.round((pb-cb)/pb*100):0,
    marginAfter:  pa>0?Math.round((pa-cb)/pa*100):0};
}
function lineRows(){ var f=combo(0,loyFrac());
  return items().map(function(p){ return row(p, combo(offerFrac(p), loyFrac())); }); }

/* ── ladders (max three steps, always) ─────────────────────────────────── */
function tiers(){ return (S.tiers||[]).map(function(t){return {qty:num(t[0]),pct:num(t[1])};}); }
function setTier(i,which,v){ if(!S.tiers[i]) return; S.tiers[i][which]=Math.max(0,num(v)); S.applied=true; render(); }
function addTier(){ if(S.tiers.length>=3) return;
  var t=S.tiers[S.tiers.length-1]||[1,0];
  S.tiers.push([num(t[0])*2, Math.min(95,num(t[1])+5)]); S.applied=true; render(); }
function delTier(i){ if(S.tiers.length<=1) return; S.tiers.splice(i,1); S.applied=true; render(); }
function tierFault(){ var t=tiers(), bad=[];
  for(var i=1;i<t.length;i++){
    if(t[i].qty<=t[i-1].qty) bad.push('Step '+(i+1)+' must be more than '+t[i-1].qty);
    if(t[i].pct <t[i-1].pct) bad.push('Buying more should not give less than '+t[i-1].pct+'%'); }
  return bad; }
function counts(){ return (S.freeCounts||[1,2,3]).map(num); }
function setCount(i,v){ S.freeCounts[i]=Math.max(1,num(v)); S.applied=true; render(); }
function addCount(){ if(S.freeCounts.length>=3) return;
  S.freeCounts.push(num(S.freeCounts[S.freeCounts.length-1])+1); S.applied=true; render(); }
function delCount(i){ if(S.freeCounts.length<=1) return; S.freeCounts.splice(i,1); S.applied=true; render(); }
function setBill(i,v){ S.bills[i]=Math.max(1,num(v)); S.applied=true; render(); }

/* three representative items in the shelf: cheapest, middle, dearest */
function threeOf(list){
  var xs=list.filter(function(p){return p.cost!=null;})
             .sort(function(a,b){return a.price-b.price;});
  if(!xs.length) return [];
  if(xs.length<3) return xs;
  return [xs[0], xs[Math.floor(xs.length/2)], xs[xs.length-1]];
}

/**
 * ── ⭐⭐⭐ ON A REAL BASKET, NOT JUST ONE ITEM (Athi: "can provide how the cart looks like with this offer in
 * place, and also can compute margin"; "we should not lose that functionality" — the current offer-lab.html
 * already shows a real cart via app/cart.js) ──────────────────────────────────────────────────────────────
 *
 * Not a second offer type merged onto the screen — the SAME one offer this screen is configured as (reusing
 * subKindOf()/ruleParamsOf(), built for Saved offers), shown against 2-3 everyday items together instead of
 * one, through the real engine, because that is what a customer's bill actually looks like: several things,
 * only some of them touched by any one offer.
 * ⚠️ NOT FOR spend/ship/band — those already show three whole-bill sightlines, which answers the same question
 * a mixed basket would, more directly (a spend threshold cares about the BILL TOTAL, not which items make it
 * up). Forcing a basket onto them would be a second, weaker way to ask something already answered.
 */
function cartPreviewItems(){
  var pool=P.filter(function(p){return p.cost!=null;}); if(pool.length<2) pool=P.slice();
  var picked=[];
  function add(p){ if(p && picked.indexOf(p)<0) picked.push(p); }
  if(S.goal==='bundle'){ add(byId(S.bunA)); add(byId(S.bunB)); }
  else if(S.goal==='free'){
    if(S.freeShape==='same') add(byId(S.itemId));
    else if(S.freeShape==='pair'){ add(byId(S.pairA)); add(byId(S.pairB)); }
    else if(S.freeShape==='anything') add(byId(S.giftId));
    else if(S.freeShape==='cheapest') catItems(S.catId).slice(0,2).forEach(add);
  } else if(S.goal==='percent'||S.goal==='amount'||S.goal==='qty'){
    if(S.scope==='item') (S.itemIds||[]).forEach(function(id){ add(byId(id)); }); else catItems(S.catId).slice(0,2).forEach(add);
  } else return [];   /* spend / ship / band: the three-bill sightline already answers this */
  for(var i=0;i<pool.length && picked.length<3;i++) add(pool[i]);
  return picked.slice(0,3);
}
function cartPreviewLines(items){
  return items.map(function(p){
    var qty=1;
    if(S.goal==='qty'){ var ts=tiers(), top=ts[ts.length-1]; if(top && S.scope==='item' && (S.itemIds||[]).indexOf(p.id)>=0) qty=top.qty; }
    else if(S.goal==='free'&&S.freeShape==='same'&&p.id===S.itemId) qty=(counts()[0]||1)+1;
    else if(S.goal==='free'&&S.freeShape==='cheapest') qty=Math.max(2,num(S.cheapN));
    return { key:p.id, item_id:p.id, name:p.name, category:p.cat, qty:qty, unitPrice:p.price, cost:p.cost };
  });
}
function cartPreviewHTML(){
  var items=cartPreviewItems(); var sub=subKindOf();
  if(!items.length || !sub) return '';
  var lines=cartPreviewLines(items);
  var offer=Object.assign({id:'preview',kind:sub}, ruleParamsOf());
  var ev; try{ ev=CBOffers.evaluate({ lines:lines, offers:[offer] }); }catch(e){ return ''; }
  var costTotal=0, costKnown=true;
  lines.forEach(function(l){ if(l.cost==null) costKnown=false; else costTotal+=l.cost*l.qty; });
  var margin=(costKnown && ev.total>0) ? Math.round((ev.total-costTotal)/ev.total*100) : null;
  var rows=lines.map(function(l){
    var was=R2(l.unitPrice*l.qty), now=R2(ev.line_net[l.key]!=null?ev.line_net[l.key]:was), moved=Math.abs(was-now)>0.005;
    return '<tr><td data-l="">'+esc(l.qty)+' × '+esc(l.name)+(moved?' <span class="pill p-appr" style="margin-left:4px">this offer</span>':'')+'</td>'
      +'<td class="num" data-l="Price">'+(moved?'<span class="was">'+M0(was)+'</span>':'')+M0(now)+'</td></tr>';
  }).join('');
  var notes=(ev.notes||[]).filter(function(n){return n.why;}).map(function(n){return '<div class="hint">'+esc(n.why)+'</div>';}).join('');
  return '<div class="card pad" style="margin-top:14px">'
    +'<h3 class="h" style="font-size:16px">On a real basket</h3>'
    +'<p class="hs">A sample bill with other everyday items on it too — not just what this offer targets.</p>'
    +headline([[M0(ev.total),'this basket comes to'],
               [margin==null?'N/A':margin+'%','basket margin',margin!=null&&margin<num(S.margin)?'dn':'up']])
    +'<div style="overflow-x:auto"><table class="res"><thead><tr><th>Item</th><th>Price</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +notes+'</div>';
}

/* ── a percentage off / rupees off ─────────────────────────────────── */
function outLine(){
  var rs=lineRows().sort(function(a,b){
    var x=a.margin==null?999:a.margin, y=b.margin==null?999:b.margin; return x-y; });
  var t=totals(rs), lf=loyFrac();
  var h=headline([
    [M0(t.priceAfter),'they pay, one of each','',M0(t.priceBefore)],
    [M0(t.profitAfter),'your profit','',M0(t.profitBefore)],
    [t.marginAfter+'%','margin',t.marginAfter<num(S.margin)?'dn':'up',t.marginBefore+'%']
  ]);
  /**
   * ⭐⭐⭐ THE COMBINED PERCENTAGE, PER ROW, NOT ONE EXAMPLE ABOVE THE TABLE (Athi: "one more column to show
   * 10+5%=14.5%... otherwise someone has to compute"). The single note this replaced used items()[0] to stand
   * in for every row — exactly right on the % screen, where every item takes the same flat rate, but WRONG on
   * the ₹ screen: ₹10 off a ₹20 item is 50%, ₹10 off a ₹200 item is 5%, so one example at the top understated
   * or overstated every other row. ⚠️ COMPUTED FROM base/shown, NEVER FROM THE REQUESTED FRACTION — a row that
   * was left out (below-cost, excluded) shows 0% actually taken, not the 14.5% that was asked for and refused.
   */
  h+='<div class="card" style="overflow-x:auto"><table class="res"><thead><tr>'+
     '<th>Item</th><th class="hide">Cost</th><th>Off</th><th>Price</th><th>Profit</th><th>Margin</th>'+
     '</tr></thead><tbody>'+rs.map(function(r){
       var ch=r.shown!==r.base;
       var offAmt=R2(r.base-r.shown), offPct=r.base>0?(offAmt/r.base*100):0;
       return '<tr>'+nameCell(r.p)+costCell(r.p)+
         '<td class="num" data-l="Off">'+(offAmt>0?M0(offAmt)+' <span class="sub">'+PC(offPct)+'</span>':'—')+'</td>'+
         '<td class="num" data-l="Price">'+(ch?'<span class="was">'+M0(r.base)+'</span>':'')+M0(r.shown)+'</td>'+

/* ── buy anything, one named thing free ────────────────────────────── */
function outGift(){
  var g=byId(S.giftId); if(!g) return '';

    return ['<span class="inp" style="width:104px;height:31px"><span>₹</span>'+
      '<input type="number" min="1" value="'+b+'" onchange="setBill('+i+',this.value)"></span>','',false];});
  var rows=[

    ['You make', bills.map(function(b){return g.cost==null?'N/A':M0(b*am-g.cost);}), true],
    ['Margin', bills.map(function(b){

/* ── buy N of one thing, one more free ─────────────────────────────── */
function outSame(){

  /* ⭐ buy_x_get_y, live — the same kind and the same call the till fires when a real N+1 round is rung */
  var mk=function(n){ var pay=engineBuyGetPay(p.price,n,1), cost=p.cost==null?null:(n+1)*p.cost;

    ['You make',  cs.map(function(n){var x=mk(n);return x.make==null?'N/A':M0(x.make);}),true],
    ['Margin',    cs.map(function(n){var x=mk(n); if(x.m==null) return 'N/A';
       return '<span style="color:'+(x.m<0?'var(--red-i)':x.m<num(S.margin)?'var(--amber-i)':'var(--green-d)')+

  ];

/* ── buy A, get B free ─────────────────────────────────────────────── */
function outPair(){
  var a=byId(S.pairA), b=byId(S.pairB); if(!a||!b) return '';
  var was=a.price+b.price, cost=(a.cost==null||b.cost==null)?null:a.cost+b.cost;
  /* ⭐ buy_x_get_y, cross-item, live — the same call the till fires when B's line reads "free — buy A get B" */
  var pay=engineBuyGetPayCross(a.id,a.price,b.id,1);
  var make=cost==null?null:pay-cost, m=cost==null?null:marginPct(pay,cost);
  var h=headline([[M0(pay),'they pay','',M0(was)],
                  [make==null?'N/A':M0(make),'you make',make!=null&&make<0?'bad':''],
                  [m==null?'N/A':m+'%','margin',m!=null&&m<num(S.margin)?'dn':'up']]);
  h+='<div class="card pad">'+g3([[esc(a.name)+' + '+esc(b.name),'',true]],[
     ['Apart',[M0(was)]],['They pay',[M0(a.price)]],
     ['Costs you',[cost==null?'N/A':M0(cost)]],
     ['You make',[make==null?'N/A':M0(make)],true],
     ['Margin',[m==null?'N/A':m+'%'],true]])+'</div>';
  h+='<div class="note n-say"><span class="ic">●</span><div>The free one is <b>'+
     PC(b.price/was*100)+'</b> of the pair</div></div>';

  return h;
}

/* ── buy N, cheapest free ──────────────────────────────────────────── */
function outCheap(){
  var n=Math.max(2,num(S.cheapN)), three=threeOf(catItems(S.catId));
  if(!three.length) return '<div class="note n-warn"><span class="ic">!</span><div>No costs on this shelf.</div></div>';
  var labels=['Your cheapest','A middle one','Your dearest'].slice(0,three.length);
  var heads=three.map(function(p,i){return [esc(p.name),
    '<span style="font-family:\'IBM Plex Mono\',monospace">'+M0(p.price)+' · '+labels[i]+'</span>',
    i===three.length-1];});
  /**
   * ⭐ mix_and_match, live — each of the three columns asks "if every one of the N were THIS item, what is the
   * cheapest-of-N worth". A single item bought N times has only one price to be cheapest among, so this reads
   * the same number buy_x_get_y would (verified when that kind was first wired) — the point of asking the real
   * engine is provenance, not a different answer: a future change to how it rounds or stacks reaches this
   * screen too, automatically, rather than a parallel formula quietly falling out of step.
   */
  var mk=function(p){ var pay=engineMixMatchPay(p.price,n), cost=n*p.cost;
    return {pay:pay,cost:cost,make:pay-cost,m:marginPct(pay,cost)};};
  var rows=[
    ['They take', three.map(function(){return n;})],
    ['They pay',  three.map(function(p){return M0(mk(p).pay);})],
    ['Costs you', three.map(function(p){return M0(mk(p).cost);})],
    ['You make',  three.map(function(p){return M0(mk(p).make);}),true],
    ['Margin',    three.map(function(p){var x=mk(p);
      return '<span style="color:'+(x.m<0?'var(--red-i)':x.m<num(S.margin)?'var(--amber-i)':'var(--green-d)')+
        '">'+x.m+'%</span><span class="sub">'+marginPct(p.price,p.cost)+'%</span>';}),true]
  ];
  var worst=three[three.length-1], wx=mk(worst);
  var h=headline([['buy '+n,'cheapest free'],
                  [PC(100/n),'off, at most'],
                  [wx.m+'%','worst case',wx.m<num(S.margin)?'dn':'up']]);
  h+='<div class="card pad">'+g3(heads,rows)+'</div>';
  h+='<div class="note '+(wx.m<num(S.margin)?'n-warn':'n-ok')+'"><span class="ic">●</span><div>'+
     'Worst case is '+n+' × '+esc(worst.name)+' · '+wx.m+'%</div></div>';
  return h;
}

/* ── two things, one price ─────────────────────────────────────────── */
function outBundle(){
  var a=byId(S.bunA), b=byId(S.bunB); if(!a||!b) return '';
  var was=a.price+b.price, pay=num(S.bunPrice);
  var cost=(a.cost==null||b.cost==null)?null:a.cost+b.cost;
  var make=cost==null?null:R2(pay-cost), m=cost==null?null:marginPct(pay,cost);
  var h=headline([[M0(pay),'they pay','',M0(was)],
                  [make==null?'N/A':M0(make),'you make',make!=null&&make<0?'bad':''],
                  [m==null?'N/A':m+'%','margin',m!=null&&m<num(S.margin)?'dn':'up']]);
  h+='<div class="card pad">'+g3([[esc(a.name)+' + '+esc(b.name),'',true]],[
     ['Apart',[M0(was)]],['Together',[M0(pay)]],
     ['That is',[PC((was-pay)/was*100)+' off']],
     ['Break-even',[cost==null?'N/A':M0(cost)]],
     ['You make',[make==null?'N/A':M0(make)],true],
     ['Margin',[m==null?'N/A':m+'%'],true]])+'</div>';
  if(cost!=null&&pay<cost) h+='<div class="note n-bad"><span class="ic">!</span><div>Below '+
     M0(cost)+' you lose money</div></div>';
  h+=eitherNote(was-pay,was);
  return h;
}

/* ── a big bill gets something back ────────────────────────────────── */
function outSpend(){
  var at=Math.max(1,num(S.spendAt)), give=num(S.spendVal), am=avgM();
  var bills=[at,at*2,at*4];
  var heads=bills.map(function(b,i){return [M0(b),'',i===0];});

    ['Share', bills.map(function(b){return PC(give/b*100);})],
    ['Goods', bills.map(function(b){return M0(b*(1-am));})],

/* ── free delivery ─────────────────────────────────────────────────── */
function outShip(){
  var at=Math.max(1,num(S.shipAt)), c=num(S.shipCost), pay=num(S.shipCharge), am=avgM();
  var absorb=Math.max(0,c-pay), bills=[at,at*2,at*3];
  var heads=bills.map(function(b,i){return [M0(b),'',i===0];});
  var rows=[
    ['Share', bills.map(function(b){return PC(absorb/b*100);})],
    ['Goods', bills.map(function(b){return M0(b*(1-am));})],
    ['Delivery', bills.map(function(){return M0(absorb);})],
    ['You make', bills.map(function(b){return M0(b*am-absorb);}),true],
    ['Margin', bills.map(function(b){ var m=Math.round((am-absorb/b)*100);
       return '<span style="color:'+(m<0?'var(--red-i)':m<num(S.margin)?'var(--amber-i)':'var(--green-d)')+
         '">'+m+'%</span><span class="sub">'+Math.round(am*100)+'%</span>';}),true]
  ];
  var m0=Math.round((am-absorb/at)*100), be=absorb/(am-num(S.margin)/100);
  var h=headline([[M0(absorb),'you absorb, a drop'],
                  [PC(absorb/at*100),'at the threshold'],
                  [m0+'%','worst case',m0<num(S.margin)?'dn':'up']]);
  h+='<div class="card pad">'+g3(heads,rows)+'</div>';
  h+='<div class="note '+(be>at?'n-warn':'n-ok')+'"><span class="ic">●</span><div>'+
     M0(absorb)+' whatever they order'+(be>0?' · under your '+num(S.margin)+'% below '+M0(be):'')+

function outBand(){
  return '<div class="card pad">'+g3([['Allowed','',true]],[
    ['Smallest',[M0(num(S.bandLo))]],['Largest',[M0(num(S.bandHi))]]])+'</div>'+

/* a free thing and a bonus never stack — say which wins, in one line */
function eitherNote(giftValue,base){
  if(loyMode()!=='either'||!S.loyOn) return '';
  var l=num(S.loyPct)/100; if(l<=0) return '';
  if(base){ var need=giftValue/base*100;
    return '<div class="note n-say"><span class="ic">●</span><div>Bonus wins only above <b>'+
      PC(need)+'</b> · yours is '+PC(num(S.loyPct))+'</div></div>'; }
  return '<div class="note n-say"><span class="ic">●</span><div>Bonus wins only above a <b>'+
    M0(giftValue/l)+'</b> bill</div></div>';
}

/* ═══ SCREEN 3 · SAVED OFFERS ═════════════════════════════════════════ */
/* ⚠️⚠️ itemIds ADDED — the multi-item "Apply it to" picker's own field, alongside itemId (still needed for
   the free/same-shape picker, an unrelated setting). Without this, a saved offer's specific-items scope was
   silently dropped on save — snapshot() only ever copies what KEEP names. */
var KEEP=['goal','scope','catId','itemId','itemIds','pctOff','rsOff','tiers','freeShape','giftId',
  'freeCounts','bills','cheapN','pairA','pairB','bunA','bunB','bunPrice','spendAt','spendVal',
  'shipAt','shipCharge','shipCost','bandLo','bandHi','margin','cap','belowAct',
  'round','loyOn','loyPct'];
function snapshot(){ var o={}; KEEP.forEach(function(k){o[k]=JSON.parse(JSON.stringify(S[k]==null?null:S[k]));}); return o; }
function costPrint(){ var o={}; P.forEach(function(p){o[p.id]=p.cost;}); return o; }
function costMoved(sv){ var now=costPrint(), n=0;
  for(var k in sv.costs) if(sv.costs[k]!==now[k]) n++;
  return n; }

function label(){
  var g=goalOf(S.goal), where = (S.goal==='percent'||S.goal==='amount'||S.goal==='qty')
    ? (S.scope==='item'
        ? ((S.itemIds||[]).length===1 ? (byId(S.itemIds[0])||{}).name : (S.itemIds||[]).length+' items')
        : catName(S.catId))
    : '';
  var what='';
  if(S.goal==='percent') what=num(S.pctOff)+'% off';
  else if(S.goal==='amount') what=M0(num(S.rsOff))+' off each';
  else if(S.goal==='qty') what=tiers().map(function(t){return t.qty+'+ '+t.pct+'%';}).join(' · ');
  else if(S.goal==='free') what=(SHAPES.filter(function(s){return s.id===S.freeShape;})[0]||{}).n;
  else if(S.goal==='bundle') what=M0(num(S.bunPrice));
  else if(S.goal==='spend') what=M0(num(S.spendAt))+' → '+M0(num(S.spendVal))+' back';
  else if(S.goal==='ship') what='free above '+M0(num(S.shipAt));
  else what=M0(num(S.bandLo))+'–'+M0(num(S.bandHi));
  return {title:g.n, detail:[what,where].filter(Boolean).join(' · ')};
}
function keyNumber(){
  if(S.goal==='percent'||S.goal==='amount'){ var t=totals(lineRows()); return [t.marginAfter+'%','margin']; }
  if(S.goal==='qty'){ var ts=tiers(), top=ts[ts.length-1];
    var tt=totals(items().map(function(p){return row(p,top.pct/100);})); return [tt.marginAfter+'%','at '+top.qty+'+']; }
  return ['—','see it'];
}
/**
 * ── ⭐⭐⭐ SAVED OFFERS, ON THE REAL SHELF (Athi: "we have already built the offer engine... how we enhance it
 * to adopt this") ──────────────────────────────────────────────────────────────────────────────────────────
 *
 * routes/definitions.js already does everything "draft → approved → live → paused" needs — create, list,
 * version on edit, retire — for exactly `kind:'offer'`, with lib/definition-check.js validating the same six
 * sub-kinds this page computes with. Nothing new was built here; SAVED just stops being an array that forgets
 * itself on reload and starts being a mirror of that shelf.
 * ⚠️ SIGNED IN ONLY. Demo mode (the two sample books, no cb_sess) keeps the exact in-memory behaviour this
 * prototype always had — nothing to save to, nothing lost, no network call ever attempted.
 */
/**
 * ⚠️⚠️⚠️ KNOWN GAP, ON THE BACKLOG, NOT SILENT (Athi: "role based authorisation is required... margin and
 * other things should not be visible to everyone... we keep it as a role based access and will implement it
 * later"). savedLive() only asks "is somebody signed in to this entity" — cost and margin are visible to
 * every role that can sign in today, the same way [[project-iam-access-model]]'s viewer/commenter/editor
 * split does not yet reach here. Do not read this check as "authorised to see cost" anywhere it is used below.
 */
function savedLive(){ try { var s=JSON.parse(localStorage.getItem('cb_sess')||'null'); return !!(s&&s.token); } catch(_){ return false; } }
function savedToken(){ try { return (JSON.parse(localStorage.getItem('cb_sess')||'null')||{}).token||null; } catch(_){ return null; } }

/**
 * ── ⭐⭐⭐ OFFLINE, ON PURPOSE (Athi: "must work offline too") ─────────────────────────────────────────────────
 *
 * Offer Lab is a planning tool, not a point-of-sale action — but the same shopkeeper who lost the line mid-bill
 * should not also lose the ability to keep pricing while it is down. Two stores, the shape till.html's own DB
 * already proved: `kv` (the last catalogue this browser read, so the page opens with real numbers with no
 * line) and `outbox` (a write that could not reach the server yet, replayed in order once it can).
 * ⚠️ ITS OWN DATABASE, NOT TILL.HTML'S. The till's is keyed per PAIRED COUNTER (a device); this is keyed per
 * SIGNED-IN PERSON — a different identity and a different scope, and conflating them is the exact fault
 * [[project-till-store-per-key]] already paid for once, in the other direction.
 */
var LabDB = (function(){
  var p = null;
  function open(){
    if (p) return p;
    p = new Promise(function(res, rej){
      var rq = indexedDB.open('offerlab', 1);
      rq.onupgradeneeded = function(){ var db = rq.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('outbox')) db.createObjectStore('outbox', { keyPath:'id', autoIncrement:true }); };
      rq.onsuccess = function(){ res(rq.result); }; rq.onerror = function(){ rej(rq.error); };
    });
    return p;
  }
  function tx(store, mode, fn){ return open().then(function(db){ return new Promise(function(res, rej){
    var t = db.transaction(store, mode), s = t.objectStore(store); var rq = fn(s);
    t.oncomplete = function(){ res(rq && ('result' in rq) ? rq.result : undefined); }; t.onerror = function(){ rej(t.error); }; }); }); }
  return {
    get: function(k){ return tx('kv','readonly',function(s){ return s.get(k); }).catch(function(){ return undefined; }); },
    set: function(k,v){ return tx('kv','readwrite',function(s){ return s.put(v,k); }).catch(function(){}); },
    queuePush: function(row){ return tx('outbox','readwrite',function(s){ return s.add(Object.assign({at:new Date().toISOString()},row)); }).catch(function(){ return null; }); },
    queueAll: function(){ return tx('outbox','readonly',function(s){ return s.getAll(); }).catch(function(){ return []; }); },
    queueDel: function(id){ return tx('outbox','readwrite',function(s){ return s.delete(id); }).catch(function(){}); },
  };
})();
/**
 * ⭐⭐ ONE FETCH, ONE QUEUE, FOR EVERY WRITE THIS PAGE MAKES — the offer shelf and an item's cost alike. On a
 * real network failure (fetch itself throwing — not a server ANSWER, not a 4xx) the request is held in the
 * outbox and replayed once the line returns: the exact "fall through and queue it" shape till.html's own
 * tillPost() already uses. ⚠️ A GET is never queued — there is nothing to replay a READ as; its caller falls
 * back to the cache instead (labUseMine, below).
 */
async function apiFetch(method, url, body, queueKind){
  try {
    var r=await fetch(url, { method:method,
      headers:Object.assign({'Content-Type':'application/json'}, savedToken()?{Authorization:'Bearer '+savedToken()}:{}),
      body: body?JSON.stringify(body):undefined });
    var j=null; try{ j=await r.json(); }catch(_){}
    return {ok:r.ok, status:r.status, body:j||{}, queued:false};
  } catch (e) {
    if (queueKind && method!=='GET') { await LabDB.queuePush({kind:queueKind, method:method, url:url, body:body||null}); labPaintQueue(); }
    return {ok:true, queued:true, body:{}};
  }
}
/** ⭐ replays queued writes IN ORDER; a real refusal (4xx) is dropped rather than retried for ever — the same
 * offer would only be refused again, and a queue that never empties is a queue nobody trusts */
async function labDrainOutbox(){
  var rows = await LabDB.queueAll();
  for (var i=0;i<rows.length;i++){
    var row = rows[i];
    try {
      var r = await fetch(row.url, { method:row.method,
        headers:Object.assign({'Content-Type':'application/json'}, savedToken()?{Authorization:'Bearer '+savedToken()}:{}),
        body: row.body?JSON.stringify(row.body):undefined });
      if (r.ok || (r.status>=400 && r.status<500)) await LabDB.queueDel(row.id);
      else break;   /* still refusing for a server reason — stop, try the rest again next time */
    } catch(_) { break; }   /* still offline — stop, try again on the next drain */
  }
  labPaintQueue();
  if (savedLive() && S.step===3) await loadSaved();
}
function labPaintQueue(){
  LabDB.queueAll().then(function(rows){
    var n=document.getElementById('labqueue'); if(!n) return;
    if(!rows.length){ n.hidden=true; return; }
    n.hidden=false; n.textContent=rows.length+' change'+(rows.length>1?'s':'')+' waiting to sync — will send once the line is back.';
  });
}
window.addEventListener('online', function(){ labDrainOutbox(); });

function defFetch(method,path,body){ return apiFetch(method, API+'/api/definitions'+path, body, method==='GET'?null:'definitions'); }

/**

/**
 * ⭐⭐ ONE BUILDER, TWO SOURCES OF ROWS. The real catalogue (labApplyCatalogue, below) and a spreadsheet

function buildBiz(key, rows, who){
  var byCat={}; rows.forEach(function(p){ byCat[p[2]]=(byCat[p[2]]||0)+1; });
  var cats=Object.keys(byCat).map(function(c){ return [c,c]; });

  BIZ[key]={ name:who, cats:cats, prods:rows, margin:25, cap:10,

        spendAt:500, spendVal:50, buyId:firstItem, getId:firstItem, getOff:100,

  BIZ[key].d.freeShape='anything'; BIZ[key].d.giftId=firstItem; BIZ[key].d.freeCounts=[1,2,3];
  BIZ[key].d.bills=[100,250,500]; BIZ[key].d.cheapN=3; BIZ[key].d.shipCost=30;

function labApplyCatalogue(items, who, fromCache){
  var amountOf=function(v){ return (v&&typeof v==='object'&&v.amount!=null)?Number(v.amount):Number(v)||0; };
  var mineP=items.map(function(p){

    /* ⭐ lib/item-cost.js's shape, read plainly — a malformed or absent cost is unknown, never zero */
    var cost=(d.cost&&typeof d.cost==='object'&&d.cost.value!=null&&isFinite(Number(d.cost.value)))?Number(d.cost.value):null;
    /* ⭐ groupsRaw(), not groupsOf() — a group this product's owner has half-built (a name, no option yet)

    var mods=(typeof CBVariant!=='undefined'&&CBVariant.groupsRaw)?CBVariant.groupsRaw(d):[];
