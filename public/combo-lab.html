<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combo Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --page:#FCFAF5; --card:#FFFFFF; --panel:#F3EFE6;
  --line:#DDD6C6; --line-soft:#E6E0D2; --hair:#F0ECE2;
  --ink:#1D1B16; --muted:#5E594D; --faint:#8A8374; --ghost:#A8A295;
  --green:#16693F; --green-d:#0D4A2B; --green-t:#E8F4ED; --green-b:#A9D3BC;
  --amber:#E0A020; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205;
  --red:#C4562F; --red-t:#FBEAE3; --red-b:#E7B9A8; --red-i:#8E3517;
  --blue:#2F74C9; --blue-t:#E4EEFA; --blue-b:#B9D2EF; --blue-i:#174A87;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:20px 22px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.title{font-family:'Bricolage Grotesque',sans-serif;font-size:25px;font-weight:800;letter-spacing:-.02em;margin:0}
.grow{flex:1}
.chip{height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.bizSw{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:4px}
.bizSw button{height:30px;padding:0 12px;border-radius:7px;border:0;background:transparent;
  font-size:12.5px;font-weight:600;color:var(--muted)}
.bizSw button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}

.strip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:11px;padding:9px 14px;margin-bottom:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.strip b{color:var(--ink)}
.strip button{margin-left:auto;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:600}

.steps{display:flex;gap:8px;margin-bottom:16px}
.stp{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;text-align:left}
.stp .n{width:27px;height:27px;border-radius:8px;background:var(--panel);color:var(--muted);
  font-size:13px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.stp .t{display:block;font-size:13.5px;font-weight:700}
.stp .v{display:block;font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.stp.on .n{background:var(--green);color:#fff}
.stp.done .n{background:var(--green-t);color:var(--green-d)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.h{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800;margin:0}
.hs{font-size:13px;color:var(--muted);margin:4px 0 0}
.lbl{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--faint);margin-top:5px;line-height:1.35}
.screen{display:none} .screen.on{display:block}
.cols{display:grid;gap:16px}
@media(min-width:900px){ .c-2{grid-template-columns:1fr 1fr} }

.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
.goal{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;text-align:left;
  display:flex;gap:12px;align-items:flex-start;min-height:74px}
.goal.on{border:2px solid var(--green);background:var(--green-t);padding:13px}
.goal .gi{width:38px;height:38px;border-radius:10px;background:var(--panel);display:grid;place-items:center;
  font-size:19px;flex:0 0 auto}
.goal.on .gi{background:var(--green);color:#fff}
.goal b{display:block;font-size:14.5px;line-height:1.25}
.goal .ex{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;font-family:'IBM Plex Mono',monospace}
.grouphead{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--muted);margin:9px 0 -2px;
  display:flex;align-items:center;gap:9px}
.grouphead i{flex:1;height:1px;background:var(--line-soft);font-style:normal}

.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);font-size:14px;font-weight:600}
.seg button.on{background:var(--green);border-color:var(--green);color:#fff}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--card);
  overflow:hidden;height:48px}
.inp span{padding:0 11px;color:var(--faint);font-weight:600;font-size:14px;flex:0 0 auto;white-space:nowrap}
.inp input,.inp select{border:0;outline:0;padding:0 11px;height:100%;width:100%;background:transparent;
  font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600}
.inp select{font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500}
.inp:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-t)}
.f{margin-bottom:14px}
/* ⭐⭐⭐ [2026-09-26] a hand-rendered list, not a native datalist popup — see offer-lab-next.html's own
   comment beside selectOf() for why. Kept byte-for-byte identical to that copy. */
.combo{position:relative}
.comboList{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;max-height:260px;
  overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 8px 24px rgba(0,0,0,.12)}
.comboList.on{display:block}
.comboOpt{padding:10px 14px;font-size:15px;cursor:pointer}
.comboOpt:hover,.comboOpt.hi{background:var(--green-t);color:var(--green-d)}
.comboOpt+.comboOpt{border-top:1px solid var(--hair)}
.comboEmpty{padding:10px 14px;font-size:14px;color:var(--muted)}

/* ── the results table: Shopify / Tally pattern — profit in rupees, margin as a percent,
      plain adjacent columns. No invented chart. ── */
.res{width:100%;border-collapse:collapse;font-size:14px}
.res th{text-align:right;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ghost);
  font-weight:700;padding:0 10px 8px;white-space:nowrap}
.res th:first-child{text-align:left}
.res td{padding:9px 10px;border-top:1px solid var(--hair);text-align:right;white-space:nowrap}
.res td:first-child{text-align:left;white-space:normal}
.res tbody tr:hover{background:var(--panel)}
.res .nm{display:flex;align-items:center;gap:10px}
.res .nm b{font-weight:600;font-size:14px}
.tile{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:12px}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.was{color:var(--faint);text-decoration:line-through;font-size:12.5px;display:block;text-align:right}
.mgn{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.mgn-under{color:var(--amber-i)}
.mgn-loss{color:var(--red-i);font-weight:700}
.mgn-na{color:var(--ghost);font-weight:500}
/* the linked cost / margin / price row — Lightspeed X-Series */
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.trio > div > span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ghost);margin-bottom:5px}
.ladder{border:1px solid var(--line-soft);border-radius:11px;overflow:hidden;margin-top:6px}
.lhead{display:grid;grid-template-columns:26px 1fr 1fr 1fr 34px;gap:8px;padding:8px 10px;background:var(--panel)}
.lhead span{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ghost)}
.lrow{display:grid;grid-template-columns:26px 1fr 1fr 1fr 34px;gap:8px;padding:8px 10px;align-items:center;
  border-top:1px solid var(--hair);cursor:pointer}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--card);
  display:block;position:relative}
.radio.on{border-color:var(--green)}
.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--green)}
.lrow.on{background:var(--green-t);box-shadow:inset 3px 0 0 var(--green)}
.lrow .inp{height:38px}
.lrow .inp input{font-size:15px;padding:0 8px}
.lrow .inp span{padding:0 7px;font-size:13px}
.lprice{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;text-align:right;padding-right:6px}
.lx{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  color:var(--faint);font-size:16px;line-height:1}
.lx:disabled{opacity:.3}
.rungs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.rung{flex:1;min-width:120px;border:1px solid var(--line);border-radius:11px;background:var(--card);
  padding:11px 13px;text-align:left;display:block}
.rung.on{border:2px solid var(--green);background:var(--green-t);padding:10px 12px}
.rung .rq{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.rung .rp{display:block;font-size:12.5px;color:var(--faint);margin-top:1px}
.rung .rm{display:block;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;margin-top:6px;color:var(--green-d)}
.rung .rm.under{color:var(--amber-i)}
.rung .rk{display:block;font-size:11px;line-height:1.35;color:var(--muted)}
.trioNote{font-size:12.5px;color:var(--faint);margin-top:9px;line-height:1.35}
.costIn{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;
  background:var(--card);height:32px;max-width:92px;overflow:hidden}
.costIn span{padding:0 6px;color:var(--faint);font-size:12.5px}
.costIn input{border:0;outline:0;width:100%;height:100%;padding:0 6px 0 0;background:transparent;
  font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;text-align:right}
.costIn:focus-within{border-color:var(--green);box-shadow:0 0 0 2px var(--green-t)}

/* the live total — Vyapar's profit indicator, one number beside where you type */
.live{display:flex;gap:22px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:12px;padding:14px 16px;margin-bottom:14px}
.live > div{display:flex;flex-direction:column}
.live .k{font-size:11.5px;color:var(--muted);order:2;margin-top:2px}
.live .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;line-height:1.1;order:1}
.live .v small{font-size:13px;color:var(--faint);font-weight:500}
.live .v.dn{color:var(--red-i)} .live .v.up{color:var(--green-d)}

.note{padding:11px 13px;border-radius:11px;font-size:13px;line-height:1.4;display:flex;gap:9px;align-items:flex-start}
.note .ic{flex:0 0 auto}
.n-ok{background:var(--green-t);border:1px solid var(--green-b);color:var(--green-d)}
.n-warn{background:var(--amber-t);border:1px solid var(--amber-b);color:var(--amber-i)}
.n-bad{background:var(--red-t);border:1px solid var(--red-b);color:var(--red-i)}
.n-info{background:var(--blue-t);border:1px solid var(--blue-b);color:var(--blue-i)}

.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair)}
.sw:last-of-type{border-bottom:0}
.sw b{display:block;font-size:14px} .sw span{font-size:12.5px;color:var(--muted)}
.tog{position:relative;width:48px;height:27px;flex:0 0 auto}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}
.tog i::before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.tog input:checked + i{background:var(--green)}
.tog input:checked + i::before{transform:translateX(21px)}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{min-height:44px;padding:10px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);text-align:left;display:flex;gap:10px;align-items:flex-start;width:100%}
.pick button.on{border:2px solid var(--green);background:var(--green-t);padding:9px 12px}
.pick b{display:block;font-size:13.5px} .pick small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.pick .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;
  display:grid;place-items:center;font-size:12px;color:transparent;margin-top:1px}
.pick button.on .tick{background:var(--green);border-color:var(--green);color:#fff}
.pick button:disabled{opacity:.5;cursor:not-allowed}
.soon{font-size:10px;font-weight:700;background:var(--panel);color:var(--faint);padding:1px 6px;border-radius:5px;margin-left:6px}
.setRow{padding:14px 0;border-bottom:1px solid var(--hair)}
.setRow:last-child{border-bottom:0}
.setRow > b{display:block;font-size:14px;margin-bottom:2px}
.setRow > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:9px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;border-top:1px solid var(--hair)}
.btn{height:48px;padding:0 19px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.scroll{max-height:460px;overflow-y:auto;border:1px solid var(--line-soft);border-radius:12px}
@media(max-width:760px){
  .res th:nth-child(2),.res td:nth-child(2){display:none}
  .steps{flex-direction:column}
}
/* ═══ v5 additions ═══════════════════════════════════════════════════════ */

/* the one number that matters, said big, above everything */
.headline{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;
  padding:16px 20px;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:var(--r);margin-bottom:14px}
.headline .hv{display:block;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.01em}
.headline .hv small{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;
  color:var(--faint);text-decoration:line-through;margin-left:7px;letter-spacing:0}
.headline .hk{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ghost);margin-top:5px}
.headline .up{color:var(--green-d)} .headline .dn{color:var(--amber-i)}
.headline .bad{color:var(--red-i)}
.headline .sep{width:1px;align-self:stretch;background:var(--line)}

/* the loyalty bar — one switch, one number, never a column */
.loy{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:12px 15px;margin-top:14px}
.loy.on{border-color:var(--blue-b);background:var(--blue-t)}
.loy .inp{height:38px;width:112px}
.loy .lt{font-size:13.5px;font-weight:700}
.loy .ls{font-size:12.5px;color:var(--muted);flex:1;min-width:200px}
.sw{width:44px;height:25px;border-radius:13px;border:1px solid var(--line);background:var(--panel);
  position:relative;flex:0 0 auto;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .12s}
.sw.on{background:var(--blue);border-color:var(--blue)}
.sw.on::after{left:21px}

/* sightline / comparison table: labels down the left, up to three columns */
.g3{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.g3 th:first-child,.g3 td:first-child{width:27%}
.g3 th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ghost);
  font-weight:700;padding:0 10px 9px;text-align:right;border-bottom:1px solid var(--line)}
.g3 th:first-child{text-align:left}
.g3 th b{display:block;font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--ink);
  letter-spacing:0;text-transform:none;margin-bottom:2px}
.g3 th.on{color:var(--green-d)} .g3 th.on b{color:var(--green-d)}
.g3 td{padding:8px 10px;border-top:1px solid var(--hair);text-align:right;white-space:nowrap;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.g3 td:first-child{text-align:left;font-family:'IBM Plex Sans',sans-serif;
  color:var(--muted);font-size:13px;white-space:normal}
.g3 tr.big td{font-size:18px;font-weight:700;padding-top:11px;padding-bottom:11px}
.g3 tr.big td:first-child{font-size:13px;font-weight:600}
.g3 .sub{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;
  font-weight:400;color:var(--faint);text-decoration:line-through}

/* editable column head for a ladder — the header IS the control */
.chead{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.chead .inp{height:33px;width:118px}
.chead .inp input{font-size:14px;padding:0 7px;min-width:34px;text-align:right}
.chead .inp span{padding:0 8px 0 4px;font-size:11.5px;white-space:nowrap}
.colx{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--card);
  font-size:13px;line-height:1;color:var(--faint)}
.colx:disabled{opacity:.25}
.colwrap{display:flex;gap:6px;align-items:center;justify-content:flex-end}

/* the per-slab cells in the item table */
.cell{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.cell .cp{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600}
.cell .cm{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--green-d);font-weight:600}
.cell .cm.under{color:var(--amber-i)} .cell .cm.loss{color:var(--red-i);font-weight:700}
.cell .cm.na{color:var(--ghost);font-weight:500}
.res th.slab{background:var(--panel)} .res td.slab{background:rgba(243,239,230,.45)}

.phoneOnly{display:none}
.stepEd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stepEd .inp{height:38px;width:104px}
.stepEd .inp input{padding:0 7px;text-align:right}
.stepEd .inp span{padding:0 8px 0 4px;font-size:11.5px}

/* notes */
.note{display:flex;gap:9px;border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.4;margin-top:12px}
.note .ic{font-weight:700;flex:0 0 auto}
.n-ok{background:var(--green-t);border:1px solid var(--green-b);color:var(--green-d)}
.n-warn{background:var(--amber-t);border:1px solid var(--amber-b);color:var(--amber-i)}
.n-bad{background:var(--red-t);border:1px solid var(--red-b);color:var(--red-i)}
.n-say{background:var(--panel);border:1px solid var(--line-soft);color:var(--muted)}

/* actions */
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{height:44px;padding:0 16px;white-space:nowrap;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:disabled{background:var(--panel);border-color:var(--line);color:var(--ghost)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}

/* saved offers */
.bucket{display:flex;flex-direction:column;gap:10px}
.sv{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:13px 15px;
  display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.sv .svm{flex:1;min-width:220px}
.sv .svt{font-size:14.5px;font-weight:700}

/**

 * only the ROW LIST scrolls — never the whole page. Every "icon" that later wants to work against the full
 * product list (not just the ones missing a cost) opens the SAME panel; only #ovlBody's row-renderer differs.

   machinery ("there is nothing behind it a person could reach" — openModLab()'s own comment). The plain .ovl
   scrim above is 50% opaque, meant for overlays with a real, relevant page behind them; here it let that dead
   shell's heading and cards read straight through, looking exactly like the wrong page had loaded. Opaque
   here, and only here, so nothing behind it is ever legible again. */

<div class="wrap">

/* ═══════════════════════════════════════════════════════════════════════════
   OFFER LAB — the flow is v5's; the arithmetic is lib/offers-engine.js, live

   The one rule that shapes everything:
   IF A NUMBER NEEDS TO KNOW HOW MUCH YOU SELL, IT IS NOT IN HERE.
   No units sold, no period, no average basket. Sales-against-volume is a
   separate feature for when real data has accumulated.

   What it computes, and nothing else:
     two percentages per item, compounded, and the margin that leaves you.
       final  = price x (1 - offer%) x (1 - loyalty%)
       margin = (final - cost) / final          <- Shopify's formula, verbatim
     For offers that act on a bill rather than an item, the same three facts
     at three sightlines, because the cost is flat and only its SHARE moves.

   Nothing here is invented. Borrowed, in order:
     Shopify        cost -> profit + margin, live, and the margin formula
     Tally / Vyapar "Profit" for rupees, "Margin" for the percent, adjacent
     Vyapar         one live profit figure beside the discount box
     Lightspeed     cost / margin / price as linked fields on a single item
     Odoo           Min. Quantity ladders; rule on one side, effect on the other
     Cin7           N/A when there is no cost
     Fulfilment-lab free-delivery threshold: flat cost, shrinking share
     Shopify guides discount profitability as a ladder to break-even

     - No stacked cost/profit bar. Not one commercial product uses one.
     - "Markup" appears nowhere. It is the number most confused with margin.
     - The free-delivery formula's AVERAGE ORDER VALUE term is dropped. Every
       calculator online needs it; it is sales data, so it is not here. The
       curve across three bills says more than one averaged point would.
   ═══════════════════════════════════════════════════════════════════════════ */

/**

 * page, something happening there") ────────────────────────────────────────────────────────────────────────
 *
 * Not just loyalty — every input on every screen calls edit() on oninput, and render() replaces the WHOLE
 * screen's innerHTML on every call, including the very input being typed into. Destroying and recreating a
 * focused DOM node drops focus and the cursor, so typing a second digit ("15" after "1") landed nowhere —
 * indistinguishable from "the field will not take more than one character", which is exactly what was seen.
 * One character worked; anything real to type in did not.
 * ⭐ THE FIX KEEPS THE LIVE-AS-YOU-TYPE FEEL (the whole point of a lab — "flick it and watch the numbers
 * move"), rather than falling back to onchange (fires once, on blur) and losing that. Each affected input
 * carries `data-key` naming the same field edit() writes; refocus the one with a matching key after the
 * rebuild, and put the cursor back where it was.
 */
function edit(k,v){
  var af=document.activeElement, key=af&&af.getAttribute&&af.getAttribute('data-key'), start=af&&af.selectionStart, end=af&&af.selectionEnd;
  S[k]=v; S.applied=false; render();
  if(key){ var el=document.querySelector('[data-key="'+key+'"]'); if(el){ el.focus(); try{ el.setSelectionRange(start,end); }catch(_){} } }
}

 * runs against) — what was missing is that nobody watched it finish. A shopkeeper typing a cost and moving
 * on had no way to tell a real save from a silently dropped one; now every real attempt says which.

 * offer-lab-next.html's own shared machinery (catalogue loading, apiFetch, money/esc helpers — nothing here
 * duplicates logic, it duplicates the FILE, the same way till.html/app.html each already carry their own copy
 * of these small helpers rather than sharing one) with Offer Lab's percent/amount/qty screens left inert
 * underneath a permanently-open modal: this page boots straight into the modifier/combo builder and there is
 * nothing behind it a person could reach.
 * ⚠️ SO CLOSING IT MEANS CLOSING THE TAB, not revealing an Offer Lab screen nobody asked for — the one real
 * behaviour change from offer-lab-next.html's own closeModLab(), which reveals the picker it was opened from.
 * window.close() only succeeds on a tab this page (or a script) opened — true for every real entry point
 * (till.html's hub, the catalogue-setup card), so the fallback line is for the rare case it does not.
 */
function closeModLab(){
  var el=document.getElementById('modLabOverlay'); if(el) el.classList.remove('on');
  try { window.close(); } catch (_) {}
  setTimeout(function(){ toastSay('You can close this tab now.'); }, 50);
}

/** ⭐⭐ [OFFR-06] DRAFT-AWARE: a product's own item_data.modifiers when one is picked, otherwise the
 *  not-yet-attached MODLAB.draft — every other editing verb calls this and modLabSetGroups() below, so
 *  making these two aware of the draft is the whole reason the builder needed no second set of verbs. */
function modLabGroups(){
  if(MODLAB.pid){
    var p=byId(MODLAB.pid); if(!p) return [];
    return (typeof CBVariant!=='undefined'&&CBVariant.groupsRaw)?CBVariant.groupsRaw({modifiers:p.modifiers}):(Array.isArray(p.modifiers)?p.modifiers:[]);
  }
  return (typeof CBVariant!=='undefined'&&CBVariant.groupsRaw)?CBVariant.groupsRaw({modifiers:MODLAB.draft}):(Array.isArray(MODLAB.draft)?MODLAB.draft:[]);
}
/** ⭐ every editing verb funnels through here — one place that writes the draft and clears stale preview picks */
function modLabSetGroups(newGroups){
  if(MODLAB.pid){ var p=byId(MODLAB.pid); if(!p) return; p.modifiers=newGroups; }
  else { MODLAB.draft=newGroups; }
  MODLABPREV=[];   /* an edited group can invalidate an old pick (a removed option, a group gone) — simplest to restart */
  paintModLab();
}

/**
 * ⭐⭐⭐ [OFFR-07] "CREATE AS A NEW PRODUCT" — the path Athi asked for: the combo he is naming and pricing
 * right here becomes a real, sellable product, with these groups already on it, in one step. Distinct from
 * "Apply to a product ▸" (modLabAttachDraftTo), which only ever edits a product that already exists —
 * neither replaces the other, because "I'm inventing a new combo meal" and "I'm adding a choice to
 * something I already sell" are different jobs.
 */
async function modLabCreateNew(){
  var name=String(MODLAB.name||'').trim();
  if(!name){ toastSay('Give this combo a name first.'); return; }
  var priceNum=Number(MODLAB.price);
  if(!(priceNum>0)){ toastSay('Give this combo a price first.'); return; }
  var v=CBVariant.validate(modLabGroups());
  if(!v.ok){ toastSay('Fix this first: '+v.errors[0].message); return; }
  if(!(S.biz==='mine' && savedLive())){ toastSay('Sign in and use your own catalogue to create a real product.'); return; }
  var item_data={name:name, price:priceNum, modifiers:v.groups};
  var r=await apiFetch('POST', API+'/api/products', {item_data:item_data});
  if(!r.ok){ toastSay('Could not create "'+name+'": '+((r.body&&r.body.message)||'try again.')); return; }
  toastSay('Created "'+name+'" — '+M0(priceNum)+', with its combo groups already on it.');
  MODLAB.building=false; MODLAB.draft=[]; MODLAB.name=''; MODLAB.price=''; MODLAB.templateId=null; MODLABPREV=[];
  await labUseMine(true);   /* the new product needs to be in P before anything can open or show it */
  paintModLab();
  render();
}
/** ⭐ "pick a product to apply this to" — the picker's own row click, redirected while a draft is pending
 *  (see paintModLab()'s picker branch): ADDS the draft's groups to whatever that product already has,
 *  never replaces — the same "add, don't overwrite" rule modLabAddGroup() already follows. */
function modLabAttachDraftTo(id){
  var draftGroups=CBVariant.normalize(MODLAB.draft);
  MODLAB.building=false; MODLAB.savingAs=false; MODLAB.pid=id;
  var existing=modLabGroups();
  MODLAB.draft=[];
  modLabSetGroups(existing.concat(draftGroups));
}

async function modLabSaveAsConfirm(){

  if(!name){ toastSay('Type a name for this combo first — that is what you’ll look for to reopen it.'); return; }

  if(!v.ok){ toastSay('Fix this first: '+v.errors[0].message); return; }
  if(!(S.biz==='mine' && savedLive())){ toastSay('Sign in and use your own catalogue to save a combo for real.'); return; }
  /* ⭐ [OFFR-08] a price travels with the save too, when one is known — the combo's own (building fresh) or

   * with a real price later without retyping it. */
  var price = MODLAB.pid ? (byId(MODLAB.pid)||{}).price : (MODLAB.price!==''? Number(MODLAB.price): null);
  toastSay('Saving “'+name+'” to your combos…');
  var r=await apiFetch('POST', API+'/api/combo-templates', {name:name, definition:v.groups, price:price});

     * always leaves behind a real template id, which is what makes "👁 Preview" and "✚ Push to products"

/**
 * ⭐⭐⭐ [OFFR-08] "you have save as option, but no Save option, if i edit the existing combo, we have to
 * save as well" — the plain "Save," update-in-place, the way a normal document editor works: a template
 * opened for editing (MODLAB.templateId set — see modLabUseTemplate()) can be saved back onto ITSELF; "Save
 * as…" beside it still forks a new, separate copy, exactly like "Save" vs "Save as" anywhere else.
 */
async function modLabSaveConfirm(){
  if(!MODLAB.templateId) return;   /* the button that calls this is only ever shown when one exists */
  var v=CBVariant.validate(modLabGroups());
  if(!v.ok){ toastSay('Fix this first: '+v.errors[0].message); return; }
  if(!(S.biz==='mine' && savedLive())){ toastSay('Sign in and use your own catalogue to save for real.'); return; }
  var name=String(MODLAB.name||'').trim() || 'Untitled combo';
  var price=MODLAB.pid ? (byId(MODLAB.pid)||{}).price : (MODLAB.price!==''? Number(MODLAB.price): null);
  toastSay('Saving changes to “'+name+'”…');
  var r=await apiFetch('PATCH', API+'/api/combo-templates/'+MODLAB.templateId, {name:name, definition:v.groups, price:price});
  /* ⭐ Athi: "save, commit, update message is a must without which not able to understand the change" — a bare
   * "Saved." said nothing. This names what changed and where it landed (combo library = back office), and — if
   * this template is already live as a product — that the product itself is now out of date until pushed again. */
  if(r.ok){
    toastSay('Saved “'+name+'” — updated in your combo library (back office).'
      + (modLabTemplateLinked() ? ' The live product still has the OLD version until you push this update.' : ''));
    await comboLibLoad(true);
  }
  else toastSay('NOT saved — the update to “'+name+'” did not reach your combo library: '+((r.body&&r.body.message)||'try again.'));
  paintModLab();
}
/** ⭐ loaded once per Lab session (cached on COMBO_LIB), forced fresh right after a save or a delete */
async function comboLibLoad(force){
  if(COMBO_LIB.loaded && !force) return COMBO_LIB.items||[];
  if(!(S.biz==='mine' && savedLive())){ COMBO_LIB.items=[]; COMBO_LIB.loaded=true; return []; }
  var r=await apiFetch('GET', API+'/api/combo-templates');
  if(r.ok && r.body && Array.isArray(r.body.templates)) COMBO_LIB.items=r.body.templates;
  COMBO_LIB.loaded=true;
  return COMBO_LIB.items||[];
}
async function modLabOpenLibrary(){ MODLAB.libraryOpen=true; paintModLab(); await comboLibLoad(!COMBO_LIB.loaded?false:true); paintModLab(); }
function modLabCloseLibrary(){ MODLAB.libraryOpen=false; paintModLab(); }
/**
 * ⭐⭐⭐ REOPENING A SAVED COMBO — two different jobs, told apart by whether anything is being built yet.
 * ⚠️ [OFFR-08] "you have save as option, but no Save option, if i edit the existing combo, we have to save
 * as well." A blank builder means this IS the thing being opened — its groups REPLACE the (empty) draft, its
 * name/price load too, and MODLAB.templateId remembers which template this is, so "💾 Save" (below) can
 * update it directly. Anything already being built means this is being COMBINED with something else — its
 * groups are ADDED, never a silent replace, and templateId stays null: a combination is not "that one
 * template" any more, only "Save as" (a new one) makes sense for it.
 */
function modLabUseTemplate(id){
  var t=(COMBO_LIB.items||[]).filter(function(x){return x.id===id;})[0]; if(!t) return;
  var groups=CBVariant.normalize(t.definition);
  var editing = !MODLAB.pid && !modLabGroups().length;
  if(editing){
    modLabSetGroups(groups);
    MODLAB.name=t.name||''; MODLAB.price=(t.price==null?'':t.price); MODLAB.templateId=t.id;
  } else {
    modLabSetGroups(modLabGroups().concat(groups));
    MODLAB.templateId=null;
  }
  MODLAB.libraryOpen=false;
  if(!MODLAB.pid) MODLAB.building=true;
  toastSay(editing ? 'Opened “'+t.name+'” to edit.' : 'Added “'+t.name+'” — '+groups.length+' group'+(groups.length===1?'':'s')+'.');
  paintModLab();
}
/** ⚠️ no confirm() dialog — matches this Lab's own style (✕ on a group/option removes immediately too), and
 *  deleting a SAVED combo touches nothing already applied to a product; the toast says so. */

  var r=await apiFetch('DELETE', API+'/api/combo-templates/'+id);

/* ⭐ exampleGroup(), not addGroup() — see app.html's own comment on the same call; the answer to "I don't

function modLabAddGroup(){ modLabSetGroups(CBVariant.exampleGroup(modLabGroups())); }
function modLabRemoveGroup(gi){ modLabSetGroups(CBVariant.removeGroup(modLabGroups(), gi)); }
function modLabMoveGroup(gi,by){ modLabSetGroups(CBVariant.moveGroup(modLabGroups(), gi, gi+by)); }
function modLabSetGroup(gi,patch){ modLabSetGroups(CBVariant.setGroup(modLabGroups(), gi, patch)); }
function modLabAddOption(gi){ modLabSetGroups(CBVariant.addOption(modLabGroups(), gi, 'New option', 0)); }
function modLabRemoveOption(gi,oi){ modLabSetGroups(CBVariant.removeOption(modLabGroups(), gi, oi)); }
function modLabSetOption(gi,oi,patch){ modLabSetGroups(CBVariant.setOption(modLabGroups(), gi, oi, patch)); }
async function modLabApply(){
  var p=byId(MODLAB.pid); if(!p) return;
  var clean=CBVariant.normalize(modLabGroups());
  p.modifiers=clean;   /* the Lab's own copy — true immediately, whatever the save below does */
  if(S.biz==='mine' && savedLive()){
    toastSay('Saving “'+p.name+'”…');
    /**
     * ⚠️⚠️ [found live-testing, 2026-09-26] Athi: "not sure whether it reflected in the back office or only
     * in the front end." The bug: apiFetch() never THROWS on a real server refusal (4xx/5xx) — it resolves
     * normally with {ok:false}. This try/catch's `catch` was therefore dead code, and EVERY refusal still
     * printed "saved to your catalogue" because nothing ever reached it. Checking r.ok/r.queued directly is
     * the fix — and it is also the honest three-way answer: saved for real, only queued (offline), or refused.
     */
    var r=await apiFetch('PATCH', API+'/api/products/'+p.id, {item_data:{modifiers:clean}, merge:true}, 'modifiers');
    if(r.queued) toastSay('Saved here in the Lab. Offline right now — this reaches your catalogue (and then the till, on its next price refresh) once you’re back online.');
    else if(r.ok) toastSay('Saved — in the Lab and in your catalogue. The till will show it next time it refreshes prices.');
    else toastSay('Saved here in the Lab only — NOT in your catalogue: '+((r.body&&r.body.message)||'the save was refused')+'. The till will not see this.');
  } else {
    toastSay('Saved here in the Lab only — this is a sample catalogue, not yours. Sign in and use your own catalogue for this to reach your products or the till.');
  }
  paintModLab();
  /* ⭐⭐⭐ THE SETTINGS SCREEN'S OWN "MODIFIERS" CARD IS render()'s JOB, NOT paintModLab()'s — its count of how
   * many items already carry one goes stale (still "No product has a modifier yet") the moment Apply actually
   * changes that count, exactly the way setCost() already avoids by calling render() on every edit. Found by
   * using the real, deployed page, not by reading the code. */
  render();
}
/**
 * ── ⭐⭐⭐ [OFFR-06] THE SHARED EDITOR — one implementation, used by the builder AND the per-product screen ──
 * Unchanged from the original per-product code except reading `groups` as an argument instead of closing
 * over `p` — same markup, same verbs (modLabSetGroup/AddOption/…, already draft-aware).
 */
function comboGroupsEditorHTML(groups){
  var err=CBVariant.validate(groups).errors;
  var errFor=function(gi){ return err.filter(function(e){return e.at===gi;}).map(function(e){return e.message;}); };
  return groups.map(function(g,gi){
    var gerr=errFor(gi);
    return '<div class="kv" style="padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px">'
      + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
      + '<input class="inp" style="flex:1;min-width:140px;height:38px" value="'+esc(g.name)+'" placeholder="Group name" onchange="modLabSetGroup('+gi+',{name:this.value})">'
      + '<label style="display:flex;gap:4px;align-items:center;font-size:13px"><input type="checkbox" '+(g.required?'checked':'')+' onchange="modLabSetGroup('+gi+',{required:this.checked})"> Required</label>'
      + '<label style="display:flex;gap:4px;align-items:center;font-size:13px">Pick up to <input type="number" min="1" value="'+g.max+'" style="width:52px;height:32px" onchange="modLabSetGroup('+gi+',{max:this.value})"></label>'
      + '<button class="btn sm" onclick="modLabMoveGroup('+gi+',-1)" '+(gi===0?'disabled':'')+'>↑</button>'
      + '<button class="btn sm" onclick="modLabMoveGroup('+gi+',1)" '+(gi===groups.length-1?'disabled':'')+'>↓</button>'
      + '<button class="btn sm" onclick="modLabRemoveGroup('+gi+')">✕ Remove</button>'
      + '</div>'
      + (gerr.length?'<div style="color:var(--red);font-size:12px;margin-top:4px">'+gerr.map(function(m){return esc(m);}).join(' · ')+'</div>':'')
      + '<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">'
      + g.options.map(function(o,oi){
          return '<div style="display:flex;gap:6px;align-items:center">'
            + '<input class="inp" style="flex:1;height:36px" value="'+esc(o.name)+'" placeholder="Option" onchange="modLabSetOption('+gi+','+oi+',{name:this.value})">'
            + '<div class="inp" style="width:100px;height:36px"><span>₹</span><input type="number" step="0.01" value="'+o.price+'" onchange="modLabSetOption('+gi+','+oi+',{price:this.value})"></div>'
            + '<button class="btn sm" onclick="modLabRemoveOption('+gi+','+oi+')">✕</button></div>';
        }).join('')
      + '<button class="btn sm" style="align-self:flex-start" onclick="modLabAddOption('+gi+')">+ Add an option</button>'
      + '</div></div>';
  }).join('');
}

function paintComboTillPreview(){
  var body = document.getElementById('comboTillPreviewBody'), foot = document.getElementById('comboTillPreviewFoot');

  if (!body || !COMBO_TILL_PREVIEW) return;

/* ── the engine: two percentages, compounded ───────────────────────────── */
function offerFrac(p){
  if(S.goal==='percent') return Math.min(.99,num(S.pctOff)/100);
  if(S.goal==='amount')  return p.price>0?Math.min(1,num(S.rsOff)/p.price):0;
  return 0;
}
function loyMode(){
  if(!S.custOn || !S.loyOn) return 'none';
  if(S.goal==='percent'||S.goal==='amount') return 'pct';
  if(S.goal==='qty') return 'top';
  if(S.goal==='free') return (S.freeShape==='same'||S.freeShape==='cheapest')?'top':'either';
  if(S.goal==='bundle') return 'either';
  return 'na';
}
function loyFrac(){ return loyMode()==='pct' ? Math.min(.95,num(S.loyPct)/100) : 0; }
function combo(a,b){ return 1-(1-a)*(1-b); }
/**
 * ⭐⭐⭐ THE ONE PLACE THE REAL ENGINE ANSWERS "WHAT DOES A % OFF COME TO" (Phase: offer-lab adoption).
 * `frac` is already the combined offer+loyalty fraction (combo(), above) — a single percent_off asked of
 * CBOffers.evaluate() at that percentage is mathematically identical to price*(1-frac), and provably so:
 * verified against the spec's own §10 checks (10% off ₹70 → ₹63, compounded 10%+10% → 19% not 20%) before
 * this file was written. The difference from computing it locally is provenance, not the number — every
 * "final price" on this screen now comes from the same call the till and the storefront make, so a future
 * change to how the engine rounds or stacks reaches this page automatically instead of silently diverging.
 * ⚠️ ROUNDING AND THE BELOW-COST FLOOR STAY HERE, NOT IN THE ENGINE. They are this LAB's own policy — "never
 * show a price you would not actually charge" — not a fact about the offer, and the engine correctly knows
 * nothing about either.
 */
function engineFinal(unitPrice, frac){
  if(!(window.CBOffers && window.CBOffers.evaluate)) return R2(unitPrice*(1-frac));   /* engine missing: never blank the screen */
  var pct=Math.min(99,Math.max(0,frac*100));
  if(pct<=0) return R2(unitPrice);
  var r=CBOffers.evaluate({ lines:[{key:'x',qty:1,unitPrice:unitPrice}],
    offers:[{id:'preview',kind:'percent_off',percent:pct,scope:'line'}] });
  return R2(r.line_net.x);
}
/** ⭐ buy N of ONE item, get 1 more free (or at a %) — same-item buy_x_get_y, N+1 units on one line */
function engineBuyGetPay(unitPrice, buy, get, getPercent){
  if(!(window.CBOffers && window.CBOffers.evaluate)) return R2(unitPrice*buy);
  var r=CBOffers.evaluate({ lines:[{key:'x',qty:buy+get,unitPrice:unitPrice}],
    offers:[{id:'preview',kind:'buy_x_get_y',buy:buy,get:get,get_percent:getPercent==null?100:getPercent,scope:'line'}] });
  return R2(r.line_net.x);
}
/** ⭐ buy A, get B free (or at a %) — buy_x_get_y with a DIFFERENT reward item, exactly the cross-item shape
 * lib/offers-engine.js added for "buy rice, get oil free". Returns what is paid for A; B's line (if it were on
 * the same basket) would show as free — the wizard only ever prices the pair it was given, per spec §4. */
function engineBuyGetPayCross(aItemId, aPrice, bItemId, bQty, getPercent){
  if(!(window.CBOffers && window.CBOffers.evaluate)) return R2(aPrice);
  /* ⚠️ applies_to.item_ids RESTRICTS "BUY" TO A SPECIFICALLY, or the engine would count B's own line towards
     the purchase requirement too — the exact cross-item wiring lib/offers-engine.js was built for. */
  var r=CBOffers.evaluate({ lines:[{key:'a',item_id:aItemId,qty:1,unitPrice:aPrice},{key:'b',item_id:bItemId,qty:bQty,unitPrice:0}],
    offers:[{id:'preview',kind:'buy_x_get_y',buy:1,get:bQty,get_item_id:bItemId,get_percent:getPercent==null?100:getPercent,
             scope:'line',applies_to:{item_ids:[aItemId]}}] });
  return R2(r.line_net.a);
}
/** ⭐ buy a FEW, the cheapest of them is free — mix_and_match, one line of N units of a single item. What N of
 * ONE product pays after the cheapest of the N is free, the same kind the cheapest-of-a-mixed-shelf save uses. */
function engineMixMatchPay(unitPrice, n){
  if(!(window.CBOffers && window.CBOffers.evaluate)) return R2(unitPrice*(n-1));
  var r=CBOffers.evaluate({ lines:[{key:'x',qty:n,unitPrice:unitPrice}],
    offers:[{id:'preview',kind:'mix_and_match',buy:n-1,get:1,get_percent:100,scope:'line'}] });
  return R2(r.line_net.x);
}

/* one row of the item table, for a given total fraction off */
function row(p,frac){
  var base=p.price, want=engineFinal(base,frac), status='ok';
  if(p.cost==null) status='nocost';
  else if(S.belowCost && want < p.cost-0.005){
    if(S.belowAct==='exclude'){ status='left'; want=base; }
    else if(S.belowAct==='cap'){ status='capped'; want=p.cost; }
    else status='loss';
  }
  var shown=R2(status==='left'?base:roundDown(want,base));
  if(p.cost!=null && shown<p.cost-0.005) status='loss';
  return {p:p, base:base, shown:shown, status:status,
    profit: p.cost==null?null:R2(shown-p.cost),
    margin: p.cost==null?null:marginPct(shown,p.cost),
    wasProfit: p.cost==null?null:R2(base-p.cost),
    wasMargin: p.cost==null?null:marginPct(base,p.cost)};
}
/* "as if one of each" — there is no volume in here, ever */
function totals(rs){
  var pb=0,pa=0,cb=0,n=0,blind=0;
  rs.forEach(function(r){ if(r.p.cost==null){blind++;return;}
    n++; pb+=r.base; pa+=r.shown; cb+=r.p.cost; });
  return {n:n, blind:blind, priceBefore:R2(pb), priceAfter:R2(pa), cost:R2(cb),
    profitBefore:R2(pb-cb), profitAfter:R2(pa-cb),
    marginBefore: pb>0?Math.round((pb-cb)/pb*100):0,
    marginAfter:  pa>0?Math.round((pa-cb)/pa*100):0};
}
function lineRows(){ var f=combo(0,loyFrac());
  return items().map(function(p){ return row(p, combo(offerFrac(p), loyFrac())); }); }

/* ── ladders (max three steps, always) ─────────────────────────────────── */
function tiers(){ return (S.tiers||[]).map(function(t){return {qty:num(t[0]),pct:num(t[1])};}); }
function setTier(i,which,v){ if(!S.tiers[i]) return; S.tiers[i][which]=Math.max(0,num(v)); S.applied=true; render(); }
function addTier(){ if(S.tiers.length>=3) return;
  var t=S.tiers[S.tiers.length-1]||[1,0];
  S.tiers.push([num(t[0])*2, Math.min(95,num(t[1])+5)]); S.applied=true; render(); }
function delTier(i){ if(S.tiers.length<=1) return; S.tiers.splice(i,1); S.applied=true; render(); }
function tierFault(){ var t=tiers(), bad=[];
  for(var i=1;i<t.length;i++){
    if(t[i].qty<=t[i-1].qty) bad.push('Step '+(i+1)+' must be more than '+t[i-1].qty);
    if(t[i].pct <t[i-1].pct) bad.push('Buying more should not give less than '+t[i-1].pct+'%'); }
  return bad; }
function counts(){ return (S.freeCounts||[1,2,3]).map(num); }
function setCount(i,v){ S.freeCounts[i]=Math.max(1,num(v)); S.applied=true; render(); }
function addCount(){ if(S.freeCounts.length>=3) return;
  S.freeCounts.push(num(S.freeCounts[S.freeCounts.length-1])+1); S.applied=true; render(); }
function delCount(i){ if(S.freeCounts.length<=1) return; S.freeCounts.splice(i,1); S.applied=true; render(); }
function setBill(i,v){ S.bills[i]=Math.max(1,num(v)); S.applied=true; render(); }

/* three representative items in the shelf: cheapest, middle, dearest */
function threeOf(list){
  var xs=list.filter(function(p){return p.cost!=null;})
             .sort(function(a,b){return a.price-b.price;});
  if(!xs.length) return [];
  if(xs.length<3) return xs;
  return [xs[0], xs[Math.floor(xs.length/2)], xs[xs.length-1]];
}

/* ── small view helpers ────────────────────────────────────────────────── */
function mgnClass(m,status){
  if(status==='nocost'||m==null) return 'na';
  if(m<0) return 'loss';
  if(m<num(S.margin)) return 'under';
  return '';
}
function mgnText(m,status){ return (status==='nocost'||m==null)?'N/A':m+'%'; }
function seg(k,opts,fn){
  return '<div class="seg">'+opts.map(function(o){
    return '<button class="'+(String(S[k])===String(o[0])?'on':'')+'" onclick="'+
      (fn||'edit')+'(\''+k+'\',\''+o[0]+'\')">'+o[1]+'</button>';}).join('')+'</div>';

/**
 * ── ⭐⭐⭐ SEARCH, NOT A DROPDOWN TO SCROLL — [REUSES THE OVERLAY, 2026-09-26, same as offer-lab-next.html's
 * own copy] First an <input list=datalist> (unreliable native popup), then a hand-built dropdown of its own.
 * Athi, on that: "why are you not reusing the existing component?" — right question: #priceOverlay below is
 * a real, scrollable, searchable product list already, built to be reused. selectOf() just opens it in a
 * picking mode now. Kept byte-for-byte identical to the sibling copy on purpose.
 */
function selectOf(list,val,fn){
  var cur = list.filter(function(o){ return String(o[0])===String(val); })[0];
  return '<button type="button" class="btn" style="width:100%;justify-content:space-between;font-weight:500" '+
    'onclick="openPickOverlay(\''+(fn==='setCat'?'cat':'item')+'\',\''+fn+'\')">'+
    '<span>'+(cur?esc(cur[1]):'Choose…')+'</span><span style="color:var(--faint)">▾</span></button>';
}
function prodOpts(list){ return list.map(function(p){
  return [p.id, p.name+'  —  '+M0(p.price)];}); }

     '</div>'+

   * is ever set from Offer Lab itself.
   * ⚠️ RENDERED ONLY WHEN COST_ACCESS.is_owner — an actor never sees this card at all.

  if(S.biz==='mine' && savedLive() && COST_ACCESS.is_owner){

         '👥 Open Co-assists</button></div>';

  h+='<div class="acts"><button class="btn pri" onclick="go(1)">Done — pick an offer</button></div>';

}

        '<div class="inp"><span>₹</span><input type="text" inputmode="decimal" min="0" value="'+esc(S.bandHi==null?'':String(S.bandHi))+'" data-key="bandHi" oninput="edit(\'bandHi\',this.value)"></div></div></div>';
  }
  return '';
}
function setGift(v){ S.giftId=v; render(); }
function setA(v){ if(S.goal==='bundle') S.bunA=v; else S.pairA=v; render(); }
function setB(v){ if(S.goal==='bundle') S.bunB=v; else S.pairB=v; render(); }

/* ═══ OUTPUT ══════════════════════════════════════════════════════════ */
function outHTML(){
  var body='';
  switch(S.goal){
    case 'percent': case 'amount': body=outLine(); break;
    case 'qty':    body=outQty(); break;
    case 'free':   body=S.freeShape==='anything'?outGift():
                          S.freeShape==='same'    ?outSame():
                          S.freeShape==='pair'    ?outPair():outCheap(); break;
    case 'bundle': body=outBundle(); break;
    case 'spend':  body=outSpend(); break;
    case 'ship':   body=outShip(); break;
    case 'band':   body=outBand(); break;
  }
  return body+cartPreviewHTML();
}
/**
 * ── ⭐⭐⭐ ON A REAL BASKET, NOT JUST ONE ITEM (Athi: "can provide how the cart looks like with this offer in
 * place, and also can compute margin"; "we should not lose that functionality" — the current offer-lab.html
 * already shows a real cart via app/cart.js) ──────────────────────────────────────────────────────────────
 *
 * Not a second offer type merged onto the screen — the SAME one offer this screen is configured as (reusing
 * subKindOf()/ruleParamsOf(), built for Saved offers), shown against 2-3 everyday items together instead of
 * one, through the real engine, because that is what a customer's bill actually looks like: several things,
 * only some of them touched by any one offer.
 * ⚠️ NOT FOR spend/ship/band — those already show three whole-bill sightlines, which answers the same question
 * a mixed basket would, more directly (a spend threshold cares about the BILL TOTAL, not which items make it
 * up). Forcing a basket onto them would be a second, weaker way to ask something already answered.
 */
function cartPreviewItems(){
  var pool=P.filter(function(p){return p.cost!=null;}); if(pool.length<2) pool=P.slice();
  var picked=[];
  function add(p){ if(p && picked.indexOf(p)<0) picked.push(p); }
  if(S.goal==='bundle'){ add(byId(S.bunA)); add(byId(S.bunB)); }
  else if(S.goal==='free'){
    if(S.freeShape==='same') add(byId(S.itemId));
    else if(S.freeShape==='pair'){ add(byId(S.pairA)); add(byId(S.pairB)); }
    else if(S.freeShape==='anything') add(byId(S.giftId));
    else if(S.freeShape==='cheapest') catItems(S.catId).slice(0,2).forEach(add);
  } else if(S.goal==='percent'||S.goal==='amount'||S.goal==='qty'){
    if(S.scope==='item') add(byId(S.itemId)); else catItems(S.catId).slice(0,2).forEach(add);
  } else return [];   /* spend / ship / band: the three-bill sightline already answers this */
  for(var i=0;i<pool.length && picked.length<3;i++) add(pool[i]);
  return picked.slice(0,3);
}
function cartPreviewLines(items){
  return items.map(function(p){
    var qty=1;
    if(S.goal==='qty'){ var ts=tiers(), top=ts[ts.length-1]; if(top && p.id===S.itemId) qty=top.qty; }
    else if(S.goal==='free'&&S.freeShape==='same'&&p.id===S.itemId) qty=(counts()[0]||1)+1;
    else if(S.goal==='free'&&S.freeShape==='cheapest') qty=Math.max(2,num(S.cheapN));
    return { key:p.id, item_id:p.id, name:p.name, category:p.cat, qty:qty, unitPrice:p.price, cost:p.cost };
  });
}
function cartPreviewHTML(){
  var items=cartPreviewItems(); var sub=subKindOf();
  if(!items.length || !sub) return '';
  var lines=cartPreviewLines(items);
  var offer=Object.assign({id:'preview',kind:sub}, ruleParamsOf());
  var ev; try{ ev=CBOffers.evaluate({ lines:lines, offers:[offer] }); }catch(e){ return ''; }
  var costTotal=0, costKnown=true;
  lines.forEach(function(l){ if(l.cost==null) costKnown=false; else costTotal+=l.cost*l.qty; });
  var margin=(costKnown && ev.total>0) ? Math.round((ev.total-costTotal)/ev.total*100) : null;
  var rows=lines.map(function(l){
    var was=R2(l.unitPrice*l.qty), now=R2(ev.line_net[l.key]!=null?ev.line_net[l.key]:was), moved=Math.abs(was-now)>0.005;
    return '<tr><td data-l="">'+esc(l.qty)+' × '+esc(l.name)+(moved?' <span class="pill p-appr" style="margin-left:4px">this offer</span>':'')+'</td>'
      +'<td class="num" data-l="Price">'+(moved?'<span class="was">'+M0(was)+'</span>':'')+M0(now)+'</td></tr>';
  }).join('');
  var notes=(ev.notes||[]).filter(function(n){return n.why;}).map(function(n){return '<div class="hint">'+esc(n.why)+'</div>';}).join('');
  return '<div class="card pad" style="margin-top:14px">'
    +'<h3 class="h" style="font-size:16px">On a real basket</h3>'
    +'<p class="hs">A sample bill with other everyday items on it too — not just what this offer targets.</p>'
    +headline([[M0(ev.total),'this basket comes to'],
               [margin==null?'N/A':margin+'%','basket margin',margin!=null&&margin<num(S.margin)?'dn':'up']])
    +'<div style="overflow-x:auto"><table class="res"><thead><tr><th>Item</th><th>Price</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +notes+'</div>';
}
function under(m){ return m!=null && m<num(S.margin); }
function mgnSpan(m,st){ return '<span class="cm '+mgnClass(m,st)+'">'+mgnText(m,st)+'</span>'; }

/* ── a percentage off / rupees off ─────────────────────────────────── */
function outLine(){
  var rs=lineRows().sort(function(a,b){
    var x=a.margin==null?999:a.margin, y=b.margin==null?999:b.margin; return x-y; });
  var t=totals(rs), lf=loyFrac();
  var h=headline([
    [M0(t.priceAfter),'they pay, one of each','',M0(t.priceBefore)],
    [M0(t.profitAfter),'your profit','',M0(t.profitBefore)],
    [t.marginAfter+'%','margin',t.marginAfter<num(S.margin)?'dn':'up',t.marginBefore+'%']
  ]);
  /**
   * ⭐⭐⭐ THE COMBINED PERCENTAGE, PER ROW, NOT ONE EXAMPLE ABOVE THE TABLE (Athi: "one more column to show
   * 10+5%=14.5%... otherwise someone has to compute"). The single note this replaced used items()[0] to stand
   * in for every row — exactly right on the % screen, where every item takes the same flat rate, but WRONG on
   * the ₹ screen: ₹10 off a ₹20 item is 50%, ₹10 off a ₹200 item is 5%, so one example at the top understated
   * or overstated every other row. ⚠️ COMPUTED FROM base/shown, NEVER FROM THE REQUESTED FRACTION — a row that
   * was left out (below-cost, excluded) shows 0% actually taken, not the 14.5% that was asked for and refused.
   */
  h+='<div class="card" style="overflow-x:auto"><table class="res"><thead><tr>'+
     '<th>Item</th><th class="hide">Cost</th><th>Off</th><th>Price</th><th>Profit</th><th>Margin</th>'+
     '</tr></thead><tbody>'+rs.map(function(r){
       var ch=r.shown!==r.base;
       var offAmt=R2(r.base-r.shown), offPct=r.base>0?(offAmt/r.base*100):0;
       return '<tr>'+nameCell(r.p)+costCell(r.p)+
         '<td class="num" data-l="Off">'+(offAmt>0?M0(offAmt)+' <span class="sub">'+PC(offPct)+'</span>':'—')+'</td>'+
         '<td class="num" data-l="Price">'+(ch?'<span class="was">'+M0(r.base)+'</span>':'')+M0(r.shown)+'</td>'+
         '<td class="num" data-l="Profit">'+(r.profit==null?'—':
           (ch&&r.wasProfit!=null?'<span class="was">'+M0(r.wasProfit)+'</span>':'')+M0(r.profit))+'</td>'+
         '<td data-l="Margin">'+(ch&&r.wasMargin!=null&&r.margin!=null&&r.wasMargin!==r.margin
             ?'<span class="was">'+r.wasMargin+'%</span>':'')+
           '<span class="mgn mgn-'+(mgnClass(r.margin,r.status)||'ok')+'">'+
           mgnText(r.margin,r.status)+'</span></td></tr>';
     }).join('')+'</tbody></table></div>';
  if(t.blind) h+='<div class="hint">'+t.blind+' with no cost — left out.</div>';
  return h;
}

  if(faults.length) h+='<div class="note n-bad"><span class="ic">!</span><div>'+faults.join('. ')+'.</div></div>';

           '" onchange="setTier('+i+',0,this.value)"><span>or more</span></span>'+
         '<span class="inp"><input type="number" min="0" max="95" value="'+t.pct+

         '<button class="colx" onclick="delTier('+i+')" '+(ts.length<=1?'disabled':'')+'>×</button>'+

     '</tr></thead><tbody>'+
     its.map(function(p){

         ts.map(function(t){ var r=row(p,t.pct/100);
           return '<td class="slab" data-l="buy '+t.qty+'+"><span class="cell">'+
             '<span class="cp">'+M0(r.shown)+'</span>'+mgnSpan(r.margin,r.status)+'</span></td>';}).join('')+
         (ts.length<3?'<td></td>':'')+'</tr>';}).join('')+
     '</tbody><tfoot><tr><td colspan="2"><b>All '+its.length+'</b></td><td></td>'+
     ts.map(function(t){ var tt=totals(its.map(function(p){return row(p,t.pct/100);}));
       return '<td class="slab" data-l="buy '+t.qty+'+"><span class="cell">'+

  if(loyMode()==='top'&&S.loyOn){

       (r?' · '+esc(one.name)+' '+M0(r.shown)+' · '+mgnText(r.margin,r.status):'')+'</div></div>';

/* ── buy anything, one named thing free ────────────────────────────── */
function outGift(){
  var g=byId(S.giftId); if(!g) return '';
  var am=avgM(), bills=(S.bills||[]).map(num);
  var heads=bills.map(function(b,i){
    return ['<span class="inp" style="width:104px;height:31px"><span>₹</span>'+
      '<input type="number" min="1" value="'+b+'" onchange="setBill('+i+',this.value)"></span>','',false];});
  var rows=[
    ['Share', bills.map(function(b){return PC(g.price/b*100);})],
    ['Goods', bills.map(function(b){return M0(b*(1-am));})],
    ['Gift', bills.map(function(){return g.cost==null?'N/A':M0(g.cost);})],
    ['You make', bills.map(function(b){return g.cost==null?'N/A':M0(b*am-g.cost);}), true],
    ['Margin', bills.map(function(b){
       if(g.cost==null) return 'N/A';
       var m=Math.round((am-g.cost/b)*100);
       return '<span class="'+(m<num(S.margin)?'':'')+'" style="color:'+
         (m<0?'var(--red-i)':m<num(S.margin)?'var(--amber-i)':'var(--green-d)')+'">'+m+'%</span>'+
         '<span class="sub">'+Math.round(am*100)+'%</span>';}), true]
  ];
  var h=headline([[M0(g.price),'worth to them'],
                  [g.cost==null?'N/A':M0(g.cost),'costs you','bad'],
                  [Math.round(am*100)+'%','your average margin']]);
  h+='<div class="card pad">'+g3(heads,rows)+'</div>';
  if(g.cost!=null){
    var be=g.cost/(am-num(S.margin)/100);
    h+='<div class="note '+(be>0?'n-warn':'n-ok')+'"><span class="ic">●</span><div>'+
      M0(g.cost)+' every time · '+(be>0?'under your '+num(S.margin)+'% below a '+M0(be)+' bill':
      'always clears your '+num(S.margin)+'%')+'</div></div>';
  }
  h+=eitherNote(g.price);
  h+='<div class="hint">Goods cost uses your catalogue average — what they buy is not knowable here.</div>';
  return h;
}

/* ── buy N of one thing, one more free ─────────────────────────────── */
function outSame(){
  var p=byId(S.itemId); if(!p) return '';
  var cs=counts();
  var heads=cs.map(function(n,i){
    return ['<span class="inp" style="width:104px;height:31px">'+
      '<input type="number" min="1" value="'+n+'" onchange="setCount('+i+',this.value)"><span>buy</span></span>',
      '<span style="font-family:\'IBM Plex Mono\',monospace">+1 · '+PC(100/(n+1))+'</span>',false];});
  /* ⭐ buy_x_get_y, live — the same kind and the same call the till fires when a real N+1 round is rung */
  var mk=function(n){ var pay=engineBuyGetPay(p.price,n,1), cost=p.cost==null?null:(n+1)*p.cost;
    return {pay:pay,cost:cost,make:cost==null?null:pay-cost,
            m:cost==null?null:marginPct(pay,cost)};};
  var rows=[
    ['They take', cs.map(function(n){return (n+1);})],
    ['They pay',  cs.map(function(n){return M0(mk(n).pay);})],
    ['Costs you', cs.map(function(n){return mk(n).cost==null?'N/A':M0(mk(n).cost);})],
    ['You make',  cs.map(function(n){var x=mk(n);return x.make==null?'N/A':M0(x.make);}),true],
    ['Margin',    cs.map(function(n){var x=mk(n); if(x.m==null) return 'N/A';
       return '<span style="color:'+(x.m<0?'var(--red-i)':x.m<num(S.margin)?'var(--amber-i)':'var(--green-d)')+
         '">'+x.m+'%</span><span class="sub">'+marginPct(p.price,p.cost)+'%</span>';}),true]
  ];
  var h=headline([[M0(p.price),esc(p.name)],
                  [p.cost==null?'N/A':M0(p.cost),'costs you'],
                  [marginPct(p.price,p.cost)+'%','margin now']]);
  h+='<div class="card pad">'+g3(heads,rows)+'</div>';
  var ok=cs.filter(function(n){var x=mk(n);return x.m!=null&&x.m>=num(S.margin);});
  h+='<div class="note '+(ok.length?'n-ok':'n-bad')+'"><span class="ic">'+(ok.length?'✓':'!')+
     '</span><div>'+(ok.length?'Clears your '+num(S.margin)+'% from buy '+ok[0]+' +1':
     'No step here clears your '+num(S.margin)+'%')+'</div></div>';
  if(loyMode()==='top'&&S.loyOn){
    var x=mk(cs[0]);
    h+='<div class="note '+(x.m!=null&&x.m<num(S.margin)?'n-warn':'n-ok')+'"><span class="ic">●</span>'+
       '<div>Loyalty: buy '+cs[0]+' +1 from the first visit · '+

}

/* ── buy A, get B free ─────────────────────────────────────────────── */
function outPair(){
  var a=byId(S.pairA), b=byId(S.pairB); if(!a||!b) return '';
  var was=a.price+b.price, cost=(a.cost==null||b.cost==null)?null:a.cost+b.cost;
  /* ⭐ buy_x_get_y, cross-item, live — the same call the till fires when B's line reads "free — buy A get B" */
  var pay=engineBuyGetPayCross(a.id,a.price,b.id,1);
  var make=cost==null?null:pay-cost, m=cost==null?null:marginPct(pay,cost);
  var h=headline([[M0(pay),'they pay','',M0(was)],
                  [make==null?'N/A':M0(make),'you make',make!=null&&make<0?'bad':''],
                  [m==null?'N/A':m+'%','margin',m!=null&&m<num(S.margin)?'dn':'up']]);
  h+='<div class="card pad">'+g3([[esc(a.name)+' + '+esc(b.name),'',true]],[
     ['Apart',[M0(was)]],['They pay',[M0(a.price)]],
     ['Costs you',[cost==null?'N/A':M0(cost)]],
     ['You make',[make==null?'N/A':M0(make)],true],
     ['Margin',[m==null?'N/A':m+'%'],true]])+'</div>';
  h+='<div class="note n-say"><span class="ic">●</span><div>The free one is <b>'+
     PC(b.price/was*100)+'</b> of the pair</div></div>';
  h+=eitherNote(b.price,was);
  return h;
}

/* ── buy N, cheapest free ──────────────────────────────────────────── */
function outCheap(){
  var n=Math.max(2,num(S.cheapN)), three=threeOf(catItems(S.catId));
  if(!three.length) return '<div class="note n-warn"><span class="ic">!</span><div>No costs on this shelf.</div></div>';
  var labels=['Your cheapest','A middle one','Your dearest'].slice(0,three.length);
  var heads=three.map(function(p,i){return [esc(p.name),
    '<span style="font-family:\'IBM Plex Mono\',monospace">'+M0(p.price)+' · '+labels[i]+'</span>',
    i===three.length-1];});
  /**
   * ⭐ mix_and_match, live — each of the three columns asks "if every one of the N were THIS item, what is the
   * cheapest-of-N worth". A single item bought N times has only one price to be cheapest among, so this reads
   * the same number buy_x_get_y would (verified when that kind was first wired) — the point of asking the real
   * engine is provenance, not a different answer: a future change to how it rounds or stacks reaches this
   * screen too, automatically, rather than a parallel formula quietly falling out of step.
   */
  var mk=function(p){ var pay=engineMixMatchPay(p.price,n), cost=n*p.cost;
    return {pay:pay,cost:cost,make:pay-cost,m:marginPct(pay,cost)};};
  var rows=[
    ['They take', three.map(function(){return n;})],
    ['They pay',  three.map(function(p){return M0(mk(p).pay);})],
    ['Costs you', three.map(function(p){return M0(mk(p).cost);})],
    ['You make',  three.map(function(p){return M0(mk(p).make);}),true],
    ['Margin',    three.map(function(p){var x=mk(p);
      return '<span style="color:'+(x.m<0?'var(--red-i)':x.m<num(S.margin)?'var(--amber-i)':'var(--green-d)')+
        '">'+x.m+'%</span><span class="sub">'+marginPct(p.price,p.cost)+'%</span>';}),true]
  ];
  var worst=three[three.length-1], wx=mk(worst);
  var h=headline([['buy '+n,'cheapest free'],
                  [PC(100/n),'off, at most'],
                  [wx.m+'%','worst case',wx.m<num(S.margin)?'dn':'up']]);
  h+='<div class="card pad">'+g3(heads,rows)+'</div>';
  h+='<div class="note '+(wx.m<num(S.margin)?'n-warn':'n-ok')+'"><span class="ic">●</span><div>'+
     'Worst case is '+n+' × '+esc(worst.name)+' · '+wx.m+'%</div></div>';
  return h;
}

/* ── two things, one price ─────────────────────────────────────────── */
function outBundle(){
  var a=byId(S.bunA), b=byId(S.bunB); if(!a||!b) return '';
  var was=a.price+b.price, pay=num(S.bunPrice);
  var cost=(a.cost==null||b.cost==null)?null:a.cost+b.cost;
  var make=cost==null?null:R2(pay-cost), m=cost==null?null:marginPct(pay,cost);
  var h=headline([[M0(pay),'they pay','',M0(was)],
                  [make==null?'N/A':M0(make),'you make',make!=null&&make<0?'bad':''],
                  [m==null?'N/A':m+'%','margin',m!=null&&m<num(S.margin)?'dn':'up']]);
  h+='<div class="card pad">'+g3([[esc(a.name)+' + '+esc(b.name),'',true]],[
     ['Apart',[M0(was)]],['Together',[M0(pay)]],
     ['That is',[PC((was-pay)/was*100)+' off']],
     ['Break-even',[cost==null?'N/A':M0(cost)]],
     ['You make',[make==null?'N/A':M0(make)],true],
     ['Margin',[m==null?'N/A':m+'%'],true]])+'</div>';
  if(cost!=null&&pay<cost) h+='<div class="note n-bad"><span class="ic">!</span><div>Below '+
     M0(cost)+' you lose money</div></div>';
  h+=eitherNote(was-pay,was);
  return h;
}

/* ── a big bill gets something back ────────────────────────────────── */
function outSpend(){
  var at=Math.max(1,num(S.spendAt)), give=num(S.spendVal), am=avgM();
  var bills=[at,at*2,at*4];
  var heads=bills.map(function(b,i){return [M0(b),'',i===0];});
  var rows=[
    ['Share', bills.map(function(b){return PC(give/b*100);})],
    ['Goods', bills.map(function(b){return M0(b*(1-am));})],
    ['You make', bills.map(function(b){return M0(b*am-give);}),true],
    ['Margin', bills.map(function(b){
       var m=Math.round((b*am-give)/(b-give)*100);

/**
 * ── ⭐⭐⭐ OFFLINE, ON PURPOSE (Athi: "must work offline too") ─────────────────────────────────────────────────
 *
 * Offer Lab is a planning tool, not a point-of-sale action — but the same shopkeeper who lost the line mid-bill
 * should not also lose the ability to keep pricing while it is down. Two stores, the shape till.html's own DB
 * already proved: `kv` (the last catalogue this browser read, so the page opens with real numbers with no
 * line) and `outbox` (a write that could not reach the server yet, replayed in order once it can).
 * ⚠️ ITS OWN DATABASE, NOT TILL.HTML'S. The till's is keyed per PAIRED COUNTER (a device); this is keyed per
 * SIGNED-IN PERSON — a different identity and a different scope, and conflating them is the exact fault
 * [[project-till-store-per-key]] already paid for once, in the other direction.
 */
var LabDB = (function(){
  var p = null;
  function open(){
    if (p) return p;
    p = new Promise(function(res, rej){
      var rq = indexedDB.open('offerlab', 1);
      rq.onupgradeneeded = function(){ var db = rq.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('outbox')) db.createObjectStore('outbox', { keyPath:'id', autoIncrement:true }); };
      rq.onsuccess = function(){ res(rq.result); }; rq.onerror = function(){ rej(rq.error); };
    });
    return p;
  }
  function tx(store, mode, fn){ return open().then(function(db){ return new Promise(function(res, rej){
    var t = db.transaction(store, mode), s = t.objectStore(store); var rq = fn(s);
    t.oncomplete = function(){ res(rq && ('result' in rq) ? rq.result : undefined); }; t.onerror = function(){ rej(t.error); }; }); }); }
  return {
    get: function(k){ return tx('kv','readonly',function(s){ return s.get(k); }).catch(function(){ return undefined; }); },
    set: function(k,v){ return tx('kv','readwrite',function(s){ return s.put(v,k); }).catch(function(){}); },
    queuePush: function(row){ return tx('outbox','readwrite',function(s){ return s.add(Object.assign({at:new Date().toISOString()},row)); }).catch(function(){ return null; }); },
    queueAll: function(){ return tx('outbox','readonly',function(s){ return s.getAll(); }).catch(function(){ return []; }); },
    queueDel: function(id){ return tx('outbox','readwrite',function(s){ return s.delete(id); }).catch(function(){}); },
  };
})();
/**
 * ⭐⭐ ONE FETCH, ONE QUEUE, FOR EVERY WRITE THIS PAGE MAKES — the offer shelf and an item's cost alike. On a
 * real network failure (fetch itself throwing — not a server ANSWER, not a 4xx) the request is held in the
 * outbox and replayed once the line returns: the exact "fall through and queue it" shape till.html's own
 * tillPost() already uses. ⚠️ A GET is never queued — there is nothing to replay a READ as; its caller falls
 * back to the cache instead (labUseMine, below).
 */
async function apiFetch(method, url, body, queueKind){
  try {
    var r=await fetch(url, { method:method,
      headers:Object.assign({'Content-Type':'application/json'}, savedToken()?{Authorization:'Bearer '+savedToken()}:{}),
      body: body?JSON.stringify(body):undefined });
    var j=null; try{ j=await r.json(); }catch(_){}
    return {ok:r.ok, status:r.status, body:j||{}, queued:false};
  } catch (e) {
    if (queueKind && method!=='GET') { await LabDB.queuePush({kind:queueKind, method:method, url:url, body:body||null}); labPaintQueue(); }
    return {ok:true, queued:true, body:{}};
  }
}
/** ⭐ replays queued writes IN ORDER; a real refusal (4xx) is dropped rather than retried for ever — the same
 * offer would only be refused again, and a queue that never empties is a queue nobody trusts */
async function labDrainOutbox(){
  var rows = await LabDB.queueAll();
  for (var i=0;i<rows.length;i++){
    var row = rows[i];
    try {
      var r = await fetch(row.url, { method:row.method,
        headers:Object.assign({'Content-Type':'application/json'}, savedToken()?{Authorization:'Bearer '+savedToken()}:{}),
        body: row.body?JSON.stringify(row.body):undefined });
      if (r.ok || (r.status>=400 && r.status<500)) await LabDB.queueDel(row.id);
      else break;   /* still refusing for a server reason — stop, try the rest again next time */
    } catch(_) { break; }   /* still offline — stop, try again on the next drain */
  }
  labPaintQueue();
  if (savedLive() && S.step===3) await loadSaved();
}
function labPaintQueue(){
  LabDB.queueAll().then(function(rows){
    var n=document.getElementById('labqueue'); if(!n) return;
    if(!rows.length){ n.hidden=true; return; }
    n.hidden=false; n.textContent=rows.length+' change'+(rows.length>1?'s':'')+' waiting to sync — will send once the line is back.';
  });
}

/**
 * ── ⭐⭐⭐ IMPORT A SPREADSHEET, FEEL THE PURPOSE WITH YOUR OWN NUMBERS (Athi: "possibly excel... bring it
 * here... so we can releast it public domain if required to use it, and feel the purpose") ──────────────────
 *
 * A visitor with no ChitBridge account can drop in their own product list and see their OWN margins react to

 * real-catalogue import the app already has elsewhere for onboarding — this never saves anywhere, never
 * leaves the browser tab, and forgets itself on reload exactly like the demo books always have.
 * ⚠️ HEADER NAMES ARE MATCHED LOOSELY, NEVER POSITIONALLY. A column-order guess is how the old catalogue
 * importer's csv-preflight screen was built to refuse silent mismatches; the same care applies here on a much
 * smaller scale — name/category/price/cost, whatever a person happened to call them.
 */
var IMPORT_NAME  = ['name','item','item name','product','product name'];
var IMPORT_CAT   = ['category','cat','section'];
var IMPORT_PRICE = ['price','rate','mrp','selling price','sale price'];
var IMPORT_COST  = ['cost','purchase','purchase price','cost price','buying price'];
function importField(row, names){
  var keys = Object.keys(row);
  for (var i=0;i<names.length;i++){
    for (var k=0;k<keys.length;k++){ if (String(keys[k]).trim().toLowerCase()===names[i]) return row[keys[k]]; }
  }
  return null;
}
function importSpreadsheet(input){
  var file = input && input.files && input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var raw = XLSX.utils.sheet_to_json(sheet, { defval:null });
      if (!raw.length) { toastSay('That file has no rows Offer Lab can read.'); return; }
      var seq = 0, rows = raw.map(function(r){
        var name = importField(r, IMPORT_NAME); if(!name) return null;
        var price = num(importField(r, IMPORT_PRICE));
        var costRaw = importField(r, IMPORT_COST);
        var cost = (costRaw==null || costRaw==='') ? null : num(costRaw);
        var cat = importField(r, IMPORT_CAT) || 'Imported';
        return ['imp'+(++seq), String(name).trim(), String(cat).trim(), price, cost];
      }).filter(Boolean);
      if (!rows.length) { toastSay('No row had a name Offer Lab could read — check the column is called "Name" or "Item".'); return; }
      buildBiz('imported', rows, file.name.replace(/\.(xlsx|xls|csv)$/i,''));
      applyBiz('imported');
      toastSay(rows.length+' rows read from '+file.name+' — nothing was saved anywhere; this stays in this tab.');
      render();
    } catch(err){ toastSay('Could not read that file — is it a spreadsheet (.xlsx, .xls or .csv)?'); }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}
