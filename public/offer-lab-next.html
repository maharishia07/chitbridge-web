/**
 * ── ⭐⭐⭐ IMPORT A SPREADSHEET, FEEL THE PURPOSE WITH YOUR OWN NUMBERS (Athi: "possibly excel... bring it
 * here... so we can releast it public domain if required to use it, and feel the purpose") ──────────────────
 *
 * A visitor with no ChitBridge account can drop in their own product list and see their OWN margins react to
 * real offer mechanics, instead of a hotel and a pharma distributor that are not theirs. Nothing here is the
 * real-catalogue import the app already has elsewhere for onboarding — this never saves anywhere, never
 * leaves the browser tab, and forgets itself on reload exactly like the demo books always have.
 * ⚠️ HEADER NAMES ARE MATCHED LOOSELY, NEVER POSITIONALLY. A column-order guess is how the old catalogue
 * importer's csv-preflight screen was built to refuse silent mismatches; the same care applies here on a much
 * smaller scale — name/category/price/cost, whatever a person happened to call them.
 */
var IMPORT_NAME  = ['name','item','item name','product','product name'];
var IMPORT_CAT   = ['category','cat','section'];
var IMPORT_PRICE = ['price','rate','mrp','selling price','sale price'];
var IMPORT_COST  = ['cost','purchase','purchase price','cost price','buying price'];
function importField(row, names){
  var keys = Object.keys(row);
  for (var i=0;i<names.length;i++){
    for (var k=0;k<keys.length;k++){ if (String(keys[k]).trim().toLowerCase()===names[i]) return row[keys[k]]; }
  }
  return null;
}
function importSpreadsheet(input){
  var file = input && input.files && input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var raw = XLSX.utils.sheet_to_json(sheet, { defval:null });
      if (!raw.length) { toastSay('That file has no rows Offer Lab can read.'); return; }
      var seq = 0, rows = raw.map(function(r){
        var name = importField(r, IMPORT_NAME); if(!name) return null;
        var price = num(importField(r, IMPORT_PRICE));
        var costRaw = importField(r, IMPORT_COST);
        var cost = (costRaw==null || costRaw==='') ? null : num(costRaw);
        var cat = importField(r, IMPORT_CAT) || 'Imported';
        return ['imp'+(++seq), String(name).trim(), String(cat).trim(), price, cost];
      }).filter(Boolean);
      if (!rows.length) { toastSay('No row had a name Offer Lab could read — check the column is called "Name" or "Item".'); return; }
      buildBiz('imported', rows, file.name.replace(/\.(xlsx|xls|csv)$/i,''));
      applyBiz('imported');
      toastSay(rows.length+' rows read from '+file.name+' — nothing was saved anywhere; this stays in this tab.');
      render();
    } catch(err){ toastSay('Could not read that file — is it a spreadsheet (.xlsx, .xls or .csv)?'); }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}
/** ⭐ the reverse direction — a plain CSV of what is on screen right now, no library needed to write one */
function exportCsv(){
  var rows = [['Item','Category','Price','Cost']].concat(P.map(function(p){
    return [p.name, p.cat, p.price, p.cost==null?'':p.cost];
  }));
  var csv = rows.map(function(r){
    return r.map(function(c){ var s=String(c==null?'':c); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',');
  }).join('\r\n');
  var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (BIZ[S.biz]&&BIZ[S.biz].name||'offer-lab')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}
/** ⭐ ONE ENGINE KIND PER SCREEN — the same registry lib/offers-engine.js's KINDS already names */
function subKindOf(){
  if(S.goal==='percent') return 'percent_off';
  if(S.goal==='amount') return 'amount_off';
  if(S.goal==='qty') return 'tier_price';
  if(S.goal==='bundle') return 'bundle_price';
  if(S.goal==='spend') return 'threshold';
  if(S.goal==='ship') return 'shipping';
  if(S.goal==='free') return S.freeShape==='cheapest'?'mix_and_match':S.freeShape==='anything'?'threshold':'buy_x_get_y';
  return null;   /* 'band' — refuse a very small/large bill — has no engine kind yet; kept local-only, see §the plan */
}
/** the concrete rule this screen is CURRENTLY showing, in the exact field names lib/offers-engine.js reads */
function ruleParamsOf(){
  var scopeIds=S.scope==='item'?{item_ids:(S.itemIds||[])}:{category:S.catId};
  if(S.goal==='percent') return {percent:num(S.pctOff), scope:'line', applies_to:scopeIds};
  if(S.goal==='amount') return {amount:num(S.rsOff), scope:'line', applies_to:scopeIds};
  if(S.goal==='qty') return {tiers:tiers(), scope:'line', applies_to:scopeIds};
  if(S.goal==='bundle') return {bundle_price:num(S.bunPrice), bundle_items:[S.bunA,S.bunB], scope:'line'};
  if(S.goal==='spend') return {min_amount:num(S.spendAt), amount:num(S.spendVal), scope:'cart'};
  if(S.goal==='ship') return {min_amount:num(S.shipAt), free:true, scope:'shipping'};
  if(S.goal==='free'){
    if(S.freeShape==='anything'){ var g=byId(S.giftId);
      /* ⚠️ "any bill" needs SOME stated minimum or the engine reads it as unfinished (verified against the
         real engine before this was written) — a nominal 1 is "any bill that is a bill", not a real threshold */
      return {min_amount:1, get_item_id:S.giftId, get_item_name:g?g.name:'', get_qty:1, get_percent:100, scope:'cart'}; }
    if(S.freeShape==='same'){ var n=counts()[0]||1;

    if(S.freeShape==='pair'){ var b=byId(S.pairB);

/** a unique-enough name — the API refuses a second definition of one kind with the same name */
function saveName(l){ return l.title+(l.detail?' · '+l.detail:'')+' · '+new Date().toISOString().slice(0,16); }

/** ⭐ mirrors the shelf into SAVED's own shape, so renderS3/clash/costMoved need not know the source */
async function loadSaved(){

function openSaved(id){

function toastSay(t){ var n=document.getElementById('labtoast'); if(n){ n.textContent=t; n.hidden=false; } else alert(t); }

/**
 * ── commercetools' rule, borrowed: only ONE item-level discount may apply to an item (highest ranked wins);
 * bill-level ones can stack. So two live offers touching the same shelf is a collision worth naming, not a
 * silent race.
 *
 * ⭐⭐⭐ [2026-09-26] ONE SHARED "DOES THIS SCOPE COVER THAT ITEM" TEST — lifted out of clash() so
 * overlayApplyRows() (the new checkbox picker) can ask the SAME question per-row, live, while picking, rather
 * than only after saving. `snap.itemIds` is the current shape; `snap.itemId` (singular) is read too, so an
 * older saved offer from before this field existed is still understood correctly.
 */
function scopeCoversItem(snap,p){
  if(!p) return false;
  if(snap.scope==='cat') return p.cat===snap.catId;
  var ids=(snap.itemIds&&snap.itemIds.length)?snap.itemIds:(snap.itemId?[snap.itemId]:[]);
  return ids.indexOf(p.id)>=0;
}
function scopesOverlap(a,b){
  if(a.scope==='cat'&&b.scope==='cat') return a.catId===b.catId;
  var aIds=(a.itemIds&&a.itemIds.length)?a.itemIds:(a.itemId?[a.itemId]:[]);
  var bIds=(b.itemIds&&b.itemIds.length)?b.itemIds:(b.itemId?[b.itemId]:[]);
  if(a.scope==='item'&&b.scope==='item') return aIds.some(function(id){return bIds.indexOf(id)>=0;});
  var itemSide=a.scope==='item'?aIds:bIds, catSide=a.scope==='item'?b.catId:a.catId;
  return itemSide.some(function(id){ var p=byId(id); return p&&p.cat===catSide; });

function clash(sv){
  if(['percent','amount','qty'].indexOf(sv.snap.goal)<0) return null;
  var other=SAVED.filter(function(x){
    if(x.id===sv.id||x.biz!==sv.biz) return false;
    if(x.status==='draft'&&sv.status==='draft') return false;
    if(['percent','amount','qty'].indexOf(x.snap.goal)<0) return false;
    return scopesOverlap(sv.snap,x.snap);

  return other.length?other.length:null;
}
/** ⭐ Athi, live: "if any of the item is already in the offer it has to highlight, which offer it is already
 * included." The same overlap test clash() uses, asked per PRODUCT instead of per saved-offer-pair, so the
 * picker can say so BEFORE a save ever happens, not just warn after. First match wins (rare in practice —
 * a shop with two live overlapping offers already has a clash() warning on both of them). */
function offerCoveringItem(p){
  for(var i=0;i<SAVED.length;i++){
    var x=SAVED[i];
    if(x.biz!==S.biz||x.status==='retired') continue;
    if(['percent','amount','qty'].indexOf(x.snap.goal)<0) continue;
    if(scopeCoversItem(x.snap,p)) return x;
  }
  return null;
}

/**
 * ⚠️ FOUR REAL STATES, NOT THREE PRETENDING TO BE FIVE. v5's own prototype sent "Pause" back to 'approved' —
 * indistinguishable from a draft someone had just reviewed and not yet launched. A live offer that stops must
 * say PAUSED, or "why is this showing at the till" and "why did we never launch this" become the same question.
 */
function renderS3(){
  var h='<div class="card pad"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
        '<h2 class="h">Saved offers</h2>'+backBtn(0)+'</div>'+
        '<p class="hs">'+(savedLive()?'Draft → approved → live → paused.':'Draft → approved → live. Sign in to keep these past this tab.')+'</p></div>';
  if(!SAVED.length) return h+'<div class="card empty">Nothing saved yet.</div>';
  h+='<div class="bucket" style="margin-top:14px">';
  SAVED.forEach(function(sv){
    var moved=costMoved(sv), pillClass=sv.status==='live'?'live':sv.status==='paused'?'paused':sv.status==='approved'?'appr':'draft';
    h+='<div class="sv"><div class="svm">'+
      '<div class="svt">'+esc(sv.title)+'</div>'+
      '<div class="svd">'+esc(sv.detail)+' · '+esc(BIZ[sv.biz].name)+'</div>'+
      '<div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">'+
        '<span class="pill p-'+pillClass+'">'+esc(sv.status)+'</span>'+
        (moved?'<span class="pill p-stale">'+moved+' cost'+(moved>1?'s':'')+' changed since</span>':'')+
        (clash(sv)?'<span class="pill p-stale">overlaps '+clash(sv)+' other</span>':'')+
      '</div></div>'+
      '<div style="text-align:right"><div class="svn">'+esc(sv.n)+'</div><div class="svk">'+esc(sv.k)+'</div></div>'+
      '<div style="display:flex;gap:7px;flex-wrap:wrap;width:100%">'+
        '<button class="btn sm" onclick="openSaved(\''+sv.id+'\')">Review</button>'+
        (sv.status==='draft'?'<button class="btn sm" onclick="setStatus(\''+sv.id+'\',\'approved\')">Approve</button>':'')+
        (sv.status==='approved'?'<button class="btn sm pri" onclick="setStatus(\''+sv.id+'\',\'live\')">Go live</button>':'')+
        (sv.status==='live'?'<button class="btn sm" onclick="setStatus(\''+sv.id+'\',\'paused\')">Pause</button>':'')+
        (sv.status==='paused'?'<button class="btn sm pri" onclick="setStatus(\''+sv.id+'\',\'live\')">Resume</button>':'')+
        '<button class="btn sm" onclick="dropSaved(\''+sv.id+'\')">'+(savedLive()?'Retire':'Delete')+'</button>'+
      '</div></div>';
  });
  return h+'</div>';
}

/* ═══ SHELL ═══════════════════════════════════════════════════════════ */
function render(){
  var B=BIZ[S.biz];
  document.getElementById('bizName').textContent=B.name;
  /* ⚠️⚠️ THE SAMPLE SWITCHER IS GONE (Athi: "there is a Sri button appearing... we have to speak about the
     shop only"). "Sri Sai Pharma Distributors" sat one tap from the real shop's own name. HOTEL stays as the
     one thing the page boots with before a sign-in or an import replaces it; PHARMA (var PHARMA above) and
     setBiz() are untouched below for a future public/marketing release that genuinely wants more than one
     example, but nothing in this build reaches them.
     ⚠️⚠️⚠️ [OFFR-01] THAT WAS NOT THE WHOLE FIX. HOTEL's own sample was ALSO named "Mayur Bhavan" — Athi's
     real shop's name, by coincidence — so a session that opened before sign-in (or where sign-in silently
     failed) still read "Mayur Bhavan" at the top, identical to the real thing, with no switcher left to
     reveal a second name to compare it against. Athi typed real cost prices into it believing it was his
     shop's own catalogue; none of them reached it, because S.biz was still 'hotel', not 'mine'. Renamed
     the sample (see HOTEL above) AND added a banner that says so on every visit, not only inside one
     overlay's footer — a fact this important cannot depend on which screen happens to be open. */
  /* ⭐ [per Athi's design doc] "Sample data — nothing here reaches your shop." — shorter, matches the
     12-word explanation budget; the sample business's own name (e.g. "Sample Tiffin Corner") already sits
     right beside it as the #bizName chip, so repeating it here was rule 3's duplicate string, not new info. */
  var sampleNote=document.getElementById('labSampleNote');
  if(S.biz!=='mine'){
    sampleNote.hidden=false;
    sampleNote.innerHTML='Sample data — nothing here reaches your shop.'
      +' <button class="chip" onclick="labUseMine()">Use my catalogue</button>';
  } else sampleNote.hidden=true;

  document.getElementById('strip').innerHTML = S.step===0?'' :
    '<div class="strip">Margin <b>'+num(S.margin)+'%</b><span>·</span>'+
    (S.round==='0'?'exact':S.round==='1'?'whole ₹':'ends '+(S.round==='5'?'0 or 5':'0'))+
    '<span>·</span>loyalty '+(S.custOn?'up to <b>'+num(S.cap)+'%</b>':'off')+
    '<button onclick="go(0)">Change</button></div>';

  var names=['Settings','Offer','Work it out'];
  document.getElementById('steps').innerHTML = S.step===3?'' : names.map(function(n,i){
    return '<button class="stp '+(S.step===i?'on':S.step>i?'done':'')+'" onclick="go('+i+')">'+
      '<span class="n">'+(i+1)+'</span><span><span class="t">'+n+'</span></span></button>';}).join('');

  [0,1,2,3].forEach(function(i){
    var el=document.getElementById('s'+i);
    el.className='screen'+(S.step===i?' on':'');
    if(S.step===i) el.innerHTML=[renderS0,renderS1,renderS2,renderS3][i]();
  });
  /* ⭐ if the "Work it out" modal is open, keep it in sync — e.g. editing a qty tier's own inline inputs while
   * the result is on screen calls render() the same way every other edit does, and the modal is not one of
   * the four .screen divs render() already repaints above. */
  var ws=document.getElementById('workScrim');
  if(ws && ws.classList.contains('on')) paintWork();
}
applyBiz('hotel');
render();
/* ⭐ signed in → try your own catalogue quietly; queued writes from a previous offline session try to send
 * now too. Neither blocks the first paint — the samples are already on screen the instant this loads. */
labPaintQueue();
labDrainOutbox();
if (savedLive()) labUseMine(true);

</script>
</body>
</html>
