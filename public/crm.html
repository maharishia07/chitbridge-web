<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CB CRM</title>
<!-- ⭐ CB CRM — every party (customer and supplier) as one record, on its own page like CB Accounts (docs/design/crm/PLAN.md Q9).
     The FRAME is CB Accounts' (accounts.html: sidebar · header · tokens), the LOOK of every list is the frozen list standard
     (docs/design/list-standard + SYSTEM.md §3a): each list is a CBList mount (app/list-ctl.js) — three-row head ≤ 20%, adjustable
     columns, only the rows scroll. The SCREENS are app/cap-crm.js (home · follow-ups · add) and app/cap-crm-record.js (record ·
     timeline · log); this page is only the shell, the gate and the router. Data: the CRM API (chitbridge-api /api/crm/*); every
     figure (dues, counts, "late") is the server's — the page paints, it computes nothing (SYSTEM rule 12).
     The avatar: ONE control on every page (CBAvatar, app/avatar.js) — #cb-avatar is its slot in the title row; CBAvatar.mount draws it, this page draws none.
     ⚠️ Never the banned words on a screen — the Ledger's own word for CB Accounts' books. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* CB Accounts' tokens, as shipped (accounts.html) — there is no shared stylesheet yet, so the shell's own lines are repeated here (named in the PR) */
:root{
  --ground:#fbf6ec; --surface:#fffdf8; --side:#f4ecdc; --sub:#fbf6ec;
  --ink:#2a2418; --ink-2:#3d3527; --muted:#6f6450; --muted-2:#5c5240;
  --line:#e6dcc6; --line-2:#efe6d3; --line-3:#d8ccb0; --hover:#f3ead7;
  --accent:#1f5f5b; --accent-ink:#fbf6ec;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --serif:'Source Serif 4',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
  --green:#16693F; --green-d:#0D4A2B; --green-t:#E8F4ED; --green-b:#A9D3BC;
  --amber:#E0A020; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205;
  --red:#C4562F; --red-t:#FBEAE3; --red-b:#E7B9A8; --red-i:#8E3517;
  --blue:#2F74C9; --blue-t:#E4EEFA; --blue-b:#B9D2EF; --blue-i:#174A87;
  /* the names cap-books.js (the dues chip, the statement) and CBList paint with, mapped onto this palette */
  --fs-1:12px; --fs-2:13.5px; --fs-3:15px; --grey:var(--muted);
  --page:#FCFAF5; --card:#fffdf8; --panel:#F3EFE6;
  --paper:var(--sub); --sel:var(--hover); --blue-tint-bg:var(--blue-t); --on-card:var(--ink); --blue-2:var(--blue-i); --on-accent:var(--accent-ink);
  --warn-2:var(--amber-i); --ok-2:var(--green-d); --blue-d:var(--blue-i); --warn-tint:var(--amber-t); --blue-tint:var(--blue-t); --ok-tint:var(--green-t); --grey-2:var(--muted-2);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;height:100vh;overflow:hidden;position:relative}

/* sidebar */
.side{width:232px;flex-shrink:0;height:100%;background:var(--side);border-right:1px solid #e2d6bc;display:flex;flex-direction:column;transition:width .2s ease}
.side.collapsed{width:68px}
.side.collapsed .label{display:none}
.side.collapsed .nav-chev{transform:rotate(180deg)}
.brand{height:56px;padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e2d6bc}
.logo{width:32px;height:32px;flex-shrink:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.brand-name{font-family:var(--serif);font-size:19px;font-weight:700;white-space:nowrap}
.nav{flex-grow:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav-btn{width:100%;height:44px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 12px;border:none;border-radius:8px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:500;text-align:left;white-space:nowrap;text-decoration:none}
.nav-btn:hover{background:#ece1c9}
.nav-btn.active{background:#e6d9bd;color:var(--accent);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nav-btn .n{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--amber-t);color:var(--amber-i)}
.nav-btn .n.quiet{background:transparent;color:var(--muted-2)}
.nav-chev{transition:transform .2s ease}
.side-foot{padding:8px;border-top:1px solid #e2d6bc}
.side-foot .nav-btn{font-size:13px;color:var(--muted-2)}

/* main · a slim bar (shop · Home · the avatar's slot · the page's one action), then the screen */
.main{flex-grow:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.bar{flex-shrink:0;min-height:48px;background:rgba(251,246,236,.96);border-bottom:1px solid var(--line);padding:6px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;color:var(--muted)}
.crumb a{color:var(--accent);text-decoration:none;font-weight:600}
.crumb a:hover{text-decoration:underline}
.who{display:flex;align-items:center;gap:10px;position:relative}
.shop{font-size:13.5px;color:var(--muted)}
.home{display:inline-flex;align-items:center;height:36px;padding:0 12px;border:1px solid var(--line-3);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;text-decoration:none}
.home:hover{background:var(--hover)}
#cb-avatar{display:inline-block;min-width:0;min-height:0}
/* ⭐ THE FROZEN HEAD (list-standard): shop · Home · avatar belong IN the list's title row, so on a list screen the bar is laid over the right end of
   the unit's own title row (which keeps room for it) — everything above the rows stays three rows, ≤ 20% of the window. Other screens keep the bar. */
@media (min-width:761px){
  .main{position:relative}
  .main.overbar .bar{position:absolute;top:0;right:0;z-index:8;min-height:0;border:0;background:transparent;padding:5px 20px;flex-wrap:nowrap}
  .main.overbar .crumb{display:none}
  .main.overbar .home{height:32px}
  .main.overbar .act.sm{min-height:32px}
  .main.overbar .screen .cbl-title{padding-right:440px}
}
.screen{flex:1;min-height:0;overflow-y:auto}
.screen.flush{overflow:hidden;padding:0}
.content{padding:20px 24px 120px;display:flex;flex-direction:column;gap:16px;max-width:1100px}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line-3);border-radius:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .t{font-family:var(--serif);font-size:19px;color:var(--ink);font-weight:700}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px 22px 20px;max-width:560px;display:flex;flex-direction:column;gap:12px;margin:24px}
.card h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:14px}
.card.bad{border-color:var(--red-b);background:var(--red-t)}
.card.bad h2,.card.bad p{color:var(--red-i)}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;align-self:flex-start;min-height:40px;padding:0 16px;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.act:hover{background:#174a47}
.act.ghost{background:transparent;color:var(--accent)}
.act.quiet{background:transparent;border-color:var(--line-3);color:var(--ink)}
.act.sm{min-height:34px;padding:0 12px;font-size:13px}
.act[disabled]{opacity:.6;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 20px 6px}
.tab{height:36px;padding:0 12px;display:flex;align-items:center;gap:8px;border:1px solid var(--line-3);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600}
.tab .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.tab[aria-pressed="true"] .n{color:#e9dfc8}
.sec{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin:0 0 8px}
.mono{font-family:var(--mono)}
.inp{width:100%;border:1px solid var(--line-3);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.optchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-3);border-radius:999px;padding:3px 10px;font-size:var(--fs-1);font-weight:600;background:var(--surface)}
.supacts{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.loadwrap{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:var(--fs-2);padding:18px 0}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line-3);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:min(520px,92vw)}
#toast .toast{background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:0 10px 24px rgba(42,36,24,.25)}
#toast .toast.err{background:var(--red-i)}
#toast .toast.warn{background:var(--amber-i)}
#toast button{margin-left:10px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:2px 10px}

/* chips: a status is an icon AND a word (cb-design) */
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line-3);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.tag svg{width:12px;height:12px}
.tag.role{background:var(--panel)}
.tag.on{background:var(--green-t);border-color:var(--green-b);color:var(--green-d)}
.tag.local{border-style:dashed}
.tag.walk{border-style:dotted}
.tag.seg{background:var(--blue-t);border-color:var(--blue-b);color:var(--blue-i)}
.tag.amber{background:var(--amber-t);border-color:var(--amber-b);color:var(--amber-i)}
.tag.red{background:var(--red-t);border-color:var(--red-b);color:var(--red-i)}
.tag.green{background:var(--green-t);border-color:var(--green-b);color:var(--green-d)}
.tag.blue{background:var(--blue-t);border-color:var(--blue-b);color:var(--blue-i)}
.pcell .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pcell .nm{font-weight:700}
.pcell .pno{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pcell .l2{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.late{color:var(--amber-i);font-weight:700}
.sub{color:var(--muted)}
.crm-mini{height:30px;padding:0 10px;border:1px solid var(--line-3);border-radius:8px;background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600}
.crm-mini:hover{background:var(--hover)}

/* the record: header · identity block · Next · actions · sections */
.rec{display:flex;flex-direction:column;gap:14px;padding:16px 24px 120px;max-width:980px}
.rec h1{margin:0;font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:-.01em}
.rec .legal{color:var(--muted);font-size:13.5px}
.rhead{display:flex;flex-direction:column;gap:6px}
.rchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.idblk{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.idblk.local,.idblk.walk{border-style:dashed}
.idblk .cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.idblk .c{padding:9px 13px;border-right:1px solid var(--line-2);min-width:0}
.idblk .c:last-child{border-right:0}
.idblk .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2)}
.idblk .v{font-weight:600;overflow-wrap:anywhere}
.idblk .v.none{color:var(--muted);font-weight:400}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 13px;border-top:1px solid var(--line-2);font-size:13.5px}
.verdict.on{background:var(--green-t);color:var(--green-d)}
.verdict.off{color:var(--ink-2)}
.next{border:1px solid var(--amber-b);border-radius:12px;background:var(--amber-t);overflow:hidden}
.next .nh{padding:7px 13px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-i);border-bottom:1px solid var(--amber-b)}
.nx{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--amber-b);flex-wrap:wrap;color:var(--amber-i)}
.nx:last-child{border-bottom:0}
.nx .tx{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.nx .tx .s{display:block;font-size:12.5px;color:var(--muted-2)}
.nx .btns{display:flex;gap:6px;flex-wrap:wrap}
.nx .ic{display:inline-flex}
.actbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actbar .more{position:relative}
.menu{position:absolute;top:calc(100% + 4px);right:0;z-index:20;min-width:220px;background:var(--surface);border:1px solid var(--line-3);border-radius:12px;box-shadow:0 10px 24px rgba(42,36,24,.16);padding:4px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:0;background:none;border-radius:8px;text-align:left;font-size:14px;color:var(--ink)}
.menu button:hover:not([disabled]){background:var(--hover)}
.menu button[disabled]{color:var(--muted)}
.menu .why{margin-left:auto;font-size:12px;color:var(--amber-i)}
.menu .danger{color:var(--red-i)}
.rsec{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rsec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;font-weight:700;min-height:44px}
.rsec>summary::-webkit-details-marker{display:none}
.rsec>summary::before{content:"▸";color:var(--muted);font-size:12px;transition:transform .15s}
.rsec[open]>summary::before{transform:rotate(90deg)}
.rsec>summary .fact{margin-left:auto;font-weight:400;color:var(--muted);font-size:13px;text-align:right}
.rsec .rbody{padding:4px 14px 14px;border-top:1px solid var(--line-2)}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:14px;flex-wrap:wrap}
.kv:last-child{border-bottom:0}
.kv b{min-width:130px;color:var(--muted-2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.kv span{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.tl-wrap{margin:0 -14px}
.notice{border:1px solid var(--line-3);border-radius:12px;background:var(--panel);padding:14px 16px;color:var(--ink-2);font-size:14px}
.entry{display:flex;gap:10px;align-items:flex-start;width:100%}
.entry .mk{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);color:var(--ink-2);flex-shrink:0}
.entry .mk svg{width:15px;height:15px}
.entry .mk.blue{background:var(--blue-t);color:var(--blue-i)}
.entry .mk.amber{background:var(--amber-t);color:var(--amber-i)}
.entry .mk.red{background:var(--red-t);color:var(--red-i)}
.entry .mk.green{background:var(--green-t);color:var(--green-d)}
.entry .tx{min-width:0;flex:1;overflow-wrap:anywhere}
.entry .tx .by{display:block;font-size:12.5px;color:var(--muted)}
.entry.theirs .tx{border-left:3px solid var(--blue-b);padding-left:8px}
.entry .unread-line{font-weight:700}
.tagi{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);border:1px solid var(--line-3);border-radius:6px;padding:0 5px;margin-left:6px}

/* a sheet (add party · log · follow-up · edit) — the same frame for each */
dialog.sheet{border:1px solid var(--line-3);border-radius:14px;padding:0;width:min(520px,94vw);max-height:92vh;background:var(--surface);color:var(--ink);font:15px/1.45 var(--sans)}
dialog.sheet::backdrop{background:rgba(42,36,24,.4)}
.mhd{padding:16px 20px 4px;display:flex;align-items:center;gap:10px}
.mhd .t{font-family:var(--serif);font-size:20px;font-weight:700;flex:1}
.mhd .sub{font-size:13px}
.mx{border:0;background:none;font-size:18px;min-width:40px;min-height:40px;border-radius:8px;color:var(--muted)}
.mbody{padding:8px 20px 12px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:70vh}
.mbody label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600}
.mfoot{padding:10px 20px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mfoot button{min-height:40px;padding:0 16px;border:1px solid var(--line-3);border-radius:9px;background:transparent;color:var(--ink);font-weight:600}
.mfoot button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mfoot button[disabled]{opacity:.6}
.seg2{display:inline-flex;border:1px solid var(--line-3);border-radius:9px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:0 12px;min-height:38px;font-size:13.5px;border-left:1px solid var(--line-2)}
.seg2 button:first-child{border-left:0}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.result{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.result .k{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--amber-b);background:var(--amber-t);color:var(--amber-i);border-radius:10px;padding:9px 12px;font-size:13.5px}
.banner.bad{border-color:var(--red-b);background:var(--red-t);color:var(--red-i)}
.hint{font-size:13px;color:var(--muted)}

@media (max-width:760px){
  .side{width:64px}
  .side .label,#toggleNav{display:none}
  .brand{padding:0 15px}
  .bar{padding-left:12px;padding-right:12px}
  .nav-btn .n{position:absolute;margin:0;transform:translate(12px,-12px);padding:0 5px}
  .nav-btn{position:relative}
  .content,.rec{padding-left:16px;padding-right:16px}
  .idblk .cells{grid-template-columns:1fr}
  .idblk .c{border-right:0;border-bottom:1px solid var(--line-2)}
  .tabs{margin-left:12px;margin-right:12px}
}
@media (max-width:620px){
  .shop{display:none}
  .rec h1{font-size:23px}
  .actbar.pin{position:fixed;left:64px;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px;gap:6px;flex-wrap:nowrap}
  .actbar.pin .wide-only{display:none}
  .actbar.pin .act{flex:1;justify-content:center;padding:0 8px}
  .actbar.pin .more{flex:1}
  .actbar.pin .more>.act{width:100%}
}
@media (min-width:621px){ .narrow-only{display:none !important} }
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></div>
      <div class="brand-name label">CB CRM</div>
    </div>
    <nav class="nav" id="nav" aria-label="CB CRM"></nav>
    <div class="side-foot">
      <button type="button" class="nav-btn" id="toggleNav" aria-label="Collapse sidebar" aria-expanded="true">
        <svg class="nav-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span class="label">Collapse</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="bar">
      <div class="crumb" id="crumb"></div>
      <div class="who" id="who"></div>
    </header>
    <div class="screen" id="screen" data-testid="crm-screen"></div>
  </main>
</div>
<dialog class="sheet" id="crm_sheet" data-testid="crm-sheet"></dialog>
<div id="toast"></div>

<script>
'use strict';
/* ── the host globals the app's own files expect (app.html declares these with let/const; so does this page) ── */
const CFG = { API_BASE: (function(){
  try{
    var forced = localStorage.getItem('cb_api_base');
    if (forced) return forced === 'stage' ? 'https://chitbridge-api-production.up.railway.app' : forced;
    var h = location.hostname;
    if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:3000';
  }catch(_){}
  return 'https://chitbridge-api-production.up.railway.app';
})() };
let SESSION = { token: null, role: null, name: null, entity: null, bridgeId: null };
const EP = {};                       /* the Ledger's boot rows come from accounts-shell.js, the CRM's from cap-crm.js */
let UI = { vp: 'lap', lw: 340, custs: [], sups: [] };   /* custs/sups: the rows cap-books.js's party editor reads (cap-crm.js fills them from the CRM list) */
function go(hash){ location.href = '/app.html' + hash; }   /* api()'s 401 → the app's sign-in */
</script>
<script src="/engine/screen.js"></script>   <!-- APP_THEMES: the themes the avatar applies (engines screen) -->
<script src="/app/avatar.js"></script>   <!-- CBAvatar: the one avatar (Profile · Support · Sign out) and the look it owns — nothing of it is drawn here -->
<script src="/app/core.js"></script>
<script src="/app/accounts-shell.js"></script>
<script>Object.assign(EP, CB_BOOKS_EP, CB_SHEET_EP, CB_PARTY_EP);</script>
<script src="/engine/money.js"></script>
<script src="/app/locale.js"></script>
<script src="/app/helpers.js"></script>
<script src="/app/list-ctl.js"></script>   <!-- CBList: every list here is a mount on it -->
<script src="/app/tax.js"></script>
<script src="/app/chit-sheet.js"></script>   <!-- THE CHIT SHEET: a bill, a chit, a message in the timeline opens it in place -->
<script src="/app/cap-folders.js"></script>
<script src="/app/cap-books.js"></script>   <!-- partyDueChipHTML · partyEditOpen · statementHTML — the party pieces the record reuses -->
<script src="/app/one-person.js"></script>
<script src="/app/cap-crm.js"></script>
<script src="/app/cap-crm-record.js"></script>
<script>
'use strict';
/* ═══ CB CRM — the page: gate · chrome · router. The screens are cap-crm.js and cap-crm-record.js. ═════════════════ */
Object.assign(EP, CRM_EP);

const $ = (id) => document.getElementById(id);
let SESS = null, MINE = null;

function session(){
  try{
    const s = JSON.parse(localStorage.getItem('cb_sess') || 'null');
    return (window.CBOnePerson && CBOnePerson.who(s)) ? s : null;
  }catch(_){ return null; }
}

/* the pages of the app this page hands over to */
function navTo(k){ location.href = '/app.html#/app/' + encodeURIComponent(k); }
function openChit(id){ window.open('/app.html#/app/chit/' + encodeURIComponent(id), '_blank', 'noopener'); }
const confirmAsk = CBConfirm;   /* the page's own confirm, as CB Accounts uses it */

/* ── a sheet: the app's modal(html) / closeModal() signature on a native <dialog>, so cap-books.js's partyEditOpen opens here unchanged ── */
function modal(html){
  const d = $('crm_sheet');
  d.innerHTML = '<button class="mx" style="position:absolute;right:6px;top:6px" onclick="closeModal()" aria-label="Close" title="Close">✕</button>' + html;
  if (!d.open) { try { d.showModal(); } catch (_) { d.setAttribute('open', ''); } }
}
function closeModal(){
  const d = $('crm_sheet'); try { d.close(); } catch (_) { d.removeAttribute('open'); } d.innerHTML = '';
  /* a sheet opened by its address (#/…/add · /log · /edit) goes back to the screen under it */
  if (/\/(add|log|edit)(\?.*)?$/.test(location.hash)) { try { history.replaceState(null, '', location.hash.replace(/\/(add|log|edit)(\?.*)?$/, '')); } catch (_) {} }
}
$('crm_sheet').addEventListener('cancel', (e) => { e.preventDefault(); closeModal(); });
$('crm_sheet').addEventListener('click', (e) => { if (e.target === $('crm_sheet')) closeModal(); });

/* ── the chrome ── */
$('toggleNav').addEventListener('click', () => {
  const open = $('side').classList.toggle('collapsed') === false;
  $('toggleNav').setAttribute('aria-expanded', String(open));
  $('toggleNav').setAttribute('aria-label', open ? 'Collapse sidebar' : 'Expand sidebar');
});
function whoPaint(){
  const nm = SESS ? (SESS.entity || SESS.name || '') : '';
  const role = typeof crmRole === 'function' ? crmRole() : 'owner';
  $('who').innerHTML = `<span class="shop" data-testid="shop-name">${esc(nm)}${role !== 'owner' ? ' · ' + esc(role === 'editor' ? 'co-assist' : 'viewer') : ''}</span>`
    + `<span id="crm-bar-act"></span>`
    + `<a class="home" href="/" data-testid="crm-home">⌂ Home</a>`
    + `<span id="cb-avatar" data-cb-avatar data-testid="avatar-slot"></span>`;
  /* the avatar is CBAvatar (app/avatar.js), the same control as CB Accounts: Profile · Support · Sign out; Settings stays in the app */
  if (typeof CBAvatar !== 'undefined') CBAvatar.mount($('cb-avatar'), { person: CBAvatar.personOf(SESS), items: ['profile', 'support', 'signout'], apiBase: CFG.API_BASE, token: SESS && SESS.token });
}
function signedOut(why){
  SESS = null; MINE = null; CRM.gen++;
  $('who').innerHTML = ''; $('nav').innerHTML = ''; $('crumb').innerHTML = '';
  crmCard(`<h2>${esc(why || 'You are signed out')}</h2><a class="act" data-testid="signin-door" href="/app.html#/login">Sign in</a>`);
}
function closeFirst(r){
  $('nav').innerHTML = '';
  crmCard(r.others.map((o, i) => `<h2 data-testid="close-first">${esc(CBOnePerson.sentence(o))}</h2>
      <button type="button" class="act" data-testid="close-first-go" data-i="${i}">${esc(CBOnePerson.buttonLabel(o))}</button>`).join(''), true);
  $('screen').querySelectorAll('[data-testid="close-first-go"]').forEach((b) => {
    b.onclick = () => {
      $('screen').querySelectorAll('button').forEach((x) => { x.disabled = true; });
      b.textContent = 'Signing it out…';
      CBOnePerson.clearOut(r.others[+b.getAttribute('data-i')], MINE.name).then(start, start);
    };
  });
}
function crmCard(html, bad){
  $('screen').className = 'screen';
  $('screen').innerHTML = `<div class="card${bad ? ' bad' : ''}" data-testid="crm-card">${html}</div>`;
}

/* ═══ START ═══ */
async function start(){
  SESS = session();
  if (!SESS) return signedOut('');
  MINE = CBOnePerson.who(SESS);
  SESSION = Object.assign({ token: null }, { entityId: MINE && MINE.ent, token: SESS.token, role: SESS.role, name: SESS.name, entity: SESS.entity, bridgeId: SESS.bridgeId, duty: SESS.duty, hat: SESS.hat, shop: SESS.shop });
  const g = ++CRM.gen;
  whoPaint();
  /* ⭐ ONE BROWSER, ONE SHOP: nothing is read until this browser holds no other shop's fingerprint */
  let t;
  try{ t = await CBOnePerson.traces(MINE); }catch(_){ t = { others: [] }; }
  if (g !== CRM.gen || !MINE) return;
  if (t.others.length) return closeFirst(t);
  /* the Ledger's one read: on → the Dues column and the dues alert exist; off (404) → neither is drawn, no blank column */
  try{ const h = await api('booksHealth'); CRM.ledger = !!(h && h.enabled !== false); }
  catch(e){ CRM.ledger = false; }
  if (g !== CRM.gen) return;
  whoPaint();
  crmRoute();
}
window.addEventListener('hashchange', () => { if (MINE) crmRoute(); });

/* ⭐ THE ONLY READER OF THE `storage` EVENT HERE: a session gone, or now another SHOP's, signs this page out and says why */
window.addEventListener('storage', (e) => {
  if (e.key !== null && e.key !== 'cb_sess') return;
  if (!MINE) return;
  const next = CBOnePerson.stored();
  if (next && next.ent === MINE.ent) return;
  signedOut(next ? 'Signed out — ' + CBOnePerson.shopName(next) + ' opened in another tab.' : 'Signed out — you signed out in another tab.');
});
CBOnePerson.attach({ quiet: true, who: () => MINE, label: () => 'CB CRM',
  onLeave: (by) => { location.replace('/?left=' + encodeURIComponent(by || '')); },
  onWipe: () => { location.replace('/?cleaned=1'); } });
start();
</script>
</body>
</html>
