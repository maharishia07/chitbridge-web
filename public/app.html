<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chit &amp; Bridge — app (build)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /**
   * ⭐ `--grey` WAS #7C8085 AND FAILED WCAG AA ON EVERY GROUND IT LANDS ON (backlog 16.1).
   *
   * Athi, 2026-08-16, comparing a mockup to the app: *"this panel looks good, with black background, letters are
   * sharp and very professional, but our design not getting the same, why?"* Measured rather than guessed, and
   * this was the largest single cause: 3.75:1 on paper, 3.97 on white, 3.46–3.57 on the tinted cards — against a
   * 4.5:1 floor. It is the colour on every caption, sub-label and note, so a large share of the words on screen
   * were below the readability line. That reads as SOFT, which is the opposite of sharp.
   *
   * #61666c measures 5.04–5.79 across all six grounds (paper · white · gold-soft · #f2efe8 · #eef3fb · #EDF2F9)
   * while staying far lighter than --ink at 13.39:1, so the hierarchy between a heading and its note survives.
   *
   * ⚠️ CHANGED AS A TOKEN, NOT A SWEEP — everything already says `var(--grey)`, so one line lifts every caption
   * at once and nothing can be missed. ⚠️ VERIFY WITH design-guard.spec.js, never by eye: the contrast checker
   * caught six of my own false readings the day it was written.
   *
   * ⚠️ `--ok` AND `--prog` MOVED FOR THE SAME REASON — and the catch is that each is read against ITS OWN tinted
   * chip, not against paper. #2f8f5b on the green chip #E9F4EE is 3.58:1; #9a7b34 on the gold chip is 3.55. Two
   * of the three lifecycle chips were below the line while looking perfectly deliberate. (--blue was already
   * fine at 4.97, which is exactly why the other two went unnoticed — a set where most members pass reads as a
   * set that passes.) Now 4.75 and 5.17 on their chips.
   *
   * ⚠️ Both tokens are ALSO used as swatch and bar FILLS (the MIS stack, the ageing meters). Darkening helps
   * there too — a fill sits on paper or white, so more contrast is strictly better. Checked before changing:
   * there is no role in which a lighter value was the right one.
   */
  :root{--ink:#0F2E3D;--blue:#3F66A6;--blue-d:#345488;--gold:#C9A86A;--gold-soft:#F7F1E4;--gold-line:#E8D9BC;--paper:#FAF8F4;--card:#fff;--line:#E7E2D8;--grey:#61666c;--ok:#27794c;--prog:#7d6126;--disp:#b4453f;--shadow:0 1px 2px rgba(15,46,61,.05),0 12px 34px rgba(15,46,61,.08)}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit}button{cursor:pointer}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cfc7b8;border-radius:6px}
  #root{height:100vh;display:flex;flex-direction:column}
  .mono{font-family:'Space Mono'}.disp{font-family:'Space Grotesk'}

  /* mode ribbon */
  .moderibbon{background:var(--gold-soft);border-bottom:1px solid var(--gold-line);color:#6b5a36;font-size:11px;font-weight:600;padding:5px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .moderibbon b{font-family:'Space Grotesk'}
  .moderibbon .pill{background:#fff;border:1px solid var(--gold-line);border-radius:20px;padding:2px 9px;font-size:10px}
  .moderibbon .sw{margin-left:auto;display:flex;gap:6px}
  .moderibbon .sw button{border:1px solid var(--gold-line);background:#fff;border-radius:7px;font-size:10.5px;font-weight:700;padding:4px 9px;color:#6b5a36}
  .moderibbon .sw button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .moderibbon .sw button:disabled{opacity:.42;cursor:not-allowed}
  /* Welcome (pre-register) */
  .welwrap{max-width:860px;margin:0 auto;padding:6px 18px 70px}
  .weltop{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px}
  .welsignin{font-size:13px;color:var(--blue);border:1px solid var(--line);border-radius:8px;padding:7px 13px;background:#fff;cursor:pointer}
  .welhero{text-align:center;padding:14px 0 6px}
  .welhero h1{font-family:'Space Grotesk';font-size:26px;font-weight:600;letter-spacing:-.02em;margin:6px auto;line-height:1.15;max-width:24ch}
  .welhero p{color:var(--grey);font-size:14.5px;max-width:60ch;margin:0 auto}
.welhero-cta{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:18px}
.welhero-cta-sub{color:var(--grey);font-size:12px}
  .welcaps{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
  .welcap{flex:1;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}
  .welcap .ci{font-size:20px}.welcap .cn{font-family:'Space Grotesk';font-weight:600;font-size:14.5px;margin:7px 0 3px}.welcap .cd{font-size:12.5px;color:var(--grey)}
  .welsec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
  .welh2{font-family:'Space Grotesk';font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);font-weight:700;margin-bottom:4px}
  .welsub{font-size:12.5px;color:var(--grey);margin-bottom:12px}
  .welgrid{display:flex;gap:12px;flex-wrap:wrap}
  .welrole,.welbp{flex:1;min-width:220px;border:1.5px solid var(--line);border-radius:13px;padding:15px;cursor:pointer;transition:.15s;background:#fff}
  .welrole:hover,.welbp:hover{border-color:var(--blue);transform:translateY(-1px)}
  .welrole.sel,.welbp.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,106,.22)}
  .welrole .ci{font-size:21px}.welrole .cn,.welbp .cn{font-family:'Space Grotesk';font-weight:600;font-size:15px;margin:5px 0 2px}
  .welrole .cd,.welbp .cd{font-size:12.5px;color:var(--grey)}.welbp .bt{font-size:11px;color:var(--grey);font-family:'Space Mono'}
  .welbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .welwrap .btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
  .welwrap .btn:disabled{background:#c7cdd2;cursor:not-allowed}
  .welfoot{color:var(--grey);font-size:11.5px;margin-top:20px;text-align:center;border-top:1px solid var(--line);padding-top:12px}
  .rchosen{background:#f3f6fb;border:1px solid #d7e2f1;border-radius:11px;padding:10px 13px;font-size:13px;margin-bottom:14px}
  .welpips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:8px 0 2px}
  .welpip{font-size:11px;font-family:'Space Mono';color:var(--grey);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px}
  .welpip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .welsplit{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
  .welcol{flex:1;min-width:240px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}
  .welcol.is{border-top:4px solid var(--blue)}.welcol.isnot{border-top:4px solid var(--gold)}
  .welcol ul{margin:8px 0 0;padding-left:17px}.welcol li{font-size:12.5px;margin:5px 0}
  .welask{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin:14px 0}
  .welask-tag{font-size:10.5px;font-family:'Space Mono';background:var(--gold-soft);color:#7a5e22;border-radius:5px;padding:1px 7px;margin-left:6px}
  .welchips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
  .welchip{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--ink)}
  .welchip:hover{border-color:var(--blue)}
  .welask-row{display:flex;gap:8px;margin-top:6px}.welask-row .inp{flex:1}
  .welask-ans{font-size:13px;color:var(--ink);margin-top:10px;line-height:1.5}

  /* auth screens */
  .auth{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;background:linear-gradient(160deg,#0F2E3D,#143b4e 60%,#1d4d61)}
  .card{width:440px;max-width:100%;background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .card .top{padding:22px 26px 8px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:18px}
  .card h1{font-family:'Space Grotesk';font-size:20px;margin:14px 0 4px}.card .sub{font-size:12.5px;color:var(--grey);margin:0}
  .card .body{padding:8px 26px 24px}
  .tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:4px;margin:14px 0}
  .tabs button{flex:1;border:0;background:none;color:var(--grey);font-size:12px;font-weight:700;padding:9px 6px;border-radius:8px}
  .tabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.07)}
  label.fl{display:block;font-size:11px;font-weight:700;color:var(--grey);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
  .inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;outline:0;background:var(--paper)}
  .inp:focus{border-color:var(--blue);background:#fff}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  .btn{width:100%;border:0;border-radius:11px;padding:13px;font-weight:700;font-size:14px;margin-top:16px;background:var(--ink);color:#fff}
  .btn.gold{background:linear-gradient(90deg,var(--gold),#b8945a);color:#3a2e16}
  .btn:disabled{opacity:.5}
  .swap{text-align:center;font-size:12.5px;color:var(--grey);margin-top:14px}.swap a{color:var(--blue);font-weight:700;cursor:pointer}
  .hint{font-size:11px;color:#9a7b34;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:9px;padding:9px 11px;margin-top:12px;line-height:1.5}
  .err{font-size:12px;color:var(--disp);background:#fbeeed;border:1px solid #e7b9b5;border-radius:9px;padding:9px 11px;margin-top:12px}
  /* An empty error box still had background, border and padding — so it rendered as a pink bar with nothing
     to say, on a form where nothing had gone wrong. An error surface must be INVISIBLE until it has content. */
  .err:empty{display:none}

  /* app shell */
  .shell{flex:1;display:grid;grid-template-columns:212px 1fr;grid-template-rows:auto 1fr;min-height:0}
  .topbar{grid-column:1/3;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--ink);color:#fff}
  .topbar .b{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk';font-weight:700;font-size:14px}
  .topbar .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px}
  .topbar .who .nm{font-weight:700}.topbar .who .rl{color:#9fb4bf;font-size:11px}
  .topbar .who .av{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#3a2e16;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk'}
  .topbar .so{border:1px solid rgba(255,255,255,.25);background:none;color:#cfe0e8;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .topbar .so:hover{background:rgba(255,255,255,.08)}
  .dutytog,.shoptog{display:flex;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
  .dutytog button,.shoptog button{border:0;background:rgba(255,255,255,.05);color:#bcccd6;font-size:11px;font-weight:700;padding:6px 10px;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
  .dutytog button.on.duty,.shoptog button.on.open{background:#1f7a4d;color:#fff}
  .dutytog button.on.brk,.shoptog button.on.away{background:var(--gold);color:#2c2410}
  .shoptog button.on.closed{background:#9a4040;color:#fff}
  .topbar .b .bt{margin-left:2px}
  .topbar .lo{border:1px solid rgba(255,255,255,.25);background:none;color:#cfe0e8;border-radius:8px;font-size:11px;font-weight:700;padding:6px 10px}
  .topbar .ham{display:none;border:0;background:none;color:#fff;font-size:20px}

  .menu{background:#0F2E3D;color:#bcccd6;padding:12px 10px;display:flex;flex-direction:column;overflow-y:auto;border-top:1px solid rgba(255,255,255,.06)}
  .menu .grpsep{height:1px;background:var(--line);margin:7px 10px 3px}
  /* ⚠️ #5f7d8c measured 3.25:1 on the navy — the two lowest-contrast runs on the whole screen were here, in the
     nav, where every session starts. #8fa9b6 is 5.76:1 and still clearly recessive against the 8.62:1 items. */
  .menu .grp{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#8fa9b6;margin:10px 8px 5px}
  .menu button{display:flex;align-items:center;gap:10px;border:0;background:none;color:#bcccd6;text-align:left;font-size:13px;font-weight:500;padding:9px 10px;border-radius:9px;width:100%}
  .menu button .ic{width:16px;text-align:center}.menu button .ct{margin-left:auto;font-size:9.5px;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 6px}
  .menu button:hover{background:rgba(255,255,255,.06)}.menu button.on{background:var(--blue);color:#fff}
  .menu .tagl{margin-top:auto;font-size:9.5px;color:#93adba;line-height:1.5;padding:8px}   /* was #6f8b99 — 3.94:1 */

  .main{min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
  .purpose{display:flex;align-items:center;gap:10px;padding:0 16px;max-height:0;overflow:hidden;background:#fff;font-size:12px;color:var(--mut,#5d6b73);transition:max-height .22s ease,padding .22s ease}
  .purpose.open{max-height:90px;padding:9px 16px;border-bottom:1px solid var(--line)}
  .purpose b{font-family:'Space Grotesk';color:var(--ink)}
  .purpose .x{margin-left:auto;border:0;background:none;color:var(--grey);font-size:14px;cursor:pointer}
  .topbar .info{border:0;background:none;color:#9fb4bf;font-size:16px;cursor:pointer;padding:2px 5px;line-height:1}
  .topbar .info.on{color:var(--gold)}

  .panel{flex:1;display:grid;grid-template-columns:var(--lw,340px) 7px minmax(0,1fr);min-height:0;position:relative}
  .list{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
  .lh{padding:10px 12px;border-bottom:1px solid var(--line)}
  .folders{display:flex;gap:4px;margin-bottom:8px}
  .folders button{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--grey);font-size:12px;font-weight:700;padding:8px;border-radius:8px}
  .folders button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .statetabs{display:flex;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:8px}
  .statetabs button{flex:1;border:0;background:none;color:var(--grey);font-size:11px;font-weight:700;padding:6px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:5px}
  .statetabs button.on{background:#E3EDF8;color:var(--blue);box-shadow:inset 0 0 0 1.6px var(--blue);font-weight:800}
  .statetabs button.on .n{background:var(--blue);color:#fff}
  .statetabs .n{font-size:9px;background:rgba(0,0,0,.06);border-radius:9px;padding:0 5px}
  .srch{display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;color:var(--grey)}
  .srch input{border:0;background:none;outline:0;font-size:12.5px;width:100%;color:var(--ink)}
  .tools{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
  /* Folded: the band keeps only what is ACTIVE, so a live search or an Assigned scope stays on screen as a chip. */
  .lh.folded{padding:7px 12px}
  .lh.folded .statetabs{margin-bottom:0}
  .lhfolded{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:8px;cursor:pointer}
  .fchip{display:inline-flex;align-items:center;gap:4px;background:var(--gold-soft);border:1px solid #e3d9bd;color:#6b5a36;border-radius:20px;padding:2px 9px;font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .colcog.fold{margin-right:7px}
  /**
   * ⚠️ TRADE READY ROLLS ITS OWN TWO PANES and therefore inherited NONE of the shell's mobile behaviour. On a
   * phone it rendered both columns side by side — a 300px list and a detail squeezed to about 120px, breaking to
   * one word per line. `.panel` handles this for every other screen; this one never used `.panel`, so it needed
   * its own collapse. Same rule as the shell: below the breakpoint you see the list OR the detail, never both.
   */
  /* ⚠️ !important because the width is an INLINE style (`width:300px`) on the element, and inline beats a class
     rule. Without it the list stayed 300px wide on a phone with dead space beside it — the collapse "worked" and
     changed nothing visible, which is the most misleading kind of half-fix. */
  .appwrap.m .rdpanes .rdlist{width:100%!important;flex:1 1 auto!important;border-right:0}
  .appwrap.m .rdpanes .rddetail{display:none}
  .appwrap.m .rdpanes.showdetail .rdlist{display:none}
  .appwrap.m .rdpanes.showdetail .rddetail{display:block;flex:1 1 auto}
  /* ── MIS · the four bands in the two-pane shell (app/cap-admin.js) ───────────────────────────────────────── */
  /* .detail supplies no padding of its own — every other screen wraps its content in a padded block (.db, .dh),
     so MIS must bring its own or the bars run flush to the window edge. */
  /**
   * ⚠️ ALL THREE BODIES, NOT JUST MIS. #misbody got this and #setbody / #profbody did not, so Settings ran
   * 1568px of content inside a 799px pane with `overflow-y:visible` and NO scrollbar — 769px was simply
   * unreachable, and nothing on screen said so. Content that overflows without a scroll container does not look
   * broken; it looks finished, which is why it went unnoticed until Athi asked how he would know.
   */
  #misbody,#setbody,#profbody{flex:1;min-height:0;overflow-y:auto;padding:16px 18px}
  /* A scrollbar you can SEE. Windows overlay bars fade out when idle, so the only cue that there is more is a
     cue that is not being shown. */
  #misbody::-webkit-scrollbar,#setbody::-webkit-scrollbar,#profbody::-webkit-scrollbar{width:10px}
  #misbody::-webkit-scrollbar-thumb,#setbody::-webkit-scrollbar-thumb,#profbody::-webkit-scrollbar-thumb{
    background:#d3d8de;border-radius:6px;border:2px solid #fff}
  #misbody::-webkit-scrollbar-thumb:hover,#setbody::-webkit-scrollbar-thumb:hover,#profbody::-webkit-scrollbar-thumb:hover{background:#b9c1ca}
  /* Says the page has ended, rather than leaving you to guess whether it stopped or stalled. */
  .capend{text-align:center;font-size:11px;color:var(--grey);padding:16px 0 6px;letter-spacing:.04em}
  .misbar{display:flex;align-items:center;gap:9px;padding:9px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .misttl{font-family:'Space Grotesk';font-weight:700;font-size:14px}
  .misbar .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .misbar .seg button{border:0;background:#fff;color:var(--grey);font-size:11.5px;font-weight:700;padding:5px 11px;cursor:pointer}
  .misbar .seg button.on{background:var(--ink);color:#fff}
  .misbar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
  .misasof{font-size:11px;color:var(--grey);font-family:'Space Mono'}
  .misrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  /* Nested rail rows (the 7 governance layers under Settings → Governance). Indented and quieter than a section,
     so the hierarchy is visible without a second control. */
  /* Governance rows grouped by who controls them — the group heading answers "what can I change?" before you
     read a single row, so the per-row class chip becomes confirmation rather than the only signal. */
  .govtitle{font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--ink)}
  .govsub{font-size:11.5px;color:var(--grey);margin:3px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .govdesc{font-size:12.5px;color:#3a4a54;line-height:1.55;margin:8px 0 4px}
  .govgrp{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  /* The whole header is the hit target — a chevron alone is a 12px tap area, which on a phone is a miss. */
  .govgrp-h{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;cursor:pointer;
            background:var(--paper);padding:10px 12px;font-size:12px;font-weight:800;letter-spacing:.03em;
            text-transform:uppercase;color:var(--ink);font-family:inherit}
  .govgrp-h:hover{background:#f2efe8}
  .govgrp.open .govgrp-h{border-bottom:1px solid var(--line)}
  /**
   * ⚠️ A CONTAINER QUERY, NOT A MEDIA QUERY — because the constraint is the PANE, not the window.
   *
   * `@media(max-width:560px)` never fired here: the window is 897px wide while the detail pane it governs is
   * ~340px, so the note kept its space and the title truncated to "NOT CONFIGU…". Media queries ask how big the
   * SCREEN is; every two-pane screen in this app needs to ask how big THIS PANE is. Below 420px of pane the note
   * is dropped and the title gets the room — it is the label, the note is a gloss.
   */
  .govgrp{container-type:inline-size}
  .govgrp-t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @container (max-width:420px){ .govnote{display:none} }

<!-- module 2: generic dependency-free helpers (esc/opt/scrErr/cap/inr_/fmtAt/fmtMoney/deepClone/jwtPayload) -->

     it. Pure resolver, same posture as offers.js; not wired to a screen yet. -->

<!-- ATTACH + VIEW, shared. Loaded here so `cbAttachType` is the SINGLE type→icon mapping for every screen; the
     copy that used to live in this file is gone. See BACKLOG-attach-ui-sweep.md for what is deliberately NOT
     swept yet and why. -->

<!-- the shared step flow: rail, guard and footer for every screen that composes an order one step at a time -->

<!-- module 4 (LOCAL PROTOTYPE — not promoted): enhanced catalogue "face" setup (adopt/build → one face → conforming items). -->

<script>
/* =========================================================================
   CHIT & BRIDGE — separate build (Registration → Login → Menu → Task Panel)
   Single self-contained SPA. Deploy to its OWN URL (does not touch the
   existing front end). Switch stage (Dev/UAT/Live) to point at a different API.
   ========================================================================= */

/* ---- CONFIG: the only block to edit when wiring to the backend ----
   STAGE = the promotion ladder. ONE source of truth: CFG.STAGE.
     dev / uat / live → the SAME real-API code path, pointed at three backends (differ only by base URL)
   MODE + API_BASE are DERIVED from STAGE, so the shared client (core.js) needs no change. */
const STAGES = {
  dev:      { label:"Dev",      mock:false, base:"https://chitbridge-api-production.up.railway.app",  note:"real API · dev database" },
  uat:      { label:"UAT",      mock:false, base:"",   /* TODO: UAT cloud API base */                 note:"real API · UAT cloud" },
  live:     { label:"Live",     mock:false, base:"",   /* TODO: production API base */                note:"production" },
};
const CFG = {
  STAGE: "dev",                                                     // points at the live dev API (Railway). Flip in the build-preview ribbon if present.
  ASSIST_LLM: false,                                                // tier-1 LLM for the assistant — OFF until the /api/assist proxy exists; answer() falls through to the library floor.
  get MODE(){ return "live"; },                                     // compat shim: core.js still reads CFG.MODE. There is no mock stage — the demo is gone.
  /**
   * ⭐ API_BASE — the stage's base, unless this page is being served from localhost.
   *
   * Athi, 2026-08-14, after measuring 9.3s to open a chit in production and 0.62s against a local API:
   * *"even i would be happy if we build locally as much as we can and push when all the test completed."*
   *
   * The cause is not the code. Railway runs in Singapore and Supabase in Mumbai, so EVERY SQL statement costs
   * ~250ms; the same statement from a machine in India costs ~35ms. Developing against the cloud means paying a
   * quarter of a second per statement on every click, plus a deploy cycle to see any change at all.
   *

   * localStorage override wins over both, so a local page can still be pointed at the cloud API deliberately —
   * `localStorage.cb_api_base = "https://…"` — which is what you want when reproducing something cloud-specific.
   */
  get API_BASE(){
    try {
      const forced = localStorage.getItem('cb_api_base');
      if (forced) return forced === 'stage' ? (STAGES[this.STAGE].base || '') : forced;
      const h = location.hostname;
      if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:3000';
    } catch (e) { /* storage blocked — fall through to the stage */ }
    return STAGES[this.STAGE].base || "";
  },
};

/* ── answer() — the single answer seam (the floating assistant AND the "?" overlays both go through this) ──────
   Tiered BY DESIGN so the assistant DEGRADES, never breaks — continuity beats cleverness:
     tier 1  (future) LLM over the library + live context — added ABOVE matchLibrary, wrapped in a timeout +
             try/catch, and it MUST fall through to tier 2 on ANY error/timeout/rate-limit (user sees no error,
             just a slightly less-smart answer in the same turn);
     tier 2  matchLibrary — deterministic keyword match over ASSIST_LIB. Pure client-side, zero network: the
             always-on FLOOR. It cannot be "down" (works offline / API down / LLM down);
     tier 3  the caller's own static fallback (suggested Q&A buttons + curated overlay) when tier 2 finds nothing.
   answer() is async on purpose so the LLM tier can slot in later WITHOUT changing a single caller. */
async function answer(question, contextKey){
  if(typeof CFG!=="undefined" && CFG.ASSIST_LLM){                         // tier 1 — only when explicitly enabled
    try {
      const a = await Promise.race([ askLLM(question, contextKey), _timeout(6000) ]);
      if(a) return a;                                                     // got a model answer — use it
    } catch(_){ /* swallow — NEVER surface the failure; fall through to the floor */ }
  }
  return matchLibrary(question, contextKey);                              // tier 2 — the floor (cannot be "down")
}
function _timeout(ms){ return new Promise((_,rej)=> setTimeout(()=>rej(new Error("assist-timeout")), ms)); }
/* tier-1 LLM call — STUB, gated by CFG.ASSIST_LLM (off by default). The model key NEVER lives in the client:
   this calls OUR backend proxy (EP.assist → POST /api/assist), which attaches the no-oversell system prompt +
   the library as grounding and talks to the model server-side. Returns a normalized library-shaped entry
   {q,a,fit?,media?} or null. answer() wraps this so ANY failure (disabled / demo / endpoint missing / timeout /
   network / bad shape) falls through to matchLibrary — the assistant degrades, it never breaks. */
async function askLLM(question, contextKey){
  if(!(typeof CFG!=="undefined" && CFG.ASSIST_LLM)) return null;          // disabled → instant fall-through
  const r = await api('assist', { body:{ q:question, context:contextKey||curScreen(), stage:CFG.STAGE } });
  if(!r || !r.answer) return null;                                        // honest empty → fall through to the floor
  return { q:question, a:String(r.answer), fit:r.fit, media:r.media };    // shape it like a library entry for assistEntryHTML
}
// Common words that must NOT count as relevance (else "what is the status of X" false-matches on "what"/"status").
const ASSIST_STOP = new Set(["what","this","that","with","your","from","does","have","will","when","where","which","about","into","they","them","then","than","here","there","would","could","should","been","were","being","some","more","most","such","just","only","very","much","many","also","else","over","under","these","those","whose"]);
function matchLibrary(question, contextKey){
  const q=(question||"").toLowerCase(); if(!q) return null;
  const pool = contextKey ? ASSIST_LIB.filter(e=>(e.context||[]).indexOf(contextKey)>=0 || (e.context||[]).indexOf("*")>=0) : ASSIST_LIB.slice();
  const words = q.split(/\W+/).filter(w=>w.length>3 && !ASSIST_STOP.has(w));   // meaningful words only
  let best=null, score=0;
  pool.forEach(e=>{ let s=0; const hay=(e.q+" "+e.a).toLowerCase();
    (e.topics||[]).forEach(t=>{ if(q.indexOf(t.toLowerCase())>=0) s+=2; });     // curated topic phrase present -> strong signal
    words.forEach(w=>{ if(hay.indexOf(w)>=0) s++; });                            // non-stopword content overlap
    if(s>score){ score=s; best=e; } });
  return score>=2 ? best : null;   // floor: a topic hit or >=2 meaningful words. Below -> no answer -> capture the gap.
}

  if(h.startsWith("#/register")) return renderRegister();
  if(h.startsWith("#/login")) return renderLogin();
  return renderApp();
}

/* Normalise the verify response — the API returns entity as an OBJECT. Fixes the [object Object] header bug. */
function entFromVerify(r, fallbackName){
  let nm, ent, bridge;
  if(r && r.entity && typeof r.entity==="object"){ nm = r.entity.display_name||fallbackName; ent = nm; bridge = r.entity.bridge_id||null; }
  else { nm = (r&&r.name)||fallbackName; ent = (r&&r.entity)||nm; bridge = (r&&r.bridgeId)||null; }
  return {token:(r&&r.token)||"t", role:"entity", name:nm, entity:ent, bridgeId:bridge, shop:"open"};
}

/* SCREEN: Login (#/login) · module target: auth.js · smart single-login.

let LOGIN = {step:"id", id:"", kind:null, email:"", handle:"", note:"", hasPin:false, busy:false, err:"", cust:false};

function setLoginCust(on){ LOGIN.cust=!!on; LOGIN.err=""; renderLogin(); }

async function doLogin(){
  const L=LOGIN;
  // capture inputs BEFORE the busy re-render (renderLogin rebuilds the form)
  const v_id=val("l_id"), v_otp=val("l_otp"), v_pin=val("l_pin"), v_setpin=val("l_setpin"), v_bridge=val("l_bridge")||"", v_cotp=val("l_cotp");
  if(L.step==="id" && v_id) L.id=v_id.trim();
  if(L.cust && v_bridge) L.id=v_bridge.trim();
  L.err=""; L.busy=true; renderLogin();
  try{
    if(L.cust){
      await api("custVerify",{params:{bridgeId:L.id},body:{otp:v_cotp}});
      setSession({token:"t",role:"customer",name:"Customer",entity:"",bridgeId:L.id});
      L.busy=false; return go("#/app");
    }
    if(L.step==="id"){
      const id=L.id;
      if(loginIsActor(id)){
        L.kind="actor";
        const r=await api("actorCheck",{query:{username:id.toLowerCase()}});
        if(r && r.valid===false){ L.busy=false; L.err="Co-assist not found — check username and entity name."; return renderLogin(); }
        L.hasPin = !!(r && r.has_pin);
        L.step = L.hasPin ? "pin" : "otp";
      } else {
        L.kind="entity";
        const r=await api("ownerLogin",{body:{display_name:id, email:id, mode:"login"}});
        /**
         * ⚠️ A HANDLE IS NOT AN EMAIL, AND THIS LINE USED TO PRETEND IT WAS.
         *
         * Athi, 2026-08-08: *"when I try to log in using the id alpha-timers.north it asked for the password, and
         * on providing it the window says sign-in failed, email not found."*
         *
         * A network-minted store has NO email — it is issued a handle and a claim code. `r.email` came back empty,
         * this fell back to the typed id, and the id was then sent to /verify as `email`, which looked it up in the
         * email column and quite correctly found nothing. The API has accepted `user_id` here since the handle was
         * introduced; the client simply never used it, so every minted store could be issued a code it could not
         * redeem — a credential that cannot log in.
         */
        L.email  = (r && r.email) || null;
        L.handle = (r && r.handle) || (String(id).includes('@') ? null : id);
        L.note   = (r && r.operator_issued) ? (r.message || 'This store signs in with the code its network operator issued.') : '';
        L.step="otp";
      }
      L.busy=false; return renderLogin();
    }
    if(L.step==="otp"){
      if(L.kind==="actor"){
        const r=await api("actorLogin",{body:{username:L.id.toLowerCase(), otp:v_otp}});
        if(r && r.requires_pin_setup){ setSession({token:r.token||"",role:"actor"}); L.busy=false; L.step="setpin"; return renderLogin(); }
        setSession({token:r.token||"t",role:"actor",name:(r.actor&&r.actor.display_name)||r.name||L.id.split("@")[0],entity:(r.actor&&r.actor.parent_entity)||r.entity||L.id.split("@")[1]||"",duty:((r.actor&&r.actor.break_status&&r.actor.break_status!=='active')?'break':'duty')});
      } else {
        // Email when we have one, otherwise the HANDLE as `user_id` — the two are different columns and the API
        // has always taken either. Never the typed string as an email just because it is the only thing to hand.
        const r=await api("ownerVerify", { body: L.email
          ? { email: L.email, otp: v_otp }
          : { user_id: (L.handle || L.id), otp: v_otp } });
        setSession(entFromVerify(r, L.id));
      }
      L.busy=false; return go("#/app");
    }
    if(L.step==="pin"){
      const r=await api("actorLogin",{body:{username:L.id.toLowerCase(), pin:v_pin}});
      setSession({token:r.token||"t",role:"actor",name:(r.actor&&r.actor.display_name)||r.name||L.id.split("@")[0],entity:(r.actor&&r.actor.parent_entity)||r.entity||L.id.split("@")[1]||"",duty:((r.actor&&r.actor.break_status&&r.actor.break_status!=='active')?'break':'duty')});
      L.busy=false; return go("#/app");
    }
    if(L.step==="setpin"){
      await api("setPin",{body:{pin:v_setpin, confirm_pin:v_setpin}});
      /* session already established from the OTP login (real token set above) */
      L.busy=false; return go("#/app");

/* ── universal client-side lazy list — reveals N rows at a time in ANY container ────────────

   For lists whose endpoint returns everything at once: lazyWrap(id, items, cardFn, emptyHtml). */
const LAZY = {};
function lazyWrap(id, items, cardFn, empty){ items = items || [];
  if(LAZY[id] && LAZY[id]._io){ try{ LAZY[id]._io.disconnect(); }catch(_){} }
  if(!items.length) return empty || '';
  const chunk = 50;
  LAZY[id] = { items, cardFn, chunk, shown: Math.min(chunk, items.length), total: items.length, _io:null };
  setTimeout(function(){ lazyAttach(id); }, 0);
  return items.slice(0, LAZY[id].shown).map(cardFn).join("") + lazyBar(id); }
function lazyBar(id){ const s=LAZY[id]; if(!s) return ''; const left=s.total-s.shown;
  const inner = left<=0 ? ('<div class="listend">'+s.total+' total · end of list</div>')
    : ('<div class="listend"><button class="composebtn" onclick="lazyReveal(\''+id+'\')">↓ Show '+Math.min(s.chunk,left)+' more</button> <span style="color:var(--grey)">'+s.shown+' of '+s.total+'</span></div>');
  return '<div class="lazysent" id="lzs_'+id+'">'+inner+'</div>'; }
function lazyReveal(id){ const s=LAZY[id]; if(!s) return; const sent=document.getElementById('lzs_'+id); if(!sent) return;
  const next=s.items.slice(s.shown, s.shown+s.chunk); if(next.length){ sent.insertAdjacentHTML('beforebegin', next.map(s.cardFn).join("")); s.shown+=next.length; }

/* ══ WHICH OF MY SUPPLIERS SELLS THIS? ════════════════════════════════════════════════════════════════════════
   Athi, 2026-08-16: *"do we have a chance to seach the product under all the suppliers, similar to network?"*

   Modelled on netAvailSearch (cap-network.js) — ask every one, and say plainly what each answer is worth. The
   discipline that screen set is the part worth copying: it waited for real data rather than shipping invented
   figures, and it names the states that decide whether a person can trust the result.

   ⚠️ IT READS EXACTLY WHAT ANYONE COULD READ ANONYMOUSLY. /suppliers/:id/catalogue returns the PUBLIC storefront
   payload and nothing more, deliberately — relationships.js:145 spells out why: adding a supplier is unilateral,
   so being "related" is SELF-ASSERTED and must not authorise a wider view. Fanning out client-side therefore adds
   zero exposure; it is the same data, gathered.

   ⚠️ THE THREE ANSWERS ARE NOT THE SAME, and the UI must not flatten them:
     HAS IT        the item is in their published catalogue, with a price
     NO CATALOGUE  they have published nothing — this is NOT "they don't sell it", it is "we cannot know"

var _supFindT=null;
function supFindSearch(v){
  UI._sfQ=String(v||'');

  const q=UI._sfQ.trim();
  if(q.length<2){ UI._sfRes=null; UI._sfBusy=false; paintSupFind(); return; }
  UI._sfBusy=true; paintSupFind();
  /* Debounced: a keystroke is not a question, and this walks every supplier's catalogue. */
  _supFindT=setTimeout(function(){ supFindRun(q); }, 400);

async function supFindRun(q){
  const sups=(UI.sups||[]).slice();
  const needle=q.toLowerCase();
  const out=[];
  UI._sfDone=0; UI._sfTotal=sups.length;
  for(const s of sups){
    if(String(UI._sfQ||'').trim().toLowerCase()!==needle) return;   // a newer query superseded this one
    if(!s.has_catalogue){ out.push({sup:s, state:'nocat', hits:[]}); UI._sfDone++; paintSupFind(); continue; }
    try{
      /* Cached per supplier — searching three words in a row must not refetch the same catalogue three times. */
      UI._sfCache=UI._sfCache||{};
      let cat=UI._sfCache[s.supplier_entity_id];
      if(!cat){ cat=await supCatalogueFull(s.supplier_entity_id); UI._sfCache[s.supplier_entity_id]=cat; }
      /* ⚠️ item_data OR FLAT — the catalogue payload wraps items, exactly as the mapper at the end of
         selectSupplier() unwraps them. Reading it.name directly matched nothing and looked like "no supplier
         stocks it", which is the worst possible way for a search to be broken. */
      const hits=(cat.items||[]).filter(function(p){
        const d=p.item_data||p;
        return ((d.name||d.product||'')+' '+(d.code||d.hsn||d.sku||'')).toLowerCase().indexOf(needle)>=0;
      });
      out.push({sup:s, state:hits.length?'has':'miss', hits:hits.slice(0,6), cat:cat});
    }catch(e){ out.push({sup:s, state:'err', err:(e&&e.message)||'failed', hits:[]}); }
    UI._sfDone++; UI._sfRes=out.slice(); paintSupFind();
  }
  UI._sfBusy=false; UI._sfRes=out; paintSupFind();

  } else {

/**
 * Download the catalogue as CSV.
 *
 * Not a plain <a href> — the endpoint is authenticated, and a link carries no Authorization header. So: fetch with
 * the token, turn the response into a blob, and click a temporary link at it. The browser then treats it as a real
 * download with a real filename, rather than rendering the text or opening a tab.
 *
 * Deliberately NOT routed through api() in core.js: that helper JSON-parses every response, which would turn a
 * perfectly good CSV into a parse error.
 */
async function exportCatalogueCSV(btn){
  const was = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = '⬇ Preparing…'; }
  try{
    const res = await fetch(CFG.API_BASE + '/api/products/export.csv', {
      cache: 'no-store',
      headers: SESSION.token ? { Authorization: 'Bearer ' + SESSION.token } : {},
    });
    if(!res.ok){
      let msg = ''; try { const j = await res.json(); msg = j.message || j.error || ''; } catch(_){}
      throw new Error(msg || ('Export failed (' + res.status + ')'));
    }
    const blob = await res.blob();
    // Prefer the filename the SERVER chose — it carries the date, and one place deciding it means the file is
    // named the same however it was fetched.
    const cd = res.headers.get('Content-Disposition') || '';
    const m = /filename="?([^"]+)"?/.exec(cd);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (m && m[1]) || 'catalogue.csv';
    document.body.appendChild(a); a.click(); a.remove();
    // Revoke on the next tick, not immediately — Safari cancels an in-flight download if the URL dies too soon.
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    if(typeof toast === 'function') toast('Catalogue exported ✓');
  }catch(e){
    if(typeof toast === 'function') toast((e && e.message) || 'Could not export the catalogue.');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = was; }
  }
}

async function _cfRun(btn){

    // control is removed rather than merely pre-set, because a disabled dropdown still looks like a decision

      }

        + '<td style="padding:5px 8px;border-bottom:1px dashed var(--line);font-family:ui-monospace,monospace;font-size:12px">'+esc(m.incoming||'(blank)')+'</td>'
        + '<td style="padding:5px 8px;border-bottom:1px dashed var(--line);color:'+h[1]+';font-weight:700;text-align:center">'+h[0]+'</td>'
        + '<td style="padding:5px 8px;border-bottom:1px dashed var(--line);min-width:150px">'+control+'</td>'
        + '<td style="padding:5px 8px;border-bottom:1px dashed var(--line);font-size:11.5px;color:var(--grey)">'+esc(m.conflict||m.why||h[2])+'</td>'

      : (r.ready

      + '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr>'
      + ['In your file','','What to do with it','Why'].map(function(h){ return '<th style="text-align:left;padding:5px 8px;font-size:10.5px;text-transform:uppercase;color:var(--grey);border-bottom:1px solid var(--line)">'+h+'</th>'; }).join('')

      + (issues ? '<div style="font-size:11px;text-transform:uppercase;color:var(--grey);margin:10px 0 4px">Rows</div><ul style="font-size:12px;line-height:1.6;padding-left:18px;margin:0">'+issues+'</ul>'
          + ((r.issues||[]).length>25 ? '<div style="font-size:11.5px;color:var(--grey);margin-top:5px">…and '+((r.issues||[]).length-25)+' more.</div>' : '') : '')

    out.innerHTML = '<div style="font-size:12.5px;color:#B4483C">'+esc((e&&e.message)||'Could not read the file.')+'</div>';
  }finally{ if(btn){ btn.disabled = false; btn.textContent = was; } }
}
/**
 * _cfImport — apply the per-column choices.
 *
 * The decisions come from the dropdowns, NOT from the preflight's suggestions: what the person sees on screen is
 * exactly what is sent. The server re-reads the file and re-checks every decision, so nothing here is trusted.

function _cfImport(btn){
  if(!UI._cf){ if(typeof toast==='function') toast('Check a file first.'); return; }
  var out = document.getElementById('cf_out');
  var sels = Array.prototype.slice.call(document.querySelectorAll('[data-cfcol]'));
  var decisions = sels.map(function(el){
    var v = el.value || 'ignore';
    if(v === 'create') return { incoming: el.getAttribute('data-cfcol'), action: 'create' };
    if(v.indexOf('map:') === 0) return { incoming: el.getAttribute('data-cfcol'), action: 'map', field: v.slice(4) };
    return { incoming: el.getAttribute('data-cfcol'), action: 'ignore' };
  });
  var creating = decisions.filter(function(d){ return d.action === 'create'; }).length;
  var using = decisions.filter(function(d){ return d.action !== 'ignore'; }).length;
  if(!using){ if(typeof toast==='function') toast('Every column is set to be left out.'); return; }
  confirmAsk('Import using ' + using + ' column' + (using===1?'':'s') + '?',
    (creating ? 'It also adds <b>' + creating + ' new column' + (creating===1?'':'s') + '</b> to your catalogue.<div style="margin-top:7px">' : '<div>')
    + 'Products are <b>added or updated</b>. Nothing is deleted.</div>',
    'Import', function(){ _cfImportRun(btn, decisions, out); });
}

/* ═══ EVERY FIELD THIS ITEM CARRIES ════════════════════════════════════════════════════════════════════════════
 * Athi, 2026-08-13: *"the other information like synonym etc are not visible… clicking one item possibly bring
 * the field name and its item vertically as an overlay showcasing all the fields but graying the field which
 * cannot be edited… or we can group and show case in tab, like price info, tax info and reference, canonical."*
 *
 * ⚠️ THE OLD VIEW SHOWED FIVE HARD-CODED FIELDS — name, price, unit, code, description. `item_data` is free-form
 * jsonb, so synonyms, variant, status, conversions and every column anyone ever imported from a spreadsheet were
 * simply invisible. Not hidden deliberately; just never asked for. A catalogue you cannot see the whole of is one
 * you edit blind.
 *
 * ⚠️ SO THE LAST GROUP IS THE IMPORTANT ONE. Known keys are grouped for readability, and EVERYTHING ELSE lands in
 * "Other" automatically. Add a field tomorrow and it appears without anyone touching this file — which is the
 * only version of this that stays true.
 */
const CAT_GROUPS = [
  ['Basics',    ['name', 'variant', 'grade', 'unit', 'unit_size', 'desc', 'description', 'note', 'synonyms']],
  ['Price',     ['price', 'price_per_litre', 'mrp', 'currency', 'min_qty', 'conversions']],
  ['Tax',       ['hsn', 'sac', 'gst', 'gst_rate', 'tax', 'tax_rate', 'cess']],
  ['Status',    ['status', 'status_until', 'status_replaced_by', 'status_note', 'status_at', 'status_by', 'avail']],
  ['Canonical', ['sku', 'code', 'gtin', 'ean', 'barcode', 'category', 'brand', 'botanical', 'local_name']],
];
/* ⚠️ READ-ONLY, AND THE REASON MATTERS: a reference from another system is EVIDENCE OF WHERE THIS CAME FROM. If
   it is editable it stops being evidence — the same argument as the amendment trail. Stamps (who/when) and the
   connector-written availability feed are on the list for the same reason: they are records of an event, not
   opinions someone may revise. */
const CAT_READONLY = new Set(['status_at', 'status_by', 'avail', 'source', 'external_id', 'source_system',
  'imported_at', 'schema_id', 'item_id', 'created_at', 'updated_at', 'entity_id', 'is_active']);

function catFieldVal(k, v){
  if (v === null || v === undefined || v === '') return '<span style="color:var(--grey)">—</span>';
  if (Array.isArray(v)) {
    if (!v.length) return '<span style="color:var(--grey)">—</span>';
    /* Synonyms are the field Athi could not see, so they get chips rather than a comma soup — the count is the
       thing you actually want to read at a glance. */
    return '<div style="display:flex;flex-wrap:wrap;gap:4px">' + v.map(function(x){
      return '<span style="border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11.5px;background:#fff">' + esc(String(x)) + '</span>';
    }).join('') + '</div>';
  }
  if (typeof v === 'object') {
    if (typeof cbAmount === 'function' && v.amount !== undefined) return esc(String(v.currency || '') + ' ' + v.amount);
    return '<span style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px">' + esc(JSON.stringify(v)) + '</span>';
  }
  return esc(String(v));
}
/**
 * The standard equivalent, printed under the field it belongs to.
 *
 * ⚠️ GUARDED, because catalogue-model.js is a LAZY capability and this overlay is not. Reading CBCatalogue
 * unguarded here would throw on a page where the catalogue capability has not been loaded yet — and the overlay
 * would simply not open, with no error a person could act on.
 */
function catStdLine(k){
  const C = (typeof CBCatalogue !== 'undefined') ? CBCatalogue : null;
  const s = (C && typeof C.stdFor === 'function') ? C.stdFor(k) : null;

    + (s.label ? '<span style="color:#2c5aa0">' + esc(s.label) + '</span>' : '')
    + (s.note ? (s.label ? ' · ' : '') + esc(s.note) : '') + '</div>';
}
function catFieldRow(k, v){
  const ro = CAT_READONLY.has(k);
  return '<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;'
    + (ro ? 'opacity:.55' : '') + '">'
    + '<b style="min-width:118px;color:var(--grey);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em">'
    + esc(k.replace(/_/g, ' ')) + (ro ? ' <span title="from another system — read-only">🔒</span>' : '') + '</b>'
    + '<span style="flex:1;min-width:0;font-weight:600">' + catFieldVal(k, v) + catStdLine(k) + '</span></div>';
}
/**
 * ── ⭐ WHAT THIS ITEM COULD CARRY AND DOES NOT ──────────────────────────────────────────────────────────────────
 * Athi, 2026-08-13: *"also in the ux, we can showcase fields which are available, but not used."*
 *
 * ⚠️ ADOPTED, NOT INVENTED — this is PIM **completeness**, already named in CBCatalogue.STANDARDS ("attributes ·
 * families · completeness"). Every PIM shows how full a record is against the attributes its family declares,
 * because the missing half is the half nobody can see. Same idea, same word.
 *
 * ⚠️ AND "AVAILABLE" HAS TWO SOURCES THAT MEAN DIFFERENT THINGS — showing them as one list would be a lie:
 *   DECLARED — your catalogue definition has this column and this item leaves it blank. If it is also REQUIRED,
 *              that is not an opportunity, it is a gap, and it gets said in amber.
 *   IN USE   — nothing declares it, but N other items carry it. That is the catalogue teaching itself: someone
 *              imported `botanical` on 40 rows and this row missed the file.
 *
 * ⚠️ STAMPS AND REFERENCES ARE NOT SUGGESTED. `status_at`, `avail`, `external_id` are written by an event or
 * another system; listing them as "you could fill this in" invites someone to forge a record of something that
 * never happened. The read-only set already says which those are — one definition, used for both jobs.
 */
const catDeclared = async function(){
  if (UI._catFields) return UI._catFields;                 // once per session — this is a definition, not data
  try { const r = await api('schemaFields'); UI._catFields = (r && r.fields) || []; }
  catch (_) { UI._catFields = []; }                        // no definition is not an error; it just means no hints
  return UI._catFields;
};
function catUnusedRow(k, label, why, required){
  return '<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px">'
    + '<b style="min-width:118px;color:var(--grey);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em">'
    + esc(String(label || k).replace(/_/g, ' ')) + '</b>'
    + '<span style="flex:1;min-width:0;color:' + (required ? '#b0641c' : 'var(--grey)') + ';font-style:italic;font-weight:' + (required ? '700' : '400') + '">'
    + (required ? 'required — not set' : 'not set')
    + '<span style="font-style:normal;font-weight:400;color:var(--grey);font-size:11.5px"> · ' + esc(why) + '</span>'
    + '<span style="font-style:normal;font-weight:400">' + catStdLine(k) + '</span></span></div>';
}
async function prodAllFields(id){
  const p = (UI.prods || []).find(function(x){ return prodId(x) === id; });
  if (!p) return;
  const d = Object.assign({}, pData(p));
  const shown = new Set();
  let body = '';
  CAT_GROUPS.forEach(function(g){
    const rows = g[1].filter(function(k){ return d[k] !== undefined; });
    if (!rows.length) return;
    rows.forEach(function(k){ shown.add(k); });
    body += '<div style="font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--grey);margin:14px 0 2px">' + g[0] + '</div>'
      + rows.map(function(k){ return catFieldRow(k, d[k]); }).join('');
  });
  /* ⭐ ANYTHING THE GROUPS DID NOT CLAIM. This is what makes the overlay survive a new field being added. */
  const rest = Object.keys(d).filter(function(k){ return !shown.has(k); });
  if (rest.length) {
    body += '<div style="font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--grey);margin:14px 0 2px">Other</div>'
      + rest.map(function(k){ return catFieldRow(k, d[k]); }).join('');
  }
  /* ── available, not used ─────────────────────────────────────────────────────────────────────────────────── */
  const has = function(k){ const v = d[k]; return !(v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)); };
  const skip = function(k){ return CAT_READONLY.has(k) || k.charAt(0) === '_' || k.indexOf('status_') === 0; };
  const declared = await catDeclared();
  const gapsDeclared = declared.filter(function(f){ return !skip(f.field_key) && !has(f.field_key); });
  const declaredKeys = new Set(declared.map(function(f){ return f.field_key; }));
  /* Observed across the catalogue the person already has — counted, because "3 of 56" and "51 of 56" are not the
     same suggestion and a bare field name cannot tell them apart. */
  const seen = {};
  (UI.prods || []).forEach(function(x){
    const od = pData(x) || {};
    Object.keys(od).forEach(function(k){
      if (skip(k) || declaredKeys.has(k)) return;
      if (od[k] === undefined || od[k] === null || od[k] === '') return;
      seen[k] = (seen[k] || 0) + 1;
    });
  });
  const gapsSeen = Object.keys(seen).filter(function(k){ return !has(k); }).sort(function(a, b){ return seen[b] - seen[a]; });

  if (gapsDeclared.length || gapsSeen.length) {
    body += '<div style="font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--grey);margin:14px 0 2px">'
      + 'Available · not used <span style="font-weight:600;text-transform:none;letter-spacing:0">— what this item could carry</span></div>'
      + gapsDeclared.map(function(f){
          return catUnusedRow(f.field_key, f.field_name || f.field_key, 'in your catalogue definition', !!f.is_required);
        }).join('')
      + gapsSeen.map(function(k){
          return catUnusedRow(k, k, 'used by ' + seen[k] + ' other item' + (seen[k] === 1 ? '' : 's'), false);
        }).join('');
  }

  /* The row's own identifiers, always read-only — where this record lives, not what it says. */
  body += '<div style="font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--grey);margin:14px 0 2px">Reference</div>'
    + catFieldRow('item_id', p.item_id) + catFieldRow('schema_id', p.schema_id)
    + catFieldRow('created_at', p.created_at) + catFieldRow('updated_at', p.updated_at);

  /* PIM completeness, over the DECLARED set only — the definition is the thing you can be complete against. A
     percentage over "every key anyone ever imported" would fall as the catalogue grew richer, which is backwards. */
  const missReq = gapsDeclared.filter(function(f){ return f.is_required; }).length;
  const compl = declared.length
    ? '<span style="color:' + (missReq ? '#b0641c' : 'var(--grey)') + '"> · '
      + (declared.length - gapsDeclared.length) + '/' + declared.length + ' of the definition filled'
      + (missReq ? ' · ' + missReq + ' required blank' : '') + '</span>'
    : '';

  const st = (d.status || 'available');
  const stCol = st === 'available' ? '#2f6b4f' : st === 'unavailable' ? '#b0641c' : '#c0453b';
  modal('<h3 style="margin:0 0 3px">' + esc(pName(d)) + (d.variant ? ' <span style="color:var(--grey);font-weight:500">· ' + esc(d.variant) + '</span>' : '') + '</h3>'
    + '<div style="font-size:12px;margin-bottom:4px"><span style="color:' + stCol + ';font-weight:700">' + esc(st) + '</span>'
    + '<span style="color:var(--grey)"> · ' + Object.keys(d).length + ' fields on this item</span>' + compl + '</div>'
    + '<div style="font-size:11.5px;color:var(--grey);margin-bottom:6px">🔒 marks a field written by another system or stamped by an event — shown, never edited. <i>Not set</i> marks a field this catalogue has and this item leaves blank.</div>'
    + '<div style="max-height:52vh;overflow-y:auto">' + body + '</div>'

}

/* ── set the lifecycle flag — Athi: "so we don't need to amend the catalogue, but we can set the flag" ──────── */
function prodStatusPick(id){
  const p = (UI.prods || []).find(function(x){ return prodId(x) === id; });
  const d = p ? pData(p) : {};
  const opt = function(v, label, why){
    const on = (d.status || 'available') === v;
    return '<button class="btn" style="width:100%;margin-bottom:7px;text-align:left;' + (on ? 'border-color:var(--blue);font-weight:700' : '') + '" onclick="prodSetStatus(\'' + id + '\',\'' + v + '\')">'
      + esc(label) + '<div style="font-size:11px;color:var(--grey);font-weight:400">' + esc(why) + '</div></button>';
  };
  modal('<h3 style="margin:0 0 4px">Status · ' + esc(pName(d)) + '</h3>'
    + '<div style="font-size:11.5px;color:var(--grey);margin-bottom:12px">The row is never deleted — only the flag changes.</div>'
    + opt('available', 'Available', 'normal — matches orders and prices')
    + opt('unavailable', 'Not available (for now)', 'still matches, so the order records what they asked for — flagged as unable to ship')
    + opt('retired', 'Retired', 'no longer sold. New orders stop resolving to it; old chits are untouched')
    + opt('redundant', 'Redundant', 'replaced by another item — needs to say which')
    + '<button class="btn" style="width:100%;margin-top:4px" onclick="closeModal()">Cancel</button>');
}
function prodSetStatus(id, status){
  /* ⚠️ ASKED FOR, NOT REQUIRED — "Not available" with no end is indistinguishable from retired to everyone
     except the person who set it, and that person forgets. So the date is offered and a blank one is accepted,
     which promptAsk does not do (it refuses empty). Hence the extra button rather than an empty submit. */
  if (status === 'unavailable') {
    return promptAsk('Not available — until when?',
      { label:'Back on which date?', placeholder:'YYYY-MM-DD', okLabel:'Set',
        hint:'Leave it and press <b>I don’t know</b> if there is no date yet — the item still matches orders, '
           + 'flagged as unable to ship.' },
      function(u){ _prodStatus(id, status, { until:u }); },
      { extraLabel:'I don’t know', onExtra:function(){ _prodStatus(id, status, {}); } });
  }
  if (status === 'redundant') {
    return promptAsk('Replaced by which item?',
      { label:'Replacement', okLabel:'Set',
        hint:'The point of <b>redundant</b> is that there is a right answer. If there is none, use <b>Retired</b>.' },
      function(r){ _prodStatus(id, status, { replaced_by:r }); });
  }
  _prodStatus(id, status, {});
}
async function _prodStatus(id, status, extra){
  let body = Object.assign({ status: status }, extra || {});
  try { const out = await api('prodStatus', { params: { id }, body: body });
    closeModal(); await loadCatalogue(); paintProdList(); paintProdDetail();
    toast((out && out.reads_as) ? out.reads_as : ('Status: ' + status));
  } catch (e) { toast(MSG.fail('set the status', e)); }
}

function prodViewFields(d){ const kv=(l,v)=>`<div class="kv" style="display:flex;gap:8px;padding:8px 12px;border-bottom:1px dashed var(--line);font-size:13px"><b style="min-width:96px;color:var(--grey);font-weight:600;font-size:11px;text-transform:uppercase">${l}</b><span style="font-weight:600">${v===''||v==null?'—':esc(v)}</span></div>`;
  return `<div class="itab">${kv('Name',pName(d))}<div class="kv" style="display:flex;gap:8px;padding:8px 12px;border-bottom:1px dashed var(--line);font-size:13px"><b style="min-width:96px;color:var(--grey);font-weight:600;font-size:11px;text-transform:uppercase">Price</b><span style="font-weight:600">${inr(pPrice(d))} <span style="color:var(--grey);font-weight:400">/ ${esc(pUnit(d))}</span></span></div>${kv('Unit',pUnit(d))}${kv('Code / HSN',pCode(d))}${kv('Description',pDesc(d))}</div>`; }
/**
 * ── WHAT THIS STORE HAS, AND WHEN THAT WAS LAST TRUE ─────────────────────────────────────────────────────────
 * The other half of "where is it?" — the locator can only report what a store has said, so a store needs a place
 * to say it. Deliberately NOT a field in the edit form: availability describes the SHELF, changes on its own
 * timetable, and is written by a connector far more often than by a person.
 *
 * The screen never shows a bare number. It shows the number, where it came from and when — because "6 in stock"
 * and "6 in stock, as of March" lead to different decisions, and a store reporting its own stock is exactly where
 * that habit has to start.
 */
function prodAvailBlock(d, id){
  const a = (d && d.avail) || null;
  let age = '', stale = false;
  if (a && a.as_of) {
    const mins = Math.max(0, Math.round((Date.now() - Date.parse(a.as_of)) / 60000));
    stale = mins > 1440;
    age = mins <= 1 ? 'just now' : mins < 60 ? mins + ' min ago'
        : mins < 1440 ? Math.round(mins / 60) + ' h ago' : Math.round(mins / 1440) + ' days ago';
  }
  const state = !a
    ? `<div style="font-size:12.5px;color:#8a5a1e">Not reported. Other stores in your network will see this as
       <b>unknown</b> — which is not the same as zero, and is the honest answer until you say.</div>`
    : `<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
         <b style="font-size:16px;color:${a.qty > 0 ? '#2c7a43' : '#a5382e'}">${a.qty} in stock</b>
         <span style="font-size:10px;font-weight:800;border-radius:5px;padding:1px 6px;${stale ? 'background:#f6ecd8;color:#8a5a1e' : 'background:#e6f4ec;color:#2c7a43'}">${esc(a.source || 'unknown')} · ${esc(age)}</span>
       </div>`;
  return `<div class="sec" style="margin-top:16px">Availability</div>
    <div style="border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff">
      ${state}
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
        <input id="av_qty" placeholder="how many" style="width:110px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px">
        <select id="av_src" style="padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px">
          <option value="manual">counted by hand</option>
          <option value="erp">from the ERP</option>
          <option value="iot">from a sensor</option>
        </select>
        <button class="pri" onclick="saveAvail('${id}')" style="padding:7px 13px">Report it</button>
      </div>
      <div style="font-size:11px;color:var(--grey);margin-top:7px;line-height:1.5">Stamped with the time you report
        it. A connector can write this far more often than a person — the number is only as good as its date.</div>
      <div class="err" id="av_err" style="margin-top:6px"></div>
    </div>`;
}
async function saveAvail(id){
  const e = document.getElementById('av_err'); if (e) e.textContent = '';
  const qty = val('av_qty'), src = val('av_src');
  if (String(qty).trim() === '') { if (e) e.textContent = 'How many?'; return; }
  try {
    await api('prodAvail', { params: { id }, body: { qty: qty, source: src } });
    toast('Availability reported');
    await loadCatalogue();
  } catch (err) {
    // The server refuses a negative on purpose — a wrong feed must not be rounded into an empty shelf.
    if (e) e.textContent = (err && err.message) || 'Could not save that';
  }
}

function prodDetailHTML(){

  else {

       full list would bury the price under twenty rows of provenance; hiding the full list is what made synonyms
       invisible in the first place. Glance, then the whole record on demand. */
    const nfields = Object.keys(d).length;
    body = `<div class="sec">Product</div>${prodViewFields(d)}`
      + `<div style="padding:9px 12px"><button class="composebtn" data-testid="cat-all-fields" onclick="prodAllFields('${id}')">🗂️ All ${nfields} fields</button>`
      + `<span style="font-size:11.5px;color:var(--grey);margin-left:9px">synonyms, status, and anything imported</span></div>`

    bar=`<button class="pri" data-testid="cat-edit" onclick="setProdMode('edit')">✎ Edit</button><button data-testid="cat-status" onclick="prodStatusPick('${id}')">◍ Status</button><button class="warn" data-testid="cat-delete" onclick="delProduct('${id}')">Delete</button>`;
  }
  return `${head}<div class="db">${body}</div><div class="actbar">${bar}</div>`;
}
function ctReadForm(orig){ return Object.assign({}, orig||{}, { name:(val("ct_name")||'').trim(), unit:(val("ct_unit")||'').trim()||'unit', price:+val("ct_price")||0, code:(val("ct_code")||'').trim(), desc:(val("ct_desc")||'').trim() }); }
async function saveNewProduct(){ const err=document.getElementById("ct_err"); if(err)err.textContent=""; const data=ctReadForm({}); if(!data.name){ if(err)err.textContent="Name is required."; return; }
  try{ const r=await api("prodAdd",{body:{item_data:data}}); const nid=(r&&r.item&&r.item.item_id)||null; toast("Product added ✓"); if(window.CBOffline)CBOffline.clearDraft('prod.new'); UI.prodMode='view'; UI.prodSel=nid; await loadCatalogue(); if(nid){ UI.prodSel=nid; paintProdList(); paintProdDetail(); } }catch(e){ if(err)err.textContent=(e&&e.message)||"Could not add the product — please try again."; } }
async function saveProduct(id){ const err=document.getElementById("ct_err"); if(err)err.textContent=""; const p=(UI.prods||[]).find(x=>prodId(x)===id); const data=ctReadForm(pData(p)); if(!data.name){ if(err)err.textContent="Name is required."; return; }
  try{ await api("prodEdit",{params:{id},body:{item_data:data}}); toast("Product updated ✓"); UI.prodMode='view'; await loadCatalogue(); UI.prodSel=id; paintProdList(); paintProdDetail(); }catch(e){ if(err)err.textContent=(e&&e.message)||"Could not add the product — please try again."; } }
function delProduct(id){ confirmAsk('Delete this product?','This <b>cannot be undone</b>. Chits that already cite it keep their frozen copy of the line.','Delete',function(){ _delProduct(id); },true); }
async function _delProduct(id){ try{ await api("prodDel",{params:{id}}); UI.prodSel=null; UI.mdetail=false; toast(MSG.productDeleted()); await loadCatalogue(); }catch(e){ toast(MSG.fail("delete the product", e)); } }

/* ============================================================================================
 * CO-ASSISTS (ACTOR) MODULE
 * PURPOSE: manage the people/systems that act for an entity — the actor roster + their lifecycle.
 * ACTIVITIES: create/invite (User ID + one-time code) · first-login → set-PIN · re-invite · reset-PIN ·
 *   edit profile/hat · leave-cover (buddy pairs, concurrency-checked) · actor Duty/Break · deactivate/

 * SHARED (stay in Core, used by assign pickers): mapApiActor, hatLabel, hatAssignable, HAT_LABEL, acType.
 * GROWTH: other actor types, leave module, shift rotation, wage/salary → target lazy `cap-workforce`.
 * UI: two-sided master/detail (same skeleton as task/order/suppliers — draggable divider + mobile collapse).

const AC_TYPE={human:'🧑 human', iot_device:'⚙️ device', connector:'🔌 connector', ai_agent:'🤖 AI', process_rule:'📋 rule'};
const HAT_LABEL={view_only:'View-only', act:'Act', audit:'Audit', mis:'MIS', manager:'Manager'};
function hatLabel(h){ return HAT_LABEL[h]||h||'Act'; }
function hatAssignable(h){ return h==='act'||h==='manager'; }
function acType(t){ return AC_TYPE[t]||esc(t||'human'); }
function acShc(sh){ return sh==='on_shift'?'on':sh==='on_break'?'brk':'off'; }
function acShLabel(sh){ return sh==='on_shift'?'on shift':sh==='on_break'?'on break':'off'; }
function acFlt(){ return UI.acFlt||'active'; }
function acDate(ts){ if(!ts)return '—'; try{ return new Date(ts).toLocaleDateString('en-IN', {day:'2-digit',month:'2-digit',year:'numeric'}); }catch(_){ return '—'; } }
function acLogin(x){ return esc(x.key)+'@'+esc((SESSION.entity||'').toLowerCase()); }

/* ===== movable panels (drag / resize / font, persisted) ===== */
/* makeMovable(panel, opts) — make a panel draggable + resizable + font-adjustable, geometry persisted per opts.key.
   Best-effort & idempotent: if anything throws it never breaks the panel. Adds a grip + A-/A+ (top-left) and a
   corner resize handle. opts: { key, minW, minH }. Uses CSS zoom for font scale (Chromium/Edge/Safari). */
function makeMovable(panel, opts){
  opts = opts || {};
  try{
    if(!panel || panel.getAttribute('data-movable')) return;
    panel.setAttribute('data-movable','1');
    var key = opts.key || 'cb_panel', minW = opts.minW || 280, minH = opts.minH || 160;
    if(getComputedStyle(panel).position === 'static') panel.style.position = 'relative';
    var saved = null; try{ saved = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){}
    var fs = (saved && saved.fs) || 1;
    function save(){ try{ localStorage.setItem(key, JSON.stringify({
      left: parseFloat(panel.style.left), top: parseFloat(panel.style.top),
      width: parseFloat(panel.style.width), height: parseFloat(panel.style.height), fs: fs })); }catch(e){} }
    function clampIntoView(){
      var r = panel.getBoundingClientRect();
      var l = parseFloat(panel.style.left), t = parseFloat(panel.style.top);
      if(!isNaN(l)) panel.style.left = Math.min(Math.max(0, l), Math.max(0, window.innerWidth - r.width)) + 'px';
      if(!isNaN(t)) panel.style.top  = Math.min(Math.max(0, t), Math.max(0, window.innerHeight - r.height)) + 'px';
    }
    function floatOut(){ var r = panel.getBoundingClientRect();
      panel.style.position = 'fixed'; panel.style.margin = '0'; panel.style.right = 'auto'; panel.style.bottom = 'auto';
      if(!panel.style.left)  panel.style.left  = r.left + 'px';
      if(!panel.style.top)   panel.style.top   = r.top + 'px';
      if(!panel.style.width) panel.style.width = r.width + 'px';
    }
    // control bar: grip + A-/A+
    var bar = document.createElement('div');
    bar.setAttribute('data-mv','bar');
    /* ⚠️ THE BAR'S POSITION IS WHY THIS WAS DISABLED FOR MODALS. Pinned top-left it sat on top of the title and
       the close button, so the note below says modals were "kept plain + centered". That was a workaround for a
       placement, not a reason movable modals are wrong — opts.barAt:'right' puts it clear of both, so a modal can
       have the same drag/resize/zoom every other panel has. Default is unchanged. */
    bar.style.cssText = 'position:absolute;top:6px;' + (opts.barAt === 'right' ? 'right:42px;' : 'left:8px;')
      + 'display:flex;gap:4px;align-items:center;z-index:6';
    var grip = document.createElement('span'); grip.textContent = '⠿'; grip.title = 'Drag';
    grip.style.cssText = 'cursor:grab;color:#9aa3a7;font-size:14px;line-height:1;user-select:none;padding:2px 3px';
    var btn = function(t, ti, fn){ var b = document.createElement('button'); b.type = 'button'; b.title = ti; b.textContent = t;
      b.style.cssText = 'border:1px solid rgba(0,0,0,.13);background:rgba(255,255,255,.92);cursor:pointer;border-radius:5px;width:22px;height:22px;font-size:11px;font-weight:700;color:#5a6472;line-height:1;padding:0';
      b.onmousedown = function(e){ e.stopPropagation(); };
      b.onclick = function(e){ e.stopPropagation(); e.preventDefault(); fn(); }; return b; };
    function setFs(d){ fs = Math.max(0.8, Math.min(1.6, Math.round((fs + d) * 100) / 100)); panel.style.zoom = fs; save(); }
    bar.appendChild(grip);
    bar.appendChild(btn('A−','Smaller text', function(){ setFs(-0.1); }));
    bar.appendChild(btn('A+','Larger text', function(){ setFs(0.1); }));
    /**
     * ⭐ MINIMISE — Athi, 2026-08-15: *"minimize icon all required."*
     *
     * ⚠️ IT HIDES, IT NEVER CLOSES. A minimise that discards the panel loses whatever was typed into it and is
     * indistinguishable from the ✕ beside it — so this only collapses the panel to its header, and the same
     * button restores it. Everything in the fields is still there when it comes back.
     */
    if (opts.minimise) {
      var min = false;
      var mb = btn('–', 'Minimise', function(){
        min = !min;
        [].slice.call(panel.children).forEach(function(c){
          if (c === bar || c.getAttribute('data-mv') === 'rz' || c.classList.contains('mx')) return;
          if (c.classList.contains('mhd')) return;                 // the header stays, so it can be restored
          c.style.display = min ? 'none' : '';
        });
        panel.style.height = min ? 'auto' : panel.style.height;
        mb.textContent = min ? '□' : '–';
        mb.title = min ? 'Restore' : 'Minimise';
      });
      bar.appendChild(mb);
    }
    panel.appendChild(bar);
    // drag by grip
    var d = null;
    function dmove(e){ if(!d) return; panel.style.left = (d.l + e.clientX - d.x) + 'px'; panel.style.top = (d.t + e.clientY - d.y) + 'px'; }
    function dup(){ if(!d) return; d = null; grip.style.cursor = 'grab'; clampIntoView(); save();
      document.removeEventListener('mousemove', dmove); document.removeEventListener('mouseup', dup); }
    grip.addEventListener('mousedown', function(e){ floatOut(); var r = panel.getBoundingClientRect();
      d = { x: e.clientX, y: e.clientY, l: r.left, t: r.top }; grip.style.cursor = 'grabbing';
      document.addEventListener('mousemove', dmove); document.addEventListener('mouseup', dup); e.preventDefault(); });
    // resize corner
    var rz = document.createElement('div'); rz.setAttribute('data-mv','rz');
    rz.style.cssText = 'position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;z-index:6;background:linear-gradient(135deg,transparent 48%,rgba(0,0,0,.22) 48%);border-radius:0 0 8px 0';
    panel.appendChild(rz);
    var z = null;
    function zmove(e){ if(!z) return; panel.style.width = Math.max(minW, z.w + e.clientX - z.x) + 'px';
      panel.style.height = Math.max(minH, z.h + e.clientY - z.y) + 'px'; panel.style.maxHeight = 'none'; }
    function zup(){ if(!z) return; z = null; save(); document.removeEventListener('mousemove', zmove); document.removeEventListener('mouseup', zup); }
    rz.addEventListener('mousedown', function(e){ floatOut(); var r = panel.getBoundingClientRect();
      z = { x: e.clientX, y: e.clientY, w: r.width, h: r.height };
      document.addEventListener('mousemove', zmove); document.addEventListener('mouseup', zup); e.preventDefault(); e.stopPropagation(); });
    // restore saved geometry
    if(saved){ panel.style.position = 'fixed'; panel.style.margin = '0'; panel.style.right = 'auto'; panel.style.bottom = 'auto';
      if(saved.left  != null && !isNaN(saved.left))  panel.style.left = saved.left + 'px';
      if(saved.top   != null && !isNaN(saved.top))   panel.style.top = saved.top + 'px';
      if(saved.width != null && !isNaN(saved.width)) panel.style.width = saved.width + 'px';
      if(saved.height!= null && !isNaN(saved.height)){ panel.style.height = saved.height + 'px'; panel.style.maxHeight = 'none'; }
      if(saved.fs != null){ fs = saved.fs; panel.style.zoom = fs; }
      clampIntoView();
    }
  }catch(e){ /* best-effort — never break the panel */ }
}

function _aiMd(md){

  var il=function(s){return esc(String(s)).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');};
  while(i<L.length){var l=L[i];
    if(l.indexOf('|')>=0&&i+1<L.length&&sep(L[i+1])){var th=cl(l).map(function(c){return '<th>'+il(c)+'</th>';}).join('');i+=2;var tr=[];while(i<L.length&&L[i].indexOf('|')>=0&&L[i].trim()!==''){tr.push('<tr>'+cl(L[i]).map(function(c){return '<td>'+il(c)+'</td>';}).join('')+'</tr>');i++;}o.push('<table class="amdt"><thead><tr>'+th+'</tr></thead><tbody>'+tr.join('')+'</tbody></table>');continue;}
    var hm=l.match(/^(#{1,4})\s+(.*)$/);if(hm){var lv=hm[1].length;o.push('<h'+lv+' class="amdh">'+il(hm[2])+'</h'+lv+'>');i++;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){o.push('<hr>');i++;continue;}
    if(/^\s*([-*+]|\d+\.)\s+/.test(l)){var od=/^\s*\d+\./.test(l),it=[];while(i<L.length&&/^\s*([-*+]|\d+\.)\s+/.test(L[i])){it.push('<li>'+il(L[i].replace(/^\s*([-*+]|\d+\.)\s+/,''))+'</li>');i++;}o.push('<'+(od?'ol':'ul')+'>'+it.join('')+'</'+(od?'ol':'ul')+'>');continue;}
    if(l.trim()===''){i++;continue;}

 * `.appwrap.m .shell{max-width:440px}` frames the app — but `#modalhost` is a SIBLING of `.appwrap`, not a
 * descendant, so that rule can never touch it. Measured 2026-08-15 with Mobile on: shell 440px starting at
 * x=93, modal 602px starting at x=7. Every modal — compose, the cart popup, the amend card, RAID,

  /* ⚠️ SHOWN AS TEXT, NEVER AS MARKUP. The commonest text attachment here is a stranger's own words, captured off

     had it. */

    : '<div class="attfile"><div style="font-size:46px">📄</div><div style="font-weight:600;margin:8px 0 2px">'+esc(a.n||'file')+'</div><div style="font-size:11px;color:#9aa3a7">reading…</div></div>';

  const bg=a.t==='image'?'#E8F0F4':a.t==='video'?'#F7F1E4':'#F1EFE8';
