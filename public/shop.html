<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{ --ink:#20303b; --grey:#8a949c; --line:#e7e3d8; --blue:#3F66A6; --gold-soft:#f7f2e3; --gold-line:#e6d9a8; --paper:#faf8f3; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:var(--ink); background:var(--paper); }
  .wrap{ max-width:860px; margin:0 auto; padding:20px 16px 60px; }
  .sg{ font-family:'Space Grotesk',-apple-system,sans-serif; }
  .hd{ display:flex; align-items:center; gap:12px; padding:14px 0 16px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .logo{ width:44px; height:44px; border-radius:12px; background:#eef3fb; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .shopname{ font-weight:800; font-size:20px; }
  .badge{ font-size:11px; font-weight:700; border-radius:20px; padding:2px 9px; }
  .b-ver{ background:#e8f3ec; color:#2f7a45; } .b-open{ background:#e8f3ec; color:#2f7a45; } .b-closed{ background:#fbeae9; color:#b4453f; } .b-away{ background:#f7f2e3; color:#7a5e22; }
  .sechd{ font-size:11px; font-weight:800; color:#6a44a8; text-transform:uppercase; letter-spacing:.5px; margin:22px 0 10px; }
  .card{ border:1px solid var(--line); border-radius:14px; padding:15px 16px; margin-bottom:12px; background:#fff; }

  .story{ font-size:13px; color:#3a4048; line-height:1.6; margin:6px 0 9px; }

<body>
<div class="wrap" id="app"><div class="msg">Loading shop…</div></div>
<script src="cb-offline.js"></script>
<script src="app/offers.js"></script>
<script src="app/catalogue-lines.js"></script>
<script src="app/locale.js"></script>   <!-- cart-ui reads CBLocale (money/symbol) — the app loads it, the shop must too (found by the tour, 2026-09-05) -->
<script src="app/cart-ui.js"></script>
<script src="app/step-flow.js"></script>
<script>
var API = (new URLSearchParams(location.search).get('api')) || 'https://chitbridge-api-production.up.railway.app';
/**
 * ⭐⭐ ?s= IS THE PUBLIC HANDLE (a User ID); ?bridge= IS THE OLD INTERNAL KEY, KEPT SO EXISTING LINKS STILL OPEN.
 *
 * ⚠️⚠️ THE APP HAS BEEN BUILDING LINKS AS /shop.html?s=<user_id> WHILE THIS READ ONLY ?bridge=. Every one of
 * those links landed on "No shop specified" — a dead link with a perfectly plausible shape, which is exactly
 * why it survived: the storefront row rendered, the URL looked right, and the failure was on a page nobody
 * opens while working on the app.
 *
 * The server resolves either form (resolveEntity in routes/catalogue.js), so this variable stays the one
 * "who is this shop" value and nothing downstream changes.
 */
/* ?item=<item_id>: ONE product, as the customer sees it — the product page's Storefront row frames this. Same
   renderer, same offers, same cart; only the shop header and the rest of the list are left out. Athi, 2026-09-05:
   "not the entire link — how this product will look in front of the user". */
var _ONLY = (new URLSearchParams(location.search).get('item') || '').trim();
var BRIDGE = (new URLSearchParams(location.search).get('s')
           || new URLSearchParams(location.search).get('bridge') || '').trim();
var _FIN=[]; var _ord=null; var _lg={}; var _SHOPDATA=null;
// SPEC-negotiation-position — how this shop takes orders, from the API (never assumed). Decides what the customer is
// asked for and therefore what data the business gets back. Unknown/absent → 'cart' (every existing shop unchanged).
var _OI={preset:'cart',pipeline:'commerce',showsPrice:true,negotiable:false,schema:{type:'object',properties:{quantity:{type:'number'}}}};
var _METHOD='cart';   // the preset name, kept for readability
// ONE CATALOGUE ENTRY = ONE FORM. A store may offer ITR-2 and a Commercial Invoice; each item carries its OWN
// declaration, merge-patched over the catalogue's (RFC 7386 — the item wins, because it is the more specific one).
// The customer must see the fields of the template THEY picked. The server re-resolves the same way at submit.
var _OIC=null;   // the declaration for the item currently open
function _mergePatch(t,p){
  if(p===null||typeof p!=='object'||Array.isArray(p))return p;
  var o=(t&&typeof t==='object'&&!Array.isArray(t))?Object.assign({},t):{};
  for(var k in p){ if(!Object.prototype.hasOwnProperty.call(p,k))continue;
    if(p[k]===null)delete o[k]; else o[k]=_mergePatch(o[k],p[k]); }
  return o;
}
function _oiFor(it){ var d=it&&it.order_input; return d?_mergePatch(_OI,d):_OI; }
function _cur(){ return _OIC||_OI; }
function _isNegotiable(){ return !!_cur().negotiable; }
function _showsPrice(){ return _cur().showsPrice!==false && _cur().pipeline!=='payload'; }
function _isPayload(){ return _cur().pipeline==='payload'; }
function _submitLabel(){ return _isPayload()?(_cur().preset==='form'?'Submit':'Send enquiry'):(_isNegotiable()?'Make an offer':t('order')); }
// ── render the DECLARED fields — same subset the server validates (type · enum · maxLength · required) ──
function _schemaFields(schema, vals){
  var props=(schema&&schema.properties)||{}, req=(schema&&schema.required)||[];
  var fld='style="width:100%;padding:9px;border:1px solid #e7e3d8;border-radius:8px;margin:3px 0 11px;font-size:14px"';
  return Object.keys(props).map(function(k){
    var p=props[k]||{}, v=(vals&&vals[k]!=null)?vals[k]:'';
    // PROVENANCE, shown to the customer: which document a value came from, and which line of it. They can still
    // change anything — a read value is a suggestion, not a fact, until they send it.
    var src=_read[k];
    var label=esc(k.replace(/_/g,' '))+(req.indexOf(k)>=0?' <span style="color:#b4453f">*</span>':'')
      +(src?' <span style="font-size:10px;color:#2e7a45;background:#eef7ee;border:1px solid #cfe6cf;border-radius:9px;padding:1px 6px" title="'+esc(src.label)+'">from your '+esc(src.from)+'</span>':'');
    var inp;
    if(Array.isArray(p.enum)&&p.enum.length){
      inp='<select id="f_'+esc(k)+'" data-testid="shop-f-'+esc(k)+'" '+fld+'><option value=""></option>'
        +p.enum.map(function(o){ return '<option value="'+esc(o)+'"'+(String(o)===String(v)?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+'</select>';
    } else if(p.type==='boolean'){
      inp='<div style="margin:3px 0 11px"><input type="checkbox" id="f_'+esc(k)+'" data-testid="shop-f-'+esc(k)+'"'+(v?' checked':'')+'></div>';
    } else if(p.maxLength&&p.maxLength>200){
      inp='<textarea id="f_'+esc(k)+'" data-testid="shop-f-'+esc(k)+'" rows="4" '+fld+'>'+esc(v)+'</textarea>';
    } else {
      inp='<input id="f_'+esc(k)+'" data-testid="shop-f-'+esc(k)+'"'+(p.type==='number'||p.type==='integer'?' inputmode="decimal"':'')
        +(p.maxLength?' maxlength="'+p.maxLength+'"':'')+' value="'+esc(v)+'" '+fld+'>';
    }
    return '<label style="font-size:12px;color:#6a707a">'+label+'</label>'+inp;
  }).join('');
}
// ── CARRIED DOCUMENTS (SPEC-document-carrying) — the submission is the filled form AND its proof. The input appears
// ONLY when the catalogue declares it; the server re-validates and is the authority (these checks are a courtesy so
// the customer learns about a 7 MB scan before uploading it, not after).
var _docs=[];   // [{name, mime, data_base64, size}]
function _docDecl(){ var o=_cur(); return (o&&o.documents)||null; }   // per-item: this template's own proof requirement
function _docBlock(){
  var d=_docDecl(); if(!d)return '';
  var mb=function(n){ return (n/1048576).toFixed(1)+' MB'; };
  var rows=_docs.map(function(f,i){ return '<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 8px;border:1px solid #e7e3d8;border-radius:8px;margin-bottom:5px;background:#fbfaf7"><span style="flex:1">📎 '+esc(f.name)+'</span><span style="color:#8a949c">'+esc(mb(f.size))+'</span><button onclick="_docRemove('+i+')" style="border:0;background:none;color:#b4453f;cursor:pointer;font-size:15px">×</button></div>'; }).join('');
  var full=_docs.length>=d.max;
  return '<label style="font-size:12px;color:#6a707a">'+esc(d.label)+(d.required?' <span style="color:#b4453f">*</span>':' <span style="color:#9aa3a7">· optional</span>')+'</label>'
    +'<div style="margin:3px 0 11px">'+rows
    +(full?'<div style="font-size:11px;color:#8a949c">Maximum '+d.max+' reached.</div>'
          :'<label style="display:block;border:1.5px dashed #cfc3e8;border-radius:10px;padding:12px;text-align:center;cursor:pointer;color:#6a44a8;font-weight:600;font-size:12.5px">📎 Attach '+esc(d.label.toLowerCase())
            +'<input type="file" data-testid="shop-doc" accept="'+esc(d.accept.join(','))+'" onchange="_docPick(event)" style="display:none"></label>'
            +'<div style="font-size:10.5px;color:#9aa3a7;margin-top:4px">'+esc(d.accept.join(' · ').replace(/application\//g,'').replace(/image\//g,''))+' · up to '+d.max+' file(s)</div>')
    +'</div>';
}
// ── READ THE DOCUMENT (the handshake, in the browser) ────────────────────────────────────────────────────────
// The catalogue declares WHICH documents it can read and WHERE each value sits — as a LITERAL LABEL plus a type,
// never a regex, so a shop cannot ship catastrophic backtracking to its own customers. The reader escapes the label
// and builds the pattern itself.
//
// It runs HERE, in the customer's browser, on purpose: it is their own document, it never has to reach a server to
// be read, and the extracted values are their ASSERTION — exactly as if they had typed them. The document's sha256
// is the proof, and the shop can always open the PDF and check. Nobody is asked to trust an extractor.
var _pdfjs=null;
function _loadPdfjs(){
  if(_pdfjs) return Promise.resolve(_pdfjs);
  // ~1.8 MB, fetched ONLY when a customer attaches a readable document to a catalogue that declares a source.
  return import('/app/vendor/pdf.min.mjs').then(function(m){
    m.GlobalWorkerOptions.workerSrc='/app/vendor/pdf.worker.min.mjs';
    _pdfjs=m; return m;
  });
}
var _VALUE_RE={ number:'([0-9][0-9,]*\\.?[0-9]*)', code:'([A-Z0-9]{4,15})', year:'([0-9]{4}-[0-9]{2})',
                string:'([^\\n]{1,60}?)(?=\\s{2,}|$)' };
function _escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function _srcsFor(){ var o=_cur(); return (o&&o.sources)||null; }
function _srcForMime(mime){ var ss=_srcsFor()||[]; for(var i=0;i<ss.length;i++){ if((ss[i].accept||[]).indexOf(mime)>=0) return ss[i]; } return null; }

async function _readDocument(file, src){
  var pdfjs=await _loadPdfjs();
  var buf=await file.arrayBuffer();
  var doc=await pdfjs.getDocument({data:new Uint8Array(buf), isEvalSupported:false}).promise;
  var text='';
  for(var p=1;p<=doc.numPages;p++){ var pg=await doc.getPage(p); var c=await pg.getTextContent();
    text+=c.items.map(function(it){return it.str;}).join(' ')+'\n'; }
  var got={}, missed=[];
  (src.fields||[]).forEach(function(f){
    var vp=_VALUE_RE[f.type]||_VALUE_RE.string;
    var re=new RegExp(_escRe(f.after)+'\\s*:?\\s*'+vp,'i');
    var m=re.exec(text);
    if(!m){ missed.push(f.to); return; }
    var v=m[1];
    if(f.type==='number'){ v=Number(String(v).replace(/,/g,'')); if(!isFinite(v)){ missed.push(f.to); return; } }
    got[f.to]={value:v, from:src.label, label:f.after};
  });
  return {got:got, missed:missed, chars:text.length, pages:doc.numPages};
}

// what was read, and from where — the customer sees the provenance, and can still edit any of it
var _read={};   // formField -> {value, from, label}
function _applyRead(got){
  Object.keys(got).forEach(function(k){ _read[k]=got[k]; });
  _ord.payload=Object.assign({}, _ord.payload||{},
    Object.keys(got).reduce(function(a,k){ a[k]=got[k].value; return a; },{}));
}
function _readBanner(){
  var n=Object.keys(_read).length; if(!n) return '';
  var props=((_cur().schema||{}).properties)||{};
  var left=Object.keys(props).filter(function(k){ return !_read[k]; });
  return '<div style="margin:0 0 11px;padding:9px 11px;border:1px solid #cfe6cf;border-radius:9px;background:#eef7ee;font-size:12px;color:#2e7a45">'
    +'<b>Read '+n+' field'+(n===1?'':'s')+' from your '+esc(Object.values(_read)[0].from)+'.</b>'
    +(left.length?' You still need to fill '+left.length+'.':' Nothing left to fill.')
    +'<div style="font-size:10.5px;color:#6a707a;margin-top:3px">Check them — you can change anything before sending.</div></div>';
}
function _docRemove(i){ _docs.splice(i,1); orderRender(); }
function _docPick(ev){
  var d=_docDecl(), f=ev.target.files&&ev.target.files[0]; ev.target.value='';
  if(!d||!f)return;
  if(_docs.length>=d.max){ orderRender(null,'At most '+d.max+' document(s).'); return; }
  var mime=(f.type||'').toLowerCase().split(';')[0];
  if(d.accept.indexOf(mime)<0){ orderRender(null,'That file type is not accepted here.'); return; }
  if(f.size>6*1048576){ orderRender(null,'"'+f.name+'" is larger than 6 MB.'); return; }
  var rd=new FileReader();
  rd.onload=function(){
    _docs.push({name:f.name,mime:mime,size:f.size,data_base64:String(rd.result).replace(/^data:[^;]+;base64,/,'')});
    // If the catalogue declares that it can READ this kind of document, do so — and prefill what it finds.
    var src=_srcForMime(mime);
    if(!src){ orderRender(); return; }
    orderRender('Reading '+esc(f.name)+'…');
    _readDocument(f, src).then(function(r){
      _ord.busy=false;
      if(!Object.keys(r.got).length){
        // Say so plainly. A scanned PDF has no text layer, and silently filling nothing looks like a broken page.
        orderRender(null,'Attached, but nothing could be read from it — if it is a scan, please fill the fields yourself.');
        return;
      }
      _applyRead(r.got);
      orderRender();
    }).catch(function(){
      _ord.busy=false;
      orderRender(null,'Attached, but it could not be read — please fill the fields yourself.');
    });
  };
  rd.onerror=function(){ orderRender(null,'Could not read that file.'); };
  rd.readAsDataURL(f);
}
function _readSchemaFields(schema){
  var props=(schema&&schema.properties)||{}, out={};
  Object.keys(props).forEach(function(k){ var e=el('f_'+k); if(!e)return;
    out[k]=(props[k]&&props[k].type==='boolean')?!!e.checked:e.value; });
  return out;
}
// the seller's declared band for an item, when it has one
// The BAND is money too. price_min/price_max are stamped { amount, currency } like any other price, so they must
// be unwrapped — string-concatenating one renders "₹[object Object]", which is exactly what a range store showed.
// Same class of bug as the silent zero, except loud, which is the only mercy in it.
function itemBand(it){ var c=(it&&it.commercials)||{};
  if(!cbHasPrice(c.price_min) && !cbHasPrice(c.price_max)) return null;
  return { min: cbHasPrice(c.price_min)?cbAmount(c.price_min):null,
           max: cbHasPrice(c.price_max)?cbAmount(c.price_max):null,
           c:   cbCurrency(c.price_min) || cbCurrency(c.price_max) || null }; }
// The symbol comes from the BAND's own currency; the caller's hint is only a fallback.
function _bandText(b,cur){ if(!b)return ''; var sym=symOf(b.c||curOf(null))||cur||'';
  var lo=(b.min!=null?(sym+b.min):'…'), hi=(b.max!=null?(sym+b.max):'…'); return lo+' – '+hi; }
// cbAmount — TOLERANT PRICE READER. A price is either a legacy bare number or a stamped { amount, currency }.
// Deployed BEFORE any row is stamped, because the idiom this replaces is `+d.price||0`: given an object that is
// NaN, and NaN||0 is 0, so every stamped product would render as FREE — no error, no log, a correct-looking page.
// Behaviour is otherwise IDENTICAL to what it replaces (0 for absent), so this change adds a readable shape and
// nothing else. Whether absent should stop being 0 is a separate decision, deliberately not taken here.
function cbAmount(v){
  if(v&&typeof v==='object'&&typeof v.amount==='number'&&isFinite(v.amount)) return v.amount;
  var n=+v; return isFinite(n)?n:0;
}
// cbCurrency — the price's OWN currency when it carries one, else null. Null means "not stamped yet", never a guess.
function cbCurrency(v){ return (v&&typeof v==='object'&&typeof v.currency==='string')?v.currency:null; }
// cbHasPrice — distinguishes "price on request" from a genuine zero. `d.price!=null` is true for a stamped object,
// so it stays correct; this exists so callers stop relying on that coincidence.
function cbHasPrice(v){ return v!=null&&v!==''&&(typeof v!=='object'||typeof v.amount==='number'); }
var _REGIONS=[]; var _REGION='IN';
var _CUR={INR:'₹',MXN:'Mex$',USD:'$',EUR:'€',CNY:'¥',JPY:'¥'};
// NO FX TABLE. Deleted 2026-08-05, not deprecated — a rate table that exists will eventually be used.
//
// Athi: "assume you see Amazon.co.in from America — you will not get any conversion, you simply see values in INR."
// Exactly so. A storefront shows the SELLER'S price in the SELLER'S currency, to everyone, everywhere. The viewer's
// region decides language and units; it has never had any business deciding the money.
//
// What was here multiplied every price by a hardcoded rate keyed to the VIEWER's region and labelled the result
// 'indicative'. Three things wrong with that: the rates were stale the day they shipped, an approximation was
// shown where an exact figure exists, and it REPLACED the declared price instead of sitting beside it. Now that a
// price carries its own currency, the honest render is simply to print what the seller declared.
// per-language phrases — the catalogue labels render in the region's language (character variation zh/ja, word variation es/fr/de)
var _L={
  en:{wall:'See it on your wall',order:'Order this →',combos:'Colour combinations',applied:'Applied with',por:'price on request'},
  es:{wall:'Míralo en tu pared',order:'Pedir esto →',combos:'Combinaciones de color',applied:'Aplicado con',por:'precio a consultar'},
  zh:{wall:'在您的墙上预览',order:'立即订购 →',combos:'配色方案',applied:'施工工具',por:'价格面议'},
  ja:{wall:'あなたの壁で見る',order:'注文する →',combos:'カラーの組み合わせ',applied:'塗装方法',por:'価格はお問い合わせ'},
  fr:{wall:'Voyez-le sur votre mur',order:'Commander →',combos:'Combinaisons de couleurs',applied:'Appliqué avec',por:'prix sur demande'},
  de:{wall:'An Ihrer Wand ansehen',order:'Bestellen →',combos:'Farbkombinationen',applied:'Aufgetragen mit',por:'Preis auf Anfrage'},
  ta:{wall:'உங்கள் சுவரில் பாருங்கள்',order:'ஆர்டர் செய்யவும் →',combos:'வண்ண சேர்க்கைகள்',applied:'பூசும் முறை',por:'விலை கோரிக்கையின் பேரில்'},
  hi:{wall:'इसे अपनी दीवार पर देखें',order:'ऑर्डर करें →',combos:'रंग संयोजन',applied:'लगाने का तरीका',por:'कीमत अनुरोध पर'}
};
function paintPill(s){ var p=el('netpill'); if(!p){ p=document.createElement('div'); p.id='netpill'; p.style.cssText='position:fixed;bottom:10px;inset-inline-end:10px;z-index:998;font:700 11px/1 system-ui,-apple-system,sans-serif;border-radius:999px;padding:5px 11px;border:1px solid #e5e8ee;background:#fff;color:#2f7a45;box-shadow:0 1px 4px rgba(0,0,0,.08)'; (document.body||document.documentElement).appendChild(p); } if(!p)return; if(s.online){ p.style.background='#fff'; p.style.color='#2f7a45'; p.textContent=s.pending?('● Online · '+s.pending):'● Online'; } else { p.style.background='#fdf6e9'; p.style.color='#b4832a'; p.textContent='⚠ Offline · saved'; } }
if(window.CBOffline){ CBOffline.configure({apiBase:API, token:function(){return null;}, onChange:paintPill}); CBOffline.registerSW('/cb-sw.js'); }
function tlang(){ var rc=regionCur(); return rc.language||'en'; }
function t(k){ var l=tlang(); return (_L[l]&&_L[l][k])||_L.en[k]||k; }
function regionCur(){ return _REGIONS.find(function(r){return r.region_code===_REGION;})||{}; }
// The symbol follows the MONEY, not the reader. Precedence: the price's own stamped currency, then the shop's,
// then nothing rather than a guess — a wrong symbol on a right number is worse than no symbol at all.
function curOf(price){ return cbCurrency(price) || (_SHOPDATA && _SHOPDATA.shop && _SHOPDATA.shop.currency_code) || null; }
function symOf(code){ if(!code) return ''; if(_CUR[code]) return _CUR[code];
  try { var pt=new Intl.NumberFormat(undefined,{style:'currency',currency:code,currencyDisplay:'narrowSymbol'})
    .formatToParts(0).find(function(x){return x.type==='currency';}); return (pt&&pt.value)||code+' '; } catch(e){ return code+' '; } }
function priceSym(price){ return symOf(curOf(price)); }
function priceUnit(){ var rc=regionCur(); return rc.units||'litre'; }
// The amount, unchanged. No rate, no rounding of someone else's money — what the seller typed is what shows.
function priceVal(price){ return price; }

    if(!isFinite(off)||off<=0){ _ord.busy=false; orderRender(null,'Enter your offer.'); return; }
    var b=itemBand(it);
    if(b&&b.min!=null&&off<Number(b.min)){ _ord.busy=false; orderRender(null,'Your offer is below the seller’s range ('+_bandText(b)+').'); return; }
    if(b&&b.max!=null&&off>Number(b.max)){ _ord.busy=false; orderRender(null,'Your offer is above the seller’s range ('+_bandText(b)+').'); return; }
    line.proposal={price:off};
  }
  var body={ identifier:_ord.contact, name:_ord.name, otp:otp, location:_ord.loc||'', line_items:[line] };
  return _orderPost(body);
}
// One POST for every declaration — commerce order, offer, enquiry or filled form. They differ only in the line built
// above; the rail, the OTP and the resulting chit are identical.
function _orderPost(body){
  // A cart has no single finish to describe, so the confirmation names the count instead. Everything else — the
  // endpoint, the OTP, the chit that results — is identical, which is the point.
  var isCart=_isCart(), n=isCart?(_ord.lines||[]).length:0;
  var e=isCart?null:_FIN[_ord.idx], it=e?e.it:null;
  _ord.busy=true; orderRender();
  fetch(API+'/api/catalogue/'+encodeURIComponent(BRIDGE)+'/order/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){return{status:r.status,j:j};});})
    .then(function(res){ if(res.status!==200){ _ord.busy=false; orderRender(null,(res.j&&res.j.message)||'Could not submit.'); return; }
      var p=it?itemPrice(it):null, unit=(p&&p.u)||'';
      var what=isCart?'Your order for ':(_isPayload()?(_OI.preset==='form'?'Your form for ':'Your enquiry about ')
              :(_isNegotiable()?'Your offer for ':'Your order for '));
      var subject=isCart?(n+' item'+(n===1?'':'s')):esc(it.name)+((_ord.combo&&!_isPayload())?(' · '+esc(_ord.combo)):'');
      var qtyTxt=(!isCart&&!_isPayload()&&_ord.qty)?(' ('+esc(String(_ord.qty))+(unit?(' '+esc(unit)):'')+')'):'';
      var title=isCart?'Order placed':(_isPayload()?'Submitted':(_isNegotiable()?'Offer sent':'Order placed'));
      var tail=(!isCart&&_isNegotiable())?'The shop will accept or counter.':'They\'ll be in touch.';
      ohost().innerHTML='<div style="position:fixed;inset:0;background:rgba(15,22,32,.5);z-index:900;display:flex;align-items:center;justify-content:center;padding:12px" onclick="orderClose()"><div style="background:#fff;max-width:400px;border-radius:16px;padding:26px;text-align:center"><div style="font-size:40px">✓</div><div class="sg" style="font-weight:800;font-size:18px;margin-top:8px">'+esc(title)+'</div><div style="font-size:13px;color:#3a4048;margin-top:8px;line-height:1.6">'+what+'<b>'+subject+'</b>'+qtyTxt+' reached the shop. '+tail+'</div><button onclick="orderClose()" style="margin-top:16px;border:0;border-radius:10px;padding:10px 20px;background:#3F66A6;color:#fff;font-weight:700;cursor:pointer">Done</button></div></div>'; if(window.CBOffline)CBOffline.clearDraft('shop.ord.'+BRIDGE); })
    .catch(function(e2){ _ord.busy=false; orderRender(null,(window.CBOffline&&!CBOffline.online())?'You are offline — reconnect to continue. Your details are saved.':(e2.message||'Network error')); });
}
// ── VISUALIZE-APPLY ("scan your home") — CHEAP first slice: upload a room photo, tint it in each recommended
// combination (client-side canvas, no upload/GPU/S3), swap freely, then order. Honest: indicative overlay, not a true
// room render yet (that swaps in later, cost-capped, cache-to-S3). Gated by the SOURCE's experience.visualize.enabled.
var _VIZ=null;
function vizhost(){ var h=el('vizhost'); if(!h){ h=document.createElement('div'); h.id='vizhost'; document.body.appendChild(h); } return h; }
function vizClose(){ var h=el('vizhost'); if(h)h.innerHTML=''; _VIZ=null; }
function vizOpen(idx){ var e=_FIN[idx]; if(!e)return; var combos=(e.it.combinations||[]); _VIZ={idx:idx, img:null, combos:combos, combo:combos[0]||null}; vizRender(); }
function vizRender(){
  var e=_FIN[_VIZ.idx], it=e.it, combos=_VIZ.combos;
  var chips=combos.map(function(cm,i){ var on=_VIZ.combo&&_VIZ.combo.name===cm.name; var sw=(cm.colours||[]).map(function(c){return '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+esc(c.hex)+';border:1px solid rgba(0,0,0,.15);vertical-align:middle"></span>';}).join(''); return '<button onclick="vizPick('+i+')" style="border:'+(on?'2px solid #6a44a8':'1px solid #e7e3d8')+';background:#fff;border-radius:9px;padding:6px 10px;margin:0 6px 6px 0;cursor:pointer;font-size:12px"><span style="display:inline-flex;gap:2px;margin-inline-end:5px">'+sw+'</span>'+esc(cm.name)+'</button>'; }).join('');
  var upload='<label style="display:block;border:2px dashed #cfc3e8;border-radius:12px;padding:26px;text-align:center;cursor:pointer;color:#6a44a8;font-weight:600">📷 Upload a photo of your room<input type="file" accept="image/*" onchange="vizLoad(event)" style="display:none"></label>';
  vizhost().innerHTML='<div style="position:fixed;inset:0;background:rgba(15,22,32,.6);z-index:950;display:flex;align-items:center;justify-content:center;padding:12px" onclick="if(event.target===this)vizClose()">'
    +'<div style="background:#fff;width:100%;max-width:560px;border-radius:16px;padding:16px 16px 20px;max-height:94vh;overflow:auto">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px"><b class="sg" style="font-size:17px;flex:1">'+esc(it.name)+' on your wall</b><button onclick="vizClose()" style="border:0;background:none;font-size:22px;cursor:pointer;color:#8a949c">×</button></div>'
    +'<div style="font-size:11.5px;color:#9aa3a7;margin-bottom:10px">Upload a photo of your room and try the colour combinations. Indicative preview (colour overlay) - a true room render is coming.</div>'
    +(_VIZ.img?'<canvas id="viz_canvas" width="520" height="340" style="width:100%;border-radius:12px;background:#eef0f2;display:block"></canvas><div style="margin-top:10px">'+chips+'</div><div style="display:flex;gap:8px;margin-top:8px"><button onclick="vizToOrder()" style="flex:1;border:0;border-radius:10px;padding:12px;background:#3F66A6;color:#fff;font-weight:700;font-size:14px;cursor:pointer">Order this combination →</button><label style="border:1px solid #e7e3d8;border-radius:10px;padding:12px;cursor:pointer;font-size:13px">Change photo<input type="file" accept="image/*" onchange="vizLoad(event)" style="display:none"></label></div>':upload)
    +'</div></div>';
  if(_VIZ.img) vizDraw(_VIZ.combo);
}
function vizLoad(ev){ var f=ev.target.files&&ev.target.files[0]; if(!f)return; var rd=new FileReader(); rd.onload=function(){ var im=new Image(); im.onload=function(){ _VIZ.img=im; vizRender(); }; im.src=rd.result; }; rd.readAsDataURL(f); }
function vizPick(i){ _VIZ.combo=_VIZ.combos[i]; vizRender(); }
function vizDraw(combo){ var cv=el('viz_canvas'); if(!cv||!_VIZ.img)return; var ctx=cv.getContext('2d'); var iw=_VIZ.img.width,ih=_VIZ.img.height,cw=cv.width,ch=cv.height; var sc=Math.min(cw/iw,ch/ih); var w=iw*sc,h=ih*sc,x=(cw-w)/2,y=(ch-h)/2; ctx.clearRect(0,0,cw,ch); ctx.fillStyle='#eef0f2'; ctx.fillRect(0,0,cw,ch); ctx.drawImage(_VIZ.img,x,y,w,h);
  if(combo&&combo.colours&&combo.colours.length){ ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.5; var cols=combo.colours; var g=ctx.createLinearGradient(x,0,x+w,0); cols.forEach(function(c,i){ g.addColorStop(cols.length>1?(i/(cols.length-1)):0, c.hex||'#ccc'); }); ctx.fillStyle=g; ctx.fillRect(x,y,w,h); ctx.restore(); }
}
function vizToOrder(){ var idx=_VIZ.idx, comboName=_VIZ.combo&&_VIZ.combo.name; vizClose(); _ord={idx:idx, step:'contact', combo:comboName}; orderRender(); }
(function(){
  if(!BRIDGE){ el('app').innerHTML='<div class="msg">No shop specified.</div>'; return; }
  // load the region layers first (for the spin-the-globe switcher), then the shop
  fetch(API+'/api/assist/regions').then(function(r){return r.json();}).then(function(j){ _REGIONS=(j&&j.regions)||[]; if(_REGIONS.length && !_REGIONS.find(function(x){return x.region_code===_REGION;})) _REGION=_REGIONS[0].region_code; }).catch(function(){}).then(function(){
    fetch(API+'/api/catalogue/'+encodeURIComponent(BRIDGE)).then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
      .then(function(res){ if(res.status!==200){ el('app').innerHTML='<div class="msg">'+esc((res.j&&res.j.message)||'Shop not found or has no public catalogue.')+'</div>'; return; } _SHOPDATA=res.j; if(res.j.shop&&res.j.shop.storefront_access==='login'){ renderLoginGate(res.j.shop); } else { render(res.j); } })
      .catch(function(e){ el('app').innerHTML='<div class="msg">Could not reach the shop. '+esc(e.message||'')+'</div>'; });
  });
})();
</script>
