          # QA-154 (13 Nov): source scanners with a RATCHET baseline (e2e/scanner-known.json, e2e/lib/known-findings.cjs): today's findings
          # are counted and listed, only a NEW one fails. api-envelope, crm-themes and index-page carry a baseline too but need the api
