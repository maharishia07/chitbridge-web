<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network — Chit &amp; Bridge</title>
<style>
  :root{ --ink:#20303b; --grey:#8a949c; --line:#e7e3d8; --blue:#3F66A6; --paper:#faf8f3; --violet:#6a44a8; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:var(--ink); background:var(--paper); }
  .wrap{ max-width:900px; margin:0 auto; padding:20px 16px 60px; }
  .sg{ font-family:'Space Grotesk',-apple-system,sans-serif; }
  .hd{ display:flex; align-items:center; gap:12px; padding:14px 0 16px; border-bottom:1px solid var(--line); }
  .logo{ width:46px; height:46px; border-radius:13px; background:#efeaf9; display:flex; align-items:center; justify-content:center; font-size:23px; }
  .netname{ font-weight:800; font-size:21px; }
  .meta{ font-size:12px; color:var(--grey); }
  .srch{ display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:#fff; border-radius:11px; padding:9px 12px; margin:16px 0 6px; }
  .srch input{ flex:1; border:0; outline:0; font-size:15px; background:transparent; color:var(--ink); }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px; }
  .chip{ font-size:12px; border:1px solid var(--line); background:#fff; border-radius:20px; padding:5px 12px; cursor:pointer; color:var(--ink); }
  .chip.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .dept{ margin-top:22px; }
  .depthd{ display:flex; align-items:baseline; gap:9px; padding-bottom:7px; border-bottom:2px solid var(--violet); }
  .deptname{ font-weight:800; font-size:17px; }
  .cat{ font-size:11px; font-weight:800; color:var(--violet); text-transform:uppercase; letter-spacing:.5px; margin:14px 0 4px; }
  .prow{ display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px dashed var(--line); }
  .pname{ flex:1; font-size:14px; }
  .pvar{ display:inline-block; font-size:11px; color:var(--grey); border:1px solid var(--line); border-radius:6px; padding:1px 6px; margin-inline-start:6px; }
  .price{ font-weight:700; white-space:nowrap; }
  .msg{ padding:44px 16px; text-align:center; color:var(--grey); }
  .foot{ margin-top:28px; font-size:11px; color:var(--grey); text-align:center; line-height:1.6; }
  a.shoplink{ font-size:11.5px; color:var(--blue); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Loading…</div></div>
<script>
/**
 * network.html — ONE shopfront over many departments.
 *
 * Athi, 2026-08-06: *"a departmental store has N product lines like clothing, medicine and so on. Each department
 * will have its own entity and catalogue and business model. The consumer, when they browse the network, sees all
 * of it and can search."* And: *"we have to introduce grouping, category and so on, so the classification becomes
 * simpler for the person using it."*
 *
 *   DEPARTMENT → CATEGORY → PRODUCT → LINE
 *
 * ⚠️ NO VISIBILITY LOGIC LIVES HERE. The server runs every department through the same buildPublicView the
 * individual storefront uses, so a private or network-only department is simply not in the payload. A page that
 * decided what to hide would be a second opinion on access, and two opinions is how they diverge.
 *
 * Each department keeps its OWN currency — they are shown side by side, never summed. Different currencies is a
 * fact to display, not a total to compute.
 */
var API = (new URLSearchParams(location.search).get('api')) || 'https://chitbridge-api-production.up.railway.app';
var NET = (new URLSearchParams(location.search).get('bridge') || '').trim();
var DATA = null, Q = '', DEPT = null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var SYM = { INR:'₹', USD:'$', AED:'AED ', EUR:'€', GBP:'£' };
function money(amt, ccy){ if(amt==null||amt==='') return '—'; return (SYM[ccy]||((ccy||'')+' '))+amt; }

function render(){
  var app = document.getElementById('app');
  if(!DATA){ app.innerHTML = '<div class="msg">Nothing here.</div>'; return; }
  var n = DATA.network || {};

  var head = '<div class="hd"><div class="logo">🏬</div><div style="flex:1">'
    + '<div class="netname sg">'+esc(n.display_name||'Network')+'</div>'
    + '<div class="meta">'+esc(n.bridge_id||'')+' · '+DATA.departments.length+' department(s) · '+DATA.count+' product(s)'
    + (DATA.currencies && DATA.currencies.length>1 ? ' · prices in '+DATA.currencies.map(esc).join(', ') : '')
    + '</div></div></div>';

  var search = '<div class="srch">🔍 <input id="q" placeholder="Search everything — a product, a category, a department" value="'+esc(Q)+'"></div>';

  // Department filter. A shopper narrows by WHOSE it is before anything else — it is the coarsest and most
  // meaningful cut, and it is the one thing a departmental store already trains people to do.
  var chips = '<div class="chips"><span class="chip'+(DEPT?'':' on')+'" onclick="pick(null)">All</span>'
    + (DATA.departments||[]).map(function(d){
        return '<span class="chip'+(DEPT===d.bridge_id?' on':'')+'" onclick="pick(\''+esc(d.bridge_id)+'\')">'+esc(d.name)+'</span>'; }).join('')
    + '</div>';

  var shown = (DATA.departments||[]).filter(function(d){ return !DEPT || d.bridge_id===DEPT; });
  var body = shown.length ? shown.map(function(d){
    return '<div class="dept"><div class="depthd"><div class="deptname">'+esc(d.name)+'</div>'
      + '<div class="meta">'+d.count+' product(s)'+(d.currency_code?' · '+esc(d.currency_code):'')+'</div>'
      + '<div style="margin-inline-start:auto"><a class="shoplink" href="shop.html?bridge='+encodeURIComponent(d.bridge_id)+'&api='+encodeURIComponent(API)+'">open this shop <span class=arw>→</span></a></div></div>'
      + (d.categories||[]).map(function(c){
          return '<div class="cat">'+esc(c.name)+'</div>'
            + (c.items||[]).map(function(it){
                return '<div class="prow"><div class="pname"><b>'+esc(it.name)+'</b>'
                  + (it.variant?'<span class="pvar">'+esc(it.variant)+'</span>':'')
                  + (it.unit?' <span class="meta">'+esc(it.unit)+'</span>':'')+'</div>'
                  + '<div class="price">'+esc(money(it.price, it.currency))+'</div></div>';
              }).join('');
        }).join('')
      + '</div>';
  }).join('') : '<div class="msg">Nothing matches “'+esc(Q)+'”.</div>';

  var foot = '<div class="foot">Each department sets its own prices and its own way of taking an order.'
    + (DATA.truncated ? '<br>Showing '+DATA.truncated.shown+' of '+DATA.truncated.total+' departments.' : '')
    + '</div>';

  app.innerHTML = head + search + chips + body + foot;

  var q = document.getElementById('q');
  if(q){
    q.oninput = function(){ Q = q.value; clearTimeout(window._t); window._t = setTimeout(load, 220); };
    if(document.activeElement !== q && Q){ q.focus(); q.setSelectionRange(Q.length, Q.length); }
  }
}
function pick(b){ DEPT = b; render(); }

function load(){
  var url = API + '/api/catalogue/network/' + encodeURIComponent(NET) + (Q ? ('?q=' + encodeURIComponent(Q)) : '');
  fetch(url, { cache:'no-store' })
    .then(function(r){ return r.json().then(function(j){ return { status:r.status, j:j }; }); })
    .then(function(res){
      if(res.status !== 200){
        // Identical to a network that does not exist — the same rule the individual shop follows, for the same
        // reason: a distinguishable refusal tells a stranger which ids are real.
        document.getElementById('app').innerHTML = '<div class="msg">This network has nothing to show.</div>';
        return;
      }
      DATA = res.j; render();
    })
    .catch(function(){ document.getElementById('app').innerHTML = '<div class="msg">Could not reach the network.</div>'; });
}

if(!NET) document.getElementById('app').innerHTML = '<div class="msg">Add <code>?bridge=…</code> to see a network.</div>';
else load();
</script>
</body>
</html>
