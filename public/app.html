  AMD.picked=true; AMD.pickedKey=x.key; AMD.resolved=true;
  if(x.unit) AMD.line.unit=x.unit;
  if(x.unit_size) AMD.line.unit_size=x.unit_size;
  if(x.price||x.price===0) AMD.line.price=x.price;
  amdSetRef(x,'human');
  amdView('main');
}
/**
 * The catalogue reference a pick leaves behind.
 *
 * ⚠️ THE ONE PATH WHERE WE ARE CERTAIN MUST NOT BE THE ONE THAT LEAVES NO TRACE. A machine guess records how it
 * matched; a person choosing from a shortlist is the strongest evidence there is of which item was meant, and
 * without this it would have been the only resolution with nothing to show for it.
 *
 * ⚠️ `how` IS NOT COPIED FROM THE ROW. The catalogue row does not know how it came to be on screen — the caller
 * does. Trusting the row would let a fuzzy suggestion a person merely accepted be recorded as if they had picked
 * it deliberately, which is precisely the distinction a dispute turns on.
 */
function amdSetRef(x, how){
  if(!x || (!x.item_id && !x.sku)) { delete AMD.line.ref; return; }
  AMD.line.ref = { ...(x.item_id?{item_id:x.item_id}:{}), ...(x.sku?{sku:x.sku}:{}), how: how||'human',
    ...(x.as_of?{as_of:x.as_of}:{}), ...(x.hash?{hash:x.hash}:{}) };
}
function amdPickUnit(u){ AMD.line.unit=u; amdView('main'); }

const _amdSheet=(title,body,back)=>modal(`<h3 style="margin:0 0 10px">${title}</h3>${body}
  <button class="btn" style="width:100%;margin-top:8px" onclick="amdView('${back||'main'}')">← back</button>`);

/**
 * The price on a candidate row, from EITHER shape.
 *
 * ⚠️ TWO SOURCES, TWO SHAPES, AND ONE OF THEM RENDERS AS "[object Object]". The overlay hands back a plain number
 * plus a currency (money.amountOf did the unwrapping server-side); the line's own seeded candidates carry the raw
 * catalogue price, which is `{amount, currency}` on any migrated row. Rendering the raw object was invisible until
 * the picker started drawing from the line — and the failure would have been a price nobody could read on the one
 * screen whose whole job is comparing prices.
 */
function amdPriceText(x){
  if(!x) return '';
  const amt = (typeof cbAmount==='function') ? cbAmount(x.price) : x.price;
  const has = (typeof cbHasPrice==='function') ? cbHasPrice(x.price) : (x.price!=null);
  if(!has) return '<span style="color:#b0641c;font-size:12px">no price</span>';
  const cur = x.currency || ((typeof cbCurrency==='function') ? cbCurrency(x.price) : null);
  return esc((cur?cur+' ':'') + amt);
}
/**
 * ⭐ amdShortlistHTML(cands, cat, totalItems) — the two or three items a person chooses between.
 *
 * ⚠️ IT WAS CALLED AND NEVER DEFINED, AND NOTHING SAID SO. An earlier attempt to extract it broke the file, the
 * file was reverted, and the call site survived the revert. The ReferenceError then landed inside the catalogue
 * fetch's .then(), where the .catch() swallowed it and repainted the card WITHOUT any choices — so the screen
 * looked like a feature that had never been built, on a page with an empty console. Athi hit it as "why is this
 * box appearing at all". A swallowed error is worse than a crash: a crash gets fixed.
 *
 * ⚠️ RADIOS, NOT BUTTONS. These rows are the SAME product name at different prices, so the variant and the price
 * are the only things that distinguish them and must be the loud part. And the price sits ON the row: the sole
 * reason the reader refused to choose was that the prices differ.
 */
function amdShortlistHTML(cands, cat, totalItems){
  if(!cands || !cands.length) return '';
  const l = AMD.line || {};
  const head = '<div style="font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#8a6d1e;margin-bottom:5px">'
    + (cands.length===1 ? 'closest match' : 'which of these ' + cands.length + '?') + '</div>'
    + '<div style="font-size:11.5px;color:var(--grey);margin-bottom:9px;line-height:1.45">“'
    + esc(AMD.raw || l.particulars || '') + '” answers to '
    + (cat && cat.ambiguous ? ('<b>' + cat.ambiguous + '</b> catalogue names') : 'more than one grade')
    + ' — the prices differ, so nothing was picked for you.</div>';
  const rows = cands.map(function(x, i){
    const on = AMD.pickedKey === x.key;
    const st = x.status && x.status !== 'available';
    return '<label data-testid="amd-cand" style="display:flex;align-items:center;gap:11px;cursor:pointer;padding:11px 12px;'
      + 'margin-bottom:7px;border:1.5px solid ' + (on?'var(--blue)':'var(--line)') + ';border-radius:11px;background:' + (on?'#f2f7fd':'#fff') + '">'
      + '<input type="radio" name="amdcand" ' + (on?'checked':'') + ' onchange="amdPickCand(' + i + ')" '
      + 'style="width:19px;height:19px;flex:none;accent-color:var(--blue)">'
      + '<span style="flex:1;min-width:0">'
      + '<span style="font-size:15px;font-weight:700">' + esc(x.name || x.label || '') + '</span>'
      + (x.variant ? '<span style="font-size:13px;color:#245a9e;font-weight:700"> · ' + esc(x.variant) + '</span>' : '')
      + (st ? '<div style="font-size:11px;color:#b0641c;margin-top:1px">⚠️ ' + esc(x.status_text || x.status) + '</div>' : '')
      + '</span>'
      + '<span style="text-align:right;flex:none">'
      + '<span style="font-size:16px;font-weight:800">' + amdPriceText(x) + '</span>'
      + (x.unit ? '<div style="font-size:11px;color:var(--grey)">per ' + esc(x.unit) + '</div>' : '')
      + '</span></label>';
  }).join('');
  /* ⚠️ NOT "show all 0 items" — on the first paint the shortlist can come from the LINE and the full catalogue has
     not arrived yet. Offering a list of nothing is worse than saying it is still coming. */
  const all = totalItems
    ? '<button class="btn" style="width:100%;margin:2px 0 4px;font-size:13px" onclick="amdView(\'itemall\')">none of these — show all ' + totalItems + ' items</button>'
    : '<div style="font-size:11.5px;color:var(--grey);text-align:center;padding:6px 0">loading the rest of the catalogue…</div>';
  return head + rows + all;
}

  if(AMD.view==='itemall'){

  }

      <button class="btn" style="width:100%;margin-top:4px" onclick="amdView('main')">← back</button>`);
  }

  const wrote=AMD.raw?`<div style="background:#f3f5f8;border-radius:10px;padding:9px 11px;margin-bottom:14px">
      <div style="font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--grey)">they wrote</div>

  const changed=(o.quantity!=null&&Number(o.quantity)!==Number(l.quantity))||(o.particulars&&o.particulars!==l.particulars)||(o.unit&&o.unit!==l.unit);

   *   the catalogue offers several  →  choose one, or remove the line

  const cands0=(cat&&cat.candidates)||[];

  const items0=(cat&&cat.items)||[];
  const money = (n)=> (n===''||n==null||isNaN(Number(n))) ? '' : String(Number(n));
  const total = (Number(l.quantity)>0 && Number(l.price)>0)

async function amendSave(forceNull, reason_code){
  /* ⚠️ THE CHIT COMES FROM THE CARD, NOT FROM UI.sel. Design 2 opens this card without ever setting UI.sel, so
     reading the global would have filed the correction against whatever chit Design 1 last had open — or against
     nothing. A correction landing on the wrong document is not a UI bug. */
  const idx=AMD.idx, id=AMD.chit||UI.sel;
  const removing=(forceNull===null);
  let line=null;
  if(!removing){
    line=Object.assign({}, AMD.line);
    delete line.total; delete line._amended; delete line.asked_as; delete line.raw_phrase;
    if(!line.particulars){ toast('The line needs an item'); return; }
    if(line.quantity!=null && !isFinite(Number(line.quantity))){ toast('Quantity must be a number'); return; }
  }
  try{
    const r=await api('amend',{params:{id},body:{edits:[{ line_index:idx, line_id:AMD.lineId||undefined, line:line,
      /* Default reason when he just fixed a number: the machine got it wrong. That count is what tells us whether
         the reading is improving, so it must not default to a shrug. */
      reason_code: reason_code || (AMD.resolved ? 'ambiguity_resolved' : 'misread_by_ai') }]}});
    closeModal();
    toast(removing?'Removed — it stays on the chit as a record':'Fixed — what they wrote is kept');
    if(r&&r.synonym_candidates&&r.synonym_candidates.length){
      const s=r.synonym_candidates[0];
      /* ⚠️ NOTED, NOT APPLIED. One correction never teaches the catalogue — a synonym promotes only on N
         independent confirmations across entities, and units and grades never promote automatically at all. */
      toast('Noted: “'+s.term+'” may mean “'+s.means+'”');
    }
    /* Whoever opened the card says what to refresh. Design 1 reloads its detail; Design 2 reloads its own. */
    if(typeof AMD.after==='function') await AMD.after();
    else await openChit(id, true);
  }catch(e){ toast(MSG.fail('fix the line', e)); }
}

/* whole-chit attachments (documents, clips not tied to one line) */
/**
 * ⭐⭐ THE TERMS THIS CHIT FROZE — the visible end of "frozen by value when stamped".
 *
 * A chit that carries frozen terms and does not SHOW them is a chit nobody knows carries them. The freeze is
 * only useful if, months later, someone can open the chit and read what was agreed without being told where to
 * look — that is what makes it evidence rather than a database column.
 *
 * ⚠️ IT SHOWS THE VERSION AND THE FREEZE TIME, not just the rules. "10% off" is a claim; "10% off, from version 1
 * of Diwali 10%, frozen 16 Aug" is a claim that can be checked against the shelf — including by the counterparty,
 * who holds this same copy and cannot see the shelf at all.
 *
 * ⚠️ NOTHING IS RESOLVED AT READ TIME. The rules rendered here are the ones ON the chit. Looking them up live
 * would show today's terms on yesterday's agreement, which is precisely the failure the freeze prevents.
 */
function chitTermsBlock(c){
  var bj = (c && (c.business_json || (c.header && c.header.business_json))) || {};
  var terms = bj.frozen_terms || [];
  if (!terms.length) return '';
  return '<div class="itab" style="margin-top:12px">'
    + '<div style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#7a5e22;'
    + 'padding:8px 2px 4px">Terms this chit agreed'
    + (bj.frozen_at ? '<span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--grey)"> · frozen '
        + esc(new Date(bj.frozen_at).toLocaleString()) + '</span>' : '')
    + '</div>'
    + terms.map(function(t){
        var r = t.rules || {};
        /* The rules, said plainly. ⚠️ Whatever the kind carries is shown — enumerating a fixed set of fields
           here would silently hide a condition the offer actually had. */
        var parts = Object.keys(r).map(function(k){ return esc(k) + ' ' + esc(r[k]); });
        return '<div class="ir" style="align-items:flex-start">'
          + '<span><b>' + esc(t.name || t.kind) + '</b>'
          + (t.sub_kind ? ' <span style="font-size:11px;color:var(--grey)">' + esc(t.sub_kind) + '</span>' : '')
          + (parts.length ? '<div style="font-size:12px;color:var(--grey);margin-top:2px">' + parts.join(' · ') + '</div>' : '')
          + '</span>'
          /* ⭐ The version pointer, on screen. This is what someone checks against the shelf when they disagree. */
          + '<span class="qt" style="font-size:11px;color:#9aa3a7">v' + esc(t.version) + '</span></div>';
      }).join('')
    + '<div style="font-size:11px;color:var(--grey);padding:6px 2px 2px">These terms are frozen — editing the '
    + 'definition afterwards does not change this chit.</div></div>';
}

  const atts=UI.attGroups[UI.lbGroup]||[];
  if(UI.lb==null||!atts.length){host.innerHTML="";return;}
  const i=Math.min(UI.lb,atts.length-1),a=atts[i];
  host.innerHTML=`<div class="lbover" onclick="closeLightbox()"><div class="lbbox" onclick="event.stopPropagation()">
    <div class="lbtop"><span>${a.n}</span><span style="font-weight:400;color:#9fb4bf">${i+1} / ${atts.length}</span><span style="margin-left:auto;cursor:pointer" onclick="lbDownload()">⬇</span><span class="x" onclick="closeLightbox()">✕</span></div>
    <div class="lbstage">${attMedia(a,'lb')}</div>
    <div class="lbnav"><button onclick="lbNav(-1)" aria-label="Previous">‹</button><div class="lbdots">${atts.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join("")}</div><button onclick="lbNav(1)" aria-label="Next">›</button></div>
  </div></div>`;
  if(a&&a.id&&!a.src){ attResolveSrc(a); }
}

/* boot */
applyPrefs();
restoreSession();
try{ const _cw=JSON.parse(localStorage.getItem("cb_colw")||"null"); if(_cw) UI.colW=_cw; const _so=JSON.parse(localStorage.getItem("cb_sort")||"null"); if(_so&&_so.sort){ UI.sort=_so.sort; UI.dir=_so.dir||"desc"; } }catch(_){ }
try{ if(SESSION.token){ const _nv=localStorage.getItem("cb_nav"); if(_nv){ UI.nav=_nv; if(_nv==="order")UI.folder="order"; else if(["drafts","trash","archive"].indexOf(_nv)>=0)UI.folder=_nv; else if(_nv==="task")UI.folder="task"; } } }catch(_){ }
if(!location.hash) location.hash=SESSION.token?"#/":"#/login";
route();
</script>
<script>
(function(){ if(!window.CBOffline) return;
  function cbPill(s){ var p=document.getElementById("cbnet"); if(!p){ p=document.createElement("div"); p.id="cbnet"; p.style.cssText="position:fixed;bottom:10px;right:10px;z-index:9998;font:700 11px/1 system-ui,-apple-system,sans-serif;border-radius:999px;padding:5px 11px;border:1px solid #e5e8ee;background:#fff;color:#2f7a45;box-shadow:0 1px 4px rgba(0,0,0,.08)"; (document.body||document.documentElement).appendChild(p); } if(!p) return;
    if(s.online){ p.style.background="#fff"; p.style.color="#2f7a45"; p.textContent = s.pending ? ("\u25CF Online \u00B7 syncing "+s.pending) : "\u25CF Online"; }
    else { p.style.background="#fdf6e9"; p.style.color="#b4832a"; p.textContent = "\u26A0 Offline" + (s.pending ? " \u00B7 "+s.pending+" pending" : ""); } }
  try{ CBOffline.configure({apiBase: CFG.API_BASE, token:function(){return SESSION && SESSION.token;}, onChange:cbPill}); CBOffline.registerSW("/cb-sw.js"); }catch(e){}
})();
</script>
