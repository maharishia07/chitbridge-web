<!doctype html>
<html lang="en" data-tokens="list">
<!-- OWNS  the Standards page: the register (cap-standards.js), Works with (compat.json), Compared with (compare.json), the country matrix — one CBList.
     CALLED BY Home's Standards and Compatibility cards, Settings › Standards, Country setup (?std=country).
     FLOW  load → compat.json · compare.json · country-matrix.json → start(): framePaint → mountList → paintMatrix → a row opens (nextOf)
     CARD 29-qa-test-tooling-ux-locale-and-design-system/standards-page -->
<head>
<meta charset="utf-8">
<script src="/app/device-id.js"></script>
<script src="/config.js"></script>   <!-- HX1: window.CB_API — this deploy's one api address -->
<script src="/app/helpers.js"></script>   <!-- T2-WEBPRIMS: esc · fmtMoney · monthNames — the ONE copy; loads before every script that calls them -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standards</title>
<!-- ⭐ STANDARDS — the laws and standards we follow, and what is still missing (docs/design/standards-page is the design; docs/design/standards/REQUIREMENT.md the ask).
     It replaces Settings › Standards as the place to READ the register; Settings keeps what is about your own settings.
     REUSE (CLAUDE.md rule 1, named in the PR): the list is a CBList mount (app/list-ctl.js) with its filters · groups · sorts · ⚙ columns ·
     opened row · row actions; the data is the register in app/cap-standards.js (STANDARDS · STD_AREAS/PRODUCT_AREAS/KINDS/COUNTRIES/STATUS · STD_CHECKED);
     the two sheets are its stdWhyHTML() and stdRecordHTML(); "Open in the app" is its stdGoto(); the avatar is CBAvatar (app/avatar.js).
     NEW here and nowhere else: the matrix pane (counts by Area · Country · Kind × In force · Partly · Planned), whose every cell IS the list's
     own filter — it sets the unit's Status and Area / Kind / Applies in filters and keeps no filter of its own (one value, one control).
     The page paints the register and counts it; it reads nothing from the API and computes nothing a shop's figure depends on.
     STD-COMPARE (15 Oct 2026): a second saved view, "Compared with" — the country comparison of book-keeping packages, data/compare.json mapped by
     stdCompareRows (cap-standards.js) — a CBList view with its OWN rows (list-ctl.js views[].rows), its own columns, the Applies-in filter as its country
     filter (the shop's country from the avatar's one /me read, `cb:me`; else India) and a Package filter; a row opens its sources; a core-books row
     offers "See it" → the parallel run (accounts.html#compare). #compared-with addresses it. Never a second list or page. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* tokens — docs/design/SYSTEM.md §2, as index.html carries them; a chosen theme (CBAvatar) re-points every one */
:root{
  --page:#FCFAF5; --card:#FFFFFF; --panel:#F3EFE6;
  --line:#DDD6C6; --line-soft:#E6E0D2; --hair:#F0ECE2;
  --ink:#1D1B16; --muted:#5E594D; --faint:#8A8374; --ghost:#A8A295;
  --green:#16693F; --green-d:#0D4A2B; --green-t:#E8F4ED; --green-b:#A9D3BC;
  --amber:#E0A020; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205;
  --red:#C4562F; --red-t:#FBEAE3; --red-b:#E7B9A8; --red-i:#8E3517;
  --blue:#2F74C9; --blue-t:#E4EEFA; --blue-b:#B9D2EF; --blue-i:#174A87;
  /* the names cap-standards.js paints the two sheets with (stdWhyHTML · stdRecordHTML), mapped onto this palette so a chosen theme reaches them */
  --grey:var(--muted); --on-card:var(--ink); --ok-2:var(--green-d); --warn-2:var(--amber-i); --blue-2:var(--blue-i);
  --ok-tint:var(--green-t); --warn-tint:var(--amber-t); --neutral-tint:var(--panel);
  --shadow:0 10px 28px rgba(29,27,22,.16);
}
:root[data-themed]{--green-d:color-mix(in srgb,var(--ok-2,#0D4A2B) 80%,var(--ink))}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui,'IBM Plex Sans',system-ui,sans-serif);font-size:calc(15px * var(--k,1));line-height:1.45}
button,a,select,input{font:inherit;color:inherit} button{cursor:pointer} a{text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* the screen: the matrix pane beside the list — the frame Ledgers uses (a set on the left, the list on the right) */
.app{height:calc(100vh - var(--cbk-h,0px));display:flex;flex-direction:column;container-type:inline-size;container-name:stdpage}   /* the kural band (CBKural) is outside the head: it takes its height off the window, as on CRM and Accounts */
/* the frame CRM and Accounts wear: the pane's head and the list's title row are ONE header line, 56 px */
.brand{height:56px;flex:0 0 auto;padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;flex-shrink:0;border-radius:8px;background:var(--green);color:var(--card,#fff);display:flex;align-items:center;justify-content:center;font-size:16px}
.brand-name{font-family:var(--f-display,'Bricolage Grotesque',sans-serif);font-size:19px;font-weight:700;white-space:nowrap}
.main .cbl .cbl-title{min-height:56px;box-sizing:border-box}
.who .bellslot{display:inline-flex}
.body{flex:1;min-height:0;display:flex}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.main #std_list{flex:1;min-height:0}
/* the title row's right end: ‹ back (phone, list page); the frame carries the rest (SHELL-ONE) */
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who .shop{font-size:calc(13.5px * var(--k,1));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.who .home,.who .back{display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:calc(13.5px * var(--k,1));font-weight:600;white-space:nowrap}
.who .back{display:none}
.who #cb-avatar{display:inline-block;min-width:0;min-height:0}

/* the row: plain words first; what is missing IN the row, never one tap away */
.miss,.lim{display:block;margin-top:3px;font-size:calc(13px * var(--k,1));line-height:1.4}
.miss{color:var(--amber-i)} .lim{color:var(--muted)}
.miss b,.lim b{font-weight:600}
.sn{font-family:var(--f-num,'IBM Plex Mono',monospace);font-size:calc(13px * var(--k,1));font-weight:500}
.kind{display:inline-block;max-width:100%;overflow-wrap:break-word;font-weight:600;font-size:calc(11px * var(--k,1));line-height:1.5;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-inline-start:2px;color:var(--muted);vertical-align:1px;white-space:normal}
.kind.k-law{border-color:var(--ink);color:var(--ink)}
.st{font-weight:600;white-space:nowrap}
.stm{color:var(--muted);font-weight:400;font-family:inherit}
/* ONE LINE per row on a laptop: the columns share the width (weights, set by fit()), a long cell ends in … and the full words are the tooltip and the opened row */
@container list (min-width:780px){   /* wide enough for five shared columns; narrower, the unit's own widths and its sideways scroll */
  #std_list[data-fill] .cbl-grid{min-width:0!important}
  #std_list[data-fill] .cbl-hdr,#std_list[data-fill] .cbl-row{grid-template-columns:var(--std-tpl)!important}
}
@container list (min-width:621px){
  #std_list .cbl-row .cbl-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #std_list .cbl-row .cbl-cell.amt{display:block;text-align:start!important;font-family:inherit!important;font-size:inherit!important;font-weight:400!important}
  #std_list .cbl-row .kind{white-space:nowrap;overflow-wrap:normal}
  #std_list .cbl-hc.r{justify-content:flex-start!important}
  #std_list .cbl-row .kind{margin-inline-start:0}
  /* the two data-file tabs (Works with · Compared with) are short lists with long cells: they wrap — a word breaks only when it is longer than the line, never cut to … (STD-COMPARE) */
  #std_list[data-works] .cbl-row .cbl-cell{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:break-word}
  #std_list[data-works] .cbl-row .st{white-space:normal}
}
/* the list header is frozen: a row scrolled into view clears it, and the "Show more" bar clears the bottom edge */
#std_list .cbl-list{scroll-padding-top:56px;scroll-padding-bottom:56px}
.c-live,.c-live b{color:var(--green)} .c-part,.c-part b{color:var(--amber-i)} .c-plan,.c-plan b{color:var(--muted)}
/* in a row the WORD is ink (AA on every theme and on the zebra stripe); the symbol carries the colour */
.st{color:var(--ink)} .st-live>span{color:var(--green-d,var(--green))} .st-part>span{color:var(--amber-i)} .st-plan>span{color:var(--muted)}
/* STD-COMPARE: ahead · level · behind · not compared — the same rule: the word is ink, the symbol carries the colour; "to confirm" is the amber of a missing line */
.cs-ahead>span{color:var(--green-d,var(--green))} .cs-level>span{color:var(--blue-i)} .cs-behind>span{color:var(--red-i)} .cs-na>span{color:var(--muted)}
.tc{display:inline-block;color:var(--amber-i);font-size:calc(12px * var(--k,1));font-weight:600;letter-spacing:.03em;white-space:nowrap}
.src{display:block;margin-top:2px} .src a{color:var(--blue-i);text-decoration:underline;text-underline-offset:2px;overflow-wrap:break-word}
/* what a row opens to: a label · value sheet, never sideways; a word breaks only when it is longer than the line (a URL), never cut mid-word otherwise */
.sd{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:2px 0 0;max-width:820px;font-size:calc(14px * var(--k,1))}
.sd dt{color:var(--muted);font-size:calc(12px * var(--k,1));letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding-top:2px}
.sd dd{margin:0;line-height:1.5;min-width:0;overflow-wrap:break-word}
.sd code{font-family:var(--f-num,'IBM Plex Mono',monospace);font-size:calc(13px * var(--k,1));background:var(--panel);border-radius:5px;padding:1px 6px}
.exw{color:var(--muted);font-size:calc(13px * var(--k,1));margin-top:4px}
.new{display:inline-block;font-weight:700;font-size:calc(11px * var(--k,1));letter-spacing:.05em;text-transform:uppercase;color:var(--blue-i);background:var(--blue-t);border:1px solid var(--blue-b);border-radius:6px;padding:0 6px;margin-inline-end:6px}

/* ── the matrix pane ── */
.mxp{width:min(360px,34%);flex:0 0 auto;display:flex;flex-direction:column;min-height:0;background:var(--page);border-inline-end:1px solid var(--line)}
.mx-body{flex:1;min-height:0;overflow:auto;padding:12px 14px 20px 16px}
.mx-tools{display:flex;align-items:center;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.mx-lab{font-size:calc(12px * var(--k,1));font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);height:34px}
.seg button{border:0;background:none;padding:0 12px;font-size:calc(13.5px * var(--k,1));border-inline-start:1px solid var(--line-soft)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page);font-weight:600}
.mx{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(52px,max-content));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.mx-r{display:contents}
.mx-r > *{border-bottom:1px solid var(--hair);min-height:44px}
.mx-h > *{background:var(--panel);border-bottom:1.5px solid var(--line);min-height:38px}
.mx-ch{border:0;font-weight:700;font-size:calc(10.5px * var(--k,1));letter-spacing:.02em;min-width:0;text-transform:uppercase;padding:5px 4px;white-space:nowrap;text-align:center;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:1px}
.mx-ch .sym{font-size:calc(14px * var(--k,1))}
.mx-rh{border:0;background:none;text-align:start;padding:6px 8px 6px 10px;min-width:0;overflow-wrap:normal;font-weight:600;display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.mx-sub{font-size:calc(12px * var(--k,1));color:var(--muted);font-weight:400}
.mx-c{border:0;background:none;font-weight:600;font-size:calc(16px * var(--k,1));font-family:var(--f-num,'IBM Plex Mono',monospace);font-variant-numeric:tabular-nums;text-align:center;display:grid;place-items:center}
.mx-c.nil{color:var(--muted);font-weight:400}
.mx .c-live,.mx .c-live b{color:var(--green-d)}   /* the deeper green: on the panel behind the headings, --green falls under AA in Vibrant and Flowery (measured) */
.mx-c:hover,.mx-rh:hover,.mx-ch:hover{background:var(--page)}
.mx-c[aria-pressed="true"],.mx-rh[aria-pressed="true"],.mx-ch[aria-pressed="true"]{background:var(--blue-t);box-shadow:inset 0 0 0 2px var(--blue)}
.mx-all > *{border-bottom:0;border-top:1.5px solid var(--line);background:var(--panel)}
.mx-all .mx-rh{font-weight:700}
.mx-hint{font-size:calc(12px * var(--k,1));color:var(--muted)}
.mx-note{font-size:calc(12.5px * var(--k,1));color:var(--muted);margin:8px 2px 0}
.mx-more{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tbtn{height:34px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:0 10px;font-size:calc(13.5px * var(--k,1));white-space:nowrap}

/* ── the two sheets: a side sheet on a laptop, the whole screen on a phone ── */
dialog.sheet{position:fixed;inset-block:0;inset-inline:auto 0;margin:0;width:min(560px,100%);max-width:100%;height:100%;max-height:100%;padding:0;border:0;border-inline-start:1px solid var(--line);
  background:var(--card);color:var(--ink);box-shadow:var(--shadow);flex-direction:column}
dialog.sheet[open]{display:flex}
dialog.sheet::backdrop{background:color-mix(in srgb,var(--ink) 40%,transparent)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px 20px;border-bottom:1px solid var(--line-soft)}
.sh-head h2{margin:0;font-family:var(--f-display,'Bricolage Grotesque',sans-serif);font-weight:800;font-size:calc(20px * var(--k,1));line-height:1.2}
.sh-x{border:1px solid var(--line);background:var(--card);border-radius:9px;min-width:40px;min-height:40px}
.sh-body{flex:1;overflow:auto;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sh-lead{margin:0 0 12px;line-height:1.55;color:var(--muted);font-size:calc(14px * var(--k,1))}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--page);padding:10px 16px;border-radius:10px;font-size:calc(14px * var(--k,1))}
#toast[hidden]{display:none}
/* the glossary (M41 · T2): a dotted term opens its full name and meaning on a tap, a click or Enter — a phone has no hover */
abbr.gl{text-decoration:underline dotted;text-underline-offset:2px;cursor:help;border-radius:3px}
abbr.gl:focus-visible{outline:2px solid var(--blue,#3F66A6);outline-offset:1px}
.glpop{position:fixed;z-index:70;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--page);padding:9px 12px;border-radius:10px;font-size:calc(13px * var(--k,1));line-height:1.45;box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 30%,transparent)}
.glpop b{display:block;font-weight:700}
.glpop[hidden]{display:none}

/* ── phone: the matrix is the first page, the list the second (‹ back), like Ledgers ── */
@container stdpage (max-width: 640px){
  .body{display:block}
  .mxp{width:100%;height:100%;border-inline-end:0}
  .app[data-view="list"] .mxp{display:none}
  .app[data-view="matrix"] .main{display:none}
  .app[data-view="list"] .main{height:100%}
  .app[data-view="list"] .who .back{display:inline-flex}
  .who .shop{display:none}
  .who .home{width:34px;padding:0;justify-content:center}
  .who .home .hw{display:none}
  /* T3-COMPAT: the view tabs share the title row's second line with ‹ ⌂ 🔔 avatar — a symbol each on a phone (aria-label keeps the words), the tab counts on a laptop only */
  .who .back{width:34px;padding:0;justify-content:center}
  .who .back .bw{display:none}
  #std_list .cbl-vtab .n{display:none}
  /* STD-COMPARE: three tabs — on a phone the title row is TWO lines: "Standards" with ‹ ⌂ 🔔 avatar, then the tabs on a line of their own; the
     "checked" chip moves to the matrix page (mx-checked) so the head stays within its budget (standards-page.cjs: ≤ 35% with a cell chosen) */
  #std_list .cbl-title .cbl-views.in-title{order:3;flex-basis:100%}
  #std_list .cbl-title > .cbl-chip[data-testid="std-checked"]{display:none}   /* the unit's own phone rule carries an id's weight (.cbl:not(#_)); this one carries more */
  .mx-checked{display:block}
  .mx-body{padding:12px 16px 20px}
  .sd{grid-template-columns:minmax(0,1fr);gap:2px}
  .sd dd{margin-bottom:6px}
  dialog.sheet{width:100%}
}
/* STD-COMPARE: with three tabs the title row holds the shop's name only on a wide screen (it is in the avatar's menu too); below 1400 px the row stays one line */
@container stdpage (max-width: 1400px) and (min-width: 641px){ .who .shop{display:none} }
.mx-checked{display:none;font-size:calc(12.5px * var(--k,1));color:var(--muted);margin:8px 2px 0}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app" id="app" data-view="matrix">
  <div id="shell" data-testid="std-shell"></div>   <!-- THE ONE FRAME (SHELL-ONE): mark · Standards · chip · ⌂ Home · bell · avatar -->
  <div class="body">
    <!-- the matrix pane: count by Area · Country · Kind × In force · Partly · Planned. A cell is the list's own filter. -->
    <nav class="mxp" id="mxp" aria-label="Standards matrix"><div class="brand"><div class="logo" aria-hidden="true">&#9776;</div><div class="brand-name">Standards</div></div><div class="mx-body" id="mxBody" data-testid="std-matrix"></div></nav>
    <main class="main" id="main"><div id="std_list" data-testid="std-list"></div></main>
  </div>
</div>
<dialog class="sheet" id="sheet" data-testid="std-sheet" aria-label="Detail"></dialog>
<div id="toast" role="status" hidden></div>

<script src="/engine/screen.js"></script>   <!-- APP_THEMES: the themes the avatar applies (engines screen) -->
<script src="/app/edition.js"></script>   <!-- CBEdition (AX1): an edition that leaves the till out draws no door to it -->
<script src="/app/avatar.js"></script>   <!-- CBAvatar: the one avatar (Profile · Support · Sign out) and the look it owns — nothing of it is drawn here -->
<script>
'use strict';
/* the two helpers cap-standards.js paints with (it calls esc() and tx() from whatever page loads it); this page is English, so tx() is the identity */
function tx(s) {
  return s;
}
/* a row's "go" key → the customer-facing app that is its home. Every other key is a pane of the workshop (app.html) and gets no button
   (IX0: catalogue · locale · appearance · readiness · returns wait for their small app — docs/design/INDEX-NOT-APP.md). */
var HOME = {
  till: '/till.html',
  coassists: '/employees.html',
  task: '/tasks.html',
  network: '/network.html',
  identity: '/know-your-business.html',
  integrations: '/settings.html#/connectors',
  catalogue: '/catalogue.html',
  compare: '/accounts.html#compare',
  catsetup: '/catalogue.html#categories',
  returns: '/accounts.html#gstclose',
  crm: '/crm.html'
}; /* catalogue: CB Catalogue (T3-CATALOGUE) */ /* integrations: CB Settings › Connectors (T3-SETTINGS) */ /* compare: the parallel run, CB Accounts › Books (PR1) — "See it" on a Compared-with core-books row (STD-COMPARE) */
/* the places stdGoto() (cap-standards.js) sends a reader to: a customer home from the map above, never the workshop; a Settings section has no customer page yet */
function navTo(k) {
  if (HOME[k]) location.href = HOME[k];
}
function setSetSec() {}
</script>
<script src="/app/list-ctl.js"></script>   <!-- CBList: the list here is a mount on it -->
<script src="/app/rail-bell.js"></script>   <!-- CBBell.mount: the bell, the same one every app header has -->
<script src="/app/one-person.js"></script>   <!-- CBOnePerson: whose session this browser holds (CBFrame.session) -->
<script src="/app/screen-id.js"></script>   <!-- CBScreenId: this screen's name · code in the bar (SHELL-ONE) -->
<script src="/app/shell.js"></script>   <!-- CBShell: THE ONE HEADER (SHELL-ONE) — mounted into #shell by CBFrame -->
<script src="/app/page-frame.js"></script>   <!-- CBFrame.mount({ host }): the frame every page wears -->
<script src="/app/kural.js"></script>   <!-- CBKural: the kural band, ONE place below the page, the same on every page -->
<script src="/app/cap-standards.js"></script>   <!-- the register, its vocabularies, the two sheets, stdGoto -->
<script src="/app/country-ready.js"></script>   <!-- CBCountryReady (W28c): the Country readiness sheet (?ready=<cc>) — the one unit the Country lab paints too -->
<script>
'use strict';
/* ═══ STANDARDS — the page: the matrix pane, the CBList mount, the two sheets. The register is cap-standards.js. ═══ */
const $ = (id) => document.getElementById(id);
function apiBase() {
  try {
    var f = localStorage.getItem('cb_api_base');
    if (f) return f === 'stage' ? window.CB_API : f;
    var h = location.hostname;
    if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:3000';
  } catch (_) {}
  return window.CB_API;
}
function session() {
  try {
    return JSON.parse(localStorage.getItem('cb_sess') || 'null');
  } catch (_) {
    return null;
  }
}
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem('cb.standards.' + k);
    localStorage.setItem('cb.standards.' + k, v);
  } catch (_) {
    return null;
  }
}
function lab(list, id, at) {
  for (var index = 0; index < list.length; index++) if (list[index][0] === id) return list[index][at == null ? 1 : at];
  return id;

  try {
    history.replaceState(null, '', location.pathname + location.hash);
  } catch (_) {}
}
$('sheet').addEventListener('cancel', (e) => {
  e.preventDefault();
  closeSheet();
});
$('sheet').addEventListener('click', (e) => {
  if (e.target === $('sheet')) closeSheet();
});

document.addEventListener('click', (ev) => {
  var node = ev.target.closest && ev.target.closest('[data-mxr],[data-mxs],[data-sheet],[data-act]');
  if (!node) return;
  if (node.hasAttribute('data-mxr') || node.hasAttribute('data-mxs')) {
    mxPick(node.getAttribute('data-mxr'), node.getAttribute('data-mxs'));
    return;
  }
  if (node.hasAttribute('data-sheet')) {
    openSheet(node.getAttribute('data-sheet'));
    return;
  }
  var a = node.getAttribute('data-act');
  if (a === 'back') $('app').setAttribute('data-view', 'matrix');
  else if (a === 'sheetx') closeSheet();
});

/* ═════ the glossary pop — one element, moved into an open sheet (a modal dialog's top layer would hide it otherwise) ═════ */
function glHide() {
  var node = $('glpop');
  if (node) node.hidden = true;
}
function glShow(el) {
  var g = stdGlossary(el.getAttribute('data-gl'));
  if (!g) return;
  var node = $('glpop');
  if (!node) {
    node = document.createElement('div');
    node.id = 'glpop';
    node.className = 'glpop';
    node.setAttribute('role', 'status');
    node.setAttribute('data-testid', 'std-gloss-pop');
  }
  (el.closest('dialog') || document.body).appendChild(node);
  node.innerHTML = '<b>' + esc(g[0]) + ' — ' + esc(g[1]) + '</b>' + esc(g[2] || '');
  node.hidden = false;
  var r = el.getBoundingClientRect(),
    w = Math.min(320, window.innerWidth - 32),
    left = Math.max(16, Math.min(r.left, window.innerWidth - 16 - w));
  node.style.left = left + 'px';
  node.style.top = (r.bottom + 6 + 80 > window.innerHeight ? Math.max(8, r.top - 6 - node.offsetHeight) : r.bottom + 6) + 'px';
}
/* capture. ⚠️ A ROW'S OWN LINE STAYS A ROW: a tap anywhere on a closed row opens it (on a phone most of a row is abbreviations, and a row that
   would not open is a dead row) — there the term only shows its name on hover. Inside the opened row and the sheets, a tap explains the term. */
function glLive(node) {
  return !!node && (!!node.closest('dl.sd') || !!node.closest('dialog') || !node.closest('[data-testid^="std-row-"]'));
}
document.addEventListener(
  'click',
  (event) => {
    var node = event.target.closest && event.target.closest('abbr.gl');
    if (glLive(node)) {
      event.stopPropagation();
      event.preventDefault();
      glShow(node);
      return;
    }
    if (!(event.target.closest && event.target.closest('#glpop'))) glHide();
  },
  true
);
document.addEventListener(
  'keydown',
  (event) => {
    var node = event.target.closest && event.target.closest('abbr.gl');
    if (glLive(node) && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      event.stopPropagation();
      glShow(node);
    } else if (event.key === 'Escape') glHide();
  },
  true
);
window.addEventListener('scroll', glHide, true);

/* ═══ START ═══ — the register is here already; Compatibility is read first so the list and the matrix hold it from the first paint */
function start() {
  framePaint(); /* the frame first (SHELL-ONE) */
  FILTERS.push(packageFilter()); /* STD-COMPARE: the packages compare.json names, known only now */
  mountList();
  fit();
  paintMatrix();
  watch();
  var q = new URLSearchParams(location.search);
  if (q.get('sheet') === 'why' || q.get('sheet') === 'record') openSheet(q.get('sheet'));
  if (q.get('view') === 'list') $('app').setAttribute('data-view', 'list');
  if (location.hash === '#works-with') openWorks(); /* T3-COMPAT */
  if (location.hash === '#compared-with') openCompared(); /* STD-COMPARE: Home's Compatibility card, the Auditor view */
  /* CPS1: ?std=country (from Country setup) — the list, searched down to the Country Standard's row through the unit's own search box */
  if (q.get('std') === 'country') {
    var node = $('std_list').querySelector('[data-cbl-q]');
    if (node) {
      node.value = 'Country Standard';
      node.dispatchEvent(new Event('input', { bubbles: true }));
    }
    $('app').setAttribute('data-view', 'list');
  }
  /* SET-WALK1 · W28(c): ?ready=<cc> — "Where ChitBridge is for <country>" as the Country readiness sheet (moved OUT of Country setup; CBCountryReady is the one unit) */
  if (q.get('ready')) openReady(String(q.get('ready')).toUpperCase().slice(0, 2));
}
/** W28(c) · Country readiness: one row per product area — ✅ · ⚠️ · ❌ · — from public/data/country-ready.json (CBCountryReady.view), in the page's sheet */
function openReady(countryCode) {
  var sheet = $('sheet'),
    countryName = countryCode;
  try {
    countryName = new Intl.DisplayNames(['en'], { type: 'region' }).of(countryCode) || countryCode;
  } catch (err) {
    if (window.cbQuiet) cbQuiet('standards:openReady', err);
  }
  sheet.innerHTML =
    '<div class="sh-head"><h2 data-testid="std-ready-title">Country readiness · ' +
    esc(countryName) +
    '</h2><button type="button" class="sh-x" data-act="sheetx" data-testid="std-sheet-x" aria-label="Close">✕</button></div>' +
    '<div class="sh-body" data-testid="std-sheet-ready"><div class="hint" data-testid="std-ready-loading">Reading…</div></div>';
  if (!sheet.open) {
    try {
      sheet.showModal();
    } catch (_) {
      sheet.setAttribute('open', '');
    }
  }
  var paintBody = function (html) {
    var body = sheet.querySelector('[data-testid="std-sheet-ready"]');
    if (body) body.innerHTML = html;
  };
  var couldNot = '<div class="hint" data-testid="std-ready-err">Could not read where ChitBridge is for each country.</div>';
  if (!window.CBCountryReady) return paintBody(couldNot);
  CBCountryReady.load().then(
    function (data) {
      var ready = CBCountryReady.view(data, countryCode, countryName);
      paintBody(
        '<p class="hint" data-testid="' +
          (ready.known ? 'std-ready-pack' : 'std-ready-none') +
          '">' +
          esc(ready.known ? ready.pack : ready.none) +
          '</p>' +
          '<dl>' +
          ready.rows
            .map(function (line) {
              return (
                '<dt data-testid="std-ready-row" data-state="' +
                esc(line.state) +
                '"><span aria-hidden="true">' +
                esc(line.sym) +
                '</span> ' +
                esc(line.area) +
                '</dt><dd>' +
                esc(line.line) +
                '</dd>'
              );
            })
            .join('') +
          '</dl>' +
          '<p class="hint"><a href="/settings.html#/country" data-testid="std-ready-back">Country setup ›</a></p>'
      );
    },
    function () {
      paintBody(couldNot);
    }
  );
}
if (window.CBKural) CBKural.mount({ route: 'planning' });
/* three files are read before the first paint: the Compatibility rows (M41), the comparison rows (STD-COMPARE) and the country matrix (CPS1) — each failure is said in its place, never silent */
Promise.all([
  fetch('/data/compat.json', { cache: 'no-store' })
    .then((reply) => {
      if (!reply.ok) throw new Error('HTTP ' + reply.status);
      return reply.json();
    })
    .then(
      (reply) => {
        addCompat(reply);
      },
      () => {
        COMPAT_ERR = 'Compatibility rows could not be read — the standards below are complete; reload to try again.';
      }
    ),
  fetch('/data/compare.json', { cache: 'no-store' })
    .then((response) => {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    })
    .then(
      (json) => {
        addCompare(json);
      },
      () => {
        CMP_ERR = 'The country comparison could not be read (data/compare.json) — the standards are complete; reload to try again.';
      }
    ),
  fetch('/data/country-matrix.json', { cache: 'no-store' })
    .then((reply) => {
      if (!reply.ok) throw new Error('HTTP ' + reply.status);
      return reply.json();
    })
    .then(
      (reply) => {
        if (reply && Array.isArray(reply.rows) && Array.isArray(reply.packs) && reply.counts && reply.missing) CMX = reply;
        else throw new Error('not a matrix');
      },
      (e) => {
        CMX_ERR =
          'The country matrix could not be read (data/country-matrix.json' +
          (e && e.message ? ': ' + e.message : '') +
          ') — reload to try again. The standard itself is chitbridge-engines docs/COUNTRY-STANDARD.md.';
      }
    )
]).then(start);
</script>
</body>
</html>
