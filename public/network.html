<!doctype html>
<html lang="en" data-tokens="list">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network</title>
<!-- ⭐ Network — a store inside someone's network, as a small app (P2): the networks it is in and who its parent is, the stores it can see, the offers its brands
     released to it, and — for a login the server says may design — the Design tab. The FRAME is CBFrame's (the shell header, Home, the avatar, the one sign-in
     window, the foldable kural band — page-frame.js), exactly as crm.html / accounts.html / employees.html; the LISTS are CBList; every write goes through CBAction.
     Screens: app/network-app.js. Which actions are open is the server's answer (GET /api/network-offers → may_design); a refused one is greyed WITH its sentence.
     The Network Lab (network-design.html) sketches on sample data and posts nothing. The public shopfront that used to live here is network-shop.html
     (?bridge=… still lands there). -->
<style>
:root{ --ink:#2a2418; --muted:#5c5240; --line:#e6dcc6; --line-3:#d8ccb0; --surface:#fffdf8; --ground:#fbf6ec; --hover:#f3ead7; --accent:#1f5f5b; --accent-ink:#fbf6ec;
  --green-t:#E8F4ED; --green-b:#A9D3BC; --green-d:#0D4A2B; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205; --red-i:#8E3517;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif; }
*{box-sizing:border-box}
body{margin:0;background:var(--ground,#fbf6ec);color:var(--ink,#2a2418);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
.sub{color:var(--muted,#5c5240);font-size:13px}
#nw{display:flex;flex-direction:column;gap:12px;padding:16px 20px 40px;min-height:60vh}
.nw-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line,#e6dcc6);padding-bottom:8px}
.nw-tab{min-height:40px;padding:0 16px;border:1px solid var(--line-3,#d8ccb0);border-radius:9px;background:transparent;color:var(--ink,#2a2418);font-size:14px;font-weight:600}
.nw-tab.on{background:var(--accent,#1f5f5b);border-color:var(--accent,#1f5f5b);color:var(--accent-ink,#fbf6ec)}
.nw-tab.no{opacity:.6}
.nw-body{display:flex;flex-direction:column;gap:12px;flex:1}
.nw-nets{display:flex;flex-wrap:wrap;gap:10px}
.nw-net{border:1px solid var(--line,#e6dcc6);border-radius:12px;background:var(--surface,#fffdf8);padding:10px 14px;min-width:220px}
.nw-list{flex:1;min-height:420px;display:flex;flex-direction:column}
.nw-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 0}
.nw-why{padding:10px 14px;border:1px solid var(--amber-b,#EFD39A);background:var(--amber-t,#FDF3DC);color:var(--amber-i,#7A5205);border-radius:10px;font-weight:600}
.nw-tree{border:1px solid var(--line,#e6dcc6);border-radius:12px;background:var(--surface,#fffdf8);padding:10px 14px}
.nw-node{padding:5px 0;border-bottom:1px dashed var(--line,#e6dcc6)}
.nw-out{min-height:20px;margin:6px 0;font-weight:600;color:var(--green-d,#0D4A2B)}
.nw-out[data-tone="error"]{color:var(--red-i,#8E3517)}
.nw-breaks{margin:0;padding-inline-start:20px}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border:1px solid var(--accent,#1f5f5b);border-radius:9px;background:var(--accent,#1f5f5b);color:var(--accent-ink,#fbf6ec);font-size:14px;font-weight:600;text-decoration:none}
.act.quiet{background:transparent;border-color:var(--line-3,#d8ccb0);color:var(--ink,#2a2418)}
.act[disabled],.act[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.act[data-action-state="busy"]{opacity:.7}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line-3,#d8ccb0);background:var(--surface,#fffdf8);font-size:12px;font-weight:600}
.tag.green{background:var(--green-t,#E8F4ED);border-color:var(--green-b,#A9D3BC);color:var(--green-d,#0D4A2B)}
.tag.amber{background:var(--amber-t,#FDF3DC);border-color:var(--amber-b,#EFD39A);color:var(--amber-i,#7A5205)}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line-3,#d8ccb0);border-radius:14px;color:var(--muted,#5c5240);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .t{font-family:var(--serif);font-size:19px;color:var(--ink,#2a2418);font-weight:700}
.loadwrap{display:flex;align-items:center;gap:10px;color:var(--muted,#5c5240);padding:18px 0}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line-3,#d8ccb0);border-top-color:var(--accent,#1f5f5b);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
dialog.sheet{border:1px solid var(--line,#e6dcc6);border-radius:14px;padding:20px;width:min(520px,96vw);max-height:92vh;overflow:auto;background:var(--surface,#fffdf8);color:var(--ink,#2a2418);position:relative}
dialog.sheet::backdrop{background:var(--scrim,rgba(42,36,24,.4))}
dialog.sheet h2{margin:0 0 4px;font-family:var(--serif);font-size:21px}
dialog.sheet .mx{position:absolute;right:8px;top:8px;border:0;background:transparent;font-size:18px;color:inherit}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:min(520px,92vw)}
#toast .toast{background:var(--ink,#2a2418);color:var(--ground,#fbf6ec);padding:12px 16px;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<div id="nw" data-testid="nw-screen"><div class="loadwrap"><span class="spin"></span> Loading</div></div>
<div id="toast"></div>
<script src="/engine/screen.js"></script>
<script src="/app/avatar.js"></script>
<script src="/engine/signin.js"></script>
<script src="/app/signin-ui.js"></script>
<script src="/app/one-person.js"></script>
<script src="/app/accounts-shell.js"></script>
<script src="/app/rail-bell.js"></script>
<script src="/app/shell.js"></script>
<script src="/app/page-frame.js"></script>
<script src="/app/list-ctl.js"></script>   <!-- CBList: the one list control -->
<script src="/app/kural.js"></script>   <!-- CBKural: the one kural footer band; CBFrame hands it to the shell -->
<script src="/app/network-app.js"></script>
<script>
'use strict';
(function () {
  var q = new URLSearchParams(location.search);
  /* the old public link (network.html?bridge=…) keeps working: the shopfront moved to network-shop.html */
  if (q.get('bridge')) { location.replace('/network-shop.html' + location.search); return; }
  var API = q.get('api') || (window.CBShell && CBShell.apiBase && CBShell.apiBase()) || 'https://chitbridge-api-production.up.railway.app';
  var host = document.getElementById('nw');
  var frame = CBFrame.mount({ app: 'network', kural: 'network', work: host });
  if (!frame.token) { host.innerHTML = '<div class="empty" data-testid="nw-signin"><div class="t">Sign in above</div></div>'; return; }
  CBNetworkApp.mount(host, { token: frame.token, base: API, onEnded: function () { CBFrame.ended(); } });
})();
</script>
</body>
</html>
