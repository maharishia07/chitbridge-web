<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test lab · Chit &amp; Bridge</title>
<!--
  THE TEST BOARD — the test cases as a thing you can tap, not a PDF you cannot write on.

  Athi, 2026-09-11: "in the PDF we cannot update pass or fail. Can we have a simple application from our framework itself to create the
  test cases and update the status and the result, so we know that each of the test cases passed and who has tested? And we can always
  append the use case. Also we can qualify with engine, transport, web, capability etc." Then: "pass/fail status for each run — unit test /
  T1 / T2 / regression and so on, manual and so on."

  ⭐⭐ NOTHING NEW WAS INVENTED UNDERNEATH IT. A test CASE is a `definition` of kind 'testcase' — authored, named, versioned, entity-isolated
  by the same RLS as everything else — because it is the same kind of thing as a tax slab: a rule somebody declared that has to be quotable
  months later against a result it produced. Only the RESULT ledger is new (b219), for the same reason the points ledger was: results
  accumulate and a definition does not.

  ⭐ AND THE RESULTS SPEAK A STANDARD. POST /api/testing/results/junit takes JUnit XML verbatim, which Playwright emits with one config line
  and which Kiwi TCMS, TestRail and Allure all import. The automated suite and a person writing on a phone land on the same board, and
  nothing here is a format anyone else would have to re-implement.

  ⚠️ APPEND-ONLY. Tapping Pass twice writes two rows; the latest wins and the earlier one stays readable. That is deliberate: "failed on
  Thursday, passed on Friday" is the useful sentence, and a flaky case shows as pass/fail/pass instead of collapsing into whatever was
  tapped last.
-->
<style>
  :root{
    --font-ui:Inter,system-ui,-apple-system,sans-serif;
    --ink:#20303b; --ink-2:#3a4048; --grey:#8a949c; --grey-2:#545A61;
    --line:#e7e3d8; --line-2:#efece4; --paper:#faf8f3; --card:#fff;
    --blue:#3F66A6; --blue-tint:#E9F0FA;
    --ok:#2c7a43; --ok-tint:#e6f4ea;
    --bad:#b4453f; --bad-tint:#fbeceb;
    --warn:#8a5a1e; --warn-tint:#fbf3e3;
    --neutral-tint:#EEF1F5;
    --fs-1:11px; --fs-2:12.5px; --fs-3:14px; --fs-4:16px; --fs-5:20px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font-ui); color:var(--ink); background:var(--paper);
        font-size:var(--fs-3); font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }

  header{ position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); padding:9px 14px; }
  .htop{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  h1{ font-size:var(--fs-4); margin:0; }
  .sub{ color:var(--grey-2); font-size:var(--fs-2); }
  .tally{ display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
  .t{ font-size:var(--fs-1); padding:2px 8px; border-radius:99px; border:1px solid var(--line); background:var(--paper); white-space:nowrap; }
  .t b{ font-size:var(--fs-2); }
  .t.pass{ background:var(--ok-tint); border-color:#bfe0c9; color:var(--ok); }
  .t.fail{ background:var(--bad-tint); border-color:#eccbc9; color:var(--bad); }
  .t.blocked{ background:var(--warn-tint); border-color:#e8d7ae; color:var(--warn); }
  .t.todo{ background:var(--neutral-tint); color:var(--grey-2); }

  .bar{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 14px;
        border-bottom:1px solid var(--line); background:var(--card); }
  .bar label{ font-size:var(--fs-1); color:var(--grey-2); text-transform:uppercase; letter-spacing:.06em; }
  select, input[type=text]{ font:inherit; font-size:var(--fs-2); padding:5px 7px; border:1px solid var(--line);
        border-radius:7px; background:#fff; color:var(--ink); min-height:32px; }
  input[type=text]{ min-width:120px; flex:1 1 140px; }
  .btn{ font:inherit; font-size:var(--fs-2); padding:6px 11px; border:1px solid var(--line); border-radius:8px;
        background:var(--card); color:var(--ink); cursor:pointer; white-space:nowrap; min-height:32px; }
  .btn.pri{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .btn:focus-visible, select:focus-visible, input:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }

  main{ padding:12px 14px 80px; max-width:980px; margin:0 auto; }
  .mod{ margin:0 0 18px; }
  .modhead{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 7px; }
  .modhead h2{ font-size:var(--fs-3); margin:0; letter-spacing:.02em; }
  .modhead .k{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-1); color:#fff; background:var(--grey-2);
        border-radius:5px; padding:1px 6px; }
  .modhead .intro{ flex:1 1 100%; color:var(--grey-2); font-size:var(--fs-1); line-height:1.5; }

  .case{ background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; }
  .case.pass{ border-left:4px solid var(--ok); }
  .case.fail{ border-left:4px solid var(--bad); }
  .case.blocked{ border-left:4px solid var(--warn); }
  .case.skipped{ border-left:4px solid var(--grey); }
  .chead{ display:flex; gap:9px; align-items:flex-start; padding:9px 11px; cursor:pointer; }
  .chead .key{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-1); font-weight:700; color:var(--grey-2);
        background:var(--neutral-tint); border-radius:5px; padding:2px 6px; white-space:nowrap; }
  .chead .ttl{ flex:1; min-width:0; font-weight:600; line-height:1.35; font-size:var(--fs-2); }
  .chead .ttl .last{ display:block; font-weight:400; color:var(--grey-2); font-size:var(--fs-1); margin-top:3px; }
  .chead .ttl .last.fail{ color:var(--bad); }
  .pri{ font-size:var(--fs-1); color:var(--grey-2); white-space:nowrap; }
  .lay{ font-size:var(--fs-1); border:1px solid var(--line); border-radius:99px; padding:1px 7px; color:var(--grey-2);
        background:var(--paper); white-space:nowrap; }
  /* ⭐ the kind reads at a glance, and the WIDTH of the ladder is the point: acceptance is the darkest because
     it is the only evidence a customer would recognise; support is the faintest because it proves nothing. */
  .lay.ty{ font-weight:700; letter-spacing:.02em; }
  .lay.ty.acceptance { color:#1d4ed8; border-color:#c3d4fb; background:#f2f6ff; }
  .lay.ty.system     { color:#0f766e; border-color:#bfe0dc; background:#f1faf8; }
  .lay.ty.integration{ color:#7c4a03; border-color:#e8d7ae; background:#fdf8ee; }
  .lay.ty.unit       { color:#3f6212; border-color:#d3e3b8; background:#f6faf0; }
  .lay.ty.static     { color:#5b5b66; border-color:var(--line); background:var(--paper); }
  .lay.ty.support    { color:var(--grey-2); border-style:dashed; background:transparent; }

  .body{ padding:0 11px 11px; border-top:1px solid var(--line-2); }
  /* ⭐ the four project-manager facts, side by side and wrapping — a grid so the labels line up down the page */
  .facts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px;
          background:var(--line-2); border:1px solid var(--line-2); margin:9px 0 2px; }
  .facts > div{ background:var(--paper); padding:7px 9px; }
  .facts dt{ font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.06em; color:var(--grey-2);
             font-weight:700; margin:0 0 2px; }
  .facts dd{ margin:0; font-size:var(--fs-1); color:var(--ink-2); line-height:1.5; }
  .facts dd.mono{ font-family:ui-monospace,Consolas,monospace; }
  .facts dd i.dim{ color:var(--grey-2); }
  .meta{ font-size:var(--fs-1); color:var(--grey-2); margin:8px 0; line-height:1.6; }
  .meta b{ color:var(--ink-2); }
  table.steps{ width:100%; border-collapse:collapse; font-size:var(--fs-2); margin:6px 0 2px; }
  table.steps th{ text-align:left; font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.06em;
        color:var(--grey-2); border-bottom:1px solid var(--line); padding:4px 6px; font-weight:700; }
  table.steps td{ border-bottom:1px solid var(--line-2); padding:6px; vertical-align:top; line-height:1.45; }
  table.steps td.n{ width:22px; color:var(--grey); font-size:var(--fs-1); }
  .note{ font-size:var(--fs-1); color:var(--grey-2); line-height:1.55; background:var(--paper);
        border:1px solid var(--line-2); border-radius:8px; padding:7px 9px; margin:8px 0 0; }
  .acts{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .acts .btn.pass{ background:var(--ok-tint); border-color:#bfe0c9; color:var(--ok); font-weight:700; }
  .acts .btn.fail{ background:var(--bad-tint); border-color:#eccbc9; color:var(--bad); font-weight:700; }
  .acts .btn.blocked{ background:var(--warn-tint); border-color:#e8d7ae; color:var(--warn); font-weight:700; }
  .acts input[type=text]{ flex:1 1 100%; }
  .hist{ font-size:var(--fs-1); color:var(--grey-2); margin-top:8px; line-height:1.6; }
  .hist .r{ display:block; }

  .say{ padding:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; line-height:1.6; }
  .say b{ display:block; margin-bottom:5px; }
  /* ── the summary: coverage by area, and the sittings ── */
  .tabs{ display:flex; gap:4px; }
  .tabs button{ font:inherit; font-size:var(--fs-2); padding:6px 13px; border:1px solid var(--line);
        background:var(--card); color:var(--grey-2); border-radius:8px; cursor:pointer; min-height:32px; }
  .tabs button.on{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  table.sum{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line);
        border-radius:11px; overflow:hidden; font-size:var(--fs-2); margin-bottom:22px; }
  table.sum th{ text-align:start; font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.06em;
        color:var(--grey-2); font-weight:700; padding:9px 11px; background:var(--neutral-tint);
        border-bottom:1px solid var(--line); white-space:nowrap; }
  table.sum td{ padding:9px 11px; border-bottom:1px solid var(--line-2); vertical-align:middle; }
  table.sum tr:last-child td{ border-bottom:0; }
  table.sum td.num, table.sum th.num{ text-align:end; width:1%; white-space:nowrap; }
  table.sum .area{ font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:var(--fs-1); }
  table.sum .sub{ display:block; color:var(--grey-2); font-size:var(--fs-1); font-weight:400; }
  table.sum tr.clickable{ cursor:pointer; }
  table.sum tr.clickable:hover td{ background:var(--blue-tint); }
  /* ⭐ ONE BAR, READ AT A GLANCE. A row of numbers is arithmetic; a bar is a state. */
  .bar-cov{ display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--neutral-tint);
        min-width:90px; }
  .bar-cov i{ display:block; height:100%; }
  .big{ color:var(--ok); font-weight:700; } .bad{ color:var(--bad); font-weight:700; }
  .warnn{ color:var(--warn); font-weight:700; } .dim{ color:var(--grey-2); }
  .scroll{ overflow-x:auto; }

  /* ── the completion report ── */
  .rep h2{ font-size:var(--fs-4); margin:26px 0 4px; letter-spacing:-.01em; }
  .rep h2:first-of-type{ margin-top:6px; }
  .rep .num-s{ font-family:ui-monospace,Menlo,monospace; color:var(--grey-2); font-size:var(--fs-2);
        margin-inline-end:7px; }
  .rep .sec{ background:var(--card); border:1px solid var(--line); border-radius:11px;
        padding:14px 17px; margin:0 0 14px; }
  /* ⭐ THE WHOLE POINT OF THE STYLING: a measured section and a judgement section must not look alike. */
  .rep .sec.ask{ background:var(--warn-tint); border-color:#e8d7ae; }
  .rep .tag{ display:inline-block; font-size:var(--fs-1); font-weight:700; letter-spacing:.07em;
        text-transform:uppercase; border-radius:5px; padding:2px 8px; margin-bottom:9px; }
  .rep .tag.m{ background:var(--ok-tint); color:var(--ok); }
  .rep .tag.a{ background:#f3e2bd; color:var(--warn); }
  .rep .kv{ display:grid; grid-template-columns:auto 1fr; gap:5px 16px; font-size:var(--fs-2); }
  .rep .kv dt{ color:var(--grey-2); white-space:nowrap; }
  .rep .kv dd{ margin:0; }
  .rep .big-n{ display:flex; gap:20px; flex-wrap:wrap; margin:4px 0 12px; }
  .rep .big-n div{ min-width:74px; }
  .rep .big-n b{ display:block; font-size:26px; line-height:1.15; letter-spacing:-.02em; }
  .rep .big-n span{ font-size:var(--fs-1); color:var(--grey-2); text-transform:uppercase; letter-spacing:.06em; }
  .rep .inc{ border-top:1px solid var(--line-2); padding:9px 0; font-size:var(--fs-2); }
  .rep .inc:first-of-type{ border-top:0; }
  .rep .inc .k2{ font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:var(--fs-1); }
  .rep .caveat{ margin-top:9px; font-size:var(--fs-2); line-height:1.55; }
  .rep .caveat li{ margin-bottom:4px; }
  .rep .sign{ display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:18px; }
  .rep .sign div{ border-top:1px solid var(--ink); padding-top:5px; font-size:var(--fs-1); color:var(--grey-2); }
  /* ⚠️ a report is printed and filed. Everything that is a CONTROL must not be on the paper. */
  @media print{
    body{ background:#fff; }
    header, .bar, .noprint{ display:none !important; }
    main{ padding:0; max-width:none; }
    .rep .sec{ break-inside:avoid; box-shadow:none; }
    .rep h2{ break-after:avoid; }
  }

  /* ── charts: inline SVG, theme tokens, no library ── */
  .charts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-bottom:22px; }
  .chart{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:14px 16px 12px; }
  .chart h3{ font-size:var(--fs-3); margin:0 0 2px; font-weight:600; letter-spacing:-.01em; }
  .chart .ask{ font-size:var(--fs-1); color:var(--grey-2); margin:0 0 11px; line-height:1.5; }
  .chart svg{ display:block; width:100%; height:auto; overflow:visible; }
  .chart .none{ font-size:var(--fs-2); color:var(--grey-2); padding:10px 0; }
  .legend{ display:flex; flex-wrap:wrap; gap:9px 15px; margin-top:11px; font-size:var(--fs-1); color:var(--grey-2); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }
  @media print{ .chart{ break-inside:avoid; } }

  /* ── reliability: what can be believed, as opposed to what should be tested ── */
  .verdict{ font-size:var(--fs-1); font-weight:700; white-space:nowrap; }
  .verdict.drift{ color:var(--bad); }
  .verdict.broke{ color:var(--warn); }
  .verdict.settled{ color:var(--ok); }
  .verdict.once{ color:var(--grey-2); font-weight:400; }
  /* ⭐ the sequence itself, because "3 failures" and "failed every other run" look identical as a number */
  .seq{ display:inline-flex; gap:2px; vertical-align:middle; }
  .seq i{ width:7px; height:14px; border-radius:2px; display:inline-block; }
  .why-note{ background:var(--card); border:1px solid var(--line); border-radius:11px;
        padding:13px 16px; margin-bottom:16px; font-size:var(--fs-2); line-height:1.6; color:var(--ink-2); }
  .why-note b{ color:var(--ink); }

  /* ── try it: run a pure function on your own input ── */
  .try{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:14px 16px;
        margin-bottom:12px; }
  .try h3{ font-size:var(--fs-3); margin:0 0 3px; font-weight:600; }
  .try .sig{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-1); color:var(--grey-2);
        margin-bottom:9px; }
  .try .row{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .try input[type=text]{ flex:1 1 220px; font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-2); }
  .try .out{ margin-top:10px; padding:10px 12px; border-radius:8px; background:var(--paper);
        border:1px solid var(--line-2); font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-2);
        white-space:pre-wrap; word-break:break-word; line-height:1.55; }
  .try .out.bad{ background:var(--bad-tint); border-color:#eccbc9; color:var(--bad); }
  .try .eg{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .try .eg button{ font:inherit; font-size:var(--fs-1); padding:3px 9px; border:1px solid var(--line);
        background:var(--paper); border-radius:99px; cursor:pointer; color:var(--ink-2);
        font-family:ui-monospace,Menlo,monospace; }
  .try .eg button:hover{ background:var(--blue-tint); border-color:var(--blue); }
  .gone{ color:var(--grey-2); font-size:var(--fs-2); }

  .hide{ display:none !important; }
  @media (max-width:560px){ .chead{ flex-wrap:wrap; } .pri{ order:3; } }
</style>
</head>
<body>

<header>
  <div class="htop">
    <h1>Test lab</h1>
    <span class="sub" id="who">…</span>
    <span class="sub" style="opacity:.75">· cases, results and the completion report — ISO/IEC/IEEE 29119-3</span>
  </div>
  <div class="tally" id="tally"></div>
</header>

<div class="bar">
  <!-- ⭐ Athi, 2026-09-11: "where can we see the summary result?" — the totals endpoint existed and nothing
       rendered it. An endpoint with no screen is a number nobody reads. -->
  <div class="tabs">
    <!-- ⭐ Athi: "we name it as per standard, reference the standard where possible?" — each tab says which
         of 29119-3's document types it corresponds to, so a reader can look ours up in theirs rather than
         learning our words. ⚠️ Only where it genuinely corresponds: the Summary is OURS, because 29119-3's
         Test Status Report is written DURING execution against a plan and we have no plan. -->
    <button id="t_cases" class="on" onclick="setView('cases')"
      title="Test Case Specification (ISO/IEC/IEEE 29119-3)">Cases</button>
    <button id="t_sum" onclick="setView('summary')"
      title="Coverage and the execution log — ours, not a named document of the standard">Summary</button>
    <button id="t_rep" onclick="setView('report')"
      title="Test Completion Report (ISO/IEC/IEEE 29119-3)">Report</button>
    <button id="t_rel" onclick="setView('reliability')"
      title="How often each test has run, and how often it changed its answer">Reliability</button>
    <button id="t_try" onclick="setView('try')"
      title="Run a pure engine function on your own input, here, with no server">Try it</button>
  </div>
</div>
<div class="bar">
  <label for="f_mod">Module</label>
  <select id="f_mod" onchange="paint()"><option value="">All</option></select>
  <label for="f_state">Show</label>
  <select id="f_state" onchange="paint()">
    <option value="">Everything</option>
    <option value="todo">Not yet tested</option>
    <option value="fail">Failed or blocked</option>
    <option value="pass">Passed</option>
  </select>
  <!--
    ⭐⭐ Athi, 2026-09-11: "say it is unit, integration and so on."
    ⚠️ THE LEVELS ARE NOT INTERCHANGEABLE AND THE TITLES SAY SO. A green unit test and a green system test are
    not the same amount of evidence, and the commonest way a coverage figure lies is by adding them together.
  -->
  <label for="f_type">Kind</label>
  <select id="f_type" onchange="paint()">
    <option value="">Every kind</option>
    <option value="acceptance" title="A person deciding whether it does the job — the only kind that finds &quot;correct but useless&quot;">Acceptance · written for a person</option>
    <option value="unit" title="One module on its own. Proves that function, and nothing about the product.">Unit</option>
    <option value="integration" title="Several of our pieces wired together — a route over a stubbed database.">Integration</option>
    <option value="system" title="The whole product: a real browser, a live API, or a real database.">System</option>
    <option value="static" title="Reads the source and judges the text. Nothing is executed — real evidence, of a different thing.">Static · reads the code</option>
    <option value="support" title="Not a test. A fixture or harness other tests stand on.">Support · not a test</option>
  </select>
  <!--
    ⭐⭐ AREA IS NOT MODULE. A test SITS in a module and REACHES into areas — api, middleware, engine, web,
    database, connector. ⚠️ It is a visible control rather than hidden state set by the summary: an invisible
    filter is a board quietly showing a third of itself while looking complete.
  -->
  <label for="f_area">Reaches</label>
  <select id="f_area" onchange="paint()">
    <option value="">Anywhere</option>
    <option value="api">API</option>
    <option value="middleware">Middleware</option>
    <option value="engine">Engine</option>
    <option value="web">Web</option>
    <option value="database">Database</option>
    <option value="connector">Connector</option>
  </select>
  <label for="f_auto">By</label>
  <select id="f_auto" onchange="paint()">
    <option value="">Anyone</option>
    <option value="auto">The machine</option>
    <option value="human">A person</option>
  </select>
  <input type="text" id="f_q" placeholder="Search a case…" oninput="paint()">
</div>

<div class="bar">
  <label for="f_kind">Recording as</label>
  <select id="f_kind" onchange="saveRun()">
    <option value="manual">Manual</option>
    <option value="t0">T0 · guard</option>
    <option value="t1">T1 · one spec</option>
    <option value="t2">T2 · scoped</option>
    <option value="t3">T3 · full</option>
    <option value="unit">Unit</option>
    <option value="regression">Regression</option>
  </select>
  <input type="text" id="f_run" placeholder="This sitting, e.g. v2.0 before release" oninput="saveRun()">
  <label for="f_who">Tester</label>
  <!-- ⚠️ THE ENTITY NAME IS NOT AN ANSWER TO "who tested this". The server always records the identity off
       the token, which cannot be typed in and is the evidence; this is who was at the keyboard, which only
       matters — and only differs — when one login is shared. Kept on this device. -->
  <input type="text" id="f_who" placeholder="who is at the keyboard" oninput="saveWho()" style="max-width:150px">
  <button class="btn" onclick="newRun()" title="Start a fresh run — the results already recorded stay where they are">New run</button>
  <span style="flex:1"></span>
  <!-- ⭐ Gherkin: the spec clause and its cases as ONE text. The Feature description IS the clause, so a
       file that goes into the repository carries both arms of the V and neither can be edited alone. -->
  <button class="btn" onclick="exportFeature()" title="Download the cases as a .feature file">Export .feature</button>
  <button class="btn" onclick="document.getElementById('f_file').click()" title="Load a .feature file — the Feature description becomes the spec clause">Import .feature</button>
  <input type="file" id="f_file" accept=".feature,.txt" style="display:none" onchange="importFeature(this)">
</div>

<!--
  ⭐⭐⭐ THE ENGINES, LOADED INTO THE LAB SO A PERSON CAN RUN THEM.

  Athi, 2026-09-11: "for automation test cases, or the function which does not require any database info, we
  have to provide an execute function to run the test there itself and show the result — or if we need input,
  provide an option to type input and test the result. So each function is validated by a human and confirmed."

  ⚠️ THESE ARE PURE. Every one is Tier A — no database, no network, no session. That is exactly why they can
  run in a page: the answer a person sees here is the SAME answer the counter gets, from the same file, with
  no server in between to blame.

  ⚠️ A guard proves a function against the inputs somebody thought of. This lets a person try the input they
  actually have — which is the half no test suite can cover, because the suite has never met their data.
-->
<script src="/engine/money.js"></script>
<script src="/engine/locale.js"></script>
<script src="/engine/docnumber.js"></script>
<script src="/engine/nums.js"></script>
<script src="/engine/tax.js" onerror="void 0"></script>
<script src="/engine/pricing.js" onerror="void 0"></script>
<script src="/engine/offers.js" onerror="void 0"></script>
<script src="/engine/rewards.js" onerror="void 0"></script>
<script src="/engine/lots.js" onerror="void 0"></script>
<script src="/engine/gs1.js" onerror="void 0"></script>
<script src="/engine/search.js" onerror="void 0"></script>

<main id="main"><div class="say">Reading the board…</div></main>

<script>
var API = (new URLSearchParams(location.search).get('api')) || 'https://chitbridge-api-production.up.railway.app';

/**
 * ⚠️ THE SESSION COMES OFF DISK, exactly as the offer lab reads it. This page is a tool for somebody already
 * signed in on this browser; asking them to sign in twice would be asking for a second credential to reach data
 * the first one already opens.
 */
function sess(){ try { return JSON.parse(localStorage.getItem('cb_sess') || 'null'); } catch (_) { return null; } }

var CASES = [], LAST = {}, OPEN = {}, RUN = null, STALE = {};

/* ── the run this sitting belongs to ─────────────────────────────────────────────────────────────────────────
 * ⭐ IT SURVIVES A RELOAD. A run is a sitting, and a sitting includes closing the tab to go and look at
 * something. Losing the run id on refresh would scatter one afternoon's testing across nine "runs". */
/** who is at the keyboard — a courtesy beside the identity, not a substitute for it */
function who(){ try { return localStorage.getItem('cb_tester') || ''; } catch (_) { return ''; } }
function saveWho(){
  var v = (document.getElementById('f_who').value || '').trim().slice(0, 60);
  try { if (v) localStorage.setItem('cb_tester', v); else localStorage.removeItem('cb_tester'); } catch (_) {}
}

function loadRun(){
  try { RUN = JSON.parse(localStorage.getItem('cb_testrun') || 'null'); } catch (_) { RUN = null; }
  if (!RUN || !RUN.id) RUN = { id: uuid(), label: '', kind: 'manual' };
  document.getElementById('f_run').value = RUN.label || '';
  document.getElementById('f_kind').value = RUN.kind || 'manual';
  document.getElementById('f_who').value = who();
}
function saveRun(){
  RUN.label = document.getElementById('f_run').value.trim();
  RUN.kind = document.getElementById('f_kind').value;
  try { localStorage.setItem('cb_testrun', JSON.stringify(RUN)); } catch (_) {}
}
function newRun(){
  RUN = { id: uuid(), label: '', kind: document.getElementById('f_kind').value };
  document.getElementById('f_run').value = '';
  saveRun();
  say('Started a new run. Results already recorded are untouched — nothing here is ever overwritten.');
}
function uuid(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]; }); }

/** ⚠️ "3 minutes ago" is what a tester wants; a timestamp is what a log wants. */
function ago(iso){
  if (!iso) return '';
  var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s/60) + ' min ago';
  if (s < 172800) return Math.round(s/3600) + ' h ago';
  return new Date(iso).toLocaleDateString();
}

async function call(path, opts){
  var s = sess();
  if (!s || !s.token) throw new Error('Sign in to the app on this browser first, then reload this page.');
  var o = opts || {};
  var r = await fetch(API + path, {
    method: o.method || 'GET',
    headers: Object.assign({ Authorization: 'Bearer ' + s.token }, o.body ? { 'Content-Type': 'application/json' } : {}),
    body: o.body ? JSON.stringify(o.body) : undefined,
  });
  var j = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(j.message || j.error || (r.status + ''));
  return j;
}

function say(msg, bad){
  var m = document.getElementById('main');
  var el = document.createElement('div');
  el.className = 'say';
  el.style.borderColor = bad ? '#eccbc9' : 'var(--line)';
  el.textContent = msg;
  m.insertBefore(el, m.firstChild);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 6000);
}

/** ⭐ load the documented cases onto this shop's board — an upsert, so pressing it twice is safe */
async function seed(){
  try {
    var r = await call('/api/testing/cases/seed', { method:'POST' });
    say(r.added + ' cases loaded' + (r.updated ? ', ' + r.updated + ' updated' : '')
        + (r.unchanged ? ', ' + r.unchanged + ' already current' : ''));
    await load();
  } catch (e) { say('Could not load them: ' + e.message, true); }
}

/**
 * ⭐⭐ EXPORT — the board as a .feature file.
 *
 * ⚠️ IT GOES THROUGH fetch, NOT A PLAIN LINK, because the endpoint needs the Authorization header. A bare
 * <a href> would arrive unauthenticated and download a 401 as a file called chitbridge.feature, which looks
 * exactly like a successful download until somebody opens it.
 */
async function exportFeature(){
  var s = sess();
  if (!s || !s.token) { say('Sign in first.', true); return; }
  var mod = document.getElementById('f_mod').value;
  try {
    var r = await fetch(API + '/api/testing/cases/gherkin' + (mod ? '?module=' + encodeURIComponent(mod) : ''),
      { headers: { Authorization: 'Bearer ' + s.token } });
    if (!r.ok) throw new Error('the server said ' + r.status);
    var text = await r.text();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = (mod || 'chitbridge') + '.feature';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    say('Downloaded ' + a.download + '. The Feature description is the spec clause — edit it there and import it back.');
  } catch (e) { say('Could not export: ' + e.message, true); }
}

/**
 * ⭐⭐⭐ IMPORT — and this is the loop Athi described.
 *
 * Edit the Feature description (the spec clause) and send the file: the clause gains a VERSION, and every case
 * still citing the old one is marked "spec moved" — by construction, exactly the set that has to be looked at
 * again. Edit a Scenario and the case gains a version. Nothing has to be remembered.
 *
 * ⚠️ WHAT COULD NOT BE READ IS SHOWN, never swallowed. A scenario that was skipped is a test that silently
 * does not exist, and the board would be claiming coverage it does not have.
 */
async function importFeature(input){
  var file = input && input.files && input.files[0];
  input.value = '';
  if (!file) return;
  try {
    var text = await file.text();
    var r = await call('/api/testing/cases/gherkin', { method:'POST', body:{ text: text } });
    var moved = (r.clauses || []).filter(function (c) { return c.changed; });
    say(r.added + ' added, ' + r.updated + ' updated, ' + r.unchanged + ' unchanged'
      + (moved.length ? ' \u00b7 ' + moved.length + ' clause(s) changed, so cases citing the old wording now read "spec moved"' : ''));
    if ((r.problems || []).length) say('Not everything was read: ' + r.problems.join(' \u00b7 '), true);
    await load();
  } catch (e) { say('Could not import: ' + e.message, true); }
}

async function load(){
  var s = sess();
  document.getElementById('who').textContent = s ? ((s.entity || s.name || 'your business') + ' · signed in') : 'not signed in';
  try {
    /* two calls, not one per case — see the round-trip note in routes/testing.js */
    var a = await call('/api/testing/cases');
    var b = await call('/api/testing/results');
    /* ⭐ which cases were written against wording that has since changed. A green case whose clause has
       moved is the most misleading thing a board can show, so it is read every time, not on request. */
    var st = await call('/api/testing/stale');
    STALE = {};
    ((st && st.stale) || []).forEach(function (x) { STALE[x.case_key] = x; });
    CASES = a.cases || [];
    LAST = {};
    (b.results || []).forEach(function(r){
      /* ⭐ ONE HEADLINE PER CASE. A case may hold results at two layers; the board shows the WORST of them,
         because a green unit test beside a red counter is not a green case. */
      var cur = LAST[r.case_key];
      var rank = { fail: 4, blocked: 3, skipped: 2, pass: 1 };
      if (!cur || rank[r.status] > rank[cur.status] ||
          (rank[r.status] === rank[cur.status] && new Date(r.at) > new Date(cur.at))) LAST[r.case_key] = r;
    });
    if (!CASES.length) {
      document.getElementById('main').innerHTML =
        '<div class="say"><b>No test cases on this board yet.</b>'
        + '<button class="btn pri" onclick="seed()" style="margin:6px 0">Load the test cases</button>'
        + '<div style="font-size:var(--fs-1);color:var(--grey-2);margin-top:5px;line-height:1.55">The documented cases '
        + 'for the counter, the bill, the queue, suppliers and the offer lab. Safe to press again later — it reloads '
        + 'the wording and leaves every result exactly where it is.</div></div>';
      return;
    }
    /* ⚠️ the summary is derived from the same two reads — refresh it here or it shows yesterday */
    await loadSummary();
    if (VIEW === 'summary') { paintSummary(); return; }
    fillModules();
    paint();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="say"><b>Could not read the board.</b>' + esc(e.message) + '</div>';
  }
}

/**
 * ⭐⭐⭐ THE MODULE LIST COUNTS WHAT IS LEFT AFTER THE FILTERS ABOVE IT, NOT EVERYTHING.
 *
 * Athi, 2026-09-11: *"so my first filter would be that — just click unit, then it filters based on the next
 * level, how many use cases etc."*
 *
 * ⚠️⚠️ A DROPDOWN THAT KEEPS SHOWING THE UNFILTERED COUNT IS WORSE THAN ONE SHOWING NO COUNT. Pick `unit` and a
 * static list still offers `CTR · Counter (18)` — eighteen cases that are not units, promising a drill-down it
 * cannot deliver. Recomputed, the same list offers only the directories that actually hold unit tests, with how
 * many, which is the whole of what a drill-down is.
 *
 * ⚠️ IT EXCLUDES ITS OWN FILTER. Counting with the module filter applied would leave exactly one option — the
 * one already chosen — and there would be no way back up.
 */
function fillModules(){
  var sel = document.getElementById('f_mod');
  var keep = sel.value;
  var ty = (document.getElementById('f_type') || {}).value || '';
  var au = (document.getElementById('f_auto') || {}).value || '';
  var st = (document.getElementById('f_state') || {}).value || '';
  var ar = (document.getElementById('f_area') || {}).value || '';

  var n = {}, name = {}, order = [];
  CASES.forEach(function(c){
    if (ty && c.test_type !== ty) return;
    if (ar && (c.areas || []).indexOf(ar) < 0) return;
    if (au === 'auto' && !c.automated) return;
    if (au === 'human' && c.automated) return;
    var last = LAST[c.case_key];
    if (st === 'todo' && last) return;
    if (st === 'pass' && (!last || last.status !== 'pass')) return;
    if (st === 'fail' && (!last || (last.status !== 'fail' && last.status !== 'blocked'))) return;
    if (!n[c.module_key]) { n[c.module_key] = 0; name[c.module_key] = c.module_name || ''; order.push(c.module_key); }
    n[c.module_key]++;
  });

  /* ⚠ rebuilt from scratch — appending to a list that already has options is how a dropdown comes to offer the
     same module three times after a reload. */
  sel.innerHTML = '<option value="">All areas</option>';
  order.forEach(function(k){
    var o = document.createElement('option'); o.value = k;
    o.textContent = k + ' · ' + name[k] + '  (' + n[k] + ')';
    sel.appendChild(o);
  });
  /* ⚠ a chosen module that the new filter excludes must stay selectable, or choosing a kind silently widens the
     board back out without saying it did */
  if (keep && !n[keep]) {
    var o = document.createElement('option'); o.value = keep;
    o.textContent = keep + '  (0 of this kind)'; sel.appendChild(o);
  }
  sel.value = keep;
}

/**
 * ⭐⭐ WHAT EACH LEVEL IS WORTH, in one sentence, on the badge itself.
 *
 * ⚠️ These are not decoration. The commonest way a coverage number misleads is by adding a unit test to a system
 * test and reporting "2 passed" — and the person reading it has no way to know that one of them proved a
 * function and the other proved the product. The tooltip is where that stops being invisible.
 */
var LEVEL_SAYS = {
  unit: 'Unit — one module, on its own. Proves that function, and nothing about the product.',
  integration: 'Integration — several of our pieces wired together (a route over a stubbed database).',
  system: 'System — the whole product: a real browser, a live API, or a real database.',
  acceptance: 'Acceptance — a person deciding whether it does the job. The only kind that finds "correct but useless".',
  'static': 'Static — reads the source and judges the TEXT. Nothing is executed; real evidence, of a different thing.',
  support: 'Support — not a test. A fixture or harness other tests stand on.',
};

function shown(){
  var mod = document.getElementById('f_mod').value;
  var st = document.getElementById('f_state').value;
  var ty = document.getElementById('f_type').value;
  var au = document.getElementById('f_auto').value;
  var ar = document.getElementById('f_area').value;
  var q = document.getElementById('f_q').value.trim().toLowerCase();
  return CASES.filter(function(c){
    if (mod && c.module_key !== mod) return false;
    if (ty && c.test_type !== ty) return false;
    if (ar && (c.areas || []).indexOf(ar) < 0) return false;
    if (au === 'auto' && !c.automated) return false;
    if (au === 'human' && c.automated) return false;
    var last = LAST[c.case_key];
    if (st === 'todo' && last) return false;
    if (st === 'pass' && (!last || last.status !== 'pass')) return false;
    if (st === 'fail' && (!last || (last.status !== 'fail' && last.status !== 'blocked'))) return false;
    if (q && (c.case_key + ' ' + (c.title || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function tally(){
  var n = { pass:0, fail:0, blocked:0, skipped:0, todo:0 };
  CASES.forEach(function(c){ var l = LAST[c.case_key]; if (!l) n.todo++; else n[l.status]++; });
  var h = '';
  if (n.pass)    h += '<span class="t pass"><b>' + n.pass + '</b> passed</span>';
  if (n.fail)    h += '<span class="t fail"><b>' + n.fail + '</b> failed</span>';
  if (n.blocked) h += '<span class="t blocked"><b>' + n.blocked + '</b> blocked</span>';
  if (n.skipped) h += '<span class="t"><b>' + n.skipped + '</b> skipped</span>';
  if (n.todo)    h += '<span class="t todo"><b>' + n.todo + '</b> not yet tested</span>';
  var staleN = CASES.filter(function (c) { return STALE[c.case_key]; }).length;
  if (staleN) h += '<span class="t blocked"><b>' + staleN + '</b> spec moved</span>';
  h += '<span class="t">' + CASES.length + ' cases</span>';
  /**
   * ⭐⭐ THE LADDER, ALWAYS VISIBLE — and it is an honest counterweight to the total beside it.
   *
   * ⚠️ 608 cases sounds like a lot until you see that 238 of them are system tests nobody runs unattended and 29
   * are not tests at all. The shape matters more than the count, and the shape should not need a click.
   */
  var ty = {};
  CASES.forEach(function(c){ if (c.test_type) ty[c.test_type] = (ty[c.test_type] || 0) + 1; });
  ['acceptance','unit','integration','system','static','support'].forEach(function(k){
    if (!ty[k]) return;
    h += '<span class="t" style="cursor:pointer" title="' + esc(LEVEL_SAYS[k] || '')
       + '" onclick="document.getElementById(\'f_type\').value=\'' + k + '\';paint()"><b>'
       + ty[k] + '</b> ' + k + '</span>';
  });
  document.getElementById('tally').innerHTML = h;
}

var VIEW = 'cases', COVER = [], RUNS = [];

/**
 * ⭐⭐ THE SUMMARY. Two questions, and they are not the same one:
 *
 *   COVERAGE — has this area been tested at all? A property of the BOARD, and the one that decides what to
 *              do next. It is what somebody asking "are we ready" actually wants.
 *   SITTINGS — what happened in one run. A property of an EVENT, and the one you read after an automated
 *              suite has just finished, or when you want to know what somebody covered on Tuesday.
 *
 * ⚠️ Showing only the second is the common mistake: a wall of green runs says nothing about the module
 * nobody has opened.
 */
function setView(v){
  VIEW = v;
  document.getElementById('t_cases').className = (v === 'cases') ? 'on' : '';
  document.getElementById('t_sum').className = (v === 'summary') ? 'on' : '';
  /* the case filters mean nothing on either of the other two views */
  /* the case filters mean nothing on the summary — hide them rather than leave them inert */
  var bars = document.querySelectorAll('.bar');
  for (var i = 1; i < bars.length; i++) bars[i].className = (v === 'cases') ? 'bar' : 'bar hide';
  document.getElementById('t_rep').className = (v === 'report') ? 'on' : '';
  document.getElementById('t_rel').className = (v === 'reliability') ? 'on' : '';
  document.getElementById('t_try').className = (v === 'try') ? 'on' : '';
  if (v === 'summary') paintSummary();
  else if (v === 'report') paintReport();
  else if (v === 'reliability') paintReliability();
  else if (v === 'try') paintTry();
  else paint();
}

async function loadSummary(){
  try {
    var a = await call('/api/testing/coverage');
    var b = await call('/api/testing/runs');
    COVER = (a && a.areas) || [];
    /* ⚠️ on window rather than a local, because chartsHTML() is called from a repaint that does not carry it */
    window.__cover_groups = (a && a.groups) || {};
    RUNS = (b && b.runs) || [];
  } catch (e) { say('Could not read the summary: ' + e.message, true); }
}

function pct(a, b){ return b ? Math.round((a / b) * 100) : 0; }

/**
 * ⭐⭐⭐ THE TEST COMPLETION REPORT, on ISO/IEC/IEEE 29119-3's own template.
 *
 * Athi: *"is there any report available… standard report template?"* — 29119-3 is the current one, and it
 * superseded IEEE 829, which is the name most people still reach for and which was withdrawn in 2013.
 *
 * ⚠️⚠️ HALF OF A COMPLETION REPORT IS JUDGEMENT. Whether the exit criteria were met, what risk is left, who
 * accepts it — no database holds any of that. A generator that fills those headings with plausible prose
 * produces a document that LOOKS signed off and is not, and a report is read by people who were not in the
 * room and cannot tell invented text from evidence.
 *
 * ⭐ So the measured sections and the judgement sections are rendered DIFFERENTLY on purpose, and the ones
 * that need a person carry the question rather than an answer.
 */
/**
 * ⭐⭐⭐ RELIABILITY — what can be BELIEVED, as opposed to what should be tested.
 *
 * Athi, 2026-09-11: *"the total number of times it ran and how many times it failed… this particular test is
 * drifting, which means it is still not matured."*
 *
 * ⚠️⚠️ THE FAILURE COUNT IS THE WRONG HEADLINE and this screen is arranged around saying so. Three failures
 * out of five runs describes two opposite situations: something that broke once and stayed broken, and
 * something nobody can trust. The first is a defect with a fix; the second is a test that has to be rewritten
 * or deleted. Sorting by FLIPS puts the ones you cannot believe at the top, which is the order you want to
 * read them in.
 */
/**
 * ⭐⭐⭐ TRY IT — run a pure engine on your own input, here, with no server and no database.
 *
 * Athi, 2026-09-11: *"for automation test cases, or the function which does not require any database info, we
 * have to provide an execute function to run the test there itself and show the result… so each function is
 * validated by a human and confirmed."* And then, concretely: *"for example currency format testing — change the
 * currency and it showcases the format, change the sender currency, change the receiver currency, so the
 * combination is understood and also the said rule."*
 *
 * ⭐⭐ A GUARD PROVES A FUNCTION AGAINST THE INPUTS SOMEBODY THOUGHT OF. This lets a person try the input they
 * ACTUALLY HAVE — which is the half no suite can cover, because the suite has never met their data. And it is
 * the same file the counter runs: no server in between to blame for a difference.
 */
var TRY_OUT = {};

function tryCard(id, title, sig, body, egs){
  return '<div class="try" id="try_' + id + '"><h3>' + esc(title) + '</h3>'
    + '<div class="sig">' + esc(sig) + '</div>'
    + (egs ? '<div class="eg">' + egs + '</div>' : '')
    + body
    + '<div class="out" id="out_' + id + '">—</div></div>';
}
function trySay(id, text, bad){
  var el = document.getElementById('out_' + id);
  if (!el) return;
  el.className = 'out' + (bad ? ' bad' : '');
  el.textContent = text;
}

/**
 * ⭐⭐⭐ CURRENCY — the combination, which is the only way the rule is visible.
 *
 * ⚠️⚠️ THE POINT OF SHOWING BOTH SIDES IS THAT THEY ARE THE SAME. An amount of money is CONTENT, not
 * presentation: a chit travels, and the figure on it has to read the same to whoever opens it. So changing the
 * READER changes nothing, and changing the CURRENCY changes everything — and a person can see that in one
 * screen instead of being told it.
 *
 * ⭐ The third line is what the old rule would have produced, kept deliberately: "₹ grouped for a dollar" is
 * abstract until you see $12,34,567.50 sitting under the right answer.
 */
function tryMoney(){
  var amt = parseFloat((document.getElementById('tm_amt') || {}).value);
  var cur = ((document.getElementById('tm_cur') || {}).value || 'INR').trim().toUpperCase();
  var send = ((document.getElementById('tm_send') || {}).value || 'en-IN');
  var recv = ((document.getElementById('tm_recv') || {}).value || 'en-US');
  if (!isFinite(amt)) { trySay('money', 'Type an amount.', true); return; }
  try {
    var L2 = window.CBLocale;
    if (!L2 || !L2.money) { trySay('money', 'The locale engine did not load.', true); return; }
    var out = L2.money(amt, cur);
    /* what each side would see if the READER decided — the rule we removed */
    var asSender = new Intl.NumberFormat(send, { style: 'currency', currency: cur }).format(amt);
    var asRecv = new Intl.NumberFormat(recv, { style: 'currency', currency: cur }).format(amt);
    trySay('money',
      'THE CHIT SAYS         ' + out + '\n' +
      '  sender reads        ' + out + '\n' +
      '  receiver reads      ' + out + '\n' +
      (asSender === asRecv ? '' :
        '\n\u26a0 if the READER decided instead \u2014 the rule we removed:\n' +
        '  sender (' + send + ')  ' + asSender + '\n' +
        '  receiver (' + recv + ')  ' + asRecv + '\n' +
        '  \u2026one figure, two shapes, on a document that travels.') +
      '\n\nrule: the CURRENCY groups the amount. ' +
      (cur === 'INR' ? 'INR is lakh-grouped (2-2-3) \u2014 verified.'
                     : cur + ' takes the international grouping (3-3-3).'));
  } catch (e) { trySay('money', String(e.message || e), true); }
}

/** ⭐ NUMERALS — type what a customer actually said. This is the engine where `pathu kilo` once came back as 5. */
function tryNums(){
  var t = (document.getElementById('tn_text') || {}).value || '';
  var N2 = window.CBNums;
  if (!N2 || !N2.numeralsIn) { trySay('nums', 'The numerals engine did not load.', true); return; }
  try {
    var found = N2.numeralsIn(t).map(function (x) { return (x && x.value !== undefined) ? x.value : x; });
    var neg = N2.negationIn ? N2.negationIn(t) : null;
    var q = parseFloat((document.getElementById('tn_qty') || {}).value);
    var v = (isFinite(q) && N2.verifyQuantity) ? N2.verifyQuantity(t, q) : null;
    trySay('nums',
      'numbers heard   ' + (found.length ? found.join(' \u00b7 ') : '(none)') + '\n' +
      (neg ? 'negation        ' + (neg.ambiguous ? '\u26a0 AMBIGUOUS \u2014 ' + neg.reason
                                 : (neg.negated ? 'REFUSED (\u201cdo not want\u201d)' : 'none')) + '\n' : '') +
      (v ? '\nchecking ' + q + ':  ' + (v.ok ? (v.checked ? '\u2713 agrees' : '\u2014 nothing to check \u2014 ' + v.reason)
                                             : '\u2717 DISAGREES \u2014 ' + v.reason) : '') +
      '\n\n\u26a0 it VERIFIES, it never substitutes. A disagreement is a refusal with a reason, never a corrected number.');
  } catch (e) { trySay('nums', String(e.message || e), true); }
}

/** ⭐ DOCUMENT NUMBER — the country decides the shape, and says when it has not been checked. */
function tryDoc(){
  var D = window.CBDoc;
  if (!D || !D.compose) { trySay('doc', 'The docnumber engine did not load.', true); return; }
  var c = ((document.getElementById('td_cty') || {}).value || 'IN').trim().toUpperCase();
  var pre = ((document.getElementById('td_till') || {}).value || 'C1').trim();
  var seq = parseInt((document.getElementById('td_seq') || {}).value, 10) || 1;
  try {
    var r = D.rules(c);
    var lines = ['sale          ' + D.compose({ country: c, prefix: pre, seq: seq }),
                 'goods receipt ' + D.compose({ country: c, prefix: pre, seq: seq, kind: 'receipt' }),
                 'despatch      ' + D.compose({ country: c, prefix: pre, seq: seq, kind: 'despatch' })];
    var checks = lines.map(function (l) {
      var no = l.split(/\s+/).pop();
      var k = D.check(no, c);
      return l + '   ' + (k.ok ? '\u2713 ' + no.length + ' chars' : '\u2717 ' + k.reason);
    });
    trySay('doc', checks.join('\n') +
      '\n\nrule: ' + r.name + '  \u00b7  till id at most ' + D.maxPrefix(c) + ' character(s)' +
      '\n' + (r.verified ? '\u2713 these rules have been checked for ' + c
                          : '\u26a0 NOT CHECKED for ' + c + ' \u2014 ' + r.says));
  } catch (e) { trySay('doc', String(e.message || e), true); }
}

/**
 * ⭐⭐⭐ WHICH CASES CAN BE RUN ON THE SPOT.

 * Athi, 2026-09-11: *"the try view can be in the header of the test case itself, so people know that they

/**
 * ⭐⭐⭐ ONE CHART RENDERER, FOUR GROUPINGS. Athi, 2026-09-11: *"any graph / chart according to group?"*
 *
 * ⚠️ NO CHART LIBRARY, and that is a decision rather than laziness. cap-admin.js already draws its trend as
 * inline SVG with theme tokens; pulling in 200KB for four stacked bars would be a dependency that has to be
 * version-tracked, CSP-allowed and kept in step with the theme system it knows nothing about.
 *
 * ⚠️ THE SCALE IS THE WHOLE WIDTH OF THE GROUP'S OWN TOTAL, not the largest group. A row of bars each scaled
 * to itself compares nothing; a row scaled to the biggest makes a small complete area look worse than a big
 * half-done one. Each bar is that group's 100%, and the count is printed beside it so the bar never has to
 * be measured by eye.
 */
var CHART_TONES = [
  ['passed', 'var(--ok)'],
  ['failed', 'var(--bad)'],
  ['blocked', 'var(--warn)'],
  ['untested', 'var(--flat)'],
];

function chartLegend(keys){
  return '<div class="legend">' + CHART_TONES.filter(function(t){ return !keys || keys.indexOf(t[0]) >= 0; })
    .map(function(t){ return '<span><i style="background:' + t[1] + '"></i>' + t[0] + '</span>'; }).join('')
    + '</div>';
}

/** a stacked bar per row — the group name, the bar, and the numbers that make it checkable */
function chartStack(rows, opts){
  var o = opts || {};
  if (!rows || !rows.length) return '<div class="none">Nothing to draw yet.</div>';
  var rowH = 26, pad = 4, labelW = o.labelW || 74;
  var h = rows.length * rowH + pad;
  var out = '<svg viewBox="0 0 340 ' + h + '" role="img" aria-label="' + esc(o.label || '') + '">';
  rows.forEach(function (r, i) {
    var y = i * rowH + pad;
    var total = r.total || 1;
    var x = labelW;
    var w = 340 - labelW - 44;   /* room on the right for the count — labels must fit INSIDE the viewBox */
    out += '<text x="0" y="' + (y + 12) + '" font-size="10.5" font-family="ui-monospace,Menlo,monospace" '
      + 'fill="var(--ink-2)" font-weight="700">' + esc(String(r.key).slice(0, 11)) + '</text>';
    CHART_TONES.forEach(function (t) {
      var v = Number(r[t[0]] || 0);
      if (!v) return;
      var seg = (v / total) * w;
      out += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + seg.toFixed(1) + '" height="15" '
        + 'fill="' + t[1] + '"><title>' + esc(t[0] + ': ' + v) + '</title></rect>';
      x += seg;
    });
    /* ⭐ the number, because a bar you have to measure by eye is decoration */
    out += '<text x="' + (340 - 40) + '" y="' + (y + 12) + '" font-size="10.5" fill="var(--grey-2)">'
      + (r.total - (r.untested || 0)) + '/' + r.total + '</text>';
  });
  return out + '</svg>';
}

/**
 * ⚠️ THE TREND IS A DIFFERENT SHAPE BECAUSE IT ANSWERS A DIFFERENT QUESTION. The others say where we stand;
 * this says what happened in each sitting. Columns, oldest on the left, because that is how a trend reads.
 */
function chartTrend(runs){
  if (!runs || runs.length < 2) return '<div class="none">One sitting so far \u2014 a trend needs at least two.</div>';
  var max = Math.max.apply(null, runs.map(function (r) { return r.total; })) || 1;
  var w = 340, h = 120, pad = 18, colW = (w - pad * 2) / runs.length;
  var out = '<svg viewBox="0 0 ' + w + ' ' + (h + 16) + '" role="img" aria-label="Results per sitting">';
  /* ⚠️ one faint baseline, not a grid — a grid on twelve columns is noise */
  out += '<line x1="' + pad + '" y1="' + h + '" x2="' + (w - pad) + '" y2="' + h + '" stroke="var(--line)"/>';
  runs.forEach(function (r, i) {
    var x = pad + i * colW + colW * 0.18;
    var bw = colW * 0.64;
    var y = h;
    [['passed', 'var(--ok)'], ['blocked', 'var(--warn)'], ['failed', 'var(--bad)']].forEach(function (t) {
      var v = Number(r[t[0]] || 0);
      if (!v) return;
      var bh = (v / max) * (h - 10);
      y -= bh;
      out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" '
        + 'height="' + bh.toFixed(1) + '" fill="' + t[1] + '"><title>' + esc((r.run_label || 'sitting')
        + ' \u2014 ' + t[0] + ': ' + v) + '</title></rect>';
    });
    /* ⚠️ label every third column at most — twelve dates overlap into a grey smear */
    if (i === 0 || i === runs.length - 1 || i % 3 === 0) {
      out += '<text x="' + (x + bw / 2) + '" y="' + (h + 12) + '" font-size="9" fill="var(--grey-2)" '
        + 'text-anchor="middle">' + esc(new Date(r.at).toLocaleDateString(undefined,{month:'short',day:'numeric'}))
        + '</text>';
    }
  });
  return out + '</svg>';
}

function chartCard(title, ask, body, keys){
  return '<div class="chart"><h3>' + esc(title) + '</h3><p class="ask">' + esc(ask) + '</p>'
    + body + chartLegend(keys) + '</div>';
}

/** the four charts — each answers a different question, which is why there are four */
/**
 * ── ⭐⭐⭐ WHAT KIND OF TESTING EACH AREA HAS, AND WHAT IT HAS NONE OF ────────────────────────────────────────
 *
 * Athi, 2026-09-11: *"just click unit, then it filters based on the next level, how many use cases etc."*
 *
 * ⚠️⚠️ AND THE FIRST THING THIS TABLE SHOWS IS A FAULT IN THE BOARD, NOT IN THE PRODUCT. It comes out almost
 * perfectly diagonal: the written areas (CTR, SELL, REW…) hold only acceptance cases, and the code areas
 * (chitbridge-api/tests, chitbridge-web/e2e) hold only automated ones. That is not a finding about testing —
 * it is the two halves of the board using two different vocabularies. A case is filed by PRODUCT MODULE; a
 * guard is filed by DIRECTORY, because a file path is the only identity a guard has.
 *
 * ⭐ So "does the Counter have unit tests?" is a question this cannot answer yet: a counter unit test lives in
 * `chitbridge-web/e2e` by path and under `CTR` by meaning, and nothing connects the two. Naming what is missing
 * is worth more than a table that looks full — see TEST-BOARD-GUIDE.md.
 *
 * ⚠️ IT COUNTS CASES, NOT PASSES, and says so. Coverage of intention, not of evidence — the table below it is
 * where verdicts live. Conflating the two is how a board comes to report a number nobody meant.
 *
 * ⚠️ Computed from CASES, which is already in hand: a matrix like this over a server round trip would be a
 * second source of truth for a figure the page can add up itself.
 */
function matrixHTML(){
  var KINDS = ['acceptance', 'unit', 'integration', 'system', 'static', 'support'];
  var AREAS = ['api', 'middleware', 'engine', 'web', 'database', 'connector'];
  var cell = {}, rowN = {}, colN = {}, none = 0;
  CASES.forEach(function(c){
    var t = c.test_type || '?';
    colN[t] = (colN[t] || 0) + 1;
    var ar = c.areas || [];
    if (!ar.length) { none++; return; }
    /* ⚠️ a test reaching two areas is counted in BOTH, so the rows do not sum to the total — said below */
    ar.forEach(function(a){
      rowN[a] = (rowN[a] || 0) + 1;
      cell[a + '|' + t] = (cell[a + '|' + t] || 0) + 1;
    });
  });
  if (!Object.keys(rowN).length) return '';

  /**
   * ── ⭐⭐⭐ HAS IT EVER ACTUALLY RUN? ──────────────────────────────────────────────────────────────────────
   *
   * Athi, 2026-09-11: *"if a unit test is done, can we update it with when it last ran, so we know that this
   * test case has been passed through?"*
   *
   * ⚠️⚠️ THE COUNT OF TESTS AND THE COUNT OF EVIDENCE ARE DIFFERENT NUMBERS, AND THE FIRST ONE FLATTERS. 97
   * unit tests is a fact about the repository. How many of them have ever reported a result is a fact about
   * the product, and it is the one a person asking "is this tested?" actually means.
   *
   * ⭐ NEVER RUN is therefore the column to read, not the pass rate. A level that is 100% green on four of
   * ninety-seven is not 100% of anything.
   */
  var lvl = {};
  CASES.forEach(function(c){
    var t = c.test_type || '?';
    var L = lvl[t] || (lvl[t] = { n: 0, pass: 0, fail: 0, never: 0, at: null });
    L.n++;
    var last = LAST[c.case_key];
    if (!last) { L.never++; return; }
    if (last.status === 'pass') L.pass++;
    else if (last.status === 'fail' || last.status === 'blocked') L.fail++;
    if (!L.at || (last.at && last.at > L.at)) L.at = last.at;
  });
  var h = '<h2 style="font-size:var(--fs-3);margin:4px 0 9px">Evidence by level</h2>'
    + '<div style="color:var(--grey-2);font-size:var(--fs-1);margin-bottom:10px;line-height:1.5">'
    + 'How many tests exist at each level, and how many have ever reported a result. '
    + '⚠️ <b>Never run</b> is the column to read: a level that is all green on four of ninety-seven is not '
    + 'all green on anything.</div>'
    + '<div class="scroll"><table class="sum"><tr><th>Level</th><th class="num">Tests</th>'
    + '<th class="num">Passed</th><th class="num">Failed</th><th class="num">Never run</th>'
    + '<th>Last result</th></tr>';
  KINDS.forEach(function(t){
    var L = lvl[t]; if (!L) return;
    h += '<tr class="clickable" onclick="drill(\'\',\'' + t + '\')">'
      + '<td><span class="lay ty ' + t + '" title="' + esc(LEVEL_SAYS[t] || '') + '">' + t + '</span></td>'
      + '<td class="num"><b>' + L.n + '</b></td>'
      + '<td class="num">' + (L.pass ? '<span class="big">' + L.pass + '</span>' : '<span class="dim">0</span>') + '</td>'
      + '<td class="num">' + (L.fail ? '<span class="bad">' + L.fail + '</span>' : '<span class="dim">0</span>') + '</td>'
      + '<td class="num">' + (L.never ? '<span class="warnn">' + L.never + '</span>' : '<span class="dim">—</span>') + '</td>'
      + '<td class="dim">' + (L.at ? ago(L.at) : 'no result has ever been recorded') + '</td></tr>';
  });
  h += '</table></div>';

  h += '<h2 style="font-size:var(--fs-3);margin:22px 0 9px">Coverage by area and level</h2>'
    + '<div style="color:var(--grey-2);font-size:var(--fs-1);margin-bottom:10px;line-height:1.5">'
    + 'Which part of the system each test actually reaches — read from what a file requires, what it reads '
    + 'off disk and what it calls over HTTP, not from where it sits. ⚠️ A test reaching two areas is '
    + 'counted in both, so the rows do not sum to ' + CASES.length + '. Click any number to open those cases.'
    + '</div>'
    + '<div class="scroll"><table class="sum"><tr><th>Area</th>';
  KINDS.forEach(function(t){ if (colN[t]) h += '<th class="num" title="' + esc(LEVEL_SAYS[t] || '') + '">' + t + '</th>'; });
  h += '<th class="num">Tests</th></tr>';

  AREAS.forEach(function(a){
    if (!rowN[a]) return;
    h += '<tr><td><span class="area">' + esc(a) + '</span></td>';
    KINDS.forEach(function(t){
      if (!colN[t]) return;
      var n = cell[a + '|' + t] || 0;
      h += '<td class="num">' + (n
        ? '<span class="big clickable" onclick="drill(\'' + a + '\',\'' + t + '\')">' + n + '</span>'
        : '<span class="dim">—</span>') + '</td>';
    });
    h += '<td class="num"><b class="clickable" onclick="drill(\'' + a + '\',\'\')">' + rowN[a] + '</b></td></tr>';
  });

  h += '<tr><td><b>Every area</b></td>';
  KINDS.forEach(function(t){
    if (!colN[t]) return;
    h += '<td class="num"><b class="clickable" onclick="drill(\'\',\'' + t + '\')">' + colN[t] + '</b></td>';
  });
  h += '<td class="num"><b>' + CASES.length + '</b></td></tr></table></div>';
  /* ⚠️ said out loud rather than absorbed into a row: a measurement that could not place something must report
     it, or the table quietly claims to cover everything. */
  if (none) h += '<div style="color:var(--grey-2);font-size:var(--fs-1);margin:0 0 14px">⚠ ' + none
    + ' test(s) reach nothing this measurement can name. They are in the totals and out of this table — '
    + 'filing them somewhere plausible would be worse than leaving them visible.</div>';
  return h;
}

/**
 * one cell → the Cases tab, already filtered. The summary is for deciding, the cases are for doing.
 * ⚠️ The AREA filter is not the module dropdown — a test reaches areas, it sits in a module, and conflating the
 * two is what made the first version of this table come out as a useless diagonal.
 */
function drill(area, type){
  document.getElementById('f_area').value = area;
  document.getElementById('f_mod').value = '';
  document.getElementById('f_type').value = type;
  document.getElementById('f_state').value = '';
  document.getElementById('f_auto').value = '';
  setView('cases');
}

function chartsHTML(){
  var g = (window.__cover_groups) || {};
  var areas = COVER.map(function (a) { return { key: a.module_key, total: a.total, passed: a.passed,
    failed: a.failed, blocked: a.blocked, untested: a.untested }; });
  return '<div class="charts">'
    + chartCard('By area', 'Which part of the product nobody has opened \u2014 this is the one that decides what to test next.',
        chartStack(areas, { label: 'Coverage by area' }))
    + chartCard('By level', 'Whether anything below the screen is proved. All-web coverage is shallow coverage.',
        chartStack(g.by_layer || [], { label: 'Coverage by level' }))
    + chartCard('By priority', 'Whether the important cases are the done ones \u2014 a high pass rate on Low cases is not coverage.',
        chartStack(g.by_priority || [], { label: 'Coverage by priority' }))
    + chartCard('Per sitting', 'What each run recorded, oldest first. The only one of the four that is a trend.',
        chartTrend(g.trend || []), ['passed','failed','blocked'])
    + '</div>';
}

async function paintSummary(){
  if (!COVER.length && !RUNS.length) {
    document.getElementById('main').innerHTML = '<div class="say">Reading the summary…</div>';
    await loadSummary();
  }
  tally();

  /* ⭐ the charts first: a person opening the Summary wants the shape before the numbers */
  var h = matrixHTML() + chartsHTML();
  h += '<h2 style="font-size:var(--fs-3);margin:4px 0 9px">Coverage by area</h2>'
    + '<div style="color:var(--grey-2);font-size:var(--fs-1);margin-bottom:10px;line-height:1.5">'
    + 'The latest word on every case. \u26a0 An area with cases nobody has run is the one to do next \u2014 a wall '
    + 'of green runs says nothing about a module nobody has opened.</div>'
    + '<div class="scroll"><table class="sum"><tr><th>Area</th><th>Covered</th>'
    + '<th class="num">Passed</th><th class="num">Failed</th><th class="num">Blocked</th>'
    + '<th class="num">Not run</th></tr>';

  if (!COVER.length) {
    h += '<tr><td colspan="6" class="dim">No cases on the board yet.</td></tr>';
  } else {
    COVER.forEach(function(a){
      var done = a.total - a.untested;
      h += '<tr class="clickable" onclick="jumpTo(\'' + esc(a.module_key) + '\')">'
        + '<td><span class="area">' + esc(a.module_key) + '</span>'
        +   '<span class="sub">' + esc(a.module_name || '') + '</span></td>'
        + '<td style="min-width:140px"><div class="bar-cov">'
        +   '<i style="width:' + pct(a.passed, a.total) + '%;background:var(--ok)"></i>'
        +   '<i style="width:' + pct(a.failed, a.total) + '%;background:var(--bad)"></i>'
        +   '<i style="width:' + pct(a.blocked, a.total) + '%;background:var(--warn)"></i>'
        + '</div><span class="sub">' + done + ' of ' + a.total + '</span></td>'
        + '<td class="num">' + (a.passed ? '<span class="big">' + a.passed + '</span>' : '<span class="dim">0</span>') + '</td>'
        + '<td class="num">' + (a.failed ? '<span class="bad">' + a.failed + '</span>' : '<span class="dim">0</span>') + '</td>'
        + '<td class="num">' + (a.blocked ? '<span class="warnn">' + a.blocked + '</span>' : '<span class="dim">0</span>') + '</td>'
        /* \u26a0 the \u26a0 marks High-priority cases nobody has run \u2014 the number that should pull somebody in */
        + '<td class="num">' + (a.untested ? '<span class="warnn">' + a.untested
            + (a.high_untested ? ' \u26a0' : '') + '</span>' : '<span class="dim">\u2014</span>') + '</td></tr>';
    });
  }
  h += '</table></div>';

  h += '<h2 style="font-size:var(--fs-3);margin:4px 0 9px">Sittings</h2>'
    + '<div style="color:var(--grey-2);font-size:var(--fs-1);margin-bottom:10px;line-height:1.5">'
    + 'Each run, newest first \u2014 a person working through a module, or an automated suite reporting itself. '
    + 'Click one to read what it recorded.</div>'
    + '<div class="scroll"><table class="sum"><tr><th>Run</th><th>Who</th><th>When</th>'
    + '<th class="num">Pass</th><th class="num">Fail</th><th class="num">Blocked</th><th class="num">Total</th></tr>';

  if (!RUNS.length) {
    h += '<tr><td colspan="7" class="dim">Nothing recorded yet.</td></tr>';
  } else {
    RUNS.forEach(function(r){
      h += '<tr class="clickable" onclick="openRun(\'' + esc(r.run_id) + '\')">'
        + '<td><b>' + esc(r.run_label || 'unlabelled') + '</b>'
        +   '<span class="sub">' + esc(r.kinds || '') + (r.build ? ' \u00b7 ' + esc(r.build) : '') + '</span></td>'
        + '<td>' + esc(r.testers || '') + '</td>'
        + '<td class="dim">' + ago(r.finished) + '</td>'
        + '<td class="num">' + (Number(r.passed) ? '<span class="big">' + r.passed + '</span>' : '<span class="dim">0</span>') + '</td>'
        + '<td class="num">' + (Number(r.failed) ? '<span class="bad">' + r.failed + '</span>' : '<span class="dim">0</span>') + '</td>'
        + '<td class="num">' + (Number(r.blocked) ? '<span class="warnn">' + r.blocked + '</span>' : '<span class="dim">0</span>') + '</td>'
        + '<td class="num"><b>' + r.total + '</b></td></tr>';
    });
  }
  h += '</table></div>';
  document.getElementById('main').innerHTML = h;
}

/** a row in the coverage table takes you to that area, on the Cases tab — the summary is for deciding, the cases are for doing */
function jumpTo(mod){
  document.getElementById('f_mod').value = mod;
  document.getElementById('f_state').value = 'todo';
  setView('cases');
}

/**
 * ⭐ WHAT ONE SITTING RECORDED — the answer to "the suite just ran, what happened?"
 * ⚠️ Failures first. A run of 174 results is not read top to bottom; the four that failed are the whole point,
 * and putting them after 170 passes is the same as not showing them.
 */
async function openRun(id){
  try {
    var r = await call('/api/testing/results?run_id=' + encodeURIComponent(id));
    var rows = (r.results || []).slice();
    var rank = { fail:0, blocked:1, skipped:2, pass:3 };
    rows.sort(function(a,b){ return (rank[a.status] - rank[b.status]) || (a.case_key < b.case_key ? -1 : 1); });
    var first = rows[0] || {};
    var h = '<div style="margin-bottom:12px"><button class="btn" onclick="paintSummary()">\u2190 Back to the summary</button></div>'
      + '<h2 style="font-size:var(--fs-3);margin:0 0 9px">' + esc(first.run_label || 'This sitting') + '</h2>'
      + '<div class="scroll"><table class="sum"><tr><th>Case</th><th>Verdict</th><th>Who</th><th>What they saw</th></tr>';
    rows.forEach(function(x){
      var cls = x.status === 'pass' ? 'big' : (x.status === 'fail' ? 'bad' : (x.status === 'blocked' ? 'warnn' : 'dim'));
      h += '<tr><td><span class="area">' + esc(x.case_key) + '</span>'
        +   '<span class="sub">' + esc(x.run_kind || '') + (x.layer ? ' \u00b7 ' + esc(x.layer) : '') + '</span></td>'
        + '<td><span class="' + cls + '">' + esc(x.status.toUpperCase()) + '</span></td>'
        + '<td class="dim">' + esc(x.tester_name || '') + '</td>'
        + '<td>' + esc(x.note || '') 
        +   (x.evidence ? '<span class="sub">' + esc(x.evidence) + '</span>' : '') + '</td></tr>';
    });
    h += '</table></div>';
    document.getElementById('main').innerHTML = h;
  } catch (e) { say('Could not read that run: ' + e.message, true); }
}

function paint(){
  tally();
  /* ⭐ the next level down is recomputed every time, so each choice narrows the one below it */
  fillModules();
  var list = shown(), byMod = {}, order = [];
  list.forEach(function(c){ if (!byMod[c.module_key]) { byMod[c.module_key] = []; order.push(c.module_key); }
    byMod[c.module_key].push(c); });

  if (!list.length) { document.getElementById('main').innerHTML =
    '<div class="say"><b>Nothing matches.</b>Clear the search or choose a different filter.</div>'; return; }

  var h = '';
  order.forEach(function(k){
    var first = byMod[k][0];
    h += '<section class="mod"><div class="modhead"><span class="k">' + esc(k) + '</span>'
       + '<h2>' + esc(first.module_name || '') + '</h2>'
       + (first.intro ? '<div class="intro">' + esc(first.intro) + '</div>' : '') + '</div>';
    byMod[k].forEach(function(c){ h += caseHTML(c); });
    h += '</section>';
  });
  document.getElementById('main').innerHTML = h;
}

function caseHTML(c){
  var l = LAST[c.case_key], st = l ? l.status : '';
  var open = !!OPEN[c.case_key];
  var last = l
    ? '<span class="last ' + (st === 'fail' ? 'fail' : '') + '">' + st.toUpperCase()
      + ' · ' + esc(l.tester_name || '') + ' · ' + ago(l.at)
      + (l.run_kind ? ' · ' + esc(l.run_kind) : '') + (l.note ? ' — ' + esc(l.note) : '') + '</span>'
    : '<span class="last">not tested yet</span>';

  var h = '<article class="case ' + st + '" id="c_' + esc(c.case_key) + '">'
    + '<div class="chead" onclick="toggle(\'' + esc(c.case_key) + '\')">'
    +   '<span class="key">' + esc(c.case_key) + '</span>'
    +   '<span class="ttl">' + esc(c.title || '') + last + '</span>'
    /* ⚠️ ON THE ROW, not behind a filter — a tester must see it without going looking for it. */
    +   (STALE[c.case_key]
          ? '<span class="lay" style="background:#fbf3e3;border-color:#e8d7ae;color:#8a5a1e" title="'
            + esc('Clause ' + STALE[c.case_key].clause + ' is now v' + STALE[c.case_key].clause_now
                  + '; this case cites v' + STALE[c.case_key].cited_version + '.')
            + '">spec moved</span>'
          : '')
    /**
     * ⭐⭐⭐ THE OFFER IS MADE ON THE CASE, not on a tab somebody has to remember exists.
     *
     * Athi: *"the try view can be in the header of the test case itself, so people know that they can press
     * the button and run the test case."* A tester works down a list; a tool on another screen is a tool
     * they have not needed yet and will not think of.
     *
     * ⚠️ ONLY WHERE THE ENGINE *IS* THE BEHAVIOUR. A ▶ on a case that needs a shop, a screen and a person
     * would be a promise the page cannot keep — and a button that does less than it looks like it does is
     * worse than no button.
     */
    +   (RUNNABLE[c.case_key]
          ? '<button class="btn" title="Run this here \u2014 the real engine, your own input, no server" '
            + 'onclick="event.stopPropagation();runCase(\'' + esc(c.case_key) + '\')" '
            + 'style="padding:2px 9px;font-weight:700;color:var(--blue);border-color:var(--blue)">\u25b6 Run</button>'
          : '')
    /**
     * ⭐⭐ THE KIND, ON EVERY ROW. A reader scanning the board has to be able to tell, without clicking, whether
     * a green line means "a function returned the right number" or "a person used it and it worked". ⚠️ Those
     * are the two ends of the V and they are not substitutes for one another.
     */
    +   (c.test_type ? '<span class="lay ty ' + esc(c.test_type) + '" title="' + esc(LEVEL_SAYS[c.test_type] || '')
          + '">' + esc(c.test_type) + '</span>' : '')
    +   (c.layer ? '<span class="lay">' + esc(c.layer) + '</span>' : '')
    +   '<span class="pri">' + esc(c.priority || '') + '</span>'
    + '</div>';

  if (open) {
    h += '<div class="body">';
    /**
     * ⭐⭐⭐ THE FOUR FACTS A PROJECT MANAGER ASKS OF ANY TEST — Athi, 2026-09-11: *"each level, how many test
     * cases, what are they, which function it belongs to, what it proves, who runs it."*
     *
     * ⚠️ "Not stated in the file" IS ONE OF THE ANSWERS, and it is shown rather than hidden. 244 of the 464
     * automated tests carry no claim in their header; a filename dressed up as a sentence in a row headed
     * "what it proves" would be read as evidence by exactly the person reading this line.
     */
    if (c.areas || c.subjects || c.claim || c.run_by) {
      h += '<div class="facts">';
      if ((c.areas || []).length)
        h += '<div><dt>Reaches</dt><dd>' + c.areas.map(function(a){ return esc(a); }).join(' · ') + '</dd></div>';
      if ((c.subjects || []).length)
        h += '<div><dt>Module under test</dt><dd class="mono">'
           + c.subjects.map(function(s){ return esc(s); }).join('<br>') + '</dd></div>';
      h += '<div><dt>What it proves</dt><dd>' + (c.claim ? esc(c.claim)
           : (c.automated ? '<i class="dim">not stated in the file</i>' : esc(c.title || ''))) + '</dd></div>';
      if (c.run_by) h += '<div><dt>Run by</dt><dd>' + esc(c.run_by) + '</dd></div>';
      h += '</div>';
    }
    if (c.pre)  h += '<div class="meta"><b>Before you start:</b> ' + esc(c.pre) + '</div>';
    if (c.data) h += '<div class="meta"><b>Use:</b> ' + esc(c.data) + '</div>';
    if ((c.steps || []).length) {
      h += '<table class="steps"><tr><th></th><th>Do this</th><th>You should see</th></tr>';
      c.steps.forEach(function(s, i){
        h += '<tr><td class="n">' + (i+1) + '</td><td>' + esc(s[0]) + '</td><td>' + esc(s[1]) + '</td></tr>'; });
      h += '</table>';
    }
    if (c.note) h += '<div class="note">' + esc(c.note) + '</div>';
    /* ⭐ the engine, inline, above the verdict buttons — so the answer and the verdict are in one glance */
    if (RUNNABLE[c.case_key]) h += runnerHTML(RUNNABLE[c.case_key]);

    h += '<div class="acts">'
      +  '<input type="text" id="n_' + esc(c.case_key) + '" placeholder="What did you see? (kept with the result)">'
      +  '<button class="btn pass"    onclick="mark(\'' + esc(c.case_key) + '\',\'pass\')">Pass</button>'
      +  '<button class="btn fail"    onclick="mark(\'' + esc(c.case_key) + '\',\'fail\')">Fail</button>'
      +  '<button class="btn blocked" onclick="mark(\'' + esc(c.case_key) + '\',\'blocked\')">Blocked</button>'
      +  '<button class="btn"         onclick="mark(\'' + esc(c.case_key) + '\',\'skipped\')">Skip</button>'
      +  '<button class="btn"         onclick="caseHistory(\'' + esc(c.case_key) + '\')">History</button>'
      + '</div>'
      + '<div class="hist" id="h_' + esc(c.case_key) + '"></div>'
      + '</div>';
  }
  return h + '</article>';
}

/**
 * ⭐ Pressing ▶ opens the case AND runs it, because a tester who pressed Run wants the answer, not a form.
 * ⚠ The run happens after the paint — the inputs do not exist until the case is open.
 */
function runCase(k){
  OPEN[k] = true;
  paint();
  var which = RUNNABLE[k];
  if (which) setTimeout(function(){ try { runFor(which); } catch (_) {} }, 0);
  var el = document.getElementById('c_' + k);
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function toggle(k){ OPEN[k] = !OPEN[k]; repaintCase(k); }

/**
 * ⭐⭐ REPAINT THE ROW, NEVER THE PAGE. Standing rule, and it matters most here: repainting the board would
 * collapse every case a tester had open and scroll them back to the top, in the middle of working through a
 * module. One card changes, everything else stays exactly where it was.
 */
function repaintCase(k){
  var el = document.getElementById('c_' + k);
  var c = CASES.filter(function(x){ return x.case_key === k; })[0];
  if (!el || !c) { paint(); return; }
  var tmp = document.createElement('div');
  tmp.innerHTML = caseHTML(c);
  el.parentNode.replaceChild(tmp.firstChild, el);
  tally();
}

async function mark(k, status){
  var box = document.getElementById('n_' + k);
  var note = box ? box.value.trim() : '';
  var c = CASES.filter(function(x){ return x.case_key === k; })[0] || {};
  saveRun();
  try {
    var r = await call('/api/testing/results', { method:'POST', body: {
      run_id: RUN.id, run_label: RUN.label || null,
      results: [{ case_key: k, module_key: c.module_key, status: status, tester_name: who() || undefined,
                  run_kind: RUN.kind || 'manual', layer: c.layer || null, note: note || null }] }});
    /* ⚠️ take the row the SERVER wrote, not the one we hoped it would — the time and the tester come from it */
    var saved = (r.results || [])[0];
    LAST[k] = Object.assign({ case_key:k, status:status, note:note, run_kind:RUN.kind,
                              tester_name:(sess()||{}).name || 'you', at:new Date().toISOString() }, saved || {});
    OPEN[k] = (status === 'fail' || status === 'blocked');   /* a failure stays open — you are about to write a note */
    repaintCase(k);
  } catch (e) { say('Not recorded: ' + e.message, true); }
}

/* ⚠ NOT `history` — a top-level function of that name writes to `window.history`, which is a read-only
   accessor on Window. The assignment fails silently in strict-ish contexts and the button does nothing. */
async function caseHistory(k){
  var box = document.getElementById('h_' + k);
  if (!box) return;
  box.textContent = 'reading…';
  try {
    var r = await call('/api/testing/results?case_key=' + encodeURIComponent(k));
    var rows = r.results || [];
    if (!rows.length) { box.textContent = 'Nothing recorded for this case yet.'; return; }
    /* ⭐ every row, oldest at the bottom — a flaky case is only visible as a sequence */
    box.innerHTML = rows.map(function(x){
      return '<span class="r">' + esc(x.status.toUpperCase()) + ' · ' + esc(x.tester_name || '')
        + ' · ' + esc(x.run_kind) + (x.layer ? ' · ' + esc(x.layer) : '')
        + ' · ' + new Date(x.at).toLocaleString()
        + (x.run_label ? ' · ' + esc(x.run_label) : '')
        + (x.note ? ' — ' + esc(x.note) : '')
        + (x.case_version ? ' <i>(case v' + x.case_version + ')</i>' : '') + '</span>'; }).join('');
  } catch (e) { box.textContent = e.message; }
}

/* ⭐ the lab links straight here — /testing.html#report opens the report rather than the case list */
if (location.hash === '#report') { setTimeout(function(){ setView('report'); }, 0); }
else if (location.hash === '#reliability') { setTimeout(function(){ setView('reliability'); }, 0); }
else if (location.hash === '#summary') { setTimeout(function(){ setView('summary'); }, 0); }
loadRun();
load();
