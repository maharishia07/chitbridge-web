<!doctype html>
<!-- OWNS  the UI standard page (screen APP002): every component of the standard action set, its popups, icons, tokens and the language switch, drawn by the real ui.js.
     CALLED BY the Standards page (a live example on the UI-standard rows), and anyone with the address. Opens without sign-in.
     FLOW  load -> app/ui-standard.js paint() -> a switch (language, theme, screen, size, 24 px) sets state -> paint() again, no reload
     CARD  29-qa-test-tooling-ux-locale-and-design-system/ui-action-set -->
<html lang="en" data-appearance-fixed>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ⭐ A PUBLIC PAGE WITH MOCK DATA ONLY. It loads no config.js, device-id.js, shell, avatar or api script, so it has no api address and no token to send;
     connect-src 'none' makes the browser refuse any request the page might try, and nothing is stored (no localStorage, no cookie).
     The language is held in the page, never in cb_lang, so a visitor's own choice on the real app is not touched. Any session that exists is ignored. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>UI standard</title>
<!-- the product's own faces, loaded the way app.html loads them (Google Fonts): Inter is the default, Space Grotesk and Space Mono are the avatar's Grotesk and Monospace. Self-hosting is a later decision. Only font-src and style-src name Google; connect-src stays none. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* tokens: the action set draws from these; the page reads them back live (Tokens tab) */
:root{
  --page:#FCFAF5; --card:#FFFFFF; --panel:#F3EFE6; --ink:#1D1B16; --muted:#5E594D; --line:#8A8374; --soft:#DDD6C6;
  --accent:#16693F; --accent-ink:#FFFFFF; --accent-text:#16693F; --focus-ring:var(--ink); --focus-halo:var(--page); --danger:#8E3517; --ok:#16693F; --bad:#C4562F;
  --scrim:rgba(0,0,0,.45); --press-shadow:rgba(0,0,0,.35); --bad-tint:rgba(196,86,47,.18); --art-bg:#FFFFFF; --act-h:44px; --act-pad:20px; --act-radius:9px; --act-font:14px; --act-weight:700; --hdr-h:120px;
}
/* the avatar's themes (engine APP_THEMES) set the app's tokens on <html>; the page's own names follow them. Cream sets none and keeps the values above. */
:root[data-themed]{
  --page:var(--paper,#FCFAF5); --panel:var(--gold-soft,var(--card)); --soft:var(--line); --muted:var(--grey,#5E594D);
  --accent:var(--blue,#16693F); --accent-ink:var(--on-accent,#FFFFFF); --accent-text:var(--blue,#16693F); 
}
:root[data-weight="bold"]{--act-weight:800}
:root[data-weight="bold"] body{font-weight:600}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-size:calc(15px*var(--k,1));line-height:1.4;font-family:var(--font-ui,Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Tamil","Noto Sans Devanagari","Noto Naskh Arabic",sans-serif);display:flex;flex-direction:column;overflow:hidden}
#hdrwrap{flex:none;position:relative}
#avatarhost{position:absolute;inset-inline-end:12px;top:6px;z-index:70}
.hint{margin-inline-start:auto;margin-inline-end:44px;font-size:calc(12px*var(--k,1));color:var(--muted)}
#hdr{flex:none;border-bottom:1px solid var(--soft);padding:6px 12px;background:var(--page)}
.hrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:2px 0}
h1{font-size:calc(18px*var(--k,1));margin:0}
h3{font-size:calc(14px*var(--k,1));margin:14px 0 6px}
h4{font-size:calc(12px*var(--k,1));margin:0 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-block;font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--soft);border-radius:6px;padding:4px 6px;color:var(--ink);user-select:all}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:calc(12px*var(--k,1))}
.seg{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.seglabel{font-size:calc(12px*var(--k,1));color:var(--muted);margin-inline-end:4px}
.seg button,.tabs button{min-height:28px;min-width:28px;padding:2px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;font-size:calc(12px*var(--k,1));cursor:pointer}
.seg button[aria-pressed="true"],.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.tabs button{font-size:calc(13px*var(--k,1))}
/* the one focus rule (the same as page-skeleton.css): ring = body ink, halo = the surface; forced colours use Highlight */
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-halo)}
@media (forced-colors:active){button:focus-visible,select:focus-visible,a:focus-visible,.act:focus-visible{outline-color:Highlight;box-shadow:none}}
#stage{flex:1;min-height:0;display:flex;justify-content:center;padding:0;overflow:hidden}
#frame{container-type:inline-size;width:100%;height:100%;background:var(--page);border:0}
#stage.framed #frame{border:1px solid var(--line)}
#panel{height:100%;overflow:auto;padding:8px 12px 24px}
#content{position:relative}
.line{margin:4px 0 10px;color:var(--muted);max-width:70ch}
.note{color:var(--muted);font-size:calc(13px*var(--k,1))}
.crow{display:grid;grid-template-columns:260px minmax(0,1fr);gap:8px 16px;padding:10px 0;border-bottom:1px solid var(--soft);align-items:start}
@container (max-width:640px){.crow{grid-template-columns:minmax(0,1fr)}}
.cid{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.meta,.st figcaption{unicode-bidi:plaintext}
.meta{flex-basis:100%;font-size:calc(12px*var(--k,1));color:var(--muted)}
.cov{flex-basis:100%;font-size:calc(12px*var(--k,1))}.cov .yes{color:var(--ok)}.cov .no{color:var(--bad);font-weight:700}
.states{display:flex;flex-wrap:wrap;gap:8px 14px}
.st{margin:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.st figcaption{font-size:calc(11px*var(--k,1));color:var(--muted)}
.slot{min-height:28px;display:flex;align-items:center}
/* the action set: one look from the tokens (the page-level .act every small app defines for itself today) */
.act{display:inline-flex;align-items:center;justify-content:center;min-height:var(--act-h);padding:0 var(--act-pad);border:1px solid var(--accent);border-radius:var(--act-radius);background:var(--accent);color:var(--accent-ink);font:inherit;font-size:calc(var(--act-font)*var(--k,1));font-weight:var(--act-weight);cursor:pointer}
.act.ghost{background:transparent;color:var(--accent-text);border:1px solid currentColor}
.act:hover,.act[data-demo="hover"]{filter:brightness(.9)}
.act:focus-visible,.act[data-demo="focus"]{outline:3px solid var(--focus-ring);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-halo)}
.act:active,.act[data-demo="pressed"]{transform:translateY(1px);box-shadow:inset 0 2px 4px var(--press-shadow)}
.act:disabled{opacity:.5;cursor:not-allowed}
.act[aria-busy="true"]{opacity:.75;cursor:progress}
.act[aria-busy="true"]::after{content:"";width:.9em;height:.9em;margin-inline-start:8px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.act[aria-busy="true"]::after{animation:none}}
.ba{display:flex;flex-wrap:wrap;gap:12px 24px}
.bcol{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bcol h4{flex-basis:100%}
.old{display:inline-block;border:1px dashed var(--line);border-radius:4px;padding:4px 8px;font-size:calc(13px*var(--k,1));color:var(--muted)}.old small{opacity:.8}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ic{margin:0;border:1px solid var(--soft);border-radius:8px;padding:8px;background:var(--card);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ic figcaption{display:flex;flex-direction:column;font-size:calc(12px*var(--k,1))}
.ic img{background:var(--art-bg);border-radius:4px;max-width:100%;height:auto}
.glyph{font-size:calc(28px*var(--k,1));line-height:1;min-height:34px}
.tok{border-collapse:collapse;font-size:calc(13px*var(--k,1));width:100%}.tok th,.tok td{border-bottom:1px solid var(--soft);padding:4px 6px;text-align:start}
.sw{display:inline-block;width:14px;height:14px;border:1px solid var(--line);border-radius:3px;vertical-align:middle;margin-inline-end:6px}
.meas{display:flex;gap:8px;flex-wrap:wrap}.mline{font-size:calc(13px*var(--k,1));margin:6px 0}
.probe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none}
.tok{table-layout:fixed}.tok td,.tok th{overflow-wrap:anywhere}
.meets-row{border-bottom:1px solid var(--soft);padding:8px 0}.meets-row h3{margin:0 0 4px}.meets-row p{margin:2px 0}.src a{color:var(--accent-text)}
.res{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.res span{border:1px solid currentColor;border-radius:4px;padding:1px 6px;font-size:calc(11px*var(--k,1))}.res .pass{color:var(--ok)}.res .fail{color:var(--bad);font-weight:700}
.country{margin-top:12px;border:2px dashed var(--line);border-radius:8px;padding:8px 12px}
.themes th,.themes td{padding:3px 2px;font-size:calc(11px*var(--k,1))}.themes td{text-align:center}.themes td.fail{color:var(--bad);font-weight:700}.themes th{font-weight:600}.themes small{font-weight:400;color:var(--muted)}
select{min-height:28px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;font-size:calc(12px*var(--k,1))}
.ovl{position:absolute;inset:0;pointer-events:none}
.ovl i{position:absolute;width:24px;height:24px;border:2px dashed var(--ok);border-radius:3px}
.ovl i.bad{border-color:var(--bad);background:var(--bad-tint)}
/* the dialog host (the same classes as app.html's modal), below the header so the switches stay reachable */
#modalhost .mover{position:fixed;inset:var(--hdr-h) 0 0 0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
#modalhost .modal{width:360px;max-width:94vw;background:var(--card);color:var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px var(--press-shadow);border:1px solid var(--soft)}
.mxrow{display:flex;justify-content:flex-end;padding:4px 6px 0}
.modal .mhd{padding:0 16px 8px}.modal .mhd .t{font-weight:700;font-size:calc(17px*var(--k,1))}
.modal .mbody{padding:4px 16px 12px;max-height:54vh;overflow-y:auto}
.modal .mfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--soft)}
.modal .mfoot button{flex:1 1 0;min-width:0;height:var(--act-h);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--act-radius);font:inherit;font-size:calc(var(--act-font)*var(--k,1));font-weight:var(--act-weight);cursor:pointer}
.modal .mfoot button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modal .mfoot button.danger{background:var(--danger);border-color:var(--danger);color:var(--card)}
.modal .mxrow .act{height:var(--act-h);min-width:var(--act-h)}
/* the toast is a row of the page below the stage, not an overlay: it can never cover a button; empty it takes no room */
#toast{flex:none;display:flex;justify-content:center;padding:0 12px}
#toast .toast{margin:6px 0;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--page);border-radius:8px;padding:8px 14px;font-size:calc(14px*var(--k,1))}
</style>
</head>
<body>
<div id="hdrwrap"><header id="hdr" data-testid="gal-header"></header><div id="avatarhost" data-testid="gal-avatarhost"></div></div>
<main id="stage"><div id="frame" data-testid="gal-frame"><div id="panel"><div id="content" data-testid="gal-content"></div></div></div></main>
<div id="probe" class="probe" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite" data-testid="gal-toast"></div>
<div id="modalhost" data-testid="gal-modalhost"></div>
<script src="/app/helpers.js"></script>   <!-- esc · fmtMoney -->
<script src="/app/accounts-shell.js"></script>   <!-- tx · txf · toast · CBAction · CBConfirm: the string door and the one confirm -->
<script src="/app/strings-ta.js"></script>
<script src="/app/strings-hi.js"></script>
<script src="/app/strings-ar.js"></script>
<script src="/app/strings-fr.js"></script>
<script src="/app/strings-ui-standard.js"></script>   <!-- this page's own labels, same shape as the packs -->
<script src="/engine/screen.js"></script>   <!-- CBScreen.APP_THEMES: the avatar's 16 themes (no storage, no request) -->
<script src="/app/avatar.js"></script>   <!-- CBAvatar.applyWith: the avatar's own apply, on a fixed-look page (data-appearance-fixed) it never touches storage -->
<script src="/app/ui.js"></script>   <!-- ui.action / ui.dialog: the standard action set, CMP001..CMP010 -->
<script src="/app/ui-standard.js"></script>
</body>
</html>
