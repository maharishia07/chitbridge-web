          node tests/acc342-todo-no-action.test.cjs
          node tests/wx-chit-door.test.cjs
          node tests/wx-pay-name.test.cjs
      - name: Every capability's CMDB record link resolves (shape-only without the API repo beside it)
        run: node e2e/cmdb-records.cjs
      - name: Every stand-in that answers /api/books or /api/crm holds its answers to the API contract (M43)
        run: node e2e/contract.cjs
      - name: No NEW raw colour in a page or app file (ratchet; e2e/token-guard.baseline.json)
        run: node e2e/token-guard.cjs
      - name: The process map names files and functions that exist (PM1; docs/process/flows.json)
        run: node e2e/process-map.cjs
      - name: Docs beside the code have not drifted (MODULES.md; regenerate with node tools/gen-modules-doc.cjs)
        run: node e2e/docs-guard.cjs
      - name: The seam index and its drift check do what they say (tools/seams.cjs, DOC-68)
        run: node e2e/seams-guard.cjs
      # ⭐ READ-GUARD (DISCIPLINES §6, 15 Oct): every §6 rule bites once on a fixture, then the guard judges ONLY the code this push/PR
      # touched — a hard limit crossed, a NEW cryptic name, a new empty catch, a module with no header / CARD line / test row (trace.json,
      # built fresh from KG1), a file scoring worse than readability.ratchet.json. Today's backlog blocks nobody: untouched code is not judged.
      - name: The §6 readability guard bites on its fixtures (e2e/readability-guard.cjs)
        run: node e2e/readability-guard.cjs
      - name: Only the code this change touched is judged (readability --changed --ratchet; the checklist numbers are printed)
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        # ONE-TIME WAIVER (Athi, 19 Oct 2026): the iteration-1 mechanical pass reformats the whole repo, so every legacy function "got worse" and 757 headers
        # are owed. Skipped ONLY when the PR head branch is exactly iter1/mechanical AND that branch carries the commit "chore(iter1): mechanical pass (MNT-4)".
        # It expires on landing: the branch is gone, and every later PR is judged against the re-baselined readability.ratchet.json. No limit or rule is changed.
        run: |
          if [ "$HEAD_REF" = "iter1/mechanical" ] && git log origin/main..HEAD --format=%s | grep -qxF 'chore(iter1): mechanical pass (MNT-4)'; then
            echo 'readability guard WAIVED once for the iter1 mechanical pass (head branch iter1/mechanical + the pass commit); see the PR section 6'
          else
            node tools/readability.cjs --changed --base origin/main --ratchet --md
          fi
      # ⭐ T1-TAX (14 Oct): the web and the api pin the SAME engine versions — web's packs sat at v1.42 while the api booked on v1.45.
      # The api is public; checked out LAST (after every other step) so no earlier guard sees a second tree. Twin branch as walks.yml.
      - name: Twin api branch?
        id: twin
        env:
          B: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$B" ] && git ls-remote --exit-code --heads https://github.com/maharishia07/chitbridge-api "$B" >/dev/null 2>&1; then
            echo "ref=$B" >> "$GITHUB_OUTPUT"; else echo "ref=main" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        with:
          repository: maharishia07/chitbridge-api
          ref: ${{ steps.twin.outputs.ref }}
          path: .side/chitbridge-api
      - name: Every engine both the web and the api pin is at one version (e2e/engines-pins-agree.cjs)
        env:
          CB_API_REPO: .side/chitbridge-api
        run: node e2e/engines-pins-agree.cjs
      - name: "The connector adapters against their fakes (QA wave 2 - Tally, Zoho, GoFrugal, B2B purchase; the kit is the api's tools/tally-connector)"
        env:
          CB_API_REPO: .side/chitbridge-api
        run: |
          node e2e/connector-b2b.test.cjs
          node e2e/connector-gofrugal.test.cjs
          node e2e/connector-purchase.test.cjs
          node e2e/connector-zoho.test.cjs
      - name: Every policy flag the API reads can be set by somebody (policy-reachable, QA-154 baseline; CB_API_REPO set, so a missing api FAILS)
        env:
          CB_API_REPO: .side/chitbridge-api
        run: node e2e/policy-reachable.cjs

  till-copies:
    # THE COPIES OF THE COUNTER SCREEN ARE JUDGED AT A PINNED API COMMIT (11 Nov 2026, root cause of the api reds on its vendor and parse guards).
    # The master is in chitbridge-api; public/till.html, promo.html, till-sw.js, the manifest, engine/qr.js, engine/versions.json and app/their-bill.js
    # are generated from it. vendor.lock.json names ONE merged api commit; this job vendors from THAT commit and fails if a copy differs (a hand-edited
    # copy, or a forgotten re-vendor). The api moving on never reds this job; a master change on the api is a pin bump: node tools/vendor-pin.cjs bump <api checkout>.
    # The api is public (no token); its own CI no longer reads this repo for these copies (api scripts/vendor-till.cjs --kit-only).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Which api commit is pinned?
        id: pin
        run: echo "sha=$(node -p "require('./vendor.lock.json').api.sha")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: maharishia07/chitbridge-api
          ref: ${{ steps.pin.outputs.sha }}
          path: .side/api-pin
      - name: the api's qrcode-generator (the one third-party file the vendoring copies)
        working-directory: .side/api-pin
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: every copy is the pinned api master (vendor-till.cjs --check --web-only)
        env:
          CB_WEB_DIR: ${{ github.workspace }}
        run: node .side/api-pin/scripts/vendor-till.cjs --check --web-only
      # NON-BLOCKING: api MAIN against the pin, so a pin left behind is visible (warning with its age; STALE after 7 days).
      - uses: actions/checkout@v4
        with:
          repository: maharishia07/chitbridge-api
          ref: main
          path: .side/api-main
          fetch-depth: 0
      - name: has the api changed a master since the pin? (warns, never fails)
        run: node tools/vendor-pin.cjs drift .side/api-main

  twin-master-first:
    # ⭐ PLT-92 (9 Nov): a vendored copy (public/till.html, promo.html, app/their-bill.js ... the api's vendor-till COPIES list, read from api main, never copied)
    # may only change after its api master on api main holds the same bytes. Web #510 changed promo.html alone and every api PR went red.
    name: twin-master-first (a vendored copy follows its api master)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: maharishia07/chitbridge-api
          ref: main
          path: .side/api-main
      - name: The check bites on a changed promo.html and passes on a clean copy (self-test)
        run: node e2e/twin-master-first.cjs --self-test
      - name: No copy this PR changed is ahead of the api master on api main
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node e2e/twin-master-first.cjs --api .side/api-main --base "$PR_BASE"

  seams-drift:
    # DOC-68 (docs truth): docs/SEAMS.md is GENERATED (node C:/dev/seams.cjs --write), so a drift check fails the build the way MODULES.md does.
    # ONE copy of the logic: tools/seams.cjs in the web repo (this repo).
    # It reads only THIS repo's checkout, so a change in the sibling repo can never turn this red. Refresh: node C:/dev/seams.cjs --write (LF checkout).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: docs/SEAMS.md has not drifted (node tools/seams.cjs --check --repo web)
        run: node tools/seams.cjs --check --repo web

  pr-checklist:
    # ⭐ READ-GUARD (DISCIPLINES §6): a PR's body carries the §6 checklist WITH NUMBERS (.github/pull_request_template.md), filled from
    # `node tools/readability.cjs --changed --ratchet --md`. Skipped for a dependency bot's PR and for a docs-only PR (tools/pr-checklist.cjs decides).
    # The body travels in an env var, never inside a shell line.
    name: pr-checklist (§6 numbers in the PR body)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The PR body carries the §6 checklist with numbers (bots' dependency PRs and docs-only PRs skip)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/pr-checklist.cjs --author "$PR_AUTHOR" --base "$PR_BASE"

  scan:
    # E02 — dependency + secret scanning on every push/PR.
    #  1) npm audit: shipped (production) dependencies must carry no high/critical advisory. Dev-only tooling is
    #     listed in RETIRED.md instead of gating (a dev tool is never deployed).
    #  2) gitleaks-action: the commits this push/PR adds.
    #  3) gitleaks on the WHOLE working tree (not history). .gitleaks.toml names the only allowed files.
    name: scan (npm audit + gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      # 8 Nov 2026 (Athi): GitHub release downloads 504'd for hours and turned every scan red. The binary is now CACHED between runs,
      # the download is RETRIED, and if GitHub releases are still down it is copied from the OFFICIAL image ghcr.io/gitleaks/gitleaks at the
      # SAME version. The version is asserted either way; the scan itself is unchanged.
      - name: gitleaks binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gl-bin
          key: gitleaks-8.24.3-linux-x64
      - name: gitleaks (whole working tree, no history)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -e
          bin="$RUNNER_TEMP/gl-bin/gitleaks"; mkdir -p "$RUNNER_TEMP/gl-bin"
          if [ ! -x "$bin" ]; then
            base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
            get() { curl -sSfL --retry 5 --retry-delay 15 --retry-all-errors -o "$1" "$2"; }
            if get "$RUNNER_TEMP/gl.tgz" "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" && get "$RUNNER_TEMP/gl.sum" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"; then
              grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "$RUNNER_TEMP/gl.sum" | sed "s|  .*|  $RUNNER_TEMP/gl.tgz|" | sha256sum -c -
              tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP/gl-bin" gitleaks
            else
              echo "::warning::GitHub release download failed; using the official image ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION}"
              img="ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION}"; docker pull -q "$img"
              cid=$(docker create "$img"); docker cp "$cid:/usr/bin/gitleaks" "$bin"; docker rm "$cid" >/dev/null
            fi
          fi
          ln -sf "$bin" "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version | grep -q "${GITLEAKS_VERSION}" || { echo "gitleaks is not ${GITLEAKS_VERSION}"; exit 1; }
          "$RUNNER_TEMP/gitleaks" detect --no-git --source . --config .gitleaks.toml --redact --verbose --exit-code 2
      # 14 Oct: the commits of this push / PR through the FREE CLI (gitleaks-action@v2 demanded a paid licence whenever its owner lookup
      # failed — a flake that blocked green PRs). Same binary as the step above; same config.
      - name: gitleaks (commits in this push / PR)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then RANGE="$HEAD~1..$HEAD"; else RANGE="$BASE..$HEAD"; fi
          echo "scanning commits $RANGE"
          "$RUNNER_TEMP/gitleaks" detect --source . --log-opts="$RANGE" --config .gitleaks.toml --redact --verbose --exit-code 2
