<!doctype html>
<html lang="en">
<!-- OWNS  the network Store page: a network's shops and their catalogues as one storefront (?net=).
     CALLED BY network.html and a network's public link.
     FLOW  load → CBFrame (bar) → the network's catalogue read → paint → network-shop.html
     CARD storefront-and-catalogue/store -->
<head>
<meta charset="utf-8">
<script src="/app/device-id.js"></script>
<script src="/config.js"></script>   <!-- HX1: window.CB_API — this deploy's one api address -->
<script src="/app/helpers.js"></script>   <!-- T2-WEBPRIMS: esc · fmtMoney · monthNames — the ONE copy; loads before every script that calls them -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store</title>
<style>
  :root{ --ink:#1a2230; --muted:var(--grey-2,#5b6675); --line:#e6e9ee; --paper:#f6f7f9; --bg:var(--paper); --card:#fff; --accent:#2c5aa0; --accent-soft:#eaf1fb; --good:#2c7a43; }   /* the theme names (a chosen theme writes them on <html>); --accent is the store's own */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui,'IBM Plex Sans',system-ui,sans-serif);line-height:1.5}   /* SYSTEM.md §2: one face on every page (SHELL-ONE) */
  .tools{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:5}   /* the store's own search and categories; the header is the frame's (SHELL-ONE) */
  .srow{max-width:1000px;margin:0 auto;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .brand{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
  .brand .sub{font-size:11px;font-weight:600;color:var(--muted)}
  .search{flex:1;min-width:200px;display:flex}
  .search input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .cats{max-width:1000px;margin:0 auto;padding:12px 18px 2px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:6px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;min-height:32px}   /* a real button: Tab, Enter and Space work (UX-5) */
  .chip:focus-visible,.card button:focus-visible,.cartbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .po-ask{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .po-ask label{font-size:12px;font-weight:700;color:var(--muted)}
  .po-ask input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:15px;color:var(--ink);background:var(--card)}
  .po-ask ul{margin:6px 0;padding-inline-start:18px}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  main{max-width:1000px;margin:0 auto;padding:16px 18px 60px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;display:flex;flex-direction:column;gap:8px}
  .card .cat{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);align-self:flex-start;padding:2px 9px;border-radius:20px}
  .card .nm{font-size:15px;font-weight:700;line-height:1.3}
  .card .pr{font-size:16px;font-weight:800;color:var(--ink);margin-top:auto}
  .card button{padding:9px 12px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
  .card button:active{transform:translateY(1px)}
  .msg{padding:60px 20px;text-align:center;color:var(--muted)}
  .msg .big{font-size:34px}
  .count{max-width:1000px;margin:0 auto;padding:4px 18px;font-size:12px;color:var(--muted)}
  footer{max-width:1000px;margin:0 auto;padding:20px 18px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--line)}
  .cartbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:none;align-items:center;gap:14px;box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:15}
  .cartbar.show{display:flex}
  body #toast{bottom:74px}   /* UX-142: the shared host sits at 20px; lift it above the cart bar (it loads its style after this one, so the selector must be stronger) */
  .cartbar .ct{font-weight:800;font-size:15px}
  .cartbar button{margin-inline-start:auto;padding:11px 22px;border:0;border-radius:10px;background:var(--good);color:#fff;font-weight:800;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div id="shell" data-testid="store-shell"></div>   <!-- THE ONE FRAME (SHELL-ONE): the bar — ⌂ Home is this store's front -->
<div class="tools">
  <div class="srow">
    <span class="sub" id="netlabel"></span>
    <div class="search"><input data-cbsid="STR001-I01" id="q" type="search" placeholder="Search products…" aria-label="Search products" autocomplete="off"></div>
  </div>
  <div class="cats" id="cats" role="group" aria-label="Categories"></div>
</div>
<div class="count" id="count"></div>
<main><div id="body"><div class="msg"><div class="big">⏳</div>Loading the store…</div></div></main>
<footer id="foot"></footer>
<div class="cartbar" id="cartbar"></div>

<!-- THE ONE FRAME (SHELL-ONE): the header every page wears — mark · name · the screen chip · ⌂ Home · the avatar (Sign in). Nothing of it is drawn here. -->
<script src="/engine/screen.js"></script>   <!-- APP_THEMES: the themes the avatar applies -->
<script src="/app/avatar.js"></script>      <!-- CBAvatar: the one avatar / Sign in door -->
<script src="/app/one-person.js"></script>  <!-- CBOnePerson: whose session this browser holds (CBFrame.session) -->
<script src="/app/screen-id.js"></script>   <!-- CBScreenId: this screen's name · code in the bar -->
<script src="/app/accounts-shell.js"></script>   <!-- UX-142: toast() — the ONE shared toast (words, place, live region), not this page's own copy -->
<script src="/app/ui.js"></script>   <!-- CMP023 Home: the shell draws its ⌂ Home link from the standard components -->
<script src="/app/shell.js"></script>       <!-- CBShell: the bar -->
<script src="/app/page-frame.js"></script>  <!-- CBFrame.mount({ bar: true }): the header only; the page's own body under it -->
<script src="/engine/locale.js"></script>
<script>
if (window.CBFrame)
  CBFrame.mount({
    app: 'store',
    bar: true,
    signin: false,
    host: document.getElementById('shell'),
    homeHref: location.pathname + location.search,
    title: { icon: '◇', name: 'Store' }
  }); /* SHELL-ONE */
var API = window.CB_API;
var NET = new URLSearchParams(location.search).get('net') || '';
var STATE = { all: [], categories: [], q: '', cat: '', cart: {}, cur: '' };

function rs(v) {
  if (v == null) return '';
  try {
    return CBLocale.money(Number(v), STATE.cur || '');
  } catch (e) {
    return (STATE.cur ? STATE.cur + ' ' : '') + v;
  }
} /* CX0: the store's currency through the locale engine, never ₹ en-IN by name */

function addToCart(pid) {
  STATE.cart[pid] = (STATE.cart[pid] || 0) + 1;
  renderCart();
  var p = STATE.all.find(function (x) {
    return x.product_id === pid;
  });
  toast((p ? p.name : 'Item') + ' added');
}
function cartItems() {
  return Object.keys(STATE.cart).map(function (pid) {
    var p =
      STATE.all.find(function (x) {
        return x.product_id === pid;
      }) || {};
    return { product_id: pid, qty: STATE.cart[pid], name: p.name, price: p.price };
  });
}
function renderCart() {
  var bar = document.getElementById('cartbar');
  var list = cartItems();
  var n = list.reduce(function (total, item) {
      return total + item.qty;
    }, 0),
    tot = list.reduce(function (total, item) {
      return total + (item.price || 0) * item.qty;
    }, 0);
  if (!n) {
    bar.className = 'cartbar';
    bar.innerHTML = '';
    return;
  }
  bar.className = 'cartbar show';
  bar.innerHTML = '<div class="ct">🛒 ' + n + ' item' + (n === 1 ? '' : 's') + ' · ' + rs(tot) + '</div><button type="button" data-cbsid="STR001-B01" onclick="placeOrder()">Place order</button>';
}
/* MONEY PROMISE = DELIBERATE CONFIRM (UX-5): Place order opens the library's one confirm (CBConfirm) saying WHAT is promised (the lines, the total) and TO WHOM (this store); the name and e-mail are form fields in it, not prompt() boxes. Nothing is sent until Place order is pressed in it. */
/** the lines the buyer is about to order, as a list: quantity, name, line total */
function orderLinesHtml(list) {
  return (
    '<ul>' +
    list
      .map(function (item) {
        return '<li>' + item.qty + ' × ' + esc(item.name || item.product_id) + (item.price != null ? ' · ' + esc(rs(item.price * item.qty)) : '') + '</li>';
      })
      .join('') +
    '</ul>'
  );
}
/** the buyer pressed Place order: ask first (lines, total, store, name, e-mail); only the confirm sends */
function placeOrder() {
  var list = cartItems();
  if (!list.length) return;
  var total = list.reduce(function (sum, item) {
    return sum + (item.price || 0) * item.qty;
  }, 0);
  var buyer = { name: '', email: '' };
  CBConfirm(
    'Place this order?',
    '<div>This sends an order to the store <b>' + esc(NET) + '</b>.</div><div class="po-ask">' + orderLinesHtml(list) + '<div><b>Total ' + esc(rs(total)) + '</b></div>' +
      '<label for="po_name">Your name</label><input id="po_name" data-testid="po-name" autocomplete="name" placeholder="Customer">' +
      '<label for="po_email">Your email (optional)</label><input id="po_email" data-testid="po-email" type="email" autocomplete="email"></div>',
    'Place order',
    function () {
      sendOrder(list, buyer);
    }
  );
  ['po_name', 'po_email'].forEach(function (id) {
    var box = document.getElementById(id);
    if (!box) return;
    box.addEventListener('input', function () {
      buyer[id === 'po_name' ? 'name' : 'email'] = box.value;
    });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') e.preventDefault(); /* Enter in a box never answers the question: only the Place order button does */
    });
  });
}
/** the buyer said yes: post the order to the network store and say the outcome in the toast */
function sendOrder(list, buyer) {
  var body = {
    items: list.map(function (item) {
      return { product_id: item.product_id, qty: item.qty };
    }),
    customer: { name: (buyer.name || '').trim() || 'Customer', email: (buyer.email || '').trim() }
  };
  fetch(API + '/api/catalogue/network-store/' + encodeURIComponent(NET) + '/order', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
    .then(function (reply) {
      return reply.json();
    })
    .then(function (reply) {
      if (reply && reply.ok) {
        STATE.cart = {};
        renderCart();
        toast('✓ Order placed · #' + String(reply.order_id).slice(0, 8) + ' · ' + reply.item_count + ' item(s) · ' + rs(reply.total));
      } else {
        toast((reply && reply.message) || 'Order failed');
      }
    })
    .catch(function () {
      toast('Order failed — try again.');
    });
}

function visible() {
  return STATE.all.filter(function (item) {
    if (STATE.cat && item.category !== STATE.cat) return false;
    if (STATE.q) {
      var s = (item.name + ' ' + item.category).toLowerCase();
      if (s.indexOf(STATE.q.toLowerCase()) < 0) return false;
    }
    return true;
  });
}
function renderCats() {
  var el = document.getElementById('cats');
  var chips = ['<button type="button" data-cbsid="STR001-C01" class="chip ' + (STATE.cat === '' ? 'on' : '') + '" aria-pressed="' + (STATE.cat === '') + '" data-cat="">All</button>'];
  STATE.categories.forEach(function (item) {
    chips.push('<button type="button" data-cbsid="STR001-C02" class="chip ' + (STATE.cat === item ? 'on' : '') + '" aria-pressed="' + (STATE.cat === item) + '" data-cat="' + esc(item) + '">' + esc(item) + '</button>');
  });
  el.innerHTML = chips.join('');
}
function renderBody() {
  var items = visible();
  document.getElementById('count').textContent = items.length + ' product' + (items.length === 1 ? '' : 's');
  var body = document.getElementById('body');
  if (!items.length) {
    body.innerHTML = '<div class="msg"><div class="big">🔍</div>No products' + (STATE.q ? ' for “' + esc(STATE.q) + '”' : '') + '.</div>';
    return;
  }
  body.innerHTML =
    '<div class="grid">' +
    items
      .map(function (item) {
        return (
          '<div class="card"><span class="cat">' +
          esc(item.category) +
          '</span>' +
          '<div class="nm">' +
          esc(item.name) +
          '</div>' +
          '<div class="pr">' +
          (item.price != null ? rs(item.price) : '') +
          '</div>' +
          '<button type="button" data-cbsid="STR001-B02" onclick="addToCart(\'' +
          item.product_id +
          '\')">Add</button></div>'
        );
      })
      .join('') +
    '</div>';
}
window.setCat = function (c) {
  STATE.cat = c;
  renderCats();
  renderBody();
};
/* SEC-FIX2 H4: a chip carries its category as DATA (esc'd once) and one listener reads it back — no handler is ever built from a shop's text. */
document.getElementById('cats').addEventListener('click', function (e) {
  var chip = e.target.closest('[data-cat]');
  if (!chip) return;
  window.setCat(chip.getAttribute('data-cat'));
  /* the chips are drawn again: the keyboard user keeps their place on the chip they chose */
  var again = document.querySelectorAll('#cats [data-cat]');
  for (var i = 0; i < again.length; i++) if (again[i].getAttribute('data-cat') === STATE.cat) again[i].focus();
});

document.getElementById('q').addEventListener('input', function (e) {
  STATE.q = e.target.value;
  renderBody();
});

function load() {
  if (!NET) {
    document.getElementById('body').innerHTML =
      '<div class="msg"><div class="big">🛍️</div>No store specified. Open with <code>?net=&lt;network id&gt;</code>.</div>';
    return;
  }
  document.getElementById('netlabel').textContent = NET;
  fetch(API + '/api/catalogue/network-store/' + encodeURIComponent(NET), { cache: 'no-store' })
    .then(function (reply) {
      return reply.json();
    })
    .then(function (reply) {
      STATE.all = reply.products || [];
      STATE.categories = reply.categories || [];
      STATE.cur = reply.currency_code || (reply.shop && reply.shop.currency_code) || (reply.network && reply.network.currency_code) || '';
      renderCats();
      renderBody();
      document.getElementById('foot').innerHTML =
        "One storefront across every line of business. You see products — never the network's internal departments, locations, or supply. Powered by Chit &amp; Bridge.";
    })
    .catch(function () {
      document.getElementById('body').innerHTML = '<div class="msg"><div class="big">⚠️</div>Could not load the store. Try again.</div>';
    });
}
load();
</script>
</body>
</html>
