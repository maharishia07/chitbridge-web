<!doctype html>
<html lang="en" data-tokens="list">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChitBridge</title>
<!-- ⭐ THE INDEX PAGE IS THE SHELL'S HOME (plan row N18, 2026-10-08; FIT §D Q1 · Q3 · Q5 · Q10). CBShell (public/app/shell.js) draws
     the header, the five areas and the kural; every card is a row of public/app/manifest.json — this page writes no card by hand.
     What this page owns is the HOME area: the alerts (one browser, one shop · the ledger's waiting posts · a counter paired to
     another shop) and "The rail" widget. Every figure is the server's, one budgeted read each (I19); a read that does not exist yet
     paints nothing — never a made-up number. e2e/index-page.cjs proves it at 1366 and 390.
     The ROADMAP (public/app/roadmap.js) is drawn from the same manifest and reads no session: the page is also the front door before sign-in.
     The earlier design (docs/design/index-page/cb-index.md) is superseded by the shell (designs-inbox/cb-shell-2026-10-07). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* tokens — docs/design/SYSTEM.md §2, copied, never restyled */
:root{
  --page:#FCFAF5; --card:#FFFFFF; --panel:#F3EFE6;
  --line:#DDD6C6; --line-soft:#E6E0D2; --hair:#F0ECE2;
  --ink:#1D1B16; --muted:#5E594D; --faint:#8A8374; --ghost:#A8A295;
  --green:#16693F; --green-d:#0D4A2B; --green-t:#E8F4ED; --green-b:#A9D3BC;
  --amber:#E0A020; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205;
  --red:#C4562F; --red-t:#FBEAE3; --red-b:#E7B9A8; --red-i:#8E3517;
  --blue:#2F74C9; --blue-t:#E4EEFA; --blue-b:#B9D2EF; --blue-i:#174A87;
}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-ui,'IBM Plex Sans',system-ui,sans-serif)}

/* ── anything wrong, before anything else (the shell's alerts slot; only a failing thing earns a row) ── */
.al{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:12px;font-size:13.5px}
.al .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--card);flex:0 0 auto}
.al b{font-weight:700}
.al .fix{font:inherit;color:inherit;margin-left:auto;display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:9px;
  border:1px solid currentColor;background:var(--card);font-size:12.5px;font-weight:700;white-space:nowrap;text-decoration:none;cursor:pointer}
.al.bad{background:var(--red-t);border:1px solid var(--red-b);color:var(--red-i)}
.al.bad .ic{background:var(--red-i)}
.al.warn{background:var(--amber-t);border:1px solid var(--amber-b);color:var(--amber-i)}
.al.warn .ic{background:var(--amber-i)}

/* ── the rail: suppliers · the flows · customers (designs-inbox/cb-shell-2026-10-07, the Home widget) ── */
.rail{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px 20px 16px;position:relative;overflow:hidden;margin-bottom:16px}
.rail::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--green-b),var(--green),var(--green-b))}
.railtop{display:flex;align-items:baseline;gap:11px;margin-bottom:13px}
.railtop h3{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800;margin:0}
.railtop a{margin-left:auto;font-weight:600;color:var(--green-d);text-decoration:none}
.track{display:flex;align-items:center;position:relative}
.track::before{content:"";position:absolute;left:7%;right:7%;top:50%;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 7px,transparent 7px 13px)}
.node{position:relative;background:var(--card);padding:0 14px;text-align:center;flex:0 0 auto}
.node .n{display:block;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:21px;font-weight:700;line-height:1.1}
.node .k{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.flow{position:relative;flex:1;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.pip{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px 10px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.pip.in{border-color:var(--blue-b);background:var(--blue-t);color:var(--blue-i)}
.pip.out{border-color:var(--green-b);background:var(--green-t);color:var(--green-d)}
.pip.stuck{border-color:var(--amber-b);background:var(--amber-t);color:var(--amber-i)}
@media(max-width:700px){
  .al{flex-wrap:wrap} .al .fix{margin-left:33px}
  .rail{padding:12px 14px 14px}
  .track{display:grid;grid-template-columns:1fr 1fr;row-gap:8px;column-gap:6px;align-items:center}
  .track::before{display:none}
  .node{padding:0}
}
</style>
</head>
<body>
<div id="shell"></div>

<script src="/engine/screen.js"></script>   <!-- APP_THEMES: the themes the avatar applies (engines screen) -->
<script src="/app/avatar.js"></script>      <!-- CBAvatar: the one avatar — signed out it is the Sign in door; the shell mounts it -->
<script src="/engine/signin.js"></script>   <!-- CBSignin: the sign-in RULES (engines signin) -->
<script src="/app/signin-ui.js"></script>   <!-- CBSignin.mount: THE ONE SIGN-IN WINDOW (M14) — the door above opens it here, in place -->
<script src="/app/one-person.js"></script>  <!-- CBOnePerson: one browser, one shop -->
<script src="/app/kural.js"></script>       <!-- CBKural: the kural band; the shell gives it its place -->
<script src="/app/roadmap.js"></script>    <!-- CBRoadmap: the roadmap, the fit diagram and the rail table, drawn from the manifest, for a stranger too -->
<script src="/app/shell.js"></script>       <!-- CBShell: the frame — header · five areas · kural -->
<script>
'use strict';
/* The page paints; it computes nothing a counter or another page also computes (SYSTEM rule 12). A failed read
   leaves its row out — never an error string (rule 4). */

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* the app's session, read the way the apps restore it — an expired token counts as signed out. WHO it is (the
   shop's id from the signed token) is CBOnePerson's one answer, the same one the apps' gate compares. */
function session(){
  try{
    var s = JSON.parse(localStorage.getItem('cb_sess') || 'null');
    return (window.CBOnePerson && CBOnePerson.who(s)) ? s : null;
  }catch(_){ return null; }
}
var SESS = session();
var MINE = SESS ? CBOnePerson.who(SESS) : null;
/* every repaint starts a new generation; a read that lands for an older one paints nothing */
var GEN = 0;
var SHELL = null;

/* ⭐ THE SHELL IS THE PAGE. Home (host null): the five areas from the manifest, the header, the kural. */
function mountShell(){
  SHELL = CBShell.mount(document.getElementById('shell'), {
    host: null,
    person: SESS ? CBAvatar.personOf(SESS) : null,
    token: SESS && SESS.token,
    apiBase: CBShell.apiBase(),
    kural: 'planning',
    /* ⭐ M14: THE FRONT DOOR. Signed out, the shell's own slot holds the one sign-in window (CBSignin.mount — the same module CB Accounts,
       CB CRM and the till mount); signed in → the Home repaints. The avatar's Sign in door brings the person to the box. */
    signin: { surface: 'index', need: 'person', onIn: function(){ SESS = session(); MINE = SESS ? CBOnePerson.who(SESS) : null; open_(); } },
    avatar: { onSignIn: signinOpen }
  });
  /* Home's slot: the rail widget (signed in) above the ROADMAP, which is for everyone, signed in or not, and reads no shop's figure */
  var home = SHELL.slots.home;
  if (home) {
    home.innerHTML = '<div id="railbox"></div><div id="roadmap" data-testid="roadmap-host"></div>';
    SHELL.ready.then(function(){ if (window.CBRoadmap) CBRoadmap.mount(document.getElementById('roadmap'), SHELL.manifest()); });
  }
  return SHELL;
}
function signinOpen(){
  var i = document.querySelector('[data-testid="shell-signin"] [data-testid="signin-id"]');
  if (i) { try { i.scrollIntoView({ block: 'center' }); } catch (_) {} i.focus(); }
}

/* one read; the {ok,data,error} envelope unwrapped; any failure throws, and the caller paints nothing */
async function read(path){
  var g = GEN, never = function(){ return new Promise(function(){}); };
  var r = await fetch(CBShell.apiBase() + path, { cache:'no-store', headers:{ Authorization:'Bearer ' + SESS.token } });
  if (g !== GEN) return never();
  if (!r.ok) { var e = new Error(String(r.status)); e.status = r.status; throw e; }
  var j = await r.json();
  if (g !== GEN) return never();
  return (j && typeof j === 'object' && 'ok' in j && ('data' in j || 'error' in j)) ? (j.ok ? j.data : null) : j;
}
function n1(v){ var n = Number(v); return isFinite(n) ? n : null; }

/* ── ALERTS: the shell's slot. What is wrong NOW (red) sits above what needs a hand (amber), whatever order the answers
   arrived in. With nothing wrong the slot is empty and draws nothing at all (SYSTEM rule 1). ── */
var ALERTS = [];
function alert_(key, lvl, ic, t, s, fixText, fixHref, fixBlank){
  ALERTS = ALERTS.filter(function(a){ return a.key !== key; });
  ALERTS.push({ key: key, lvl: lvl, html: '<div class="al ' + lvl + '" data-testid="' + esc(key) + '"><span class="ic">' + ic + '</span><span><b>' + esc(t) + '</b>' + (s ? ' &nbsp;' + esc(s) : '') + '</span>'
    + '<a class="fix" href="' + esc(fixHref) + '"' + (fixBlank ? ' target="_blank" rel="noopener"' : '') + '>' + esc(fixText) + '</a></div>' });
  alertsPaint();
}
function alertDrop(key){ ALERTS = ALERTS.filter(function(a){ return a.key !== key; }); alertsPaint(); }
function alertsPaint(){
  var host = SHELL && SHELL.slots.alerts; if (!host) return;
  host.innerHTML = ALERTS.filter(function(a){ return a.lvl === 'bad'; }).concat(ALERTS.filter(function(a){ return a.lvl !== 'bad'; }))
    .map(function(a){ return a.html; }).join('');
}

/* the ledger's posts waiting for the owner — GET /api/books/health (budget line: I19); a 404 means the ledger is off, nothing wrong */
function booksAlert(){
  var g = GEN;
  return read('/api/books/health').then(function(r){
    if (g !== GEN) return;
    var w = ((r && r.waiting) || []).length;
    if (w) alert_('ledger-waiting', 'warn', '🕗', w + ' waiting for the ledger', '', 'See them', '/accounts.html#waiting');
  }).catch(function(){});
}

/* ── THE RAIL: the Home widget. Its one read and its Open target come from the manifest's `rail` (null = not drawn). ── */
function railPaint(r){
  var host = document.getElementById('railbox'); if (!host) return;
  var m = SHELL.manifest(), rail = (m && m.rail) || {};
  var sup = n1(r && r.suppliers), cus = n1(r && r.customers), fin = n1(r && r.in), fout = n1(r && r.out), stuck = n1(r && r.stuck);
  if (sup == null && cus == null) { host.innerHTML = ''; return; }
  var pips = [];
  if (fin != null) pips.push('<span class="pip in" data-testid="rail-in">' + fin + ' in</span>');
  if (fout != null) pips.push('<span class="pip out" data-testid="rail-out">' + fout + ' out</span>');
  if (stuck) pips.push('<span class="pip stuck" data-testid="rail-stuck">' + stuck + ' stuck</span>');
  host.innerHTML = '<div class="rail" data-testid="rail"><div class="railtop"><h3>The rail</h3>'
    + (rail.route ? '<a href="' + esc(rail.route) + '" data-testid="rail-open">Open ›</a>' : '') + '</div>'
    + '<div class="track"><span class="node"><b class="n" data-testid="rail-suppliers">' + (sup == null ? '–' : sup) + '</b><span class="k">Suppliers</span></span>'
    + '<span class="node"><b class="n" data-testid="rail-customers">' + (cus == null ? '–' : cus) + '</b><span class="k">Customers</span></span>'
    + '<span class="flow">' + pips.join('') + '</span></div></div>';
}
function railRead(){
  var g = GEN;
  return SHELL.ready.then(function(){
    if (g !== GEN || !SESS) return;
    var m = SHELL.manifest(), rail = m && m.rail;
    if (!rail || !rail.facts) return;                       /* no read exists yet → nothing is drawn (never a made-up number) */
    return read(rail.facts).then(function(r){ if (g === GEN) railPaint(r); }).catch(function(){});
  });
}

function facts(){
  booksAlert();
  railRead();
}

/* ── ONE BROWSER, ONE SHOP (2026-10-01) — the page asks CBOnePerson the same question the apps' gate asks ── */

/* a counter in this browser paired to ANOTHER shop earns a row (amber); paired here, or not paired, is nothing wrong.
   Read from the counter's own keys, never written; the counter's own sign-in switches it. */
function pairPaint(p){
  if (!MINE) return;
  if (p && p.paired && p.ent !== MINE.ent)
    alert_('till-paired', 'warn', '▤', p.counter + ' · paired to ' + CBOnePerson.shopName(p) + ', not this shop', '', 'Open the counter', '/till.html', true);
  else alertDrop('till-paired');
}

/* another shop still here (an app tab, its unsent drafts) → the facts wait; one row each, one button each */
function closeFirst(r){
  var host = SHELL.slots.alerts;
  host.innerHTML = r.others.map(function(o, i){
    return '<div class="al bad" data-testid="close-first"><span class="ic">!</span><span>' + esc(CBOnePerson.sentence(o)) + '</span>'
      + '<button class="fix" data-testid="close-first-go" data-i="' + i + '">' + esc(CBOnePerson.buttonLabel(o)) + '</button></div>';
  }).join('');
  host.querySelectorAll('[data-testid="close-first-go"]').forEach(function(b){
    b.onclick = function(){
      host.querySelectorAll('button').forEach(function(x){ x.disabled = true; });
      b.textContent = 'Signing it out…';
      CBOnePerson.clearOut(r.others[+b.getAttribute('data-i')], MINE.name).then(open_, open_);
    };
  });
}

/* another shop's counter still holds unsent bills: one line, nothing to fix here — and the shop opens regardless.
   Dismissed for the rest of this tab's life (sessionStorage; a page that cannot keep it just shows it again). */
function noticePaint(n){
  var host = SHELL.slots.alerts;
  var old = host.querySelector('[data-testid="gate-notice"]'); if (old) old.remove();
  if (!n) return;
  var k = 'cb_notice_seen', sig = n.ent + ':' + n.unsent;
  try { if (sessionStorage.getItem(k) === sig) return; } catch (_) {}
  var d = document.createElement('div'); d.className = 'al warn'; d.setAttribute('data-testid', 'gate-notice');
  d.innerHTML = '<span class="ic">!</span><span>' + esc(CBOnePerson.noticeSentence(n)) + '</span><button class="fix" data-testid="gate-notice-x">Dismiss</button>';
  d.querySelector('button').onclick = function(){ try { sessionStorage.setItem(k, sig); } catch (_) {} d.remove(); };
  host.insertBefore(d, host.firstChild);
}

/* signed out — the shell draws the areas and the avatar's Sign in door; (when another tab did it) one line saying why.
   The row's button is THE door (CBAvatar's), not a second one. */
function signedOut(why){
  SESS = null; MINE = null; GEN++; ALERTS = [];
  mountShell();
  if (!why) return;
  var host = SHELL.slots.alerts;
  host.innerHTML = '<div class="al warn" data-testid="signed-out-why"><span class="ic">!</span><span>' + esc(why) + '</span><button class="fix" data-testid="signed-out-go">Sign in</button></div>';
  host.querySelector('button').onclick = function(){ var door = document.querySelector('[data-testid="signin-door"]'); if (door) door.click(); };
}

function open_(){
  if (!SESS) return signedOut('');
  GEN++; ALERTS = [];
  var g = GEN;
  mountShell();
  CBOnePerson.traces(MINE).then(function(r){
    if (g !== GEN || !MINE) return;
    if (r.others.length) closeFirst(r); else facts();
    noticePaint(r.notice);
    pairPaint(r.pair);
  });
}

/* ⭐ THE ONLY READER OF THE `storage` EVENT HERE. It never adopts anyone: a session gone, or now another SHOP's,
   signs this page out and says why. A page already signed out stays so until it is reloaded. */
function onStore(e){
  var k = e ? e.key : null;
  if (k === null || k === 'cb_sess'){
    if (!MINE) return;
    var next = CBOnePerson.stored();
    if (next && next.ent === MINE.ent) return;
    signedOut(next ? 'Signed out — ' + CBOnePerson.shopName(next) + ' opened in another tab.' : 'Signed out — you signed out in another tab.');
    return;
  }
  if (MINE && /^cb_till_(lastslot|key|entity)$/.test(k)) CBOnePerson.counterPair().then(pairPaint);
}
window.addEventListener('storage', onStore);
CBOnePerson.attach({ quiet: true, who: function(){ return MINE; }, label: function(){ return 'The home page'; },
  onLeave: function(by){ signedOut('Signed out — ' + (by || 'another shop') + ' opened in another tab.'); },
  onWipe: function(){ signedOut('Signed out — this browser is being cleaned.'); } });

/* a Lab sent here because its shop was signed out, or the browser is being cleaned, reads nothing — whatever is
   still in storage at this moment is on its way out */
var Q = new URLSearchParams(location.search);
if (Q.get('cleaned') === '1') signedOut('Signed out — this browser is being cleaned.');
else if (Q.has('left')) signedOut('Signed out — ' + (Q.get('left') || 'another shop') + ' opened in another tab.');
else open_();
</script>
</body>
</html>
