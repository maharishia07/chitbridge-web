<!doctype html>
<html lang="en" data-tokens="list">
<!-- OWNS  the CB Accounts page: Ledger · Day book · Dues · Month & year end · Returns (cap-books.js · cap-period.js paint the server's figures).
     CALLED BY Home's Accounts card (manifest /accounts.html), CB Finance and CRM links to a party's statement.
     FLOW  load → whoPaint (CBFrame) → the section's read (GET /api/books/…) → paint; a 401 ends the session
     CARD 16-finance/cb-accounts -->
<head>
<meta charset="utf-8">
<script src="/config.js"></script>   <!-- HX1: window.CB_API — this deploy's one api address -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounts</title>
<!-- ⭐ CB ACCOUNTS — the Ledger as its own page (Athi, 2026-10-01: "split the ledger system out of the rail menu
     and provide its own identity as CB Accounts and its own menu, profile page etc. — reuse the profile and avatar").
     The LOOK is the designer's handoff (docs/design/ledgers-page/: sidebar, pinned header, the Ledgers view); the RULES are
     docs/design/SYSTEM.md; e2e/cb-accounts.cjs proves both. The SCREENS are the app's own (app/cap-books.js — never a
     second copy of them), and the floor under them (tx, toast, the Ledger switch) is app/accounts-shell.js, which app.html
     loads too. This page is only: the shell, the Ledgers view, the Bills view, the off card and the gate.
     ⚠️ Never the two banned words on a screen — CB Accounts, Ledger, Day book. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* the designer's tokens, as handed over (docs/design/ledgers-page/styles.css) … */
:root{
  --ground:#fbf6ec; --surface:#fffdf8; --side:#f4ecdc; --sub:#fbf6ec;
  --ink:#2a2418; --ink-2:#3d3527; --muted:var(--grey); --muted-2:#5c5240;
  --line:#e6dcc6; --line-2:#efe6d3; --line-3:#d8ccb0; --hover:#f3ead7;
  --accent:#1f5f5b; --accent-ink:#fbf6ec;
  --personal:#1f5f5b; --real:#a0661a; --nominal:#6b4e9b;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --serif:'Source Serif 4',Georgia,serif;
  --sans:var(--f-ui,'IBM Plex Sans',system-ui,sans-serif);   /* --f-ui is the reading font the avatar chooses */
  /* … beside SYSTEM.md's status colours (green live · amber needs a hand · red wrong now · blue a link) */
  --green:#16693F; --green-d:#0D4A2B; --green-t:#E8F4ED; --green-b:#A9D3BC;
  --amber:#E0A020; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205;
  --red:#C4562F; --red-t:#FBEAE3; --red-b:#E7B9A8; --red-i:#8E3517;
  --blue:#2468BD; --blue-t:#E4EEFA; --blue-b:#B9D2EF; --blue-i:#174A87;   /* #2F74C9 read 4.37:1 under cream text and as text on cream (the thread's External · Send); 5.1:1 now (CRM2 walk) */
  /* the names app/cap-books.js paints its tables, chips and buttons with, mapped onto this page's palette */
  --fs-1:12px; --fs-2:13.5px; --fs-3:15px; --grey:#6f6450;   /* = the --muted below; --muted reads it, so a chosen theme's --grey reaches both */
  --page:#FCFAF5; --card:#fffdf8; --panel:#F3EFE6;   /* SYSTEM's neutrals, literal so e2e/a11y-contrast.cjs <page> can measure them */
  /* … and the names the app's search box (.srch) and the Ledgers tree's search paint with — CBList (list-ctl.js) carries its own look */
  --paper:var(--sub); --sel:var(--hover); --on-card:var(--ink); --ink-2:#3d3527; --on-accent:var(--accent-ink);
  /* ⚠️ LITERAL, not aliases of --amber-i / --green-d / --blue-t …: the avatar's data-tokens="list" rule points THOSE at these (--amber-t:var(--warn-tint)), so an alias back is a CYCLE — an invalid colour in every
     theme that does not carry the token. These are the Cream values the aliases resolved to. */
  --warn-2:#7A5205; --ok-2:#0D4A2B; --blue-d:#174A87; --blue-2:#174A87; --warn-tint:#FDF3DC; --blue-tint:#E4EEFA; --blue-tint-bg:#E4EEFA; --ok-tint:#E8F4ED;
  --accent-hover:#174a47; --accent-text:var(--accent); --tab-n:#e9dfc8; --shadow-toast:0 10px 24px rgba(42,36,24,.25);
}
/* ⭐ A THEME CHOSEN IN THE AVATAR (tokens inline on <html>, data-theme stamped) re-points THIS page's own names at the theme's. The fallbacks are
   the values above, and Cream is left alone, so a page nobody themed is exactly what it was. */
:root[data-themed]{--ground:var(--paper,#fbf6ec);--sub:var(--paper,#fbf6ec);--surface:var(--card,#fffdf8);--side:var(--card,#f4ecdc);   /* the theme's own surface, not --gold-soft (a brown in Dark), Athi 2026-10-03 */
  --muted-2:var(--grey,#5c5240);--line-2:var(--line,#efe6d3);--line-3:var(--line,#d8ccb0);
  --green-d:var(--ok-2,#0D4A2B);   /* the green chip's ink follows the theme like its tint (--green-t → --ok-tint): Dark painted #0D4A2B on #16281E, 1.5:1 (BR1 walk) */
  --ink-2:var(--ink);--accent:var(--blue-2);--accent-text:var(--blue-d);--accent-ink:var(--card);--accent-hover:color-mix(in srgb,var(--accent) 82%,var(--ink));--tab-n:var(--ground);--shadow-toast:var(--shadow,0 10px 24px rgba(0,0,0,.4))}   /* an --ink-2 the theme sets inline wins */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{scroll-padding-top:120px}
.cbl .cbl-list{scroll-padding-top:56px;scroll-padding-bottom:56px}   /* the list header is frozen: a row scrolled into view clears it */   /* the frozen header (56) + title bar (56+) never cover a control scrolled into view */
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:calc(15px * var(--k,1));line-height:1.45}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;height:calc(100vh - var(--cbk-h,0px));overflow:hidden;position:relative}   /* the kural footer (CBKural) is outside the head: it takes its height off the window */

/* Sidebar */
.side{width:248px;flex-shrink:0;height:100%;background:var(--side);border-right:1px solid var(--line-3);display:flex;flex-direction:column;transition:width .2s ease}
.side.collapsed{width:68px}
.side.collapsed .label{display:none}
.side.collapsed .nav-chev{transform:rotate(180deg)}
.brand{height:56px;flex-shrink:0;   /* 56 = the standard sidebar brand (page-skeleton.css) and the frame's bar in a pane: the two header lines meet (SHELL-ONE) */padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-3)}
.logo{width:34px;height:34px;flex-shrink:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.brand-text{display:flex;align-items:center;gap:8px;min-width:0}
.brand-name{font-family:var(--serif);font-size:19px;font-weight:700;white-space:nowrap}
.nav{flex-grow:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav-btn{width:100%;height:44px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 12px;border:none;border-radius:8px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:500;text-align:left;white-space:nowrap}
.nav-btn:hover{background:var(--hover)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 14%,var(--side));color:var(--accent-text);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nav-btn .n{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--amber-t);color:var(--amber-i)}
.nav-chev{transition:transform .2s ease}
/* the menu's groups: a small heading folds its group; on the icon rail (collapsed, a ledger open, a phone) the heading is a thin line and nothing is folded */
.nav-sec{display:flex;flex-direction:column;gap:2px}
.nav-sec.shut .nav-btn{display:none}
.nav-grp{display:flex;align-items:center;gap:6px;width:100%;min-height:30px;margin-top:10px;padding:4px 12px;border:0;border-radius:6px;background:none;color:var(--muted-2);font:inherit;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;text-align:left;cursor:pointer}
.nav-grp:hover{background:var(--hover)}
.nav-gchev{width:14px;height:14px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:2;transition:transform .2s ease}
.nav-grp[aria-expanded="false"] .nav-gchev{transform:rotate(-90deg)}
.side.collapsed .nav-grp{min-height:0;height:1px;margin:8px 10px;padding:0;background:var(--line-3);pointer-events:none}.side.collapsed .nav-gchev{display:none}.side.collapsed .nav-sec.shut .nav-btn{display:flex}
.side-foot{padding:8px;border-top:1px solid var(--line-3)}
.side-foot .nav-btn{font-size:13px;color:var(--muted-2)}

/* Main */
.main{flex-grow:1;min-width:0;height:100%;overflow-y:auto}
/* SHELL-ONE: the header is THE ONE FRAME (CBFrame → CBShell, #shell at the top of the main pane): mark · CB Accounts · the screen chip · ⌂ Home · bell · avatar.
   Nothing of it is drawn or styled here. Below it the view's own title row (the screen's heading), sticky with the content. */
#shell{position:sticky;top:0;z-index:11}
.titlebar{position:sticky;top:56px;z-index:10;background:color-mix(in srgb,var(--ground) 96%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);min-height:56px;justify-content:center;padding:8px 40px;display:flex;flex-direction:column;gap:16px}   /* 56 = the shell bar in a pane (shell.js .cbsh.pane: 55 + its line), the sidebar brand's height */
.titles{display:flex;flex-direction:column;gap:4px;min-width:0}
h1{margin:0;font-family:var(--f-display,'Bricolage Grotesque',sans-serif);font-size:28px;font-weight:800;letter-spacing:-.015em}   /* SYSTEM.md §2: the display face (no serif, SHELL-ONE) */
.summary{font-size:13.5px;color:var(--muted)}
.summary:empty{display:none}

.bk-skel{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.bk-skel i{display:block;height:38px;border-radius:8px;background:linear-gradient(90deg,var(--line-2),var(--sub),var(--line-2));background-size:200% 100%;animation:bksk 1.2s linear infinite}
@keyframes bksk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.bk-skel i{animation:none}}
.content{padding:24px 40px 120px;display:flex;flex-direction:column;gap:16px}   /* no width cap (T17): the page takes the screen; only prose is capped */
.empty{padding:48px 20px;text-align:center;border:1px dashed var(--line-3);border-radius:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty strong,.empty .t{font-family:var(--serif);font-size:19px;color:var(--ink);font-weight:700}
.empty .big{font-size:26px}
.empty button{height:44px;padding:0 16px;border:1px solid var(--accent);border-radius:8px;background:transparent;color:var(--accent-text);font-size:13.5px;font-weight:600}

/* the one card the page shows when something must happen first: Ledger off, signed out, another shop still here */
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px 22px 20px;max-width:560px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:14px}
.card.bad{border-color:var(--red-b);background:var(--red-t)}
.card.bad h2,.card.bad p{color:var(--red-i)}
.act{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;height:44px;padding:0 20px;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700;text-decoration:none}
.act:hover{background:var(--accent-hover)}
.act.ghost{background:transparent;color:var(--accent-text)}
.act[disabled]{opacity:.6;cursor:default}

/* Bills — the two system folders as two tabs, one step chip per bill (the server decides every step) */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{height:40px;padding:0 14px;display:flex;align-items:center;gap:8px;border:1px solid var(--line-3);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600}
.tab .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.tab[aria-pressed="true"] .n{color:var(--tab-n)}
.bills{display:flex;flex-direction:column;gap:8px}
.step{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line-3);font-size:12px;font-weight:700;background:var(--panel,#F3EFE6);color:var(--ink-2);justify-self:end}
.step.blue{background:var(--blue-t);border-color:var(--blue-b);color:var(--blue-i)}
.step.amber{background:var(--amber-t);border-color:var(--amber-b);color:var(--amber-i)}
.step.red{background:var(--red-t);border-color:var(--red-b);color:var(--red-i)}
.step.green{background:var(--green-t);border-color:var(--green-b);color:var(--green-d)}

/* ── the app's own screens (cap-books.js), dressed for this page ── */
.sec{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin:14px 0 8px}
.mono{font-family:var(--mono)}
.inp{width:100%;border:1px solid var(--line-3);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.supacts{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.supacts button,#bk_body button{min-height:40px;border:1px solid var(--line-3);background:var(--surface);color:var(--ink);border-radius:9px;padding:5px 12px;font-size:13.5px;font-weight:600}
.supacts button:hover,#bk_body button:hover{background:var(--hover)}
.optchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-3);border-radius:999px;padding:3px 10px;font-size:var(--fs-1);font-weight:600;background:var(--surface)}
.bktodo{min-height:44px}
.srch{display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line-3);border-radius:9px;padding:6px 10px;font-size:var(--fs-2);color:var(--grey)}
.srch input{border:0;background:none;outline:0;font:inherit;width:100%;color:var(--ink)}
.composebtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-size:var(--fs-1);font-weight:700;border-radius:9px;padding:5px 11px;cursor:pointer}
#bk_body select.inp{width:auto}
.loadwrap{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:var(--fs-2);padding:18px 0}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line-3);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#bk_body label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600}
#bk_body table{max-width:100%}

/* To do — one row a thing that needs doing: symbol · count · sentence · its one button; a phone puts the button under the sentence, full width */
.todo{display:flex;flex-direction:column;gap:10px;max-width:760px}
.todo-row{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:6px 12px;border:1px solid var(--amber-b);border-radius:12px;background:var(--amber-t);padding:12px 14px;color:var(--amber-i)}
.todo-row.off{border-color:var(--line-3);background:var(--surface);color:var(--muted-2)}
.todo-sym{font-size:18px}
.todo-n{font-size:15px;font-weight:700;min-width:1.5ch}
.todo-words{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.todo-go{align-self:center;white-space:nowrap}
.todo-ok{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--green-d);padding:18px 0}
.todo-ok.off{color:var(--muted-2)}
@media (max-width:620px){
  .todo-row{grid-template-columns:auto auto 1fr}
  .todo-go{grid-column:1 / -1;width:100%;min-height:44px}
}

/* Month & year end + Bank (app/cap-period.js, app/cap-bank.js): a card, a form, one line for what happened — tokens only */
.pe-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;margin:0 0 12px;max-width:820px;display:flex;flex-direction:column;gap:10px}
.pe-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px}
.pe-f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600;min-width:0}
.pe-f .inp{width:100%;min-height:44px}
.pe-bar{margin:0 0 12px}
.pe-slot:empty{display:none}
.pe-sub{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2)}
.pe-note{color:var(--muted-2);font-size:14px;padding:6px 0}
.pe-ok{border:1px solid var(--green-b);background:var(--green-t);color:var(--green-d);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.pe-bad,.pe-calm,.pe-warn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-radius:10px;padding:10px 12px;font-size:14px}
.pe-bad{border:1px solid var(--red-b);background:var(--red-t);color:var(--red-i)}
.pe-warn{border:1px solid var(--amber-b);background:var(--amber-t);color:var(--amber-i)}
.pe-calm{border:1px dashed var(--line-3);color:var(--muted-2)}
.pe-fix{min-height:40px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:9px;padding:0 14px;font-weight:700}
.pe-rows{display:flex;flex-direction:column}
.pe-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.pe-row span:first-child{min-width:0;overflow-wrap:anywhere}
.pe-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:18px;font-weight:700;padding-top:6px}
.pe-basis{font-weight:700;font-size:14px}
.pe-check{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.pe-check.ok>span:first-child{color:var(--green-d)}.pe-check.bad>span:first-child{color:var(--red-i)}
.pe-tab{height:40px;padding:0 14px;display:flex;align-items:center;gap:8px;border:1px solid var(--line-3);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600}
.pe-tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.pe-bank{display:flex;flex-direction:column;gap:12px}
@media (max-width:620px){.pe-card{padding:12px}#bk_body .pe-fix,#bk_body .pe-bar button,#bk_body .pe-card .supacts button,.pe-tab{min-height:44px}#bk_body .pe-card .supacts button{flex:1 1 100%}}

/* toast (app/accounts-shell.js writes into #toast) */
dialog.sheet{border:1px solid var(--line-3,#d8ccb0);border-radius:14px;padding:0;width:min(520px,94vw);max-height:92vh;background:var(--surface,#fffdf8);color:var(--ink,#241f14)}
dialog.sheet::backdrop{background:var(--scrim,rgba(0,0,0,.4))}
/* ⚠️ WX-P2P-14 (2026-10-13, the real stack): the sheet's body had no height here, so Pay for a supplier with 370 open bills grew the dialog to
   12,000 px — Record sat off screen at 390 (and at 1366). The sheet grammar finance.html / crm.html already carry: the head and the foot stay,
   only the body scrolls (SYSTEM rule 8 — only rows scroll). Same rules, same names; one of the three copies should become the shared file. */
dialog.sheet .mhd{padding:16px 20px 4px;display:flex;align-items:center;gap:10px}
dialog.sheet .mhd .t{font-family:var(--serif);font-size:20px;font-weight:700;flex:1;padding-inline-end:36px}
dialog.sheet .mx{border:0;background:none;font-size:18px;min-width:40px;min-height:40px;border-radius:8px;color:var(--muted)}
dialog.sheet .mbody{padding:8px 20px 12px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:62vh}
dialog.sheet .mbody label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600}
dialog.sheet .mfoot{padding:10px 20px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line-2,#e6dcc4)}
dialog.sheet .mfoot button{min-height:40px;padding:0 16px;border:1px solid var(--line-3);border-radius:9px;background:transparent;color:var(--ink);font-weight:600}
dialog.sheet .mfoot button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
dialog.sheet .mfoot button[disabled]{opacity:.6}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:min(520px,92vw)}
#toast .toast{background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow-toast)}
#toast .toast.err{background:var(--red-i)}
#toast .toast.warn{background:var(--amber-i)}
#toast button{margin-left:10px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:2px 10px}

.scroll::-webkit-scrollbar{width:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:10px;border:3px solid var(--ground)}

  } /* bills to accept: the Received bills, where they are accepted */,
  supplier: () => {
    location.href = CB_HOMES.suppliers;
  }
}; /* suppliers to add: the CRM supplier list, where Add party lives */
BK.views = {
  bills: (body) => accBills(body),
  todo: (body) => accTodo(body),
  receivables: (b) => bkDues(b, 'rcv'),
  payables: (b) => bkDues(b, 'pay'),
  closingstock: (b) => peStockView(b),
  assets: (b) => peAssetsView(b),
  accruals: (b) => peAccrualsView(b),
  gstclose: (b) => peGstView(b),
  yearclose: (b) => peYearView(b),
  bank: (b) => bankView(b),
  movein: (b) => miView(b),
  compare: (b) => cmpView(b),
  rates: (b) => fxView(b)
}; /* the Ledgers view is cap-books.js's own: the folder tree + the Task table */
function show(view) {
  if (!ON) {
    chrome(NAV.some((item) => item[0] === view) ? view : 'todo');
    return;
  } /* the frame is up before the Ledger has answered: a tap on the menu is remembered (the hash) and opened when it does */
  $('content').innerHTML = '<div id="bk_body" data-testid="bk-body"></div>';
  bkTab(view, true);
}

$('content').addEventListener('click', (e) => {
  const node = e.target.closest('.tab');
  if (node) {
    ACC.billTab = node.dataset.code;
    bkTab('bills', true);
  }
});

/* ═══ BILLS — the two system folders (GET /api/folders → B-2100 Received, B-1300 Issued) as two tabs ═════════════ */
/* the step chip's colour by the step the SERVER names (bill.step); the words are the server's label — the page never decides a step */
const STEP_TONE = { received: '', goods_checked: 'blue', accepted: 'amber', disputed: 'red', issued: '', closed: 'green' };
/* a bill is a CBList row (list-ctl.js): Supplier / Customer · Bill no · Amount · Date · Step — the step chip is the server's word. Its click opens the sheet; its next level says who took it and when. */
function accBillCols() {
  const dash = '<span style="color:var(--muted)">—</span>',
    received = ACC.billTab === 'B-2100';
  return [
    {
      key: 'who',
      label: received ? 'Supplier' : 'Customer',
      prio: 1,
      sort: 'who',
      w: 300,
      html: true,
      cell: (c) => esc(c.counterparty_name || c.manual_subject || c.auto_subject || '') || dash
    },
    {
      key: 'no',
      label: 'Bill no',
      prio: 4,
      sort: 'no',
      w: 170,
      html: true,
      cell: (c) => (c.bill_no ? '<span class="mono">' + esc(c.bill_no) + '</span>' : dash)
    },
    {
      key: 'amount',
      label: 'Amount',
      prio: 3,
      sort: 'amount',
      num: true,
      w: 150,
      html: true,
      cell: (c) => (c.value != null && c.value !== '' ? esc(CBLocale.money(Number(c.value), c.currency || bkCur())) : dash)
    },
    {
      key: 'date',
      label: 'Date',
      prio: 5,
      sort: 'date',
      w: 130,
      html: true,
      cell: (c) => {
        const d = c.created_at || (c.bill || {}).at;
        return d ? esc(bkDate(d)) : dash;
      }
    },
    {
      key: 'step',
      label: 'Step',
      prio: 2,
      sort: 'step',
      w: 240,
      html: true,
      cell: (c) => {
        const b = c.bill || {};
        return b.label
          ? `<span class="step ${STEP_TONE[b.step] || ''}" data-testid="bill-step-${esc(c.chit_id)}" data-step="${esc(b.step || '')}">${esc(b.label)}</span>`
          : dash;
      }
    }
  ];
}
function accBillNext(c) {
  const b = c.bill || {};
  /* who accepted: the person's NAME (the field the other rows show), never their user id — the id is the last resort */
  const by =
    b.by_name ||
    b.by_display_name ||
    ((c.all_recipients || []).find((x) => x && [x.user_id, x.handle, x.entity_handle, x.bridge_id].indexOf(b.by) >= 0 && x.display_name) || {}).display_name ||
    b.by;
  const rows = [
    c.manual_subject || c.auto_subject ? [tx('Subject'), esc(c.manual_subject || c.auto_subject)] : null,
    by ? [tx('By'), esc(by)] : null,
    b.at ? [tx('Step on'), esc(bkDate(b.at))] : null
  ].filter(Boolean);
  return (
    '<div data-testid="bill-next-' +
    esc(c.chit_id) +
    '">' +
    (rows.length
      ? rows.map((item) => CBList.nextRow(['<span style="color:var(--muted)">' + item[0] + '</span> ' + item[1]], [])).join('')
      : '<div style="color:var(--muted);font-size:var(--fs-1)">' + esc(tx('Nothing more is recorded')) + '</div>') +
    '</div>'
  );
}
async function accBills(body) {
  try {
    /* the folder list arrives through cap-folders.js's own splitter (_foldersFrom → UI.sysFolders), as the app reads it */
    _foldersFrom(await api('foldersList'));
    const sys = (UI.sysFolders || [])
      .filter((item) => item.code === 'B-2100' || item.code === 'B-1300')
      .sort((first, second) => (first.code === 'B-2100' ? -1 : 1) - (second.code === 'B-2100' ? -1 : 1));
    if (!sys.length) {
      body.innerHTML = emptyState('🧾', tx('No bills folders'), '');
      return;
    }
    if (!sys.some((item) => item.code === ACC.billTab)) ACC.billTab = sys[0].code;
    const cur = sys.find((item) => item.code === ACC.billTab);
    const rows = await api('folderChits', { params: { id: cur.folder_id }, query: { state: 'open' } });
    /* ⚠️ api() collapses {chits:[…]} to the array (see loadFolderChits) */
    const list = Array.isArray(rows) ? rows : (rows && (rows.chits || rows.rows || rows.data)) || [];
    const word = (f) => (f.code === 'B-2100' ? 'Received' : 'Issued');
    const tabs =
      '<div class="tabs" role="tablist">' +
      sys
        .map(
          (item) =>
            `<button type="button" class="tab" role="tab" data-testid="bills-tab-${esc(item.code)}" data-code="${esc(item.code)}" aria-pressed="${item.code === ACC.billTab}">${word(item)}<span class="n">${Number(item.count) || 0}</span></button>`
        )
        .join('') +
      '</div>';
    const by = (f, num) => (a, b) => (num ? f(a) - f(b) : String(f(a)).localeCompare(String(f(b)), undefined, { numeric: true }));
    body.innerHTML = tabs + '<div id="bkl_bills" data-testid="bills-list"></div>';
    CBList.reset('bills'); /* the Received and the Issued tab are two lists: a search or an open row does not carry across */
    CBList.mount($('bkl_bills'), {
      key: 'bills',
      t: tx,
      rows: () => list,
      id: (c) => c.chit_id,
      columns: accBillCols(),
      rowTid: (c) => 'bill-' + c.chit_id,
      /* WX-O2C (2026-10-13): all five by default — the top-3-by-prio default hid the Bill no and the Date at 1366 beside empty space,
         and the number is what a shopkeeper reads a bill by. Narrower containers still drop to cards (CBList). */
      defaultCols: ['who', 'no', 'amount', 'date', 'step'],
      /* a bill's row opens its sheet; its caret opens who took it and when */
      onOpen: (c) => openChitSheet(c.chit_id),
      search: (c) => [c.counterparty_name, c.bill_no, c.manual_subject, c.auto_subject, (c.bill || {}).label, c.value].join(' '),
      sorts: [
        { key: 'date', label: tx('Newest first'), cmp: (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')) },
        { key: 'who', label: tx('Name'), cmp: by((c) => c.counterparty_name || '') },
        { key: 'no', label: tx('Bill no'), cmp: by((c) => c.bill_no || '') },
        { key: 'amount', label: tx('Amount'), cmp: by((c) => Number(c.value) || 0, true) },
        { key: 'step', label: tx('Step'), cmp: by((c) => (c.bill || {}).label || '') }
      ],
      next: accBillNext,
      empty: { title: tx('Nothing open') }
    });
  } catch (e) {
    body.innerHTML = bkErr(e);
  }
}

/* ═══ TO DO — what the owner has to do next. GET /api/books/todo lists the checks (docs/design/cb-accounts-ia §1): a row is a symbol · a count · the server's sentence · ONE button.
   The page decides nothing: it draws what the API sends, and opens the page the row's action names. ═══ */
/* the API's `action.screen` → the tab that opens it. A screen with no page yet is not in here: its button says it starts after an update. */
const TODO_SCREEN = {
  waiting: 'waiting',
  ledgers: 'ledgers',
  periods: 'lock',
  daybook: 'daybook',
  dues: 'receivables',
  cheques: 'cheques',
  bills: 'bills',
  packs: 'packs',
  opening: 'opening',
  'closing-stock': 'closingstock',
  gst: 'gstclose',
  recurring: 'accruals',
  accruals: 'accruals',
  'year-close': 'yearclose',
  assets: 'assets',
  bank: 'bank'
};
/* an item the server could not check (503 · not migrated yet) is not a task: it says so, and its button waits */
const todoOff = (it) => it && (it.status === 503 || it.not_migrated === true || it.migrated === false || it.available === false);
function todoGo(i) {
  const it = ACC.todo && ACC.todo[i];
  if (!it) return;
  const tab = TODO_SCREEN[(it.action || {}).screen];
  if (tab) show(tab);
  else toast(tx('This starts after an update'));
}
function todoRow(it, i) {
  const off = todoOff(it),
    a = it.action || {};
  return `<div class="todo-row${off ? ' off' : ''}" data-testid="todo-row-${esc(it.kind)}" data-kind="${esc(it.kind)}">
    <span class="todo-sym" aria-hidden="true">${off ? '⏳' : '⚠'}</span>
    <span class="todo-n mono" data-testid="todo-n-${esc(it.kind)}">${off ? '' : Number(it.count) || 0}</span>
    <span class="todo-words" data-testid="todo-words-${esc(it.kind)}">${esc(off ? tx('Starts after an update') : it.words)}</span>
    <button type="button" class="act todo-go" data-testid="todo-go-${esc(it.kind)}" data-i="${i}"${off ? ' disabled' : ''}>${esc(a.label || tx('Open'))}</button>
  </div>`;
}
async function accTodo(body) {
  const g = ACC.gen;
  try {
    const reply = await api('booksTodo');
    if (g !== ACC.gen) return;
    const list = (Array.isArray(reply) ? reply : (reply && (reply.items || reply.todo)) || []).slice();
    /* BR1: the bank lines that need a person — counted on THIS device (the statement never reaches the server), drawn by the same row */
    const bank = typeof bankTodoItem === 'function' ? bankTodoItem() : null;
    if (bank && !list.some((x) => x.kind === 'bank')) list.push(bank);
    ACC.todo = list;
    body.innerHTML = list.length
      ? '<div class="todo" data-testid="todo-list">' + list.map(todoRow).join('') + '</div>'
      : '<div class="todo-ok" data-testid="todo-none">✓ ' + esc(tx('Books up to date')) + '</div>';
    body.querySelectorAll('.todo-go').forEach((item) => {
      item.onclick = () => todoGo(+item.getAttribute('data-i'));
    });
  } catch (e) {
    body.innerHTML = e && e.status === 503 ? '<div class="todo-ok off" data-testid="todo-503">⏳ ' + esc(tx('Starts after an update')) + '</div>' : bkErr(e);
  }
}

/* a table becomes one card per row on a phone: each cell is named by its column head (SYSTEM rule 8) */
function cardLabels(root) {
  root.querySelectorAll('table.bktab').forEach((item) => {
    const heads = Array.from(item.querySelectorAll('thead th')).map((node) => node.textContent.trim());
    item.querySelectorAll('tbody tr, tfoot tr').forEach((tr) => {
      let col = 0;
      Array.from(tr.children).forEach((td) => {
        if (!td.hasAttribute('data-l') && heads[col]) td.setAttribute('data-l', heads[col]);
        col += td.colSpan || 1;
      });
    });
  });
}
new MutationObserver(() => cardLabels($('content'))).observe($('content'), { childList: true, subtree: true });

/* ═══ THE STATES BEFORE THE LEDGER: signed out · another shop still here · the Ledger off ═══════════════════════ */
function card(html, bad) {
  document.body.classList.remove('lg-on', 'lg-sel');
  $('title').hidden = true;
  $('content').innerHTML = `<div class="card${bad ? ' bad' : ''}" data-testid="acc-card">${html}</div>`;
  $('summary').textContent = '';
}
function signedOut(why) {
  SESS = null;
  MINE = null;
  ON = false;
  ACC.gen++;
  whoPaint(); /* the frame stays: its avatar is the Sign in door to the card below */
  navPaint('');
  $('nav').innerHTML = '';
  /* ⭐ M14: the one sign-in window, here in the card — mobile number or e-mail, the first-time PIN step; signed in → start() */
  card(`<h2>${esc(why || 'You are signed out')}</h2><div id="signin-host" data-testid="signin-host"></div>`);
  CBSignin.mount($('signin-host'), {
    apiBase: CFG.API_BASE,
    surface: 'accounts',
    need: 'person',
    onIn: function () {
      start();
    }
  });
}
/* another shop still here (an app tab, its unsent drafts) → the Ledger waits; one sentence, one button each (CBOnePerson) */
function closeFirst(r) {
  $('nav').innerHTML = '';
  card(
    r.others
      .map(
        (item, index) => `<h2 data-testid="close-first">${esc(CBOnePerson.sentence(item))}</h2>
      <button type="button" class="act" data-testid="close-first-go" data-i="${index}">${esc(CBOnePerson.buttonLabel(item))}</button>`
      )
      .join(''),
    true
  );
  $('content')
    .querySelectorAll('[data-testid="close-first-go"]')
    .forEach((item) => {
      item.onclick = () => {
        $('content')
          .querySelectorAll('button')
          .forEach((x) => {
            x.disabled = true;
          });
        item.textContent = 'Signing it out…';
        CBOnePerson.clearOut(r.others[+item.getAttribute('data-i')], MINE.name).then(start, start);
      };
    });
}
/* the Ledger is off: ONE card. The owner switches it on here (CBLedger — the same words, confirm and call as Settings and the
   index tile); anyone else is told whom to ask. */
function offCard() {
  ON = false;
  navPaint('');
  $('nav').innerHTML = '';
  card(
    `<h2 data-testid="acc-off">Accounts is not switched on</h2>` +
      (isOwner()
        ? `<button type="button" class="act" data-testid="acc-switch-on" id="switchOn">Switch on</button>`
        : `<p data-testid="acc-ask-owner">Ask the owner to switch it on</p>`)
  );
  const node = $('switchOn');
  if (node)
    node.onclick = () =>
      CBLedger.run(true, {
        ask: confirmAsk,
        working: () => {
          node.disabled = true;
          node.textContent = 'Working…';
        },
        call: (on) => CBLedger.call({ api: api }, on),
        done: () => start(),
        failed: (e) => {
          node.disabled = false;
          node.textContent = 'Switch on';
          toast(tx('Could not switch it on.') + ' ' + friendlyErr(e));
        }
      });
}
function failedCard() {
  card(
    `<h2>Accounts could not be read</h2><p>Check the connection, then try again.</p><button type="button" class="act" data-testid="acc-retry" id="retry">Try again</button>`,
    true
  );
  $('retry').onclick = () => start();
}
/* ⭐ CS1: the country decides whether books may open here — a country with no pack (or no country, or the setup still to do) is SAID in the
   server's own sentence (engines regulation.status, 422 with a code), never the quiet 404 and never India's rules by default. The one button
   that fixes it is the Country setup step; a co-assist is told whom to ask. Selling and the rail still work. */
function countryCard(d) {
  ON = false;
  navPaint('');
  $('nav').innerHTML = '';
  const pending = d && d.code === 'COUNTRY_SETUP_PENDING';
  card(
    `<h2 data-testid="acc-country">${pending ? 'Country setup first' : 'No books here yet'}</h2>
    <p data-testid="acc-country-why">${esc((d && d.message) || '')}</p>` +
      (isOwner()
        ? `<a class="act" data-testid="acc-country-setup" href="/settings.html#/country">${pending ? 'Country setup' : 'See country setup'}</a>`
        : `<p data-testid="acc-ask-owner">Ask the owner</p>`)
  );
}

/* ═══ START ═══════════════════════════════════════════════════════════════════════════════════════════════════ */
async function start() {
  SESS = session();
  if (!SESS) return signedOut('');
  MINE = CBOnePerson.who(SESS);
  SESSION = Object.assign(
    { token: null },
    {
      entityId: MINE && MINE.ent,
      token: SESS.token,
      role: SESS.role,
      name: SESS.name,
      entity: SESS.entity,
      bridgeId: SESS.bridgeId,
      duty: SESS.duty,
      shop: SESS.shop
    }
  );
  whoPaint();
  const g = ++ACC.gen;
  /* ⭐ UI9: the WHOLE frame at once — the menu, the title and the rows' room — before anything is read; the views then fill only the rows.
     (The Ledger's answer below can still turn this into the "not switched on" card; nothing here reads or writes.) */
  {
    const f0 = (location.hash || '').replace(/^#\/?/, ''),
      v0 = NAV.some((item) => item[0] === f0) ? f0 : 'todo';
    chrome(v0);
    if (v0 !== 'ledgers')
      $('content').innerHTML = '<div class="bk-skel" aria-busy="true" data-testid="acc-skeleton"><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  }
  /* ⭐ ONE BROWSER, ONE SHOP: nothing is read until this browser holds no other shop's fingerprint */
  let t;
  try {
    t = await CBOnePerson.traces(MINE);
  } catch (_) {
    t = { others: [] };
  }
  if (g !== ACC.gen || !MINE) return;
  if (t.others.length) return closeFirst(t);
  try {
    const reply = await api('booksHealth'); /* 404 = the Ledger is off for this shop */
    BK.waiting = (reply && reply.waiting) || [];
    if (reply && reply.year) BK.year = reply.year; /* the shop's year — cap-books bkFyNow / bkMonths paint it, never an April of their own */
    if (reply && reply.currency) BK.cur = reply.currency; /* the ledger's money — bkCur's answer when a figure names none */
    ON = !!(reply && reply.enabled !== false);
    if (reply && reply.currency)
      SESSION.currency =
        reply.currency; /* CX0: the ledger's currency (AUD · AED · INR) — Receive / Pay send it; 'INR' typed here refused an AU shop (routes/books.js:520) */
    if (reply && reply.country && reply.country.country && reply.country.country.code)
      SESSION.country = reply.country.country.code; /* CX0: the shop's country (CS1 status) — the pack's words on this page (shopReg) */
  } catch (e) {
    if (e && e.status === 404) return offCard();
    if (e && e.status === 422 && e.data && /^(NO_COUNTRY_PACK|NO_COUNTRY|COUNTRY_SETUP_PENDING)$/.test(String(e.data.code || ''))) return countryCard(e.data);
    return failedCard();
  }
  if (!ON) return offCard();
  const first = (location.hash || '').replace(/^#\/?/, '');
  show(NAV.some((item) => item[0] === first) ? first : 'todo');
}

/* ⭐ THE ONLY READER OF THE `storage` EVENT HERE: a session gone, or now another SHOP's, signs this page out and says why */
window.addEventListener('storage', (e) => {
  if (e.key !== null && e.key !== 'cb_sess') return;
  if (!MINE) return;
  const next = CBOnePerson.stored();
  if (next && next.ent === MINE.ent) return;
  signedOut(next ? 'Signed out — ' + CBOnePerson.shopName(next) + ' opened in another tab.' : 'Signed out — you signed out in another tab.');
});
/* the one-shop gate, attached the way the Labs attach it (offer-lab-next.html): this tab answers the roll and leaves when
   its shop is signed out or the browser is cleaned — to the home page, which reads nothing while that runs */
CBOnePerson.attach({
  quiet: true,
  who: () => MINE,
  label: () => 'Accounts',
  onLeave: (by) => {
    location.replace('/?left=' + encodeURIComponent(by || ''));
  },
  onWipe: () => {
    location.replace('/?cleaned=1');
  }
});
/* ⭐ THE # DECIDES THE PAGE (M138): Back, Forward and a typed or shared link land on the page the address says. chrome() writes the # with replaceState, which fires nothing, so a click never loops here. */
function hashView() {
  const v = (location.hash || '').replace(/^#\/?/, '');
  return NAV.some((item) => item[0] === v) ? v : null;
}
window.addEventListener('hashchange', () => {
  const v = hashView();
  if (v && ON && v !== BK.tab) show(v);
});
if (window.CBKural) CBKural.mount();
start();
</script>
