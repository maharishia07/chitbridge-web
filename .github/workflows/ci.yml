name: web-ci

# Guards the web app on every push/PR — only checks that run OFFLINE, with no npm install and no other repo.
#
# ⚠️ 2026-09-28: this was RED ON EVERY PUSH for seven weeks. Its second step ran scripts/check-demo-leak.js, which was
#    deleted with the demo itself on 2026-08-10 (d54ee414 "delete the demo from the codebase") — the check had nothing
#    left to guard and the step was never removed, so the one CI signal the repo had meant nothing. Removed here, and
#    the offline half of `npm run check` put in its place so a red means a real fault again.
#
# NOT here, and why (run them locally with `npm run check`):
#   check:engines   reads ../chitbridge-engines (a sibling checkout)
#   check:envelope  reads ../chitbridge-api (a sibling checkout)
#   (check:pins also reads the api — it IS here: the api is public and is checked out as the job's last step)
#   check:till      needs Playwright (a browser) — an install this job deliberately does not do

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax (app.html inline + app/*.js)
        run: node scripts/check-syntax.js
      - name: The page parses as a whole
        run: node scripts/check-app-parses.cjs
      - name: Every top-level function declared once
        run: node e2e/dup-functions.cjs
      - name: Static guards
        run: node e2e/guard-static.cjs
      - name: Every typed amount is the one money input (M36)
        run: node e2e/money-input-guard.cjs
      - name: Cart, steps, adoption
        run: |
          node scripts/cart-ui.test.mjs
          node scripts/cap-network-render.test.mjs
          node scripts/step-flow.test.mjs
          node scripts/check-adoption.js
      - name: Screen reads, lazy screens, modals, tax, markup, controls, order, calls, a11y, endpoints
        run: |
          node e2e/screen-reads.cjs
          node e2e/lazy-screen-guard.cjs
          npm run check:modal
          npm run check:tax
          npm run check:markup
          npm run check:controls
          npm run check:order
          npm run check:calls
          npm run check:a11y
          npm run check:eps
      - name: Every capability's CMDB record link resolves (shape-only without the API repo beside it)
        run: node e2e/cmdb-records.cjs
      - name: Every stand-in that answers /api/books or /api/crm holds its answers to the API contract (M43)
        run: node e2e/contract.cjs
      - name: No NEW raw colour in a page or app file (ratchet; e2e/token-guard.baseline.json)
        run: node e2e/token-guard.cjs
      - name: The process map names files and functions that exist (PM1; docs/process/flows.json)
        run: node e2e/process-map.cjs
      - name: Docs beside the code have not drifted (MODULES.md; regenerate with node tools/gen-modules-doc.cjs)
        run: node e2e/docs-guard.cjs
      # ⭐ T1-TAX (14 Oct): the web and the api pin the SAME engine versions — web's packs sat at v1.42 while the api booked on v1.45.
      # The api is public; checked out LAST (after every other step) so no earlier guard sees a second tree. Twin branch as walks.yml.
      - name: Twin api branch?
        id: twin
        env:
          B: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$B" ] && git ls-remote --exit-code --heads https://github.com/maharishia07/chitbridge-api "$B" >/dev/null 2>&1; then
            echo "ref=$B" >> "$GITHUB_OUTPUT"; else echo "ref=main" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        with:
          repository: maharishia07/chitbridge-api
          ref: ${{ steps.twin.outputs.ref }}
          path: .side/chitbridge-api
      - name: Every engine both the web and the api pin is at one version (e2e/engines-pins-agree.cjs)
        env:
          CB_API_REPO: .side/chitbridge-api
        run: node e2e/engines-pins-agree.cjs


  scan:
    # E02 — dependency + secret scanning on every push/PR.
    #  1) npm audit: shipped (production) dependencies must carry no high/critical advisory. Dev-only tooling is
    #     listed in RETIRED.md instead of gating (a dev tool is never deployed).
    #  2) gitleaks-action: the commits this push/PR adds.
    #  3) gitleaks on the WHOLE working tree (not history). .gitleaks.toml names the only allowed files.
    name: scan (npm audit + gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks (whole working tree, no history)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -e
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/gl.sum" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "$RUNNER_TEMP/gl.sum" | sed "s|  .*|  $RUNNER_TEMP/gl.tgz|" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git --source . --config .gitleaks.toml --redact --verbose --exit-code 2
      # 14 Oct: the commits of this push / PR through the FREE CLI (gitleaks-action@v2 demanded a paid licence whenever its owner lookup
      # failed — a flake that blocked green PRs). Same binary as the step above; same config.
      - name: gitleaks (commits in this push / PR)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then RANGE="$HEAD~1..$HEAD"; else RANGE="$BASE..$HEAD"; fi
          echo "scanning commits $RANGE"
          "$RUNNER_TEMP/gitleaks" detect --source . --log-opts="$RANGE" --config .gitleaks.toml --redact --verbose --exit-code 2
