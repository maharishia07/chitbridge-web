<!doctype html>
<meta charset="utf-8">
<title>Network store — design mock</title>
<!--
  design-mock.html — a PAPER PROTOTYPE of the network store page. No API, no build, no deploy, no migration.

  Athi, 2026-08-08: *"we can look at design locally, fix everything and then wire it — each fix takes long time and
  tokens. What is the easy way to fix only the UX and placements, then we can take it to the code?"*

  Right. Every layout change so far has cost an edit to the real app, a parse check, a push, a Vercel build and a
  hard refresh — for something that is a drawing decision. This file is the drawing. It is self-contained: open it
  directly, or hit /design-mock.html on the deployed site. Change it, refresh, look. When the shape is settled, it
  gets ported into cap-network.js once, deliberately.

  ⚠️ NOTHING HERE IS REAL. The data is invented, nothing saves, nothing is validated. That is the point — a
  prototype that quietly half-works is worse than one that obviously does not.

  THE QUESTION IT IS EXPLORING: *"how the settings of the root are to be transferred to the child nodes — currency,
  location, trade-ready and so on."*
-->
<style>
  :root{ --line:#e5e8ee; --grey:#6b7280; --blue:#2c5aa0; --ink:#1c2128; --paper:#f7f8fa; }
  *{ box-sizing:border-box }
  body{ margin:0; font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:var(--paper) }
  .bar{ background:#0F2E3D; color:#cfe0ea; padding:9px 16px; font-size:12px; display:flex; gap:12px; align-items:center }
  .bar b{ color:#fff }
  .wrap{ display:flex; height:calc(100vh - 36px) }
  .left{ width:290px; border-right:1px solid var(--line); background:#fff; padding:12px 8px; overflow:auto; flex:0 0 auto }
  .right{ flex:1; overflow:auto; padding:18px 22px; max-width:820px }
  .nd{ padding:7px 9px; border-radius:8px; cursor:pointer; font-size:12.5px }
  .nd.on{ background:#eef4fc; color:var(--blue); font-weight:700 }
  .nd .sub{ font-size:10.5px; color:#8a94a3; margin-left:13px }
  .chip{ font-size:9.5px; font-weight:800; border-radius:5px; padding:1px 5px; margin-left:6px }
  h1{ font-size:19px; margin:0 }
  .hd{ font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--blue); margin-top:3px }
  .kind{ font-size:11.5px; color:var(--grey); margin-top:2px }
  .tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; padding-bottom:12px; border-bottom:1px solid var(--line) }
  .tab{ display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:9px; font-size:13px;
        border:1px solid var(--line); background:transparent; color:#8a94a3; cursor:pointer; white-space:nowrap }
  .tab.has{ color:var(--ink) } .tab.on{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700 }
  .tab .ic{ width:16px; text-align:center; font-size:14px }
  .dot{ width:6px; height:6px; border-radius:50%; background:#2c7a43 }
  .tab.on .dot{ background:rgba(255,255,255,.8) }
  .pane{ padding-top:16px }
  .fld{ padding:11px 0; border-bottom:1px solid var(--line) }
  .fld:last-child{ border-bottom:0 }
  .lbl{ font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--grey) }
  .val{ font-size:13.5px; margin-top:3px; display:flex; align-items:center; gap:9px; flex-wrap:wrap }
  .src{ font-size:10px; font-weight:800; letter-spacing:.03em; border-radius:5px; padding:1px 6px }
  .inh{ background:#eef2f7; color:#5b6472 }
  .own{ background:#e6f4ec; color:#2c7a43 }
  .cap{ background:#f6ecd8; color:#8a5a1e }
  .act{ font-size:11.5px; color:var(--blue); cursor:pointer; margin-left:auto }
  .note{ font-size:11.5px; color:var(--grey); margin-top:5px; line-height:1.5 }
  .box{ border:1px solid var(--line); border-radius:11px; background:#fff; padding:4px 15px; margin-top:12px }
  .legend{ border:1px solid #e0d3b0; background:#fdf8ec; border-radius:11px; padding:13px 15px; margin-top:18px; font-size:12.5px; line-height:1.65 }
  .legend h3{ margin:0 0 7px; font-size:12px; letter-spacing:.04em; color:#7a6428 }
  input,select{ padding:6px 9px; border:1px solid var(--line); border-radius:7px; font-size:13px; font-family:inherit }
</style>

<div class="bar">
  <b>DESIGN MOCK</b> — nothing here is real, nothing saves.
  <span style="margin-left:auto">exploring: how the network's settings reach its stores</span>
</div>

<div class="wrap">
  <div class="left" id="tree"></div>
  <div class="right" id="page"></div>
</div>

<script>
/* ── THE MODEL BEING TRIED ────────────────────────────────────────────────────────────────────────────────────
   Every setting on a store is one of three things, and the difference is the whole design:

     INHERITED  the network said it, this store has not disagreed. Change it at the root and it changes here.
     SET HERE   this store overrode it. It stops following the network for that one field.
     CAPPED     the network sets a CEILING, not a default. The store may go narrower, never wider.

   CB already does both halves without naming them together: catalogue fields carry per-field provenance (owned vs
   referenced), and visibility is a genuine cap. This is the same two ideas applied to a store's settings.        */
var NET = {
  name: 'alpha timers', handle: 'alpha-timers',
  currency: 'EUR', country: 'DE', city: 'Hamburg',
  certs: 'CE, ISO 9001', priceBand: '12% – 22%', disputes: 'Handled by the network',
};
/* The ROOT's catalogue — authored once, referenced by every store. Pictures and video live with the SKU. */
var SKUS = [
  { sku:'CR-32-4', name:'Vertical multistage pump CR 32-4', eur:1840, img:'🖼️ 4', vid:'🎬 1', unit:'each' },
  { sku:'MQ3-45',  name:'Booster set MQ3-45',               eur: 620, img:'🖼️ 3', vid:'🎬 0', unit:'each' },
  { sku:'SEAL-11', name:'Shaft seal kit (11 mm)',           eur:  48, img:'🖼️ 1', vid:'🎬 0', unit:'kit'  },
];
/* What a store adds ON TOP of the reference price to reach its own. Percentages, per store. */
var LANDED = { rate:{ EUR:1, LKR:335.0, INR:91.5 }, importPct:15, taxPct:18, handlePct:4 };
var STORES = [
  { key:'east',  name:'East',  vis:'Private', purpose:'Cash counter' },
  { key:'north', name:'North', vis:'Public',  purpose:'Walk-in showroom',
    own:{ currency:'INR', country:'IN', city:'Coimbatore' } },
  { key:'west',  name:'West',  vis:'Network', purpose:'Supplies the westside stores',
    own:{ currency:'LKR', country:'LK', city:'Colombo', certs:'SLS' } },
];
/* The full menu, matching the real app. `soon` = captured on the design, not enforced by the platform yet. */
var TABS = [
  ['general','⚙️','General'], ['catalogue','🗂️','Catalogue'], ['storefront','🛒','Storefront'],
  ['coassist','🧑‍🤝‍🧑','Co-assists'], ['transact','🔄','Transact'], ['tradeready','🛡️','Trade-ready'],
  ['dispute','⚖️','Dispute'], ['place','📍','Place'],
  ['territory','🗺️','Territory',1], ['stock','📦','Stock',1], ['fulfil','🚚','Fulfilment',1],
  ['money','💱','Price policy',1], ['localise','📜','Localisation',1],
];
var sel = 'west', tab = 'general';

function fld(label, value, source, hint){
  var cls = source === 'own' ? 'own' : source === 'cap' ? 'cap' : 'inh';
  // 'FROM NETWORK' alone would imply the value follows the network live. It does not — it is COPIED at Build.
  // Saying so costs three words and keeps the label from being a small lie until real inheritance is built.
  var word = source === 'own' ? 'SET HERE' : source === 'cap' ? 'CAPPED BY NETWORK' : 'FROM NETWORK · AT BUILD';
  var act  = source === 'own' ? 'use the network’s' : source === 'cap' ? '' : 'override for this store';
  return '<div class="fld"><div class="lbl">' + label + '</div>'
    + '<div class="val"><span>' + value + '</span><span class="src ' + cls + '">' + word + '</span>'
    + (act ? '<span class="act">' + act + '</span>' : '') + '</div>'
    + (hint ? '<div class="note">' + hint + '</div>' : '') + '</div>';
}
function visOpts(s){
  return ['Public','Network only','Private'].map(function(o){
    var on = (o === 'Network only' ? 'Network' : o) === s.vis;
    return '<span style="display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;cursor:pointer;'
      + 'border:1px solid ' + (on ? 'var(--blue)' : 'var(--line)') + ';background:' + (on ? 'var(--blue)' : '#fff')
      + ';color:' + (on ? '#fff' : 'var(--ink)') + ';font-weight:' + (on ? '700' : '500') + ';font-size:12.5px">' + o + '</span>';
  }).join(' ');
}
/* ── THE ROOT'S CATALOGUE, AND WHAT A STORE DOES WITH IT ──────────────────────────────────────────────────────
   Athi, 2026-08-08: *"if we set up a catalogue at the top and cascade it to the stores below as a reference…
   root is Euro and under it each store is another currency. The stores inherit the product, but the money should
   be updated with local currency — conversion + local tax + import tax + handling. But how that is maintained on
   an ongoing basis is going to be difficult."*

   He has put his finger on the hard part himself. The answer this mock proposes is that there are TWO prices and
   they are different KINDS of thing, not two versions of one number:

     REFERENCE   the root's price, in the root's currency. One per SKU. Never converted, never local.
     THE STORE'S the price the store actually sells at, stamped in ITS currency. Its own value.

   Conversion is then a CALCULATOR that proposes the second from the first — used once, at the moment a person
   accepts it. It is not a live formula the platform re-evaluates, because a live formula means every price in
   the network moves whenever a rate moves, and nobody has agreed to that.

   CB already carries this distinction: the catalogue model has price BY REF (loose, resolves when the chit is
   sealed) and BY VALUE (frozen at adoption). Ongoing maintenance is exactly that choice, made per SKU.          */
function money(n, cur){
  return (cur === 'EUR' ? '€' : cur === 'LKR' ? 'Rs ' : '₹') + n.toLocaleString(undefined,{maximumFractionDigits:0});
}
function landed(eur, cur){
  var base = eur * (LANDED.rate[cur] || 1);
  var imp  = base * LANDED.importPct / 100;
  var hand = (base + imp) * LANDED.handlePct / 100;
  var tax  = (base + imp + hand) * LANDED.taxPct / 100;
  return { base:base, imp:imp, hand:hand, tax:tax, total: base + imp + hand + tax };
}
function catalogueTab(s){
  var isRoot = false;                       // in this mock the left tree only selects stores
  var cur = val(s, 'currency');
  var rows = SKUS.map(function(k){
    var L = landed(k.eur, cur);
    return '<div class="fld"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">'
      + '<b style="font-size:13.5px">' + k.name + '</b>'
      + '<span style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--grey)">' + k.sku + '</span>'
      + '<span style="font-size:11px;color:var(--grey)">' + k.img + ' · ' + k.vid + '</span>'
      + '<span class="src inh" style="margin-left:auto">FROM NETWORK · BY REFERENCE</span></div>'
      + '<div class="val" style="margin-top:6px">'
      + '<span style="color:var(--grey);font-size:12.5px">reference ' + money(k.eur,'EUR') + '</span>'
      + '<span style="font-size:12.5px">→</span>'
      + '<b style="font-size:15px">' + money(L.total, cur) + '</b>'
      + '<span class="src own">STAMPED HERE</span></div>'
      + '<div class="note">' + money(L.base,cur) + ' converted · +' + LANDED.importPct + '% import ' + money(L.imp,cur)
      + ' · +' + LANDED.handlePct + '% handling ' + money(L.hand,cur) + ' · +' + LANDED.taxPct + '% tax ' + money(L.tax,cur)
      + '</div></div>';
  }).join('');
  return '<div class="box">'
    + '<div class="fld"><div class="lbl">WHERE THIS CATALOGUE CAME FROM</div>'
    + '<div class="val"><span>Adopted from <b>' + NET.name + '</b> · 3 items</span>'
    + '<span class="src inh">BY REFERENCE</span><span class="act">stop following the network</span></div>'
    + '<div class="note">The product, its pictures and its video stay the network\'s — corrections at the top reach '
    + 'every store. Only the <b>price</b> is this store\'s own.</div></div>'
    + rows + '</div>'

    + '<div class="box"><div class="fld"><div class="lbl">HOW THE LOCAL PRICE IS REACHED</div>'
    + '<div class="val" style="margin-top:6px;gap:6px">'
    + '<span>rate</span><input value="' + (LANDED.rate[cur] || 1) + '" style="width:80px">'
    + '<span>import %</span><input value="' + LANDED.importPct + '" style="width:56px">'
    + '<span>handling %</span><input value="' + LANDED.handlePct + '" style="width:56px">'
    + '<span>tax %</span><input value="' + LANDED.taxPct + '" style="width:56px">'
    + '</div>'
    + '<div class="note">A <b>calculator</b>, used once, at the moment someone accepts the number. It is not a live '
    + 'formula — see below.</div></div></div>'

    + '<div class="legend"><h3>THE ONGOING PROBLEM — you named it, so here it is stated plainly</h3>'
    + 'A rate moves every day. If a price is a <b>live formula</b>, then every price in every store moves every day, '
    + 'nobody agreed to any of them, and a customer can be quoted one number and invoiced another. If a price is '
    + '<b>frozen</b>, it is stable and agreed — and it goes stale, so somebody must review it.<br><br>'
    + 'There is no third option, and pretending otherwise is where this usually goes wrong. So make it a choice '
    + '<i>per SKU</i>, which CB already models:<br><br>'
    + '<b>BY VALUE (frozen)</b> — the store accepted this number. It stays until someone changes it. Right for a '
    + 'catalogue that is quoted, printed and negotiated.<br>'
    + '<b>BY REFERENCE (resolves at the order)</b> — the price is computed when the chit is sealed, from a rate '
    + 'with a <i>source and a timestamp</i>. Right for a daily-rate business — gold, fuel, commodities.<br><br>'
    + '⚠️ Whichever is chosen, the rate must be a <b>declared source with a date</b>, and the chit must record the '
    + 'rate it used. A converted price with no record of the rate cannot be disputed, and a number that cannot be '
    + 'disputed is not a price — it is an assertion.<br><br>'
    + '⚠️ And import duty and local tax are <b>not conversion</b>. They are the destination\'s rules, not arithmetic '
    + 'on a rate — they belong with trade-lane and compliance, and they change by law rather than by market.'
    + '</div>';
}
function store(){ return STORES.filter(function(s){ return s.key === sel; })[0]; }
function val(s, k){ return (s.own && s.own[k] !== undefined) ? s.own[k] : NET[k]; }
function src(s, k){ return (s.own && s.own[k] !== undefined) ? 'own' : 'inherited'; }

function drawTree(){
  document.getElementById('tree').innerHTML =
    '<div style="font-size:11px;font-weight:800;color:var(--grey);letter-spacing:.05em;padding:2px 8px 3px">NETWORK</div>'
    + '<div style="font-size:10px;color:#2c7a43;padding:0 8px 10px">✓ your network · 3 stores live</div>'
    + '<div class="nd">◆ ' + NET.name + '<div class="sub">the top — its settings flow down</div></div>'
    + STORES.map(function(s){
        var c = s.vis === 'Public' ? 'background:#e6f4ec;color:#2c7a43' : s.vis === 'Network' ? 'background:#f6ecd8;color:#8a5a1e' : 'background:#eef0f4;color:#6b6f86';
        var overrides = s.own ? Object.keys(s.own).length : 0;
        return '<div class="nd ' + (s.key === sel ? 'on' : '') + '" onclick="pick(\'' + s.key + '\')" style="margin-left:12px">'
          + '└ ' + s.name + '<span class="chip" style="' + c + '">' + s.vis + '</span>'
          + '<div class="sub">' + s.purpose + (overrides ? ' · ' + overrides + ' set here' : '') + '</div></div>';
      }).join('');
}
function drawPage(){
  var s = store();
  var body;
  if (tab === 'general') {
    body = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">'
      + '<button>＋ Add owned node</button><button>🤝 Add partner</button><button>✏️ Rename</button>'
      + '<button>🗑️ Remove</button><button>↑</button><button>↓</button></div>'
      // Visibility STAYS on General (Athi's call, 2026-08-08). It is the one decision required to build a
      // network, so it belongs on the tab you land on, not one click away behind the shopfront.
      + '<div class="box">'
      + '<div class="fld"><div class="lbl">WHO CAN SEE THIS STORE\'S CATALOGUE</div>'
      + '<div class="val" style="margin-top:7px">' + visOpts(s) + '<span class="src cap">CAPPED BY NETWORK</span></div>'
      + '<div class="note">The network is <b>Public</b>, so all three are available. If the network closes, only '
      + '<b>Network only</b> and <b>Private</b> remain — a ceiling, not a default. A store can never be more open '
      + 'than what contains it.</div></div>'
      + fld('WHAT IT IS FOR', s.purpose, 'own', 'Shows under the name in the map, and on the store itself.')
      + '</div>'
      + '<div class="box">'
      + fld('COUNTRY', val(s,'country'), src(s,'country'))
      + fld('CITY', val(s,'city'), src(s,'city'))
      + fld('CURRENCY', val(s,'currency'), src(s,'currency'))
      + '</div>';
  } else if (tab === 'storefront') {
    body = '<div class="box">'
      + '<div class="fld"><div class="lbl">HOW CUSTOMERS ORDER</div>'
      + '<div class="val"><select><option>Cart (qty + price)</option><option>Quantity only</option><option>Enquiry</option></select>'
      + '<span class="src inh">FROM NETWORK</span><span class="act">override for this store</span></div></div>'
      + '</div>';
  } else if (tab === 'money') {
    body = '<div class="box">'
      + fld('CURRENCY', val(s,'currency'), src(s,'currency'),
          src(s,'currency') === 'own'
            ? 'Overridden because this store trades in another country. Prices here are stamped LKR and are never converted.'
            : 'Follows the network. Change it at <b>' + NET.name + '</b> and every store that has not overridden it follows.')
      + fld('PRICE BAND', NET.priceBand, 'cap', 'The network sets the band. A store prices within it, not outside it.')
      + '</div>';
  } else if (tab === 'tradeready') {
    body = '<div class="box">'
      + fld('CERTIFICATIONS', val(s,'certs'), src(s,'certs'),
          src(s,'certs') === 'own'
            ? 'This store holds its own clearances — a different market needs different ones.'
            : 'The network’s certifications apply here.')
      + '</div>';
  } else if (tab === 'place') {
    body = '<div class="box">'
      + fld('CITY', val(s,'city'), src(s,'city'))
      + fld('COORDINATES', s.own && s.own.city ? 'not set' : '11.0168, 76.9558', 'own',
          'A place is never inherited — two stores are never in the same spot. The network only passes down the <b>country</b>.')
      + fld('SERVES', '50 km', 'own')
      + '</div>';
  } else if (tab === 'catalogue') {
    body = catalogueTab(s);
  } else {
    // The real app already has rich panels for co-assists, transact and dispute. The mock does not redraw them —
    // it says so, rather than showing a thinner version that would look like a proposal to replace them.
    var real = { coassist:1, transact:1, dispute:1, tradeready:1 };
    var lbl = (TABS.filter(function(t){ return t[0] === tab; })[0] || [])[2] || tab;
    body = '<div class="box"><div class="fld"><div class="lbl">' + lbl.toUpperCase() + '</div>'
      + '<div class="note">' + (real[tab]
          ? 'The real app already has this panel, in full. It is <b>not redrawn here</b> — the mock is for layout '
            + 'and inheritance, and a thinner version would read as a proposal to replace what exists.'
          : 'Captured on the design, <b>not enforced</b> by the platform yet.')
      + '</div></div></div>';
  }

  document.getElementById('page').innerHTML =
    '<h1>' + s.name + ' <span class="chip" style="background:#e6f4ec;color:#2c7a43">OWNED</span></h1>'
    + '<div class="hd">' + NET.handle + '.' + s.name.toLowerCase() + '</div>'
    + '<div class="kind">An owned store · settings not set here come from <b>' + NET.name + '</b></div>'
    + '<div class="tabs">' + TABS.map(function(t){
        return '<span class="tab ' + (t[0] === tab ? 'on' : 'has') + '" onclick="pickTab(\'' + t[0] + '\')">'
          + '<span class="ic">' + t[1] + '</span>' + t[2]
          + (t[3] ? '<span style="font-size:8.5px;font-weight:800;opacity:.7;border:1px solid currentColor;border-radius:4px;padding:0 3px">N/E</span>' : '')
          + '</span>'; }).join('') + '</div>'
    + '<div class="pane">' + body + '</div>'
    + '<div class="legend"><h3>THE THREE KINDS — this is what the mock is really asking</h3>'
      + '<b>FROM NETWORK</b> — the network said it and this store has not disagreed. Change it once at the top and '
      + 'every store that has not overridden it follows. This is how currency, country and certifications should behave.<br>'
      + '<b>SET HERE</b> — this store overrode it and stops following the network <i>for that one field</i>. It must say '
      + 'so on the field, or nobody can tell why two stores differ.<br>'
      + '<b>CAPPED BY NETWORK</b> — not a default but a <i>ceiling</i>. The store may go narrower, never wider. '
      + 'Visibility already works this way; a price band is the same shape.<br><br>'
      + '⚠️ The one that does not inherit at all is <b>place</b>. Two stores are never in the same spot, so only the '
      + '<i>country</i> comes down. A setting that inherits when it should not is worse than one that does not inherit '
      + 'at all — it looks decided and is wrong.</div>';
}
function pick(k){ sel = k; drawTree(); drawPage(); }
function pickTab(t){ tab = t; drawPage(); }
drawTree(); drawPage();
</script>
