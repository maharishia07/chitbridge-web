<title>ChitBridge List Standard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: one working screen. A three-row head (title · tools · column header) stays put; only the rows scroll in the
   space left below it. Tokens are ChitBridge's fixed set (docs/design/SYSTEM.md), plus a dark mapping for the app's dark theme. */
:root{
  --page:#FCFAF5; --card:#FFFFFF; --panel:#F3EFE6;
  --line:#DDD6C6; --line-soft:#E6E0D2; --hair:#F0ECE2;
  --ink:#1D1B16; --muted:#5E594D; --faint:#8A8374; --ghost:#A8A295;
  --green:#16693F; --green-t:#E8F4ED; --green-b:#A9D3BC;
  --amber:#E0A020; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205;
  --red:#C4562F; --red-t:#FBEAE3; --red-b:#E7B9A8; --red-i:#8E3517;
  --blue:#2F74C9; --blue-t:#E4EEFA; --blue-b:#B9D2EF; --blue-i:#174A87;
  --shadow:0 10px 28px rgba(29,27,22,.16);
  --f-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-ui:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-num:'IBM Plex Mono', ui-monospace, 'Cascadia Mono', monospace;
  --proto:#6B4FA0; --proto-t:#F1ECF8;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#15140F; --card:#1E1C17; --panel:#26241D; --line:#3A372D; --line-soft:#322F27; --hair:#2A2721;
  --ink:#F1ECE0; --muted:#C2BBAA; --faint:#9A9383; --ghost:#7C7668;
  --green:#5FBF8A; --green-t:#16301F; --green-b:#2F5E43;
  --amber:#E8B04A; --amber-t:#33280F; --amber-b:#6B5320; --amber-i:#F2C977;
  --red:#E58561; --red-t:#3A1E14; --red-b:#6E3624; --red-i:#F2A688;
  --blue:#7AAEEB; --blue-t:#16263A; --blue-b:#2E4B70; --blue-i:#A9CBF3;
  --shadow:0 10px 28px rgba(0,0,0,.5); --proto:#B9A2E3; --proto-t:#2A2238; color-scheme:dark }}
:root[data-theme="dark"]{
  --page:#15140F; --card:#1E1C17; --panel:#26241D; --line:#3A372D; --line-soft:#322F27; --hair:#2A2721;
  --ink:#F1ECE0; --muted:#C2BBAA; --faint:#9A9383; --ghost:#7C7668;
  --green:#5FBF8A; --green-t:#16301F; --green-b:#2F5E43;
  --amber:#E8B04A; --amber-t:#33280F; --amber-b:#6B5320; --amber-i:#F2C977;
  --red:#E58561; --red-t:#3A1E14; --red-b:#6E3624; --red-i:#F2A688;
  --blue:#7AAEEB; --blue-t:#16263A; --blue-b:#2E4B70; --blue-i:#A9CBF3;
  --shadow:0 10px 28px rgba(0,0,0,.5); --proto:#B9A2E3; --proto-t:#2A2238; color-scheme:dark }

html,body{height:100%}
body{background:var(--page);color:var(--ink);font:calc(15px * var(--k,1))/1.45 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ── PROTOTYPE ONLY — DO NOT BUILD: the strip that switches examples and states ───────────────────────── */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 16px;background:var(--proto-t);
  border-bottom:1px dashed var(--proto);font-size:calc(12.5px * var(--k,1));color:var(--proto)}
.proto b{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:calc(11px * var(--k,1))}
.proto .grp{display:flex;gap:2px;flex-wrap:wrap}
.proto button{border:1px solid transparent;background:none;border-radius:7px;padding:2px 8px;color:var(--proto)}
.proto button[aria-pressed="true"]{border-color:var(--proto);background:var(--card);font-weight:600}
.proto .meter{margin-inline-start:auto;font-family:var(--f-num)}
.proto .meter.ok{color:var(--green)} .proto .meter.bad{color:var(--red)}

/* ── THE SCREEN: head (3 rows) + rows that scroll ──────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:calc(100% - var(--proto-h,0px));container-type:inline-size;container-name:screen}
/* Row 1 · title */
.titlerow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 20px 8px;border-bottom:1px solid var(--line-soft);background:var(--page)}
.titlerow h1{font:800 calc(24px * var(--k,1))/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:4px 11px;font-size:calc(13.5px * var(--k,1));white-space:nowrap}
.chip.period{font-family:var(--f-num);font-size:calc(13px * var(--k,1))}
.chip.warn{background:var(--amber-t);border-color:var(--amber-b);color:var(--amber-i);font-weight:600}
.chip.bad{background:var(--red-t);border-color:var(--red-b);color:var(--red-i);font-weight:600}
.chip .go{opacity:.7}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:calc(13.5px * var(--k,1))}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 11px;font-size:calc(13.5px * var(--k,1));font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:700;display:grid;place-items:center}

/* Row 2 · tools */
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:8px 20px;background:var(--page)}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:9px;padding:0 10px;height:34px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:calc(14px * var(--k,1))}
.tbtn{height:34px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);
  border-radius:9px;padding:0 10px;font-size:calc(13.5px * var(--k,1));white-space:nowrap}
.tbtn[aria-pressed="true"],.tbtn.on{border-color:var(--blue-b);background:var(--blue-t);color:var(--blue-i);font-weight:600}
.tbtn .badge{background:var(--blue);color:var(--card);border-radius:999px;font-size:calc(11px * var(--k,1));padding:0 6px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);height:34px}
.seg button{border:0;background:none;padding:0 10px;font-size:calc(13.5px * var(--k,1));border-inline-start:1px solid var(--line-soft)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page);font-weight:600}
.ico{width:34px;justify-content:center;padding:0}
.count{font-family:var(--f-num);font-size:calc(13px * var(--k,1));color:var(--muted);padding:0 4px;white-space:nowrap}
.fchips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.fchips:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--blue-b);background:var(--blue-t);color:var(--blue-i);
  border-radius:999px;padding:1px 4px 1px 10px;font-size:calc(12.5px * var(--k,1))}
.fchip button{border:0;background:none;color:inherit;width:20px;height:20px;border-radius:50%}
.anchor{position:relative}
.pop{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:20;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;min-width:220px;max-height:min(70vh,480px);overflow:auto}
.pop.left{inset-inline-end:auto;inset-inline-start:0}
.pop h4{margin:4px 0 6px;font-size:calc(11px * var(--k,1));letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.pop label.f{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:8px;margin:6px 0;font-size:calc(13.5px * var(--k,1))}
.pop select{border:1px solid var(--line);border-radius:7px;background:var(--card);padding:3px 6px}
.preset{display:grid;gap:2px}
.preset button{text-align:start;border:0;background:none;border-radius:7px;padding:5px 8px}
.preset button[aria-pressed="true"]{background:var(--blue-t);color:var(--blue-i);font-weight:600}
.custom{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:calc(13px * var(--k,1))}
.custom input{border:1px solid var(--line);border-radius:7px;padding:2px 6px;background:var(--card);font-family:var(--f-num);font-size:calc(12.5px * var(--k,1));width:128px}
/* the ⚙ columns chooser (the Task list's, unchanged) */
.colrow{display:flex;align-items:center;gap:6px;padding:2px 0}
.colrow label{flex:1;display:flex;align-items:center;gap:7px;padding:3px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.colrow label:has(input:checked){background:var(--blue-t);color:var(--blue-i);font-weight:600}
.colrow input{accent-color:var(--blue);width:14px;height:14px}
.mv{width:24px;height:24px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:0;font-size:calc(12px * var(--k,1));flex:0 0 auto}
.mv:disabled{opacity:.3;cursor:default}
.mvsp{width:24px;flex:0 0 auto}
.noroom{font-size:calc(11.5px * var(--k,1));color:var(--amber-i);margin-inline-start:4px}

/* Row 3 · column header + the rows, ONE scroll area (header sticky inside it, so both scroll sideways together) */
.list{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);background:var(--card);container-type:inline-size;container-name:list;overscroll-behavior:contain}
.grid{display:grid;min-width:max-content}
.hdr{position:sticky;top:0;z-index:5;display:grid;background:var(--panel);border-bottom:1.5px solid var(--line)}
.hc{position:relative;display:flex;align-items:center;gap:4px;padding:7px 12px;font-size:calc(12px * var(--k,1));font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;min-width:0;user-select:none}
.hc.r{justify-content:flex-end}
.hc .sort{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;gap:3px;align-items:center}
.hc .arrow{color:var(--blue);font-size:calc(11px * var(--k,1))}
.rz{position:absolute;inset-inline-end:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:2;border:0;background:none;padding:0}
.rz::after{content:"";position:absolute;inset-inline-start:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.rz:hover::after,.rz:focus-visible::after,.rz.drag::after{width:3px;inset-inline-start:3px;background:var(--blue)}
.grow{display:grid;align-items:center;border-bottom:1px solid var(--hair);cursor:pointer}
.grow:hover{background:var(--page)}
.cell{padding:8px 12px;min-width:0;overflow-wrap:anywhere}
.cell.r{text-align:end}
.cell.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:calc(13.5px * var(--k,1))}
.cell.strong{font-weight:700}
.tw{display:inline-block;width:14px;color:var(--faint);transition:transform .15s}
.open .tw{transform:rotate(90deg)}
.link{color:var(--blue);text-decoration:underline;text-underline-offset:2px;font-family:var(--f-num);font-size:calc(13.5px * var(--k,1))}
.dim{color:var(--faint)}
.group{position:sticky;top:var(--hdr-h,35px);z-index:3;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding:7px 12px;background:var(--page);
  border-bottom:1px solid var(--line);font-size:calc(13.5px * var(--k,1));cursor:pointer}
.group b{font-weight:700}
.group .fig{font-family:var(--f-num);font-size:calc(13px * var(--k,1));color:var(--muted)}
.next{grid-column:1/-1;background:var(--page);border-bottom:1px solid var(--line-soft);padding:6px 12px 10px 38px;cursor:default}
.next .gist{color:var(--muted);font-size:calc(13px * var(--k,1));margin-bottom:6px}
.jl{display:grid;grid-template-columns:minmax(0,1fr) 120px 120px;gap:0 12px;font-size:calc(13.5px * var(--k,1));max-width:720px}
.jl .h{font-size:calc(11.5px * var(--k,1));letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:2px 0;border-bottom:1px solid var(--line-soft)}
.jl > div{padding:3px 0}
.jl .r{text-align:end;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.jl .code{font-family:var(--f-num);font-weight:600;margin-inline-end:6px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts .btn{font-weight:500;font-size:calc(13px * var(--k,1));padding:3px 10px}

/* ☰ lines view: one flowing line per record, the gist under it (the Day book's own reading style) */
.lrec{border-bottom:1px solid var(--hair);padding:8px 12px;cursor:pointer}
.lrec:hover{background:var(--page)}
.lline{display:flex;gap:4px 10px;align-items:baseline}
.lflow{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 0}
.lflow > span:not(:last-child)::after{content:"·";color:var(--ghost);margin:0 7px}
.lamt{font-family:var(--f-num);font-weight:700;white-space:nowrap}
.lgist{color:var(--muted);font-size:calc(13px * var(--k,1));padding-inline-start:22px;margin-top:1px}

/* phone / narrow container: one card per row, label:value, nothing sideways */
@container list (max-width: 620px){
  .grid{min-width:0}
  .hdr{display:none}
  .grow{display:flex;flex-wrap:wrap;gap:0 10px;padding:8px 12px;margin:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .grow .cell{padding:2px 0}
  .grow .cell[data-l]::before{content:attr(data-l) " ";color:var(--faint);font-size:calc(11px * var(--k,1));letter-spacing:.05em;text-transform:uppercase;margin-inline-end:4px;font-family:var(--f-ui);font-weight:600}
  .grow .cell.first{width:100%;font-weight:600}
  .grow .cell.amt{margin-inline-start:auto}
  .next{margin:-6px 10px 8px;border-radius:0 0 12px 12px;padding-inline-start:14px}
  .jl{grid-template-columns:minmax(0,1fr) 92px 92px}
}
@container screen (max-width: 640px){
  .titlerow,.tools{padding-inline:16px}
  .titlerow h1{font-size:calc(21px * var(--k,1))}
  .who .shop{display:none}
  .search{flex-basis:100%}
}

/* the avatar: ONE control on every page (CBAvatar); Appearance applies everywhere */
.avbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:700;display:grid;place-items:center;padding:0}
.avbtn[aria-expanded="true"]{outline:2px solid var(--blue);outline-offset:1px}
.avpop{width:min(344px,calc(100vw - 32px));padding:12px 14px}
.avwho{display:flex;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.avwho .avatar{width:40px;height:40px;font-size:calc(16px * var(--k,1))}
.avwho b{display:block;font-size:calc(14.5px * var(--k,1))}.avwho span{font-size:calc(12.5px * var(--k,1));color:var(--faint)}
.avitems{display:grid;gap:1px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.avitems button{display:flex;justify-content:space-between;align-items:center;text-align:start;border:0;background:none;border-radius:7px;padding:6px 8px;font-size:calc(14px * var(--k,1))}
.avitems button:hover{background:var(--page)}
.hint{font-size:calc(12px * var(--k,1));color:var(--faint);font-family:var(--f-ui);font-weight:400}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 8px}
.sw{display:grid;gap:3px;justify-items:center;border:1px solid transparent;background:none;border-radius:9px;padding:4px 2px;font-size:calc(10.5px * var(--k,1));color:var(--muted);line-height:1.15;text-align:center}
.sw .dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;grid-template-rows:1fr 1fr;overflow:hidden}
.sw[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-t);color:var(--blue-i);font-weight:600}
.fonts{display:grid;gap:2px}
.fonts button{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border:0;background:none;border-radius:7px;padding:5px 8px;text-align:start}
.fonts button[aria-pressed="true"]{background:var(--blue-t);color:var(--blue-i);font-weight:600}
.sizes{display:flex;gap:4px;align-items:flex-end;margin:2px 0 8px}
.sizes button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;height:42px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--ink);padding:0}
.sizes button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-t);color:var(--blue-i)}
.motion{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px}
.toggle{width:40px;height:22px;border-radius:999px;border:1px solid var(--line);background:var(--panel);position:relative;padding:0}
.toggle::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:inset-inline-start .15s}
.toggle[aria-checked="true"]{background:var(--blue-t);border-color:var(--blue)}
.toggle[aria-checked="true"]::after{inset-inline-start:20px;background:var(--blue)}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important}
:root[data-weight="bold"] body{font-weight:600}
:root[data-weight="bold"] .cell,:root[data-weight="bold"] .chip,:root[data-weight="bold"] .search input,:root[data-weight="bold"] .tbtn,
:root[data-weight="bold"] .seg button,:root[data-weight="bold"] .jl,:root[data-weight="bold"] .lrec,:root[data-weight="bold"] .count,
:root[data-weight="bold"] .group,:root[data-weight="bold"] .hint,:root[data-weight="bold"] .preset button{font-weight:600}
:root[data-weight="bold"] .cell.strong,:root[data-weight="bold"] .lamt,:root[data-weight="bold"] .group b,:root[data-weight="bold"] h1{font-weight:800}
.weights{display:flex;gap:4px;margin:0 0 8px}
.weights button{flex:1;height:36px;border:1px solid var(--line);background:var(--card);border-radius:9px;font-family:var(--f-ui);font-size:17px;color:var(--ink);padding:0}
.weights button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-t);color:var(--blue-i)}
/* states */
.state{padding:44px 20px;text-align:center;color:var(--muted)}
.state .big{font:700 calc(18px * var(--k,1)) var(--f-display);color:var(--ink);margin-bottom:4px}
.state .btn{margin-top:10px}
.skel{height:36px;margin:8px 12px;border-radius:8px;background:linear-gradient(90deg,var(--hair),var(--panel),var(--hair));background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}.tw{transition:none}}
.toast{position:fixed;inset-inline-start:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--page);
  padding:8px 14px;border-radius:9px;font-size:calc(13.5px * var(--k,1));z-index:50;box-shadow:var(--shadow)}

/* 📐 the frozen standard, readable beside the screen (PROTOTYPE ONLY) */
.spec{position:fixed;inset-block:0;inset-inline-end:0;width:min(440px,100%);background:var(--card);border-inline-start:1px solid var(--line);
  box-shadow:var(--shadow);z-index:40;overflow:auto;padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.spec h2{font:800 calc(20px * var(--k,1)) var(--f-display);margin:0 0 2px}
.spec .frozen{display:inline-block;font:600 calc(11px * var(--k,1)) var(--f-num);letter-spacing:.08em;color:var(--green);border:1px solid var(--green-b);background:var(--green-t);border-radius:6px;padding:1px 7px;margin-bottom:10px}
.spec h3{font-size:calc(12px * var(--k,1));letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
.spec ol,.spec ul{margin:0;padding-inline-start:20px;font-size:calc(13.5px * var(--k,1))}
.spec li{margin:4px 0}
.spec code{font-family:var(--f-num);font-size:calc(12px * var(--k,1));background:var(--panel);padding:0 4px;border-radius:4px}
.spec .x{position:absolute;inset-inline-end:12px;top:12px}
</style>

<div class="proto" id="proto" role="region" aria-label="Prototype controls, not part of the product">
  <b>Prototype only</b>
  <span>Same shell, different list:</span>
  <span class="grp" id="pList"></span>
  <span>State:</span>
  <span class="grp" id="pState"></span>
  <button id="pSpec" aria-pressed="false">📐 The standard</button>

(function(){

/* ═════ sample data (examples, not a real shop's figures) ═════ */
var SHOP='Chola Auto Care';
function rnd(seed){ return function(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }; }
var r=rnd(42);
var PARTIES=['P-00002 · Tally Test Shop','P-00007 · Kumar Spares','P-00011 · Ravi Stores','P-00014 · Meena Traders','—'];
var KINDS=[['Sales','sale'],['Purchase','purchase'],['Expense','expense'],['Receipts','receipt'],['Payment','payment']];
var TENDERS=['Cash','UPI','Card','On credit'];

  var d=new Date(2026,6,1), n=1;
  for(var i=0;i<46;i++){

    var bill=(k[1]==='sale'||k[1]==='purchase'||k[1]==='expense')?'C2/26-27/'+String(10+i).padStart(4,'0'):(k[1]==='receipt'?'R/C2/'+String(i).padStart(4,'0'):'');

    if(k[1]==='sale'){ lines=[[party==='—'?'1400':'1300',party==='—'?'Cash':'Debtors'+(party!=='—'?' · '+party:''),amt,0],['4000','Sales',0,taxable],['2201','Output CGST '+rate/2+'%',0,half],['2202','Output SGST '+rate/2+'%',0,tax-half]]; }
    else if(k[1]==='purchase'||k[1]==='expense'){ lines=[[k[1]==='purchase'?'5000':'6190',k[1]==='purchase'?'Purchases':'Sundry expenses',taxable,0],['2210','Input CGST',half,0],['2211','Input SGST',tax-half,0],['2100','Suppliers (Sundry Creditors) · '+party,0,amt]]; }
    else if(k[1]==='receipt'){ lines=[['1510','UPI collections',amt,0],['1300','Debtors · '+party,0,amt]]; }
    else { lines=[['2100','Suppliers (Sundry Creditors) · '+party,amt,0],['1500','Bank',0,amt]]; }
    ENTRIES.push({ id:'e'+i, date:new Date(d), entry:'JV/2026-27/'+String(n++).padStart(6,'0'), kind:k[0], party:party, bill:bill,
      time:String(8+Math.floor(r()*12)).padStart(2,'0')+':'+String(Math.floor(r()*60)).padStart(2,'0'), tender:tender,
      counter:'Counter '+(r()<.6?'C2':'C1'), person:PEOPLE[Math.floor(r()*3)], amount:amt, lines:lines,
      gist:lines.map(function(l){return l[1].split(' · ')[0]+' '+rs(l[2]||l[3]);}).slice(0,3).join(' · ') });
  }
})();
var DUES=[['P-00007','Kumar Spares',  1880000, 47, [520000,0,1360000,0]],['P-00011','Ravi Stores',612000,12,[612000,0,0,0]],
  ['P-00014','Meena Traders',0,0,[0,0,0,0]],['P-00002','Tally Test Shop',372012,3,[372012,0,0,0]],['P-00021','Lakshmi Hardware',955050,96,[0,105050,300000,550000]],
  ['P-00023','Senthil Auto',128000,31,[0,128000,0,0]]].map(function(x){return {id:x[0],party:x[0]+' · '+x[1],total:x[2],days:x[3],b:x[4]};});

function rs(paise){ var neg=paise<0; paise=Math.abs(paise); var s=(paise/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); return (neg?'−':'')+'₹'+s; }
function dfmt(d,o){ return d.toLocaleDateString('en-IN',o||{day:'2-digit',month:'short'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function store(k,v){ try{ if(v===undefined){ var x=localStorage.getItem('cblist.'+k); return x?JSON.parse(x):null; } localStorage.setItem('cblist.'+k,JSON.stringify(v)); }catch(_){ return null; } }

/* ═════ THE DECLARATIONS — the only part a page writes ═════ */
var LISTS={
  daybook:{ title:'Day book', key:'daybook', view:'grid', defaultCols:['date','entry','party'],

      {key:'party',label:'Party',prio:2,w:240,sort:true,cell:function(e){return e.party;}},

      {key:'tender',label:'Tender',prio:6,w:110,cell:function(e){return e.tender;}},

    rows:function(){return ENTRIES;}, search:function(e){return [e.entry,e.party,e.bill,e.kind,rs(e.amount)].join(' ');},

/* ═════ CBList: THE SHELL — the same on every page ═════ */
var S={}, current='daybook', pstate='normal', openPop=null;
var PERIODS=[['today','Today'],['month','This month'],['fy','This FY (Apr–Mar)'],['custom','Custom']];
function st(k){
  if(!S[k]){ var L=LISTS[k], saved=store(k)||{};
    S[k]={ cols:saved.cols||L.defaultCols.slice(), widths:saved.widths||{}, view:saved.view||L.view, group:saved.group||L.group,
      sort:saved.sort||null, filt:{}, q:'', open:{}, allOpen:false, period:'fy' }; }
  return S[k];
}
function save(k){ var s=st(k); store(k,{cols:s.cols,widths:s.widths,view:s.view,group:s.group,sort:s.sort}); }
function colsOf(L,s){ var by={}; L.columns.forEach(function(c){by[c.key]=c;}); return s.cols.map(function(k){return by[k];}).filter(Boolean).concat(L.amount?[L.amount]:[]); }
function widthOf(L,s,c){ return (s.widths[c.key]||c.w); }
function template(L,s){ return colsOf(L,s).map(function(c){return widthOf(L,s,c)+'px';}).join(' '); }

function rowsOf(L,s){
  var rows=L.rows().slice(), q=s.q.trim().toLowerCase();
  if(q) rows=rows.filter(function(x){return L.search(x).toLowerCase().indexOf(q)>=0;});
  Object.keys(s.filt).forEach(function(f){ var v=s.filt[f]; if(!v) return;
    rows=rows.filter(function(x){ if(f==='state') return v==='Owing'?x.total>0:!x.total; return x[f]===v; }); });
  if(s.sort){ var c=s.sort.key, dir=s.sort.dir;
    rows.sort(function(a,b){ var A=a[c],B=b[c]; if(A instanceof Date){A=+A;B=+B;} return (A>B?1:A<B?-1:0)*dir; }); }
  return rows;
}
function groupKey(L,s,x){
  if(L.key==='daybook'){ var d=x.date;
    if(s.group==='day') return [dfmt(d,{weekday:'short',day:'2-digit',month:'short'}), d.toDateString()];
    if(s.group==='week'){ var m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7)); return ['Week of '+dfmt(m), m.toDateString()]; }
    return [dfmt(d,{month:'long',year:'numeric'}), d.getFullYear()+'-'+d.getMonth()]; }
  if(s.group==='age'){ var a=x.days>90?'Over 90 days':x.days>30?'30–90 days':x.days>0?'Under 30 days':'Settled'; return [a,a]; }
  return null;
}

  h+='<div class="state" style="padding:14px;font:12px var(--f-num)">'+rows.length+' shown · end of list</div>';
  el.innerHTML=h;
  var hdr=document.getElementById('hdr'); if(hdr) document.documentElement.style.setProperty('--hdr-h',hdr.offsetHeight+'px');
  else document.documentElement.style.setProperty('--hdr-h','0px');
}

function paint(){ paintTitle(); paintTools(); paintList(); paintProto(); measure(); }
function measure(){
  var list=document.getElementById('list'), hdr=document.getElementById('hdr'), top=list.getBoundingClientRect().top+(hdr?hdr.offsetHeight:0)-document.getElementById('proto').offsetHeight;
  var pct=Math.round(top/(window.innerHeight-document.getElementById('proto').offsetHeight)*100), m=document.getElementById('meter'), lim=window.innerWidth<=640?30:20;
  m.textContent='head '+pct+'% of the window (limit '+lim+'%)'; m.className='meter '+(pct<=lim?'ok':'bad');
}
function paintProto(){
  document.getElementById('pList').innerHTML=Object.keys(LISTS).map(function(k){return '<button data-plist="'+k+'" aria-pressed="'+(current===k)+'">'+LISTS[k].title+'</button>';}).join('');
  document.getElementById('pState').innerHTML=[['normal','Rows'],['loading','Loading'],['empty','Empty'],['nomatch','No match'],['error','Could not load']].map(function(x){return '<button data-pstate="'+x[0]+'" aria-pressed="'+(pstate===x[0])+'">'+x[1]+'</button>';}).join('');

var tt; function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.hidden=false; clearTimeout(tt); tt=setTimeout(function(){e.hidden=true;},2600); }

/* ═════ behaviour ═════ */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('button,[data-row],.group'); var s=st(current), L=LISTS[current];

  if(t.id==='specX'){ document.getElementById('spec').hidden=true; document.getElementById('pSpec').setAttribute('aria-pressed','false'); return; }

  if(d.apFs){ AP.fs=d.apFs; store('ap.fs',AP.fs); applyAppearance(); paint(); var z=TEXT_SIZES.filter(function(x){return x[0]===AP.fs;})[0]; toast('Text: '+z[1]+', '+Math.round(z[2]*100)+'% on every page'); return; }
  if(d.apWeight){ AP.weight=d.apWeight; store('ap.weight',AP.weight); applyAppearance(); paint(); return; }

  if(d.apFont){ AP.font=d.apFont; store('ap.font',AP.font); applyAppearance(); paint(); return; }
  if(d.av){ toast({profile:'Opens Profile in the app',settings:'Settings stay in the app (owner only)',support:'Opens Support',signout:'In the product: signed out here and in every other tab'}[d.av]); return; }
  if(t.id==='periodBtn'){ openPop=openPop==='period'?null:'period'; paint(); return; }
  if(t.id==='filtBtn'){ openPop=openPop==='filt'?null:'filt'; paint(); return; }
  if(t.id==='colBtn'){ openPop=openPop==='cols'?null:'cols'; paint(); return; }
  if(d.period){ s.period=d.period; if(d.period!=='custom') openPop=null; paint(); toast('Showing '+t.textContent.toLowerCase()); return; }
  if(d.notice!=null){ toast('Opens '+L.notices[+d.notice].to+' (the warning carries its fix)'); return; }
  if(d.group){ s.group=d.group; save(current); paint(); return; }
  if(d.view){ s.view=d.view; save(current); paint(); return; }
  if(t.id==='expBtn'){ s.allOpen=!s.allOpen; s.open={}; paint(); return; }
  if(t.id==='csvBtn'){ toast('In the product this downloads '+rowsOf(L,s).length+' rows as CSV'); return; }
  if(d.unfilt){ delete s.filt[d.unfilt]; paint(); return; }
  if(t.id==='clearF'||t.id==='clearAll'){ s.filt={}; s.q=''; openPop=null; paint(); return; }
  if(t.id==='retry'){ pstate='loading'; paint(); setTimeout(function(){pstate='normal';paint();},700); return; }
  if(d.mv){ var i=s.cols.indexOf(d.mv), j=i+(+d.d); if(j<0||j>=s.cols.length) return; s.cols.splice(i,1); s.cols.splice(j,0,d.mv); save(current); paint(); return; }
  if(t.id==='resetCols'){ s.cols=L.defaultCols.slice(); s.widths={}; save(current); paint(); return; }
  if(d.sort){ s.sort=s.sort&&s.sort.key===d.sort?{key:d.sort,dir:-s.sort.dir}:{key:d.sort,dir:1}; save(current); paint(); return; }
  if(d.act){ toast('In the product: '+t.textContent); return; }

function toggleRow(id){ var s=st(current); if(s.allOpen) s.open[id+'#closed']=!s.open[id+'#closed']; else s.open[id]=!s.open[id]; paintList(); measure(); }
document.addEventListener('change',function(ev){
  var t=ev.target, s=st(current), L=LISTS[current];
  if(t.dataset.col){ var k=t.dataset.col; if(t.checked) s.cols.push(k); else s.cols=s.cols.filter(function(x){return x!==k;}); save(current); paint(); return; }

});
document.addEventListener('input',function(ev){ if(ev.target.id==='q'){ var s=st(current); s.q=ev.target.value; paintList(); var c=document.querySelector('.count'); if(c) c.textContent=rowsOf(LISTS[current],s).length+' shown'; measure(); } });
document.addEventListener('keydown',function(ev){

  if(t.dataset&&t.dataset.row&&(ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); toggleRow(t.dataset.row); var n=document.querySelector('[data-row="'+t.dataset.row+'"]'); n&&n.focus(); return; }
  if(t.dataset&&t.dataset.row&&(ev.key==='ArrowDown'||ev.key==='ArrowUp')){ ev.preventDefault(); var all=[].slice.call(document.querySelectorAll('[data-row]')), i=all.indexOf(t), nx=all[i+(ev.key==='ArrowDown'?1:-1)]; nx&&nx.focus(); }
});
/* adjustable columns: drag (mouse or touch), arrows, double-click resets; min = the label's own width */
function minW(L,c){ return Math.max(64, c.label.length*9+40); }
function resize(key,delta,abs){ var L=LISTS[current], s=st(current), c=L.columns.concat(L.amount||[]).filter(function(x){return x.key===key;})[0]; if(!c) return;
  var w=(s.widths[key]||c.w)+delta; s.widths[key]=Math.max(minW(L,c),w); save(current); paintList(); measure(); }
var drag=null;
document.addEventListener('pointerdown',function(ev){ var b=ev.target.closest('[data-rz]'); if(!b) return; ev.preventDefault();
  var L=LISTS[current], s=st(current), c=L.columns.concat(L.amount||[]).filter(function(x){return x.key===b.dataset.rz;})[0];
  drag={key:b.dataset.rz,x:ev.clientX,w:s.widths[c.key]||c.w,c:c}; b.classList.add('drag'); b.setPointerCapture&&b.setPointerCapture(ev.pointerId); });
document.addEventListener('pointermove',function(ev){ if(!drag) return; var s=st(current), L=LISTS[current], rtl=getComputedStyle(document.body).direction==='rtl';
  s.widths[drag.key]=Math.max(minW(L,drag.c),drag.w+(ev.clientX-drag.x)*(rtl?-1:1));
  var tpl=template(L,s); document.querySelectorAll('.hdr,.grow').forEach(function(e){e.style.gridTemplateColumns=tpl;}); });
document.addEventListener('pointerup',function(){ if(!drag) return; save(current); drag=null; paintList(); measure(); });
document.addEventListener('dblclick',function(ev){ var b=ev.target.closest('[data-rz]'); if(!b) return; var s=st(current); delete s.widths[b.dataset.rz]; save(current); paintList(); });
window.addEventListener('resize',function(){ paintProto(); measure(); });
