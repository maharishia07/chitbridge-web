<!doctype html>
<html lang="en">
<!-- OWNS  the Authority forms page: a statutory form's boxes as the law names them, read from the server (never computed here).
     CALLED BY CB Accounts › Returns and Home's Finance area.
     FLOW  load → CBFrame → the form's read → paint; a form the server has not built is said in words
     CARD 16-finance/authority-forms -->
<head>
<meta charset="utf-8">
<script src="/app/device-id.js"></script>
<script src="/config.js"></script>   <!-- HX1: window.CB_API — this deploy's one api address -->
<script src="/app/helpers.js"></script>   <!-- T2-WEBPRIMS: esc · fmtMoney · monthNames — the ONE copy; loads before every script that calls them -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chit &amp; Bridge — Authority forms</title>
<style>
  :root{ --ink:#1b2431; --grey:#5a6678; --line:#e5e8ee; --paper:#f5f6f9; --bg:var(--paper); --card:#fff; --blue:#3F66A6;
    --documented:#2f8f5b; --declared:#8a94a6; --derived:#7a6bb0; --order:#2f7a45;
    --ok:#2f7a45; --warn:#b4832a; --bad:#c0453b; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--f-ui,'IBM Plex Sans',system-ui,sans-serif); background:var(--bg); color:var(--ink); }   /* SYSTEM.md §2: one face on every page (SHELL-ONE) */
  .wrap{ max-width:760px; margin:0 auto; padding:16px; }
  h1{ font-size:20px; margin:4px 0 2px; } .sub{ font-size:12.5px; color:var(--grey); margin-bottom:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:13px; padding:14px 15px; margin-bottom:12px; }
  label{ font-size:11px; font-weight:700; color:var(--grey); display:block; margin:8px 0 3px; }
  input,select{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; color:var(--ink); }
  button{ font-size:13px; font-weight:700; border:0; border-radius:9px; padding:9px 15px; cursor:pointer; }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  .pri{ background:var(--blue); color:#fff; } .gh{ background:#fff; color:var(--ink); border:1px solid var(--line); }
  .ok{ background:var(--ok); color:#fff; }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .note{ font-size:11px; color:var(--grey); } .err{ color:var(--bad); font-size:12px; margin-top:6px; }
  .formcard{ border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:8px; cursor:pointer; background:#fff; }
  .formcard:hover{ border-color:var(--blue); } .formcard.on{ border-color:var(--blue); background:#f4f7fc; }
  .formcard .t{ font-weight:700; font-size:13.5px; } .formcard .a{ font-size:11px; color:var(--grey); }
  .fld{ display:grid; grid-template-columns:1fr; gap:3px; padding:9px 0; border-top:1px solid var(--line); }
  .fld .lb{ font-size:11px; font-weight:700; color:var(--grey); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .req{ color:var(--bad); } .miss{ border-color:var(--bad)!important; background:#fdf5f4; }
  .chip{ font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; border-radius:5px; padding:1px 6px; }
  .c-documented{ background:#eaf6ee; color:var(--documented); } .c-order{ background:#e9f5ec; color:var(--order); }
  .c-declared{ background:#eef0f3; color:var(--declared); } .c-derived{ background:#efeaf7; color:var(--derived); } .c-none{ background:#fbeaea; color:var(--bad); }
  .banner{ font-size:12px; font-weight:700; border-radius:8px; padding:8px 11px; margin:4px 0 10px; }
  .banner.ready{ background:#eaf6ee; color:var(--ok); } .banner.notready{ background:#fdf6e9; color:var(--warn); }
  .prov{ font-size:11px; color:var(--grey); margin-top:6px; }
  /* the printable document */
  .doc{ background:#fff; color:#111; border:1px solid var(--line); border-radius:6px; padding:34px 38px; }
  .doc h2{ text-align:center; font-size:19px; letter-spacing:.02em; margin:0 0 3px; }
  .doc .auth{ text-align:center; font-size:11px; color:#555; margin-bottom:20px; text-transform:uppercase; letter-spacing:.08em; }
  .doc .drow{ display:flex; padding:7px 0; border-bottom:1px dotted #ccc; font-size:13px; }
  .doc .dk{ width:42%; color:#444; font-weight:600; } .doc .dv{ width:58%; }
  .doc .sig{ margin-top:34px; display:flex; justify-content:space-between; align-items:flex-end; }
  .doc .sigline{ border-top:1px solid #333; padding-top:4px; font-size:12px; min-width:190px; }
  .doc .meta{ margin-top:22px; font-size:9.5px; color:#999; border-top:1px solid #eee; padding-top:8px; }
  .empty{ text-align:center; color:var(--grey); font-size:13px; padding:20px; }
  .netpill{ position:fixed; top:62px; right:12px; font-size:11px; font-weight:700; border-radius:999px; padding:4px 11px; z-index:50; border:1px solid var(--line); background:#fff; color:var(--ok); }
  .netpill.off{ background:#fdf6e9; color:var(--warn); border-color:#e8d9b8; }
  .restored{ font-size:11.5px; font-weight:600; color:var(--blue); background:#eef3fb; border:1px solid #cfe0f4; border-radius:8px; padding:7px 10px; margin-bottom:9px; }
  @media print{ .netpill{ display:none; }
    body{ background:#fff; } .wrap{ max-width:none; padding:0; }
    .noprint{ display:none!important; } .doc{ border:0; border-radius:0; padding:0; }
    .doc .drow{ border-bottom:1px solid #ddd; }
  }
  @media print{ #shell{ display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="noprint"><h1>🗎 Authority forms</h1>
  <div class="sub">Fill a submission-ready form from data we already hold &mdash; each field shows its <b>source</b> and how much to trust it. Correct anything, freeze it, sign, print. Not a governance claim; verify at the issuing authority.</div></div>
  <div id="app"><div class="card"><div class="empty">Loading…</div></div></div>
</div>
<div id="netpill" class="netpill"></div>
<script src="/engine/screen.js"></script>
<script src="/app/edition.js"></script>   <!-- CBEdition (AX1): the showing this person chose — the switcher, the bell and the avatar's Edition choice follow it -->
<script src="/app/avatar.js"></script>
<script src="/engine/signin.js"></script>
<script src="/app/signin-ui.js"></script>
<script src="/app/one-person.js"></script>
<script src="/app/accounts-shell.js"></script>
<script src="/app/rail-bell.js"></script>
<script src="/app/screen-id.js"></script>   <!-- CBScreenId: this screen's name · code in the header, and every sheet's own (SCREEN-ID) -->
<script src="/app/shell.js"></script>
<script src="/app/page-frame.js"></script>   <!-- CBFrame: the shell header + the one sign-in window (H23/H24) -->
<script src="cb-offline.js"></script>
<script>
var API = new URLSearchParams(location.search).get('api') || (window.CBShell && CBShell.apiBase && CBShell.apiBase()) || window.CB_API;
var TOK = null,
  _stage = 'email',
  FORMS = [],
  SEL = null,
  CTX = '',
  MANUAL = {},
  RESOLVED = null,
  ISSUED = null,
  _restored = false,
  ORDERS = null;
/* K3: nobody knows a chit id - the shop's own recent orders (the existing chits reads: orders that came in, orders that went out) are PICKED, not typed. */
function orderLabel(c) {
  var sj = c.summary_json || {},
    v = sj.total_value != null ? Number(sj.total_value) : null,
    cur = sj.currency_code;
  var who =
    c.sender_entity_display_name ||
    (Array.isArray(c.all_recipients) && c.all_recipients[1] ? c.all_recipients[1].display_name || c.all_recipients[1].name : '') ||
    '';
  var d = String(c.created_at || '').slice(0, 10),
    sub = c.manual_subject || c.auto_subject || 'Order';
  var money = '';
  try {
    money = v != null ? new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }).format(v) : '';
  } catch (e) {
    money = v != null ? String(v) : '';
  }
  return [sub, who, money, d].filter(Boolean).join(' · ');
}
async function ordersLoad() {
  if (ORDERS) return ORDERS;
  var rs = await Promise.all(
    ['inbox', 'sent'].map(function (item) {
      return api('GET', '/api/chits/' + item + '?limit=20')
        .then(function (reply) {
          return (reply.status === 200 && reply.j && reply.j.chits) || [];
        })
        .catch(function () {
          return [];
        });
    })
  );
  var seen = {};
  ORDERS = rs[0]
    .concat(rs[1])
    .filter(function (item) {
      if (!item || !item.chit_id || seen[item.chit_id] || !/order/i.test(item.purpose || '')) return false;
      seen[item.chit_id] = 1;
      return true;
    })
    .sort(function (first, second) {
      return String(second.created_at || '').localeCompare(String(first.created_at || ''));
    })
    .slice(0, 20);
  return ORDERS;
}
function orderSelect(id, cur, none) {
  var list = ORDERS || [],
    has =
      !cur ||
      list.some(function (item) {
        return item.chit_id === cur;
      });
  return (
    '<select id="' +
    id +
    '" data-testid="' +
    id +
    '"><option value="">' +
    esc(none) +
    '</option>' +
    (has ? '' : '<option value="' + esc(cur) + '" selected>The order it was drawn from</option>') +
    list
      .map(function (item) {
        return '<option value="' + esc(item.chit_id) + '"' + (item.chit_id === cur ? ' selected' : '') + '>' + esc(orderLabel(item)) + '</option>';
      })
      .join('') +
    '</select>' +
    (ORDERS && !list.length
      ? '<div class="note" style="margin-top:4px" data-testid="orders-none">No recent orders yet. The form is filled from your own data.</div>'
      : '')
  );
}
function paintPill(s) {
  var node = el('netpill');
  if (!node) return;
  if (s.online) {
    node.className = 'netpill';
    node.textContent = s.pending ? '● Online · syncing ' + s.pending : '● Online';
  } else {
    node.className = 'netpill off';
    node.textContent = '⚠ Offline · ' + (s.pending ? s.pending + ' pending' : 'work saved locally');
  }
}
function saveAF() {
  if (window.CBOffline && SEL) CBOffline.saveDraft('af.' + SEL, { ctx: CTX, manual: MANUAL });
}
function el(id) {
  return document.getElementById(id);
}
async function api(m, p, body) {
  var h = { 'Content-Type': 'application/json' };
  if (TOK) h.Authorization = 'Bearer ' + TOK;
  var reply = await fetch(API + p, { method: m, headers: h, body: body ? JSON.stringify(body) : undefined });
  var j = null;
  try {
    j = await reply.json();
  } catch (e) {}
  return { status: reply.status, j: j };
}
function rungChip(s) {
  var c = { documented: 'c-documented', declared: 'c-declared', derived: 'c-derived' }[s] || 'c-none';
  return '<span class="chip ' + c + '">' + esc(s || 'missing') + '</span>';
}
function srcChip(s) {
  if (!s) return '';
  var c = s === 'order' ? 'c-order' : 'c-declared';
  return '<span class="chip ' + c + '">' + esc(s) + '</span>';
}

/* H23/H24: ONE sign-in. The shell above holds the one sign-in window; a session that ended is dropped and the window shows again (CBFrame.ended) - no second e-mail code here. */
function loginView() {
  CBFrame.ended();
}
async function boot() {
  var reply = await api('GET', '/api/forms');
  if (reply.status === 401) {
    TOK = null;
    return loginView('Session expired');
  }
  FORMS = (reply.j && reply.j.forms) || [];
  render();
  ordersLoad()
    .then(function () {
      var node = el('ctx');
      if (node) {
        CTX = (node.value || CTX || '').trim();
        var h = node.parentNode;
        node.outerHTML = orderSelect('ctx', CTX, 'No order — fill from my data');
        node = el('ctx');
        if (node)
          node.onchange = function () {
            if (SEL) resolve();
          };
      }
    })
    .catch(function () {});
}
function render() {
  var picker =
    '<div class="card noprint"><div class="note" style="margin-bottom:7px;font-weight:700">Pick a form</div>' +
    FORMS.map(function (item) {
      return (
        '<div class="formcard' +
        (SEL === item.key ? ' on' : '') +
        '" onclick="pick(\'' +
        item.key +
        '\')"><div class="t">' +
        esc(item.title) +
        '</div><div class="a">' +
        esc(item.authority || '') +
        ' &middot; ' +
        item.field_count +
        ' fields</div></div>'
      );
    }).join('') +
    '<label>Draw from one of your orders (optional)</label>' +
    orderSelect('ctx', CTX, 'No order — fill from my data') +
    '<div class="note" style="margin-top:4px">Pick an order to fill the buyer, invoice and value from it.</div>' +
    '</div>';
  el('app').innerHTML = picker + '<div id="work"></div>';
  if (SEL) resolve();
  var node = el('ctx');
  if (node)
    node.onchange = function () {
      if (SEL) resolve();
    };
}
function pick(k) {
  SEL = k;
  ISSUED = null;
  _restored = false;
  var d = window.CBOffline && CBOffline.loadDraft('af.' + k);
  if (d && (d.ctx || (d.manual && Object.keys(d.manual).length))) {
    MANUAL = d.manual || {};
    CTX = d.ctx || '';
    _restored = true;
  } else {
    MANUAL = {};
    CTX = ((el('ctx') || {}).value || '').trim();
  }
  render();
}
async function resolve() {
  CTX = ((el('ctx') || {}).value || CTX || '').trim();
  saveAF();
  var node = el('work');
  node.innerHTML = '<div class="card"><div class="empty">Filling from your data…</div></div>';
  var reply = await api('POST', '/api/forms/' + SEL + '/resolve', { context_ref: CTX || undefined, manual: MANUAL });
  if (reply.status === 401) {
    TOK = null;
    return loginView('Session expired');
  }
  RESOLVED = reply.j;
  drawForm();
}
function drawForm() {
  var d = RESOLVED || {},
    fields = d.fields || [];
  var restoredNote = _restored ? '<div class="restored">↩ Restored your unsaved draft &mdash; nothing was lost.</div>' : '';
  _restored = false;
  var banner = d.ready
    ? '<div class="banner ready">✓ Ready to issue &mdash; every required field is filled.</div>'
    : '<div class="banner notready">Missing required: ' +
      ((d.unresolved_required || [])
        .map(function (item) {
          return esc(item.label);
        })
        .join(', ') || '—') +
      '</div>';
  var rows = fields
    .map(function (item) {
      var missing = item.required && (item.value == null || item.value === '');
      return (
        '<div class="fld"><div class="lb">' +
        esc(item.label) +
        (item.required ? ' <span class="req">*</span>' : '') +
        ' ' +
        srcChip(item.source) +
        rungChip(item.rung) +
        '</div>' +
        '<input class="' +
        (missing ? 'miss' : '') +
        '" data-fid="' +
        esc(item.id) +
        '" value="' +
        esc(item.value) +
        '" placeholder="' +
        (missing ? 'required — type it' : '—') +
        '" onchange="edit(this)"></div>'
      );
    })
    .join('');
  var prov = d.provenance
    ? '<div class="prov">Provenance: ' +
      Object.keys(d.provenance)
        .map(function (item) {
          return d.provenance[item] + ' ' + esc(item);
        })
        .join(' &middot; ') +
      ' &middot; ' +
      ((d.completeness || {}).pct || 0) +
      '% filled</div>'
    : '';
  el('work').innerHTML =
    '<div class="card noprint"><div class="row" style="justify-content:space-between"><b style="font-size:14px">' +
    esc(d.title || SEL) +
    '</b><span class="note">' +
    esc(d.authority || '') +
    '</span></div>' +
    restoredNote +
    banner +
    rows +
    prov +
    '<div class="row" style="margin-top:12px"><button class="ok" id="issueBtn" ' +
    (d.ready ? '' : 'disabled') +
    ' onclick="issue()">Issue &amp; freeze</button>' +
    '<button class="gh" onclick="resolve()">Re-fill</button></div>' +
    '<div class="note" style="margin-top:8px">' +
    esc(d.note || '') +
    '</div><div id="issueErr" class="err"></div></div>';
}
function edit(node) {
  var id = node.getAttribute('data-fid');
  var v = node.value.trim();
  if (v) MANUAL[id] = v;
  else delete MANUAL[id];
  resolve();
}
async function issue() {
  if (window.CBOffline && !CBOffline.online()) {
    el('issueErr').innerHTML =
      '<span class="note" style="color:var(--warn)">⏳ You&rsquo;re offline &mdash; your filled form is saved as a draft. Issue it when you&rsquo;re back online (issuing needs the server to freeze &amp; number it).</span>';
    return;
  }
  el('issueBtn').disabled = true;
  var reply = await api('POST', '/api/forms/' + SEL + '/issue', { context_ref: CTX || undefined, manual: MANUAL });
  if (reply.status === 200) {
    ISSUED = reply.j;
    if (window.CBOffline) CBOffline.clearDraft('af.' + SEL);
    loadInstance(reply.j.form_id);
  } else {
    el('issueErr').textContent = (reply.j && (reply.j.message || reply.j.error)) || 'Issue failed (' + reply.status + ')';
    el('issueBtn').disabled = false;
  }
}
async function loadInstance(id) {
  var reply = await api('GET', '/api/forms/instances/' + id);
  if (reply.status !== 200) {
    el('issueErr').textContent = 'Loaded, but could not fetch the frozen form.';
    return;
  }
  drawDoc(reply.j);
}
function drawDoc(inst) {
  var fields = inst.fields || [];
  var body = fields
    .filter(function (item) {
      return item.value != null && item.value !== '';
    })
    .map(function (item) {
      return '<div class="drow"><div class="dk">' + esc(item.label) + '</div><div class="dv">' + esc(item.value) + '</div></div>';
    })
    .join('');
  var sig = inst.signatory
    ? '<div class="sigline">' +
      esc(inst.signatory.name) +
      (inst.signatory.designation ? '<br><span style="color:#777">' + esc(inst.signatory.designation) + '</span>' : '') +
      '</div>'
    : '<div class="sigline" style="color:#aaa">Signature</div>';
  var doc =
    '<div class="doc"><h2>' +
    esc(inst.title) +
    '</h2><div class="auth">' +
    esc((RESOLVED && RESOLVED.authority) || '') +
    '</div>' +
    body +
    '<div class="sig"><div>' +
    (inst.signed_at ? '<div class="note" style="color:#2f7a45;font-weight:700">Signed ' + esc(String(inst.signed_at).slice(0, 10)) + '</div>' : '') +
    '</div>' +
    sig +
    '</div>' +
    '<div class="meta">Issued via Chit &amp; Bridge &middot; content hash ' +
    esc(String(inst.content_hash || '').slice(0, 24)) +
    '… &middot; This is a self-prepared submission; verify at the issuing authority.</div></div>';
  var controls =
    '<div class="card noprint"><div class="banner ready">✓ Issued &amp; frozen' +
    (inst.signed_at ? ' &amp; signed' : '') +
    '.</div><div class="row">' +
    (inst.signed_at ? '' : '<button class="pri" onclick="sign(\'' + inst.form_id + '\')">Sign (authorised signatory)</button>') +
    '<button class="gh" onclick="window.print()">Print / Save PDF</button>' +
    '<button class="gh" onclick="pick(\'' +
    SEL +
    '\')">New form</button></div><div id="signErr" class="err"></div>' +
    '<label style="margin-top:12px">Transfer on the rail — file onto a chit (per-copy)</label>' +
    '<div class="row"><div style="flex:1;min-width:150px">' +
    orderSelect('attach_chit', CTX, 'Pick the order to file it on') +
    '</div>' +
    '<button class="ok" onclick="attach(\'' +
    inst.form_id +
    '\')">File on rail</button></div>' +
    '<div id="attachMsg" style="margin-top:6px"></div>' +
    '<div class="note" style="margin-top:4px">Files the frozen form as an attachment on that chit — every participant gets their own copy to view, verify at source, or dispute.</div></div>';
  el('work').innerHTML = controls + doc;
}
async function sign(id) {
  var reply = await api('POST', '/api/forms/instances/' + id + '/sign', {});
  if (reply.status === 200) {
    loadInstance(id);
  } else {
    el('signErr').textContent = (reply.j && (reply.j.message || reply.j.error)) || 'Sign failed (' + reply.status + ')';
  }
}
async function attach(id) {
  var cid = ((el('attach_chit') || {}).value || '').trim();
  if (!cid) {
    el('attachMsg').innerHTML = '<span class="err">Pick the order to file it on.</span>';
    return;
  }
  el('attachMsg').innerHTML = '<span class="note">Filing on the rail…</span>';
  var reply = await api('POST', '/api/forms/instances/' + id + '/attach', { chit_id: cid });
  if (reply.status === 200) {
    el('attachMsg').innerHTML =
      '<span class="note" style="color:#2f7a45;font-weight:700">✓ Filed on the rail &mdash; attachment ' +
      esc(String(reply.j.attachment_id).slice(0, 8)) +
      '… delivered to ' +
      (reply.j.participants || 1) +
      ' participant copy(ies).</span>';
  } else {
    el('attachMsg').innerHTML =
      '<span class="err">' + esc((reply.j && (reply.j.message || reply.j.error)) || 'Attach failed (' + reply.status + ')') + '</span>';
  }
}
if (window.CBOffline) {
  CBOffline.configure({
    apiBase: API,
    token: function () {
      return TOK;
    },
    onChange: paintPill
  });
  CBOffline.registerSW();
}
var FRAME = CBFrame.mount({ app: 'documents', work: document.querySelector('.wrap') });
TOK = FRAME.token;
if (TOK) {
  boot();
} else {
  el('app').innerHTML = '<div class="card"><div class="empty">Sign in above to continue.</div></div>';
}
</script>
</body>
</html>
