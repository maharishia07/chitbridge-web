<!doctype html>
<html lang="en" data-tokens="list">
<!-- OWNS  the Offer lab (and its combo mode): the offers engine on a bare page — a cart priced live by engine/offers.js, never a second sum.
     CALLED BY the labs links on Home, the Catalogue's "see the offer", combo-lab.html (forwards here).
     LAB STANDARD (W16-W19, 22 Oct): the left menu = the eight offer types in four groups (GOALS/KINDS) · the middle = Settings or the form of the picked type ·
     the right = the cart, "Your offers (draft)" = the saved-offers shelf (SAVED, /api/definitions), with Make live and Only for a group. ?mode=combo has neither.
     FLOW  load → CBFrame.lab (the Finance frame, types in its left menu) → pick a type → the engine prices the typed cart → Add to your offers → attach from the cart → paint
     CARD 29-qa-test-tooling-ux-locale-and-design-system/offer-lab -->
<head>
<meta charset="utf-8">
<script src="/app/device-id.js"></script>
<script src="/config.js"></script>   <!-- HX1: window.CB_API — this deploy's one api address -->
<script src="/engine/locale.js"></script>   <!-- CBLocale: the shop's money word / symbol (moneySymbol below) and its number format -->
<script src="/app/helpers.js"></script>   <!-- T2-WEBPRIMS: esc · fmtMoney · monthNames — the ONE copy; loads before every script that calls them -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offer Lab · ChitBridge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --page:#FCFAF5; --card:#FFFFFF; --panel:#F3EFE6;
  --line:#DDD6C6; --line-soft:#E6E0D2; --hair:#F0ECE2;
  --ink:#1D1B16; --muted:#5E594D; --faint:#675F50; --ghost:#675F50;
  --green:#16693F; --green-d:#0D4A2B; --green-t:#E8F4ED; --green-b:#A9D3BC;
  --amber:#E0A020; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205;
  --red:#C4562F; --red-t:#FBEAE3; --red-b:#E7B9A8; --red-i:#8E3517;
  --blue:#2F74C9; --blue-t:#E4EEFA; --blue-b:#B9D2EF; --blue-i:#174A87;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:var(--f-ui,'IBM Plex Sans',system-ui,sans-serif);font-size:15px;line-height:1.45}   /* SYSTEM.md §2: one face, the avatar's reading font honoured (SHELL-ONE) */
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:20px 22px 60px}
.labtools{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}   /* the lab's tools row (its header is the frame's — SHELL-ONE) */
.title{font-family:'Bricolage Grotesque',sans-serif;font-size:25px;font-weight:800;letter-spacing:-.02em;margin:0}
.grow{flex:1}
.chip{height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}

.strip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:11px;padding:9px 14px;margin-bottom:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.strip b{color:var(--ink)}
.strip button{margin-left:auto;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:600}


.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.h{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800;margin:0}
.hs{font-size:13px;color:var(--muted);margin:4px 0 0}
.lbl{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--faint);margin-top:5px;line-height:1.35}
.screen{display:none} .screen.on{display:block}
/**
 * ── ⭐⭐⭐ [2026-09-26] SETTINGS SCREEN REBUILT PER SPEC — from Athi's own design doc
 * (offer-lab-settings.md.docx): "The screen you built is ~1,300 px tall, six cards, three yellow strips and
 * two competing action rows. The new one is one card, 281 px. Nothing was lost; things were put where they
 * belong." Reuses .inp/.two/.lbl/.seg/.btn/.acts/.chip already in this file (the doc built its prototype
 * against these exact tokens); only what's genuinely new gets a new class below.
 */
.loyrow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);
  border-radius:11px;height:50px;padding:0 13px}
.loyrow.on{border-color:var(--blue-b);background:var(--blue-t)}
.loyrow .sm{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;
  background:var(--card);height:34px;margin-left:auto}
.loyrow .sm input{border:0;outline:0;background:transparent;width:46px;padding:0 0 0 9px;
  font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;text-align:right}
.loyrow .sm span{padding:0 9px;color:var(--faint);font-size:13px;font-weight:600}
.loyrow .off{margin-left:auto;font-size:13px;color:var(--ghost);font-weight:600}
.now{font-size:13px;color:var(--muted);margin-top:9px}
.now b{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--ink)}
.now i{font-style:normal;color:var(--ghost)}
/* the fine print: one line, everything that is already fine, until "Change" opens it */
.fine{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;
  padding-top:15px;border-top:1px solid var(--hair);font-size:13px;color:var(--muted)}
.fine .dot{color:var(--ghost)}
.fine button{margin-left:auto;height:32px;padding:0 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600}
.open{display:none;margin-top:16px;border-top:1px solid var(--hair);padding-top:16px}
.open.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.sfld>span.lbl{margin-bottom:6px}   /* the settings fields: NOT .fld (the sheet's number field, fixed 48px high) - W29 */
.sub{font-size:12px;color:var(--ghost);margin-top:6px}
/* ⭐ "Tools become icon-only (labels drop, icons grow)" — the top-bar's .chip.tool buttons, per the spec's own
   phone rule. `.g` is the icon glyph, `.tx` its label; only .tx hides. */
.tool .g{font-size:14px;color:var(--faint);line-height:1}
.toolmenu-btn{display:none}
.toolmenu-body{display:contents}
@media(max-width:760px){
  .toolmenu-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px}
  .toolmenu-body{display:none;flex-direction:column;gap:8px;width:100%}
  .labtools.menu-open .toolmenu-body{display:flex}
  .toolmenu-body .tool{flex:0 0 auto;justify-content:flex-start}
  .fine button{margin-left:0;width:100%}
  .grid{grid-template-columns:1fr}
  .tool{flex:1 1 calc(50% - 8px);justify-content:center;gap:7px;min-height:44px;padding:0 8px}   /* W34: a word beside every glyph, two to a row */
  .tool .g{font-size:17px}
  .cartacts .btn, .lab-next .lk-more{min-height:44px}   /* W48: a touch target */
}
/* the cart column (W19): lab-kit.css gives .lab-cols/.lab-next; the page's own padding already frames it */
.wrap .lab-body{padding:0;margin-top:4px}
.lab-body.solo{grid-template-columns:minmax(0,1fr)}
.lab-body .lab-next[hidden]{display:none}
.lab-mid{min-width:0}
/* the frame styles ITS #screen as .cbsk .screen (flex); this page's own step panes share the class name, so the one that is not on stays hidden */
.cbsk .lab-mid .screen{display:none}
.cbsk .lab-mid .screen.on{display:block}
.cartacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.cartacts .btn{height:36px;padding:0 12px;font-size:13px}
.lab-next .lk-more{color:var(--ink)}
.cartnote{font-size:12.5px;margin-top:6px;color:var(--muted)}
.cartnote.ok{color:var(--green-d)}
.cartnote.bad{color:var(--red-i)}
/* UX-109 / W21: the reach of an offer is a card, not a quiet dropdown */
.reach{border:2px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:14px;background:var(--card)}
.reach.set{border-color:var(--blue-b);background:var(--blue-t)}
.reach .ask{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:6px;display:block}
.reach .line{font-size:17px;font-weight:700;color:var(--ink);margin:2px 0 10px;overflow-wrap:anywhere}
.reach .line.none{color:var(--red-i)}
.landing-hint{margin:14px 0 0;font-size:14px;color:var(--muted)}
.cartpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cartpick select{height:36px;max-width:100%;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:0 8px;font-size:13px}
.btn.only-narrow{display:none}
@media(max-width:760px){.btn.only-narrow{display:inline-flex;align-items:center}}
.cols{display:grid;gap:16px}
@media(min-width:900px){ .c-2{grid-template-columns:1fr 1fr} }

.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
.goal{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;text-align:left;
  display:flex;gap:12px;align-items:flex-start;min-height:74px}
.goal.on{border:2px solid var(--green);background:var(--green-t);padding:13px}
.goal .gi{width:38px;height:38px;border-radius:10px;background:var(--panel);display:grid;place-items:center;
  font-size:19px;flex:0 0 auto}
.goal.on .gi{background:var(--green);color:#fff}
.goal b{display:block;font-size:14.5px;line-height:1.25}
.goal .ex{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;font-family:'IBM Plex Mono',monospace}
.grouphead{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--muted);margin:9px 0 -2px;
  display:flex;align-items:center;gap:9px}
.grouphead i{flex:1;height:1px;background:var(--line-soft);font-style:normal}

.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:14px;font-weight:600}
.seg button.on{background:var(--green);border-color:var(--green);color:var(--on-accent,#fff)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--card);
  overflow:hidden;height:48px}
.inp span{padding:0 11px;color:var(--faint);font-weight:600;font-size:14px;flex:0 0 auto;white-space:nowrap}
.inp input,.inp select{border:0;outline:0;padding:0 11px;height:100%;width:100%;background:transparent;
  font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600}
.inp select{font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500}
.inp:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-t)}
.f{margin-bottom:14px}
/* ⭐⭐⭐ [2026-09-26] item/category pickers now open #priceOverlay in a picking mode (see openPickOverlay,
   selectOf) instead of a dropdown of their own — no picker-specific CSS needed here any more. */
.ovlpickrow:hover{background:var(--green-t)}
/**
 * ── ⭐⭐⭐ [2026-09-26] "WORK IT OUT" REBUILT PER ATHI'S OWN offer-lab-workitout.html — the two discounts as a
 * side-by-side pair, a live combined-rate line, and the result as a MODAL over the controls rather than pushed
 * in below them. Reuses .headline/.res/.ovlx (already this file's own — the doc's prototype was built against
 * them); only .pair/.box/.num/.sum/.scrim/.sheet/.shhd/.tag/.shbd/.shft are genuinely new.
 * ⚠️ "Apply it to" (scopeRow()) stays the REAL picker built and tested over this whole session — checkboxes,
 * select-all, dynamic-category, clash-highlighting — not the doc's own plain <select>, which named only 4
 * illustrative options out of 7 categories and 31 products. That control was standing in for "a picker goes
 * here," the same way the Settings doc's "61%" stood in for a live number, not a literal instruction to
 * replace a working, tested mechanism with one that cannot check a box.
 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-top:16px}
.box{border:1px solid var(--line);border-radius:12px;padding:13px 15px;min-height:96px}
/**
 * ⭐⭐⭐ [found live, 2026-09-26] "take off, everyone pay this, alignment is not same as the other box" — real
 * cause, not just a styling gap: the loyalty box carried classes `box loy`, and `.loy` ALREADY existed as a
 * completely different, older component (the full-width "loyalty bar", `display:flex;align-items:center`) —
 * so the loyalty box silently inherited a flex-ROW layout that laid its header/field/hint out side by side,
 * while the plain "Take off" box (just `.box`, no such collision) stacked the same three pieces vertically.
 * Two boxes meant to be a matched pair, rendering with two different internal layouts. Renamed to `.box.on`
 * (the same plain modifier `.quick button.on`/`.pnl button.on` already use elsewhere) so nothing but THIS
 * rule ever matches it again.
 */
.box.on{border-color:var(--blue-b);background:var(--blue-t)}
.boxhd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.boxhd .t{font-size:13.5px;font-weight:700}
/**
 * ⭐⭐⭐ [found live, 2026-09-26, goal-audit pass] A SECOND COLLISION, RIGHT NEXT TO THE FIRST ONE'S OWN
 * WARNING ABOVE — Athi: "when i change the offer type, the headers are going north... it has to be
 * consistent." Real cause on the 'amount' (₹ off) goal's result table: THIS session's own new "Take off" /
 * "Loyalty bonus" number field (a <span class="num"> wrapping an <input> and a unit suffix) reused the class
 * name `.num` — already, and much longer, a plain <td class="num"> utility on every results table (outLine/
 * outQty/cartPreviewHTML) that does nothing but set a monospace, tabular-numeral font. `display:inline-flex`
 * (needed for the input+unit pair, wrong for a table cell) doesn't get overridden by the older rule two
 * screens away — CSS merges non-overlapping properties from both — so every `<td class="num">` cell quietly
 * became `display:inline-flex`, which pulls it clean out of the table's column grid: exactly the "headers
 * over here, the numbers under them somewhere else" jumble reported live. Renamed to `.numf` (a NUMBER
 * FIELD, not a number cell) so nothing but the input component ever matches this again.
 */
.numf{display:inline-flex;align-items:baseline;gap:2px}
.numf input{width:78px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  height:52px;padding:0 10px;text-align:right;outline:0;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:700}
.numf input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-t)}
.numf .u{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--faint)}
.hint.bad{color:var(--red-i);font-weight:600}
.sum{display:flex;align-items:baseline;gap:10px;margin-top:16px;padding:13px 16px;
  background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;flex-wrap:wrap}
.sum .big{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;letter-spacing:-.01em}
.sum .wd{font-size:13px;color:var(--muted)}
/* the result, as an overlay — never pushed in below the controls */
.scrim{position:fixed;inset:0;background:rgba(29,27,22,.45);display:none;
  align-items:center;justify-content:center;padding:24px;z-index:50}
.scrim.on{display:flex}
/* ⭐ [found live, 2026-09-26] "a resizable window" — native CSS resize, no JS: drag the bottom-right corner.
   min-width/min-height stop it collapsing onto its own header. */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;
  width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;
  box-shadow:0 18px 48px rgba(29,27,22,.22);overflow:hidden;resize:both;min-width:460px;min-height:340px}
/* ⭐ [found live, 2026-09-26] "it is not movable, i should be able to drag anywhere as i want" — the header
   is the drag handle (dragSheetStart()); its own buttons keep a normal pointer cursor, see the rule below. */
.shhd{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--hair);flex-wrap:wrap;
  cursor:grab;user-select:none}
.shhd:active{cursor:grabbing}
.shhd button{cursor:pointer}
.shhd h3{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;margin:0}
.tag{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;
  background:var(--green-t);color:var(--green-d);border:1px solid var(--green-b);border-radius:8px;padding:2px 9px}
.shbd{overflow:auto;padding:0}
.shft{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--hair);background:var(--page);flex-wrap:wrap;align-items:center}
.why{font-size:12.5px;color:var(--faint)}
.promise{flex:1 0 100%;margin:0;font-size:13.5px;color:var(--ink)}   /* the sheet's last word before Add: what this saves, in words */
/**
 * ── ⭐⭐⭐ [2026-09-26] THE CONTROLS, PER ATHI'S OWN offer-lab-controls_1.html — its own review corrects the
 * compact formula row this session had just shipped: "the combined figure is a sentence, not a formula ——
 * `10% + 10% off = 19%` reads like broken arithmetic — anyone checking it gets 20." One row per real number
 * (margin threshold / take off / loyalty bonus), a big typed field, and shortcut buttons that write into that
 * field and light up only while they match it — "not a second control." Reuses .sum/.sw/.note.n-bad already
 * in this file (the doc's own `.out`/`.warn` match them closely enough that a second copy would just be the
 * same tokens under a different name); `.row`/`.fld`/`.quick` are genuinely new.
 */
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--hair)}
.row:first-child{padding-top:0}
.row:last-of-type{border-bottom:0}
.row .lab{width:150px;flex:0 0 auto;font-size:13.5px;font-weight:700}
.row .lab small{display:block;font-size:11.5px;font-weight:500;color:var(--faint);margin-top:1px}
.fld{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--card);height:48px;overflow:hidden;flex:0 0 auto}
.fld input{border:0;outline:0;background:transparent;width:74px;padding:0 4px 0 12px;text-align:right;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:24px;font-weight:700}
.fld .u{padding:0 12px 0 3px;color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:700}
.fld:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-t)}
.fld.off{opacity:.4}
.quick{display:flex;gap:5px;flex-wrap:wrap}
.quick button{height:34px;min-width:52px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:700;color:var(--muted)}
.quick button.on{background:var(--green);border-color:var(--green);color:var(--on-accent,#fff)}
.quick button:hover:not(.on){border-color:var(--ghost)}
@media(max-width:640px){
  .row{gap:10px}
  .row .lab{width:100%}
  .quick{width:100%} .quick button{flex:1}
}
/**
 * ── ⭐⭐⭐ [2026-09-26] THE RESULT PANEL, PER ATHI'S OWN offer-lab-result.html — a verdict said in words before
 * any table, a per-row "meets your margin?" answer with a computed "only up to N% off" fix, and a second,
 * genuinely NEW panel: what the CUSTOMER sees, cost and margin absent from it entirely, not hidden — never
 * sent there at all. Scoped `.vtbl` (not bare `table`/`td`) so this doesn't collide with `.res`/`.ovltbl`/`.g3`,
 * the other tables already on this page for other goal kinds. `.pri`/`.disabled` styling reuses `.btn` already
 * declared above.
 */
.pnl{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line-soft);border-radius:9px;padding:3px;margin-left:6px}
.pnl button{height:28px;padding:0 11px;border-radius:6px;border:0;background:transparent;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pnl button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/**
 * ⭐ [2026-09-26, holistic pass] "look at the whole as one piece again... a bit more aesthetic." Was edge-to-
 * edge with square corners while .sum (right above it) is an inset, rounded, bordered card — two different
 * visual languages stacked directly on each other, a real seam from being assembled across several docs. Now
 * matches .sum's own treatment (inset, rounded, a full border in its own colour) so the two read as one flow.
 */
.verdict{display:flex;align-items:center;gap:14px;padding:14px 17px;margin-top:12px;border-radius:12px;border:1px solid}
.verdict .mk{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;font-weight:800;flex:0 0 auto;color:#fff}
.verdict .tx b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.verdict .tx span{display:block;font-size:13px;margin-top:2px}   /* no opacity: it took the line to 4.0:1 in Dark (W43) */
.verdict.pass{background:var(--green-t);border-color:var(--green-b);color:var(--green-d)}
.verdict.pass .mk{background:var(--green)}
.verdict.some{background:var(--amber-t);border-color:var(--amber-b);color:var(--amber-i)}
.verdict.some .mk{background:var(--amber-i)}
.verdict.fail{background:var(--red-t);border-color:var(--red-b);color:var(--red-i)}
.verdict.fail .mk{background:var(--red-i)}
.vtbl{width:100%;border-collapse:collapse;font-size:14px}
/* ⭐ "only the products should scroll" — the whole <thead> (both its rows) stays pinned while tbody scrolls
   beneath it; the verdict above the table is pinned separately, outside the scroll entirely (see
   percentVerdictHTML/paintWork). */
.vtbl thead{position:sticky;top:0;z-index:2}

/**
 * ⭐⭐⭐ [2026-09-26] PRINTABLE — Athi: "if it is printable, that will be good." Only the offer's own name/rate
 * and its verdict+table print; the editable controls (.no-print — margin/discount/loyalty fields, the toggle,
 * every quick-preset) and the footer's own action buttons have no place on paper. `position:sticky` is reset
 * to static for print — sticky is a screen-scrolling behaviour, and printed pages have no "scroll" to stick
 * within, only page breaks (a stuck header would otherwise repeat mid-table or clip a row behind it).
 */
@media print{
  body *{visibility:hidden}
  .scrim, .scrim *{visibility:visible}
  .scrim{position:static;background:none;display:block;padding:0}
  /* !important on position/left/top/margin: a dragged sheet carries those as INLINE styles (dragSheetStart()),
     which beat a plain stylesheet rule — without !important a print taken mid-drag would print at that fixed
     screen spot instead of full-width on the page. */
  .sheet{position:static!important;left:auto!important;top:auto!important;margin:0!important;
    width:100%;max-height:none;height:auto;box-shadow:none;border:0;resize:none;overflow:visible}
  .no-print, .shft, .ovlx, #workPnl{display:none!important}
  .shbd{overflow:visible!important}
  .vtbl thead{position:static}
  .scroll{overflow:visible!important}
}

 * ⚠️⚠️⚠️ [found live, 2026-09-26] "i don't need this" — two empty amber bars sitting where #labqueue and
 * #labtoast should have been invisible. Both carry `hidden` in the HTML, but `.note{display:flex}` (declared
 * twice in this file, at equal specificity to the browser's own `[hidden]{display:none}`) wins because
 * author CSS always beats the UA stylesheet — so a `hidden`, empty .note rendered as a bordered pill with
 * nothing in it instead of vanishing. `.note[hidden]` outranks a bare `.note` on specificity alone, so this
 * one rule fixes both duplicated `.note{}` blocks without touching either of them.
 */
.note[hidden]{display:none}
.note{display:flex;gap:9px;border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.4;margin-top:12px}
.note .ic{font-weight:700;flex:0 0 auto}
.n-ok{background:var(--green-t);border:1px solid var(--green-b);color:var(--green-d)}
.n-warn{background:var(--amber-t);border:1px solid var(--amber-b);color:var(--amber-i)}
.n-bad{background:var(--red-t);border:1px solid var(--red-b);color:var(--red-i)}
.n-say{background:var(--panel);border:1px solid var(--line-soft);color:var(--muted)}

/* actions */
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{height:44px;padding:0 16px;white-space:nowrap;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--on-accent,#fff)}   /* the theme names the ink that sits on its accent: white on Cream, dark on the light green of Dark */
.btn.pri:disabled{background:var(--panel);border-color:var(--line);color:var(--ghost)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn b{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:rgba(0,0,0,.08);border-radius:5px;padding:1px 6px}
.btn.pri b{background:rgba(255,255,255,.22)}
/**
 * ⭐ [found live, 2026-09-26] "back button is there, but not noticeable, possibly you have to give a specific
 * color for all the back buttons. same color" — backBtn() was a plain `.btn`, background var(--card), sitting
 * on a `.card` section whose own background is the SAME white — nothing but a 1px line separated it from the
 * page. Every backBtn() call (screen 2, screen 3, the goal picker) shares this one class, so one rule covers
 * all of them, always the same color, per the ask.
 */
.btn.back{background:var(--panel);border-color:var(--ghost);font-weight:700}
.btn.back:hover{background:var(--line-soft)}
/**
 * ⭐ [found live, 2026-09-26] "apply to is not looking prominant" — scopeRow()'s picker was a plain `.btn`,
 * identical to every other secondary button on the screen, even though it decides WHICH items the whole offer
 * below it applies to — nothing downstream means anything until this is set. Given the same blue accent the
 * loyalty switch and the matched-pair boxes already use for "this is live and it matters", so it reads as the
 * one control worth looking at first, not just another button in the row.
 */
.btn.scope{border:1.5px solid var(--blue-b);background:var(--blue-t);color:var(--blue-i)}
.btn.scope:hover{border-color:var(--blue)}

/* saved offers: a row on the left, the open offer in the middle */
.svt{font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.svd{font-size:12.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.pin-h{font-size:14px;margin:2px 4px 0;color:var(--ink)}

.pin-row:hover{background:var(--panel,#f3efe6)}

/**

<script>
/* THE EIGHT OFFER TYPES, in four groups (W17): the left menu draws them, the middle's phone list draws them, goalOf() reads them. One list, read before the frame. */
var GOALS = [
  { id: 'percent', kind: 'line', icon: '%', n: 'A percentage off', ex: '10% off' },
  { id: 'amount', kind: 'line', icon: '₹', n: 'Rupees off', ex: '₹10 off each' },
  { id: 'qty', kind: 'line', icon: '▦', n: 'Cheaper when they buy more', ex: '2+ → 5%, 5+ → 10%' },
  { id: 'free', kind: 'pair', icon: '+', n: 'Something free', ex: 'buy 2, get 1' },
  { id: 'bundle', kind: 'pair', icon: '▣', n: 'Two things at one price', ex: 'dosa + coffee = ₹80' },
  { id: 'spend', kind: 'bill', icon: '↑', n: 'Reward a big bill', ex: 'over ₹500 → ₹50 back' },
  { id: 'ship', kind: 'bill', icon: '⌁', n: 'Free delivery', ex: 'over ₹300 → free' },
  { id: 'band', kind: 'guard', icon: '⌂', n: 'Refuse very small or big bills', ex: '₹50 to ₹2,000' }
];
var KINDS = {
  line: "One thing's price",
  pair: 'Two things together',
  bill: 'Bill size',
  guard: 'Allows or blocks'
};
var LAB_COMBO = new URLSearchParams(location.search).get('mode') === 'combo'; /* Combo Lab is a mode of this page: no types menu, no cart */
/** the left menu: each type under its group heading, a glyph for the 64px phone rail (a sections list for CBFrame.lab) */
function labTypeSections() {
  var out = [],
    last = null;
  GOALS.forEach(function (goal) {
    if (goal.kind !== last) {
      last = goal.kind;
      /* open by default (the eight types stay in sight); a heading folds its types and says how many it holds */
      out.push({ group: KINDS[goal.kind], fold: true, open: true, count: GOALS.filter(function (other) { return other.kind === goal.kind; }).length });
    }
    out.push({ k: goal.id, label: goal.n, glyph: goal.icon });
  });
  return out;
}
</script>
<script>
var LAB_FRAME = null; /* the mounted frame: render() lights the menu entry of the type on show */
(function () {
  if (!window.CBFrame) return;
  var combo = LAB_COMBO;
  /* UX-90 + W16/W17: the Finance frame; its left menu is THIS lab's choices - the eight offer types under four headings (the other labs are the top switcher's).
     Combo Lab is a mode of this page and keeps its own bar, no menu. */
  LAB_FRAME = CBFrame.lab({
    app: 'offer-lab',
    name: combo ? 'Combo Lab' : 'Offer Lab',
    icon: combo ? '▣' : '%',
    sections: combo ? [] : labTypeSections(),
    pinned: !combo,
    phone: combo ? undefined : { items: [{ k: 'new', label: 'New' }, { k: 'yours', label: 'Your offers (0)' }], active: 'new', onPick: function (tabName) { labPhonePick(tabName); } },
    active: 'percent',
    onSection: function (type) {
      pickGoal(type); /* defined further down: read when a type is tapped */
    }
  });
  if (combo && window.CBScreenId) CBScreenId.here('offer-lab', 'combo');
})();
</script>

 * CBOffers.evaluate() at that percentage is mathematically identical to price*(1-frac), and provably so:
 * verified against the spec's own §10 checks (10% off ₹70 → ₹63, compounded 10%+10% → 19% not 20%) before
 * this file was written. The difference from computing it locally is provenance, not the number — every
 * "final price" on this screen now comes from the same call the till and the storefront make, so a future
 * change to how the engine rounds or stacks reaches this page automatically instead of silently diverging.
 * ⚠️ ROUNDING AND THE BELOW-COST FLOOR STAY HERE, NOT IN THE ENGINE. They are this LAB's own policy — "never
 * show a price you would not actually charge" — not a fact about the offer, and the engine correctly knows
 * nothing about either.

/**
 * ⭐⭐⭐ [2026-09-26] ONE PICKER, NOT TWO — Athi: "can the same multi checkbox can be used for either single
 * item or for entire category with select all option, why do we need 2?" Right question. The old "A whole
 * category / One item" toggle plus two separate pickers is now one button that opens #priceOverlay once, in
 * 'apply' mode: check any number of specific products (a static list — exactly what was picked, never more),
 * or — while filtered to one category — "Use the whole X category" instead (still a real, DYNAMIC category
 * scope, not a snapshot of today's items in it: Athi, same conversation: "if we apply for a category, then it
 * has to be applied for the entire category, if a new product is added, then it has to ask specifically, are
 * you happy to apply the offer as well" — that ask-on-new-product step is catalogue-write territory, a real
 * follow-up, not part of this picker; what this picker preserves is that the SAVED scope stays `category:X`,
 * not `item_ids:[...]`, so that follow-up has something dynamic to hook into later).
 * ⚠️ `catOnly` (free/cheapest's OWN picker, which only ever means a category) is untouched — it still opens
 * the simple single-chip category picker via selectOf(), unrelated to this.
 */
/** a count in words: "1 item", "12 items" */
function itemsWord(count) {
  return count + ' item' + (count === 1 ? '' : 's');
}
/** up to three names then "and N more", with the count first: "12 items: A, B, C and 9 more" */
function namesWords(names) {
  return itemsWord(names.length) + ': ' + names.slice(0, 3).join(', ') + (names.length > 3 ? ' and ' + (names.length - 3) + ' more' : '');
}
/** the scope a state (the form's S, or a saved offer's snapshot) holds, in words: "all 12 items in Sweets", "3 items: A, B, C", or '' while nothing is chosen (UX-109: never a default) */
function scopeWords(state) {
  if (state.scope === 'cat' && state.catId) return 'all ' + itemsWord(catItems(state.catId).length) + ' in ' + catName(state.catId);
  var wanted = state.scope === 'item' ? state.itemIds || [] : [],
    picked = wanted.map(byId).filter(Boolean),
    gone = wanted.length - picked.length;
  if (!wanted.length) return '';
  var shown = picked.length ? namesWords(picked.map(function (item) { return item.name; })) : '0 items';
  return shown + (gone ? ', ' + gone + ' no longer in your catalogue' : '');
}
/** the reach the form currently holds in words, or '' while nothing is chosen */
function reachWords() {
  return scopeWords(S);
}
/**
 * "Who and what does this apply to?" - the first thing a line offer asks and the only way to carry on (UX-109, walk W21). Nothing is pre-chosen:
 * the card says "nothing chosen yet" in red until the shopkeeper picks, then states the reach and the count in a prominent line.
 * catOnly = the "cheapest is free" shape, which takes a whole category and nothing else.

  return (
    '<div class="reach' + (words ? ' set' : '') + '" data-testid="reach-card"><span class="ask">Who and what does this apply to?</span>' +
    '<div class="line' + (words ? '' : ' none') + '" data-testid="reach-line">' + (words ? 'Applies to: ' + esc(words) : 'Applies to: nothing chosen yet') + '</div>' +
    picker + '</div>'

/**
 * "Work it out" is refused until there is something real to work out, with the reason said right beside the button rather than a silent
 * no-op click (offer-lab-workitout.html; UX-109 widened it from percent/amount to every kind: nothing is pre-chosen, so each kind says what is still missing).
 */
var WHY_REACH = 'Choose what it applies to first.';
/** has the reach been chosen: a whole category, or at least one item */
function reachChosen() {
  return S.scope === 'cat' ? !!S.catId : !!(S.scope === 'item' && S.itemIds && S.itemIds.length);
}
/** percent / amount: the reach first, then a rate that makes sense */
function whyRate() {
  if (!reachChosen()) return WHY_REACH;
  var rate = S.goal === 'percent' ? num(S.pctOff) : num(S.rsOff);
  if (rate <= 0) return S.goal === 'percent' ? 'Take off more than zero.' : 'Take off more than ' + moneySymbol() + '0.';
  if (S.goal === 'percent') return rate > 95 ? 'Take off 95% or less.' : '';
  var dear = items().filter(function (product) { return product.price > 0 && rate >= product.price; })[0];
  return dear ? 'Take off less than ' + M0(dear.price) + ' — that is what ' + dear.name + ' costs.' : '';
}
/** reward a big bill: the bill must reach more than it gives back, or the shop pays out more than it takes in */
function whySpend() {
  return num(S.spendVal) >= num(S.spendAt) ? 'Give back less than the bill must reach (' + M0(num(S.spendAt)) + ').' : '';
}
/** free delivery: no amount below nothing (a negative "they still pay" would pay the customer to take delivery) */
function whyShip() {
  var typed = [S.shipAt, S.shipCost, S.shipCharge];
  return typed.some(function (amount) { return num(amount) < 0; }) ? 'Type an amount of ' + moneySymbol() + '0 or more.' : '';
}
/** what is still missing for a free offer, by shape: a gift, an item, a pair or a category */
var FREE_MISSING = {
  anything: function () { return byId(S.giftId) ? '' : 'Choose what is free first.'; },
  same: function () { return byId(S.itemId) ? '' : 'Choose the item first.'; },
  pair: function () { return byId(S.pairA) && byId(S.pairB) ? '' : 'Choose what they buy and what they get first.'; },
  cheapest: function () { return S.catId ? '' : WHY_REACH; }
};
function whyFree() {
  var check = FREE_MISSING[S.freeShape];
  return check ? check() : 'Choose which kind of free offer first.';
}
function whyBundle() {
  if (!(byId(S.bunA) && byId(S.bunB))) return 'Choose the two things first.';
  return num(S.bunPrice) > 0 ? '' : 'Type what they cost together.';
}
function whyBand() {
  return num(S.bandLo) > num(S.bandHi) ? 'The smallest bill must not be above the largest.' : '';
}
var WHY_BY_GOAL = {
  percent: whyRate,
  amount: whyRate,
  qty: function () { return reachChosen() ? '' : WHY_REACH; },
  free: whyFree,
  bundle: whyBundle,
  spend: whySpend,
  ship: whyShip,
  band: whyBand
};
/** why "Work it out" is off right now ('' = it may go): each kind says what is still missing */
function applyWhy() {
  var check = WHY_BY_GOAL[S.goal];
  return check ? check() : '';
}
/**
 * why "Add to your offers" is off while the sheet is open ('' = it may go): what Work it out refused, plus a ladder whose steps
 * are edited INSIDE the sheet (a step that is not more than the one before). One sentence; saveOffer asks it too.

function sheetWhy() {

   * catalogue only as a last resort when a category doesn't have enough else in it.

  var cats = {};

    .filter(function (item) {

                '+"><span class="cell">' +
                '<span class="cp">' +
                M0(nestedR.shown) +
                '</span>' +
                mgnSpan(nestedR.margin, nestedR.status) +
                '</span></td>'
              );
            })
            .join('') +
          (ts.length < 3 ? '<td></td>' : '') +
          '</tr>'
        );
      })
      .join('') +
    '</tbody><tfoot><tr><td colspan="2"><b>All ' +
    list.length +
    '</b></td><td></td>' +
    ts
      .map(function (item) {
        var tt = totals(
          list.map(function (p) {
            return priceRow(p, item.percent / 100);
          })
        );
        return (
          '<td class="slab" data-l="buy ' +
          item.qty +
          '+"><span class="cell">' +
          (tt.n
            ? '<span class="cm ' + (tt.marginAfter < num(S.margin) ? 'under' : '') + '" style="font-size:15px">' + tt.marginAfter + '%</span>'
            : '<span class="sub">not known</span>') +
          '</span></td>'
        );
      })
      .join('') +
    (ts.length < 3 ? '<td></td>' : '') +
    '</tr></tfoot></table></div>';

  if (loyMode() === 'top' && S.loyOn) {
    var top = ts[ts.length - 1],
      one = list[0];
    var r = one ? priceRow(one, top.percent / 100) : null;
    h +=
      '<div class="note n-ok"><span class="ic">●</span><div>Loyalty: ' +
      top.percent +
      '% from the first one' +
      (r ? ' · ' + esc(one.name) + ' ' + M0(r.shown) + ' · ' + mgnText(r.margin, r.status) : '') +
      '</div></div>';
  }
  return h;
}

/* ── buy anything, one named thing free ────────────────────────────── */
/**
 * ⭐⭐⭐ [found live, 2026-09-27] "i don't really understand this table, goods, gift, etc... what are we
 * trying to say here?" then, plainer still: "share goods gift, nothing makes sense." Real gap, not a
 * misreading — three single-word row labels ("Share", "Goods", "Gift") named the ENGINE'S OWN VARIABLES
 * (share of the bill, cost of goods sold, cost of the gift) rather than saying what each row means to a
 * shopkeeper deciding whether to run this offer. Then: "say price of onion rava dosa, cost of onion rava
 * dosa, so it makes sense" — generic "the gift" still made a reader do the work of remembering what "the
 * gift" was; the actual item's own name now sits in the row label. The table reads as one sentence top to
 * bottom: this is what the gift is worth, this is what everything ELSE cost you, this is what the gift
 * itself cost you on top, this is what's left, this is the margin that leaves you with.
 */
function outGift() {
  var node = byId(S.giftId);
  if (!node) return '';
  var am = avgM(),
    bills = (S.bills || []).map(num);
  var heads = bills.map(function (item, index) {
    return [
      '<span class="inp" style="width:104px;height:31px"><span>' +
        moneySymbol() +
        '</span>' +
        '<input type="number" min="1" value="' +
        item +
        '" onchange="setBill(' +
        index +
        ',this.value)"></span>',
      '',
      false
    ];
  });
  var rows = [
    [
      'Price of ' + esc(node.name),
      bills.map(function () {
        return M0(node.price);
      })
    ],
    [
      'Everything else costs you',
      bills.map(function (item) {
        return M0(item * (1 - am));
      })
    ],
    [
      'Cost of ' + esc(node.name),
      bills.map(function () {
        return node.cost == null ? 'N/A' : M0(node.cost);
      })
    ],
    [
      'You keep',
      bills.map(function (item) {
        return node.cost == null ? 'N/A' : M0(item * am - node.cost);
      }),
      true
    ],
    [
      'Margin on this bill',
      bills.map(function (item) {
        if (node.cost == null) return 'N/A';
        var m = Math.round((am - node.cost / item) * 100);
        return (
          '<span class="' +
          (m < num(S.margin) ? '' : '') +
          '" style="color:' +
          (m < 0 ? 'var(--red-i)' : m < num(S.margin) ? 'var(--amber-i)' : 'var(--green-d)') +
          '">' +
          m +
          '%</span>' +
          '<span class="sub">' +
          Math.round(am * 100) +
          '% normally</span>'
        );
      }),
      true
    ]
  ];
  var h = headline([
    [M0(node.price), 'worth to them'],
    [node.cost == null ? 'N/A' : M0(node.cost), 'costs you', 'bad'],
    [Math.round(am * 100) + '%', 'your average margin']
  ]);
  h +=
    '<p class="hs" style="margin:14px 0 -2px">Three sample bills — the smaller the bill, the more the ' +
    'free gift eats into what you’d normally keep from it.</p>';
  h += '<div class="card pad">' + g3(heads, rows) + '</div>';
  if (node.cost != null) {
    var be = node.cost / (am - num(S.margin) / 100);
    h +=
      '<div class="note ' +
      (be > 0 ? 'n-warn' : 'n-ok') +
      '"><span class="ic">●</span><div>' +
      M0(node.cost) +
      ' every time · ' +
      (be > 0 ? 'under your ' + num(S.margin) + '% below a ' + M0(be) + ' bill' : 'always clears your ' + num(S.margin) + '%') +
      '</div></div>';
  }
  h += eitherNote(node.price);
  h +=
    '<div class="hint">"Everything else costs you" is an estimate, from your average margin — what they actually buy alongside ' +
    esc(node.name) +
    ' is not knowable here.</div>';
  return h;
}

/* ── buy N of one thing, one more free ─────────────────────────────── */
/**
 * ⭐⭐⭐ [found live, 2026-09-27] "which offer is to be choosen, how to select the x?... need to have a radio
 * button to select the choice so that count is attached to the item" — the three "buy N" columns stay
 * independently editable (genuinely different economics worth comparing side by side), but a radio per
 * column now says which ONE is actually the offer — chosenCount()/chooseCount() — instead of ruleParamsOf()
 * silently always saving whatever sat in column 1.
 */
function outSame() {
  var node = byId(S.itemId);
  if (!node) return '';
  var list = counts(),
    chosen = chosenCount();
  var heads = list.map(function (item, index) {
    return [
      '<span class="inp" style="width:104px;height:31px">' +
        '<input type="number" min="1" value="' +
        item +
        '" onchange="setCount(' +
        index +
        ',this.value)"><span>buy</span></span>' +
        '<label style="display:flex;align-items:center;justify-content:center;gap:5px;margin-top:5px;' +
        'font-size:11.5px;font-weight:700;cursor:pointer;color:' +
        (index === chosen ? 'var(--green-d)' : 'var(--muted)') +
        '">' +
        '<input type="radio" name="sameChosen" style="margin:0" ' +
        (index === chosen ? 'checked' : '') +
        ' onchange="chooseCount(' +
        index +
        ')">' +
        (index === chosen ? 'Your offer' : 'Use this') +
        '</label>',
      '<span style="font-family:\'IBM Plex Mono\',monospace">+1 · ' + PC(100 / (item + 1)) + '</span>',
      index === chosen
    ];
  });
  /* ⭐ buy_x_get_y, live — the same kind and the same call the till fires when a real N+1 round is rung */
  var mk = function (n) {
    var pay = engineBuyGetPay(node.price, n, 1),
      cost = node.cost == null ? null : (n + 1) * node.cost;
    return { pay: pay, cost: cost, make: cost == null ? null : pay - cost, m: cost == null ? null : marginPct(pay, cost) };
  };
  var rows = [
    [
      'They take',
      list.map(function (item) {
        return item + 1;
      })
    ],
    [
      'They pay',
      list.map(function (item) {
        return M0(mk(item).pay);
      })
    ],
    [
      'Costs you',
      list.map(function (item) {
        return mk(item).cost == null ? 'N/A' : M0(mk(item).cost);
      })
    ],
    [
      'You make',
      list.map(function (item) {
        var x = mk(item);
        return x.make == null ? 'N/A' : M0(x.make);
      }),
      true
    ],
    [
      'Margin',
      list.map(function (item) {
        var x = mk(item);
        if (x.m == null) return 'N/A';
        return (
          '<span style="color:' +
          (x.m < 0 ? 'var(--red-i)' : x.m < num(S.margin) ? 'var(--amber-i)' : 'var(--green-d)') +
          '">' +
          x.m +
          '%</span><span class="sub">' +
          marginPct(node.price, node.cost) +
          '%</span>'
        );
      }),
      true
    ]
  ];
  var h = headline([
    [M0(node.price), esc(node.name)],
    [node.cost == null ? 'N/A' : M0(node.cost), 'costs you'],
    [marginPct(node.price, node.cost) + '%', 'margin now']
  ]);
  h += '<div class="card pad">' + g3(heads, rows) + '</div>';
  var chosenN = list[chosen],
    cx = mk(chosenN),
    clears = cx.m != null && cx.m >= num(S.margin);
  h +=
    '<div class="note ' +
    (clears ? 'n-ok' : 'n-bad') +
    '"><span class="ic">' +
    (clears ? '✓' : '!') +
    '</span><div>Your offer — buy ' +
    chosenN +
    ' +1 — ' +
    (clears ? 'clears your ' + num(S.margin) + '%' : 'does not clear your ' + num(S.margin) + '%') +
    '</div></div>';
  if (loyMode() === 'top' && S.loyOn) {
    h +=
      '<div class="note ' +
      (cx.m != null && cx.m < num(S.margin) ? 'n-warn' : 'n-ok') +
      '"><span class="ic">●</span>' +
      '<div>Loyalty: buy ' +
      chosenN +
      ' +1 from the first visit · ' +
      (cx.m == null ? 'N/A' : M0(cx.make) + ' · ' + cx.m + '%') +
      '</div></div>';
  }
  return h;
}

/* ── buy A, get B free ─────────────────────────────────────────────── */
function outPair() {
  var node = byId(S.pairA),
    b = byId(S.pairB);
  if (!node || !b) return '';
  var was = node.price + b.price,
    cost = node.cost == null || b.cost == null ? null : node.cost + b.cost;
  /* ⭐ buy_x_get_y, cross-item, live — the same call the till fires when B's line reads "free — buy A get B" */
  var pay = engineBuyGetPayCross(node.id, node.price, b.id, 1);
  var make = cost == null ? null : pay - cost,
    m = cost == null ? null : marginPct(pay, cost);
  var h = headline([
    [M0(pay), 'they pay', '', M0(was)],
    [make == null ? 'N/A' : M0(make), 'you make', make != null && make < 0 ? 'bad' : ''],
    [m == null ? 'N/A' : m + '%', 'margin', m != null && m < num(S.margin) ? 'dn' : 'up']
  ]);
  h +=
    '<div class="card pad">' +
    g3(
      [[esc(node.name) + ' + ' + esc(b.name), '', true]],
      [
        ['Apart', [M0(was)]],
        ['They pay', [M0(node.price)]],
        ['Costs you', [cost == null ? 'N/A' : M0(cost)]],
        ['You make', [make == null ? 'N/A' : M0(make)], true],
        ['Margin', [m == null ? 'N/A' : m + '%'], true]
      ]
    ) +
    '</div>';
  h += '<div class="note n-say"><span class="ic">●</span><div>The free one is <b>' + PC((b.price / was) * 100) + '</b> of the pair</div></div>';
  h += eitherNote(b.price, was);
  return h;
}

/* ── buy N, cheapest free ──────────────────────────────────────────── */
function outCheap() {
  var n = Math.max(2, num(S.cheapN)),
    three = threeOf(catItems(S.catId));
  if (!three.length) return '<div class="note n-warn"><span class="ic">!</span><div>No costs on this shelf.</div></div>';
  var labels = ['Your cheapest', 'A middle one', 'Your dearest'].slice(0, three.length);
  var heads = three.map(function (item, index) {
    return [
      esc(item.name),
      '<span style="font-family:\'IBM Plex Mono\',monospace">' + M0(item.price) + ' · ' + labels[index] + '</span>',
      index === three.length - 1
    ];
  });
  /**
   * ⭐ mix_and_match, live — each of the three columns asks "if every one of the N were THIS item, what is the
   * cheapest-of-N worth". A single item bought N times has only one price to be cheapest among, so this reads
   * the same number buy_x_get_y would (verified when that kind was first wired) — the point of asking the real
   * engine is provenance, not a different answer: a future change to how it rounds or stacks reaches this
   * screen too, automatically, rather than a parallel formula quietly falling out of step.
   */
  var mk = function (p) {
    var pay = engineMixMatchPay(p.price, n),
      cost = n * p.cost;
    return { pay: pay, cost: cost, make: pay - cost, m: marginPct(pay, cost) };
  };
  var rows = [
    [
      'They take',
      three.map(function () {
        return n;
      })
    ],
    [
      'They pay',
      three.map(function (item) {
        return M0(mk(item).pay);
      })
    ],
    [
      'Costs you',
      three.map(function (item) {
        return M0(mk(item).cost);
      })
    ],
    [
      'You make',
      three.map(function (item) {
        return M0(mk(item).make);
      }),
      true
    ],
    [
      'Margin',
      three.map(function (item) {
        var x = mk(item);
        return (
          '<span style="color:' +
          (x.m < 0 ? 'var(--red-i)' : x.m < num(S.margin) ? 'var(--amber-i)' : 'var(--green-d)') +
          '">' +
          x.m +
          '%</span><span class="sub">' +
          marginPct(item.price, item.cost) +
          '%</span>'
        );
      }),
      true
    ]
  ];
  var worst = three[three.length - 1],
    wx = mk(worst);
  var h = headline([
    ['buy ' + n, 'cheapest free'],
    [PC(100 / n), 'off, at most'],
    [wx.m + '%', 'worst case', wx.m < num(S.margin) ? 'dn' : 'up']
  ]);
  h += '<div class="card pad">' + g3(heads, rows) + '</div>';
  h +=
    '<div class="note ' +
    (wx.m < num(S.margin) ? 'n-warn' : 'n-ok') +
    '"><span class="ic">●</span><div>' +
    'Worst case is ' +
    n +
    ' × ' +
    esc(worst.name) +
    ' · ' +
    wx.m +
    '%</div></div>';
  return h;
}

/* ── two things, one price ─────────────────────────────────────────── */
function outBundle() {
  var node = byId(S.bunA),
    b = byId(S.bunB);
  if (!node || !b) return '';
  /* ⭐ the engine's bundle_price on the pair — a price not below the two apart gives nothing, and the page says what it charges */
  var was = node.price + b.price,
    pay = previewEval([
      { key: 'a', item_id: node.id, qty: 1, unitPrice: node.price },
      { key: 'b', item_id: b.id, qty: 1, unitPrice: b.price }
    ]).total;
  var cost = node.cost == null || b.cost == null ? null : node.cost + b.cost;
  var make = cost == null ? null : R2(pay - cost),
    m = cost == null ? null : marginPct(pay, cost);
  var h = headline([
    [M0(pay), 'they pay', '', M0(was)],
    [make == null ? 'N/A' : M0(make), 'you make', make != null && make < 0 ? 'bad' : ''],
    [m == null ? 'N/A' : m + '%', 'margin', m != null && m < num(S.margin) ? 'dn' : 'up']
  ]);
  h +=
    '<div class="card pad">' +
    g3(
      [[esc(node.name) + ' + ' + esc(b.name), '', true]],
      [
        ['Apart', [M0(was)]],
        ['Together', [M0(pay)]],
        ['That is', [PC(((was - pay) / was) * 100) + ' off']],
        ['Break-even', [cost == null ? 'N/A' : M0(cost)]],
        ['You make', [make == null ? 'N/A' : M0(make)], true],
        ['Margin', [m == null ? 'N/A' : m + '%'], true]
      ]
    ) +
    '</div>';
  if (cost != null && pay < cost) h += '<div class="note n-bad"><span class="ic">!</span><div>Below ' + M0(cost) + ' you lose money</div></div>';
  h += eitherNote(was - pay, was);
  return h;
}

/* ── a big bill gets something back ────────────────────────────────── */
function outSpend() {
  /* ⭐ what a bill of b gets back is the engine's threshold on a bill of b (capped at the bill), never the typed figure */
  var giveAt = function (b) {
    return -previewEval([{ key: 'x', qty: 1, unitPrice: b }]).goods_adjustment;
  };
  var at = Math.max(1, num(S.spendAt)),
    give = giveAt(at),
    known = costKnown(),
    am = avgM();
  var bills = [at, at * 2, at * 4];
  var heads = bills.map(function (item, index) {
    return [M0(item), '', index === 0];
  });
  var rows = [['Share', bills.map(function (item) { return PC((giveAt(item) / item) * 100); })]];
  if (known) {
    rows.push(['Goods', bills.map(function (item) { return M0(item * (1 - am)); })]);
    rows.push(['You make', bills.map(function (item) { return M0(item * am - giveAt(item)); }), true]);
    rows.push(['Margin', bills.map(function (item) { return marginCell(marginOnBill(item * am - giveAt(item), item - giveAt(item)), am); }), true]);
  }
  var m0 = known ? marginOnBill(at * am - give, at - give) : null;
  var h = headline([
    [PC((give / at) * 100), 'at the threshold'],
    [M0(give), 'given back'],
    [m0 == null ? 'not known' : m0 + '%', 'worst case', m0 != null && m0 < num(S.margin) ? 'dn' : 'up']
  ]);
  h += '<div class="card pad">' + g3(heads, rows) + '</div>';
  h += known
    ? '<div class="note ' + (m0 != null && m0 < num(S.margin) ? 'n-warn' : 'n-ok') + '"><span class="ic">●</span><div>Worst at exactly ' + M0(at) + '. Above that it only improves.</div></div>' +
      '<div class="hint">Goods cost uses your catalogue average.</div>'
    : '<div class="note n-say"><span class="ic">●</span><div>Margin not known — no item has a cost yet. It gives back ' + M0(give) + ' on a ' + M0(at) + ' bill.</div></div>';
  return h;
}

/* ── free delivery ─────────────────────────────────────────────────── */
function outShip() {
  var at = Math.max(1, num(S.shipAt)),
    c = num(S.shipCost),
    pay = num(S.shipCharge),
    known = costKnown(),
    am = avgM();
  var absorb = Math.max(0, c - pay),
    bills = [at, at * 2, at * 3];
  var heads = bills.map(function (item, index) {
    return [M0(item), '', index === 0];
  });
  var rows = [['Share', bills.map(function (item) { return PC((absorb / item) * 100); })]];
  rows.push(['Delivery', bills.map(function () { return M0(absorb); })]);
  if (known) {
    rows.push(['Goods', bills.map(function (item) { return M0(item * (1 - am)); })]);
    rows.push(['You make', bills.map(function (item) { return M0(item * am - absorb); }), true]);
    rows.push(['Margin', bills.map(function (item) { return marginCell(Math.round((am - absorb / item) * 100), am); }), true]);
  }
  var m0 = Math.round((am - absorb / at) * 100),
    be = absorb / (am - num(S.margin) / 100);
  var h = headline([
    [M0(absorb), 'you absorb, a drop'],
    [PC((absorb / at) * 100), 'at the threshold'],
    known ? [m0 + '%', 'worst case', m0 < num(S.margin) ? 'dn' : 'up'] : ['not known', 'margin']
  ]);
  h += '<div class="card pad">' + g3(heads, rows) + '</div>';
  h += known
    ? '<div class="note ' + (be > at ? 'n-warn' : 'n-ok') + '"><span class="ic">●</span><div>' + M0(absorb) + ' whatever they order' +
      (be > 0 && isFinite(be) ? ' · under your ' + num(S.margin) + '% below ' + M0(be) : '') + '</div></div>'
    : '<div class="note n-say"><span class="ic">●</span><div>' + M0(absorb) + ' whatever they order. Margin not known — no item has a cost yet.</div></div>';
  return h;
}

function outBand() {
  return (
    '<div class="card pad">' +
    g3(
      [['Allowed', '', true]],
      [
        ['Smallest', [M0(num(S.bandLo))]],
        ['Largest', [M0(num(S.bandHi))]]
      ]
    ) +
    '</div>' +
    '<div class="note n-say"><span class="ic">●</span><div>No money changes hands.</div></div>'
  );
}

/* a free thing and a bonus never stack — say which wins, in one line */
function eitherNote(giftValue, base) {
  if (loyMode() !== 'either' || !S.loyOn) return '';
  var l = num(S.loyPct) / 100;
  if (l <= 0) return '';
  if (base) {
    var need = (giftValue / base) * 100;
    return (
      '<div class="note n-say"><span class="ic">●</span><div>Bonus wins only above <b>' + PC(need) + '</b> · yours is ' + PC(num(S.loyPct)) + '</div></div>'
    );
  }
  return '<div class="note n-say"><span class="ic">●</span><div>Bonus wins only above a <b>' + M0(giftValue / l) + '</b> bill</div></div>';
}

/* ═══ SCREEN 3 · SAVED OFFERS ═════════════════════════════════════════ */
/* ⚠️⚠️ itemIds ADDED — the multi-item "Apply it to" picker's own field, alongside itemId (still needed for
   the free/same-shape picker, an unrelated setting). Without this, a saved offer's specific-items scope was
   silently dropped on save — snapshot() only ever copies what KEEP names. */
/**
 * ⚠️ [found live, 2026-09-27] `freeChosen` ADDED alongside `freeCounts` — the radio pick (chooseCount()) that
 * says WHICH of the three "buy N" columns is the real offer has to travel with the snapshot the same way
 * `freeCounts` (the three numbers themselves) already does, or reopening a saved offer to edit it would
 * silently reset the choice to column 1 — possibly a DIFFERENT number than what was actually saved.
 */
var KEEP = [
  'goal',
  'scope',
  'catId',
  'itemId',
  'itemIds',
  'pctOff',
  'rsOff',
  'tiers',
  'freeShape',
  'giftId',
  'freeCounts',
  'freeChosen',
  'bills',
  'cheapN',
  'pairA',
  'pairB',
  'bunA',
  'bunB',
  'bunPrice',
  'spendAt',
  'spendVal',
  'shipAt',
  'shipCharge',
  'shipCost',
  'bandLo',
  'bandHi',
  'margin',
  'cap',
  'belowAct',
  'round',
  'loyOn',
  'loyPct'
];
function snapshot() {
  var o = {};
  KEEP.forEach(function (item) {
    o[item] = JSON.parse(JSON.stringify(S[item] == null ? null : S[item]));
  });
  return o;
}
function costPrint() {
  var o = {};
  P.forEach(function (item) {
    o[item.id] = item.cost;
  });
  return o;
}
function costMoved(sv) {
  var now = costPrint(),
    index = 0;
  for (var k in sv.costs) if (sv.costs[k] !== now[k]) index++;

     one thing the page boots with before a sign-in or an import replaces it; PHARMA (var PHARMA above) and
     setBiz() are untouched below for a future public/marketing release that genuinely wants more than one
     example, but nothing in this build reaches them.
     ⚠️⚠️⚠️ [OFFR-01] THAT WAS NOT THE WHOLE FIX. HOTEL's own sample was ALSO named "Mayur Bhavan" — Athi's
     real shop's name, by coincidence — so a session that opened before sign-in (or where sign-in silently
     failed) still read "Mayur Bhavan" at the top, identical to the real thing, with no switcher left to
     reveal a second name to compare it against. Athi typed real cost prices into it believing it was his
     shop's own catalogue; none of them reached it, because S.biz was still 'hotel', not 'mine'. Renamed
     the sample (see HOTEL above) AND added a banner that says so on every visit, not only inside one
     overlay's footer — a fact this important cannot depend on which screen happens to be open. */
  /* ⭐ [per Athi's design doc] "Sample data — nothing here reaches your shop." — shorter, matches the
     12-word explanation budget; the sample business's own name (e.g. "Sample Tiffin Corner") already sits
     right beside it as the #bizName chip, so repeating it here was rule 3's duplicate string, not new info. */
  var sampleNote = document.getElementById('labSampleNote');
  if (S.biz !== 'mine') {
    sampleNote.hidden = false;
    sampleNote.innerHTML = 'Sample data — nothing here reaches your shop.' + ' <button class="chip" onclick="labUseMine()">Use my catalogue</button>';
  } else sampleNote.hidden = true;

  document.getElementById('strip').innerHTML =
    S.step === 0
      ? ''
      : '<div class="strip">Margin <b>' +
        num(S.margin) +
        '%</b><span>·</span>' +
        (S.round === '0' ? 'exact' : S.round === '1' ? inShopMoney('whole ₹') : 'ends ' + (S.round === '5' ? '0 or 5' : '0')) +
        '<span>·</span>loyalty ' +
        (S.custOn ? 'up to <b>' + num(S.cap) + '%</b>' : 'off') +
        '<button onclick="labStep(0)">Change</button></div>';

  if (S.step === 3 && !cartItem(OPEN_ID)) {
    OPEN_ID = null; /* retired or deleted: the landing */
    S.step = 0;
  }
  parkPromise();
  var screens = { 0: renderS0, 2: renderWorkOrTypes, 3: renderOpenOffer };
  [0, 2, 3].forEach(function (item) {
    var el = document.getElementById('s' + item);
    el.className = 'screen' + (S.step === item ? ' on' : '');
    if (S.step === item) el.innerHTML = screens[item]();
  });
  syncTypeMenu();
  renderPinned();
  renderPromisePane();
  syncPhone();
  /* ⭐ if the "Work it out" modal is open, keep it in sync — e.g. editing a qty tier's own inline inputs while
   * the result is on screen calls render() the same way every other edit does, and the modal is not one of
   * the four .screen divs render() already repaints above. */
  var node = document.getElementById('workScrim');
  if (node && node.classList.contains('on')) paintWork();
}
applyBiz('hotel');
render();
/* ⭐ T2-LABS: ?mode=combo IS the Combo Lab — the builder opens as the page, under its own name */
var LAB_MODE = new URLSearchParams(location.search).get('mode') === 'combo' ? 'combo' : 'offer';
if (LAB_MODE === 'combo') {
  document.title = 'Combo Lab · ChitBridge';
  openModLab();
} /* the bar's title said Combo Lab at mount (SHELL-ONE) */
/* ⭐ signed in → try your own catalogue quietly; queued writes from a previous offline session try to send
 * now too. Neither blocks the first paint — the samples are already on screen the instant this loads. */
labPaintQueue();
labDrainOutbox();
if (savedLive()) {
  loadShopMoney();
  labUseMine(true);
}
/**
 * ⚠️ [found live, 2026-09-26] "it says saved offers 0, but there are quite a number of saved offers" —
 * loadSaved() was only ever called AFTER landing on step 3 (labStep(3)'s own trigger) or after a save/status
 * change. The Settings screen's own "Saved offers <n>" badge reads SAVED.length directly, so on a fresh
 * signed-in load — before step 3 has ever been visited THIS session — it always showed 0, whatever the shelf
 * actually held. Loaded here too, at boot, alongside the catalogue.
 */
if (savedLive()) loadSaved();
</script>
<!-- ONE BROWSER, ONE SHOP (2026-10-01): this page answers the roll, sends what its outbox holds, and leaves when
     its shop is signed out or the browser is cleaned — to the home page, which reads nothing while that runs -->
<script src="app/one-person.js"></script>
<script>
CBOnePerson.attach({
  quiet: true,
  who: (function () {
    var w = CBOnePerson.stored();
    return function () {
      return w;
    };
  })(),
  label: function () {
    return LAB_MODE === 'combo' ? 'The Combo Lab' : 'The Offer Lab';
  },
  onLeave: function (by) {
    return Promise.resolve(labDrainOutbox())
      .catch(function () {})
      .then(function () {
        location.replace('/?left=' + encodeURIComponent(by || ''));
      });
  },
  onWipe: function () {
    return Promise.resolve(labDrainOutbox())
      .catch(function () {})
      .then(function () {
        location.replace('/?cleaned=1');
      });
  }
});
</script>
