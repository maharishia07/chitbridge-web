<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test lab · Chit &amp; Bridge</title>
<!--
  THE TEST BOARD — the test cases as a thing you can tap, not a PDF you cannot write on.

  Athi, 2026-09-11: "in the PDF we cannot update pass or fail. Can we have a simple application from our framework itself to create the
  test cases and update the status and the result, so we know that each of the test cases passed and who has tested? And we can always
  append the use case. Also we can qualify with engine, transport, web, capability etc." Then: "pass/fail status for each run — unit test /
  T1 / T2 / regression and so on, manual and so on."

  ⭐⭐ NOTHING NEW WAS INVENTED UNDERNEATH IT. A test CASE is a `definition` of kind 'testcase' — authored, named, versioned, entity-isolated
  by the same RLS as everything else — because it is the same kind of thing as a tax slab: a rule somebody declared that has to be quotable
  months later against a result it produced. Only the RESULT ledger is new (b219), for the same reason the points ledger was: results
  accumulate and a definition does not.

  ⭐ AND THE RESULTS SPEAK A STANDARD. POST /api/testing/results/junit takes JUnit XML verbatim, which Playwright emits with one config line
  and which Kiwi TCMS, TestRail and Allure all import. The automated suite and a person writing on a phone land on the same board, and
  nothing here is a format anyone else would have to re-implement.

  ⚠️ APPEND-ONLY. Tapping Pass twice writes two rows; the latest wins and the earlier one stays readable. That is deliberate: "failed on
  Thursday, passed on Friday" is the useful sentence, and a flaky case shows as pass/fail/pass instead of collapsing into whatever was
  tapped last.
-->
<style>
  :root{
    --font-ui:Inter,system-ui,-apple-system,sans-serif;
    --ink:#20303b; --ink-2:#3a4048; --grey:#8a949c; --grey-2:#545A61;
    --line:#e7e3d8; --line-2:#efece4; --paper:#faf8f3; --card:#fff;
    --blue:#3F66A6; --blue-tint:#E9F0FA;
    --ok:#2c7a43; --ok-tint:#e6f4ea;
    --bad:#b4453f; --bad-tint:#fbeceb;
    --warn:#8a5a1e; --warn-tint:#fbf3e3;
    --neutral-tint:#EEF1F5;
    --fs-1:11px; --fs-2:12.5px; --fs-3:14px; --fs-4:16px; --fs-5:20px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font-ui); color:var(--ink); background:var(--paper);
        font-size:var(--fs-3); font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }

  header{ position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); padding:9px 14px; }
  .htop{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  h1{ font-size:var(--fs-4); margin:0; }
  .sub{ color:var(--grey-2); font-size:var(--fs-2); }
  .tally{ display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
  .t{ font-size:var(--fs-1); padding:2px 8px; border-radius:99px; border:1px solid var(--line); background:var(--paper); white-space:nowrap; }
  .t b{ font-size:var(--fs-2); }
  .t.pass{ background:var(--ok-tint); border-color:#bfe0c9; color:var(--ok); }
  .t.fail{ background:var(--bad-tint); border-color:#eccbc9; color:var(--bad); }
  .t.blocked{ background:var(--warn-tint); border-color:#e8d7ae; color:var(--warn); }
  .t.todo{ background:var(--neutral-tint); color:var(--grey-2); }

  .bar{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 14px;
        border-bottom:1px solid var(--line); background:var(--card); }
  .bar label{ font-size:var(--fs-1); color:var(--grey-2); text-transform:uppercase; letter-spacing:.06em; }
  select, input[type=text]{ font:inherit; font-size:var(--fs-2); padding:5px 7px; border:1px solid var(--line);
        border-radius:7px; background:#fff; color:var(--ink); min-height:32px; }
  input[type=text]{ min-width:120px; flex:1 1 140px; }
  .btn{ font:inherit; font-size:var(--fs-2); padding:6px 11px; border:1px solid var(--line); border-radius:8px;
        background:var(--card); color:var(--ink); cursor:pointer; white-space:nowrap; min-height:32px; }
  .btn.pri{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .btn:focus-visible, select:focus-visible, input:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }

  main{ padding:12px 14px 80px; max-width:980px; margin:0 auto; }
  .mod{ margin:0 0 18px; }
  .modhead{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 7px; }
  .modhead h2{ font-size:var(--fs-3); margin:0; letter-spacing:.02em; }
  .modhead .k{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-1); color:#fff; background:var(--grey-2);
        border-radius:5px; padding:1px 6px; }
  .modhead .intro{ flex:1 1 100%; color:var(--grey-2); font-size:var(--fs-1); line-height:1.5; }

  .case{ background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; }
  .case.pass{ border-left:4px solid var(--ok); }
  .case.fail{ border-left:4px solid var(--bad); }
  .case.blocked{ border-left:4px solid var(--warn); }
  .case.skipped{ border-left:4px solid var(--grey); }
  .chead{ display:flex; gap:9px; align-items:flex-start; padding:9px 11px; cursor:pointer; }
  .chead .key{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-1); font-weight:700; color:var(--grey-2);
        background:var(--neutral-tint); border-radius:5px; padding:2px 6px; white-space:nowrap; }
  .chead .ttl{ flex:1; min-width:0; font-weight:600; line-height:1.35; font-size:var(--fs-2); }
  .chead .ttl .last{ display:block; font-weight:400; color:var(--grey-2); font-size:var(--fs-1); margin-top:3px; }
  .chead .ttl .last.fail{ color:var(--bad); }
  .pri{ font-size:var(--fs-1); color:var(--grey-2); white-space:nowrap; }
  .lay{ font-size:var(--fs-1); border:1px solid var(--line); border-radius:99px; padding:1px 7px; color:var(--grey-2);
        background:var(--paper); white-space:nowrap; }

  .body{ padding:0 11px 11px; border-top:1px solid var(--line-2); }
  .meta{ font-size:var(--fs-1); color:var(--grey-2); margin:8px 0; line-height:1.6; }
  .meta b{ color:var(--ink-2); }
  table.steps{ width:100%; border-collapse:collapse; font-size:var(--fs-2); margin:6px 0 2px; }
  table.steps th{ text-align:left; font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.06em;
        color:var(--grey-2); border-bottom:1px solid var(--line); padding:4px 6px; font-weight:700; }
  table.steps td{ border-bottom:1px solid var(--line-2); padding:6px; vertical-align:top; line-height:1.45; }
  table.steps td.n{ width:22px; color:var(--grey); font-size:var(--fs-1); }
  .note{ font-size:var(--fs-1); color:var(--grey-2); line-height:1.55; background:var(--paper);
        border:1px solid var(--line-2); border-radius:8px; padding:7px 9px; margin:8px 0 0; }
  .acts{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .acts .btn.pass{ background:var(--ok-tint); border-color:#bfe0c9; color:var(--ok); font-weight:700; }
  .acts .btn.fail{ background:var(--bad-tint); border-color:#eccbc9; color:var(--bad); font-weight:700; }
  .acts .btn.blocked{ background:var(--warn-tint); border-color:#e8d7ae; color:var(--warn); font-weight:700; }
  .acts input[type=text]{ flex:1 1 100%; }
  .hist{ font-size:var(--fs-1); color:var(--grey-2); margin-top:8px; line-height:1.6; }
  .hist .r{ display:block; }

  .say{ padding:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; line-height:1.6; }
  .say b{ display:block; margin-bottom:5px; }
  /* ── the summary: coverage by area, and the sittings ── */
  .tabs{ display:flex; gap:4px; }
  .tabs button{ font:inherit; font-size:var(--fs-2); padding:6px 13px; border:1px solid var(--line);
        background:var(--card); color:var(--grey-2); border-radius:8px; cursor:pointer; min-height:32px; }
  .tabs button.on{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  table.sum{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line);
        border-radius:11px; overflow:hidden; font-size:var(--fs-2); margin-bottom:22px; }
  table.sum th{ text-align:start; font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.06em;
        color:var(--grey-2); font-weight:700; padding:9px 11px; background:var(--neutral-tint);
        border-bottom:1px solid var(--line); white-space:nowrap; }
  table.sum td{ padding:9px 11px; border-bottom:1px solid var(--line-2); vertical-align:middle; }
  table.sum tr:last-child td{ border-bottom:0; }
  table.sum td.num, table.sum th.num{ text-align:end; width:1%; white-space:nowrap; }
  table.sum .area{ font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:var(--fs-1); }
  table.sum .sub{ display:block; color:var(--grey-2); font-size:var(--fs-1); font-weight:400; }
  table.sum tr.clickable{ cursor:pointer; }
  table.sum tr.clickable:hover td{ background:var(--blue-tint); }
  /* ⭐ ONE BAR, READ AT A GLANCE. A row of numbers is arithmetic; a bar is a state. */
  .bar-cov{ display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--neutral-tint);
        min-width:90px; }
  .bar-cov i{ display:block; height:100%; }
  .big{ color:var(--ok); font-weight:700; } .bad{ color:var(--bad); font-weight:700; }
  .warnn{ color:var(--warn); font-weight:700; } .dim{ color:var(--grey-2); }
  .scroll{ overflow-x:auto; }

  /* ── the completion report ── */
  .rep h2{ font-size:var(--fs-4); margin:26px 0 4px; letter-spacing:-.01em; }
  .rep h2:first-of-type{ margin-top:6px; }
  .rep .num-s{ font-family:ui-monospace,Menlo,monospace; color:var(--grey-2); font-size:var(--fs-2);
        margin-inline-end:7px; }
  .rep .sec{ background:var(--card); border:1px solid var(--line); border-radius:11px;
        padding:14px 17px; margin:0 0 14px; }
  /* ⭐ THE WHOLE POINT OF THE STYLING: a measured section and a judgement section must not look alike. */
  .rep .sec.ask{ background:var(--warn-tint); border-color:#e8d7ae; }
  .rep .tag{ display:inline-block; font-size:var(--fs-1); font-weight:700; letter-spacing:.07em;
        text-transform:uppercase; border-radius:5px; padding:2px 8px; margin-bottom:9px; }
  .rep .tag.m{ background:var(--ok-tint); color:var(--ok); }
  .rep .tag.a{ background:#f3e2bd; color:var(--warn); }
  .rep .kv{ display:grid; grid-template-columns:auto 1fr; gap:5px 16px; font-size:var(--fs-2); }
  .rep .kv dt{ color:var(--grey-2); white-space:nowrap; }
  .rep .kv dd{ margin:0; }
  .rep .big-n{ display:flex; gap:20px; flex-wrap:wrap; margin:4px 0 12px; }
  .rep .big-n div{ min-width:74px; }
  .rep .big-n b{ display:block; font-size:26px; line-height:1.15; letter-spacing:-.02em; }
  .rep .big-n span{ font-size:var(--fs-1); color:var(--grey-2); text-transform:uppercase; letter-spacing:.06em; }
  .rep .inc{ border-top:1px solid var(--line-2); padding:9px 0; font-size:var(--fs-2); }
  .rep .inc:first-of-type{ border-top:0; }
  .rep .inc .k2{ font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:var(--fs-1); }
  .rep .caveat{ margin-top:9px; font-size:var(--fs-2); line-height:1.55; }
  .rep .caveat li{ margin-bottom:4px; }
  .rep .sign{ display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:18px; }
  .rep .sign div{ border-top:1px solid var(--ink); padding-top:5px; font-size:var(--fs-1); color:var(--grey-2); }
  /* ⚠️ a report is printed and filed. Everything that is a CONTROL must not be on the paper. */
  @media print{
    body{ background:#fff; }
    header, .bar, .noprint{ display:none !important; }
    main{ padding:0; max-width:none; }
    .rep .sec{ break-inside:avoid; box-shadow:none; }
    .rep h2{ break-after:avoid; }
  }

  .hide{ display:none !important; }
  @media (max-width:560px){ .chead{ flex-wrap:wrap; } .pri{ order:3; } }
</style>
</head>
<body>

<header>
  <div class="htop">
    <h1>Test lab</h1>
    <span class="sub" id="who">…</span>
    <span class="sub" style="opacity:.75">· cases, results and the completion report — ISO/IEC/IEEE 29119-3</span>
  </div>
  <div class="tally" id="tally"></div>
</header>

<div class="bar">
  <!-- ⭐ Athi, 2026-09-11: "where can we see the summary result?" — the totals endpoint existed and nothing
       rendered it. An endpoint with no screen is a number nobody reads. -->
  <div class="tabs">
    <!-- ⭐ Athi: "we name it as per standard, reference the standard where possible?" — each tab says which
         of 29119-3's document types it corresponds to, so a reader can look ours up in theirs rather than
         learning our words. ⚠️ Only where it genuinely corresponds: the Summary is OURS, because 29119-3's
         Test Status Report is written DURING execution against a plan and we have no plan. -->
    <button id="t_cases" class="on" onclick="setView('cases')"
      title="Test Case Specification (ISO/IEC/IEEE 29119-3)">Cases</button>
    <button id="t_sum" onclick="setView('summary')"
      title="Coverage and the execution log — ours, not a named document of the standard">Summary</button>
    <button id="t_rep" onclick="setView('report')"
      title="Test Completion Report (ISO/IEC/IEEE 29119-3)">Report</button>
  </div>
</div>
<div class="bar">
  <label for="f_mod">Module</label>
  <select id="f_mod" onchange="paint()"><option value="">All</option></select>
  <label for="f_state">Show</label>
  <select id="f_state" onchange="paint()">
    <option value="">Everything</option>
    <option value="todo">Not yet tested</option>
    <option value="fail">Failed or blocked</option>
    <option value="pass">Passed</option>
  </select>
  <input type="text" id="f_q" placeholder="Search a case…" oninput="paint()">
</div>

<div class="bar">
  <label for="f_kind">Recording as</label>
  <select id="f_kind" onchange="saveRun()">
    <option value="manual">Manual</option>
    <option value="t0">T0 · guard</option>
    <option value="t1">T1 · one spec</option>
    <option value="t2">T2 · scoped</option>
    <option value="t3">T3 · full</option>
    <option value="unit">Unit</option>
    <option value="regression">Regression</option>
  </select>
  <input type="text" id="f_run" placeholder="This sitting, e.g. v2.0 before release" oninput="saveRun()">
  <label for="f_who">Tester</label>
  <!-- ⚠️ THE ENTITY NAME IS NOT AN ANSWER TO "who tested this". The server always records the identity off
       the token, which cannot be typed in and is the evidence; this is who was at the keyboard, which only
       matters — and only differs — when one login is shared. Kept on this device. -->
  <input type="text" id="f_who" placeholder="who is at the keyboard" oninput="saveWho()" style="max-width:150px">
  <button class="btn" onclick="newRun()" title="Start a fresh run — the results already recorded stay where they are">New run</button>
  <span style="flex:1"></span>
  <!-- ⭐ Gherkin: the spec clause and its cases as ONE text. The Feature description IS the clause, so a
       file that goes into the repository carries both arms of the V and neither can be edited alone. -->
  <button class="btn" onclick="exportFeature()" title="Download the cases as a .feature file">Export .feature</button>
  <button class="btn" onclick="document.getElementById('f_file').click()" title="Load a .feature file — the Feature description becomes the spec clause">Import .feature</button>
  <input type="file" id="f_file" accept=".feature,.txt" style="display:none" onchange="importFeature(this)">
</div>

<main id="main"><div class="say">Reading the board…</div></main>

<script>
var API = (new URLSearchParams(location.search).get('api')) || 'https://chitbridge-api-production.up.railway.app';

/**
 * ⚠️ THE SESSION COMES OFF DISK, exactly as the offer lab reads it. This page is a tool for somebody already
 * signed in on this browser; asking them to sign in twice would be asking for a second credential to reach data
 * the first one already opens.
 */
function sess(){ try { return JSON.parse(localStorage.getItem('cb_sess') || 'null'); } catch (_) { return null; } }

var CASES = [], LAST = {}, OPEN = {}, RUN = null, STALE = {};

/* ── the run this sitting belongs to ─────────────────────────────────────────────────────────────────────────
 * ⭐ IT SURVIVES A RELOAD. A run is a sitting, and a sitting includes closing the tab to go and look at
 * something. Losing the run id on refresh would scatter one afternoon's testing across nine "runs". */
/** who is at the keyboard — a courtesy beside the identity, not a substitute for it */
function who(){ try { return localStorage.getItem('cb_tester') || ''; } catch (_) { return ''; } }
function saveWho(){
  var v = (document.getElementById('f_who').value || '').trim().slice(0, 60);
  try { if (v) localStorage.setItem('cb_tester', v); else localStorage.removeItem('cb_tester'); } catch (_) {}
}

function loadRun(){
  try { RUN = JSON.parse(localStorage.getItem('cb_testrun') || 'null'); } catch (_) { RUN = null; }
  if (!RUN || !RUN.id) RUN = { id: uuid(), label: '', kind: 'manual' };
  document.getElementById('f_run').value = RUN.label || '';
  document.getElementById('f_kind').value = RUN.kind || 'manual';
  document.getElementById('f_who').value = who();
}
function saveRun(){
  RUN.label = document.getElementById('f_run').value.trim();
  RUN.kind = document.getElementById('f_kind').value;
  try { localStorage.setItem('cb_testrun', JSON.stringify(RUN)); } catch (_) {}
}
function newRun(){
  RUN = { id: uuid(), label: '', kind: document.getElementById('f_kind').value };
  document.getElementById('f_run').value = '';
  saveRun();
  say('Started a new run. Results already recorded are untouched — nothing here is ever overwritten.');
}
function uuid(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]; }); }

/** ⚠️ "3 minutes ago" is what a tester wants; a timestamp is what a log wants. */
function ago(iso){
  if (!iso) return '';
  var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s/60) + ' min ago';
  if (s < 172800) return Math.round(s/3600) + ' h ago';
  return new Date(iso).toLocaleDateString();
}

async function call(path, opts){
  var s = sess();
  if (!s || !s.token) throw new Error('Sign in to the app on this browser first, then reload this page.');
  var o = opts || {};
  var r = await fetch(API + path, {
    method: o.method || 'GET',
    headers: Object.assign({ Authorization: 'Bearer ' + s.token }, o.body ? { 'Content-Type': 'application/json' } : {}),
    body: o.body ? JSON.stringify(o.body) : undefined,
  });
  var j = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(j.message || j.error || (r.status + ''));
  return j;
}

function say(msg, bad){
  var m = document.getElementById('main');
  var el = document.createElement('div');
  el.className = 'say';
  el.style.borderColor = bad ? '#eccbc9' : 'var(--line)';
  el.textContent = msg;
  m.insertBefore(el, m.firstChild);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 6000);
}

/** ⭐ load the documented cases onto this shop's board — an upsert, so pressing it twice is safe */
async function seed(){
  try {
    var r = await call('/api/testing/cases/seed', { method:'POST' });
    say(r.added + ' cases loaded' + (r.updated ? ', ' + r.updated + ' updated' : '')
        + (r.unchanged ? ', ' + r.unchanged + ' already current' : ''));
    await load();
  } catch (e) { say('Could not load them: ' + e.message, true); }
}

/**
 * ⭐⭐ EXPORT — the board as a .feature file.
 *
 * ⚠️ IT GOES THROUGH fetch, NOT A PLAIN LINK, because the endpoint needs the Authorization header. A bare
 * <a href> would arrive unauthenticated and download a 401 as a file called chitbridge.feature, which looks
 * exactly like a successful download until somebody opens it.
 */
async function exportFeature(){
  var s = sess();
  if (!s || !s.token) { say('Sign in first.', true); return; }
  var mod = document.getElementById('f_mod').value;
  try {
    var r = await fetch(API + '/api/testing/cases/gherkin' + (mod ? '?module=' + encodeURIComponent(mod) : ''),
      { headers: { Authorization: 'Bearer ' + s.token } });
    if (!r.ok) throw new Error('the server said ' + r.status);
    var text = await r.text();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = (mod || 'chitbridge') + '.feature';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    say('Downloaded ' + a.download + '. The Feature description is the spec clause — edit it there and import it back.');
  } catch (e) { say('Could not export: ' + e.message, true); }
}

/**
 * ⭐⭐⭐ IMPORT — and this is the loop Athi described.
 *
 * Edit the Feature description (the spec clause) and send the file: the clause gains a VERSION, and every case
 * still citing the old one is marked "spec moved" — by construction, exactly the set that has to be looked at
 * again. Edit a Scenario and the case gains a version. Nothing has to be remembered.
 *
 * ⚠️ WHAT COULD NOT BE READ IS SHOWN, never swallowed. A scenario that was skipped is a test that silently
 * does not exist, and the board would be claiming coverage it does not have.
 */
async function importFeature(input){
  var file = input && input.files && input.files[0];
  input.value = '';
  if (!file) return;
  try {
    var text = await file.text();
    var r = await call('/api/testing/cases/gherkin', { method:'POST', body:{ text: text } });
    var moved = (r.clauses || []).filter(function (c) { return c.changed; });
    say(r.added + ' added, ' + r.updated + ' updated, ' + r.unchanged + ' unchanged'
      + (moved.length ? ' \u00b7 ' + moved.length + ' clause(s) changed, so cases citing the old wording now read "spec moved"' : ''));
    if ((r.problems || []).length) say('Not everything was read: ' + r.problems.join(' \u00b7 '), true);
    await load();
  } catch (e) { say('Could not import: ' + e.message, true); }
}

async function load(){
  var s = sess();
  document.getElementById('who').textContent = s ? ((s.entity || s.name || 'your business') + ' · signed in') : 'not signed in';
  try {
    /* two calls, not one per case — see the round-trip note in routes/testing.js */
    var a = await call('/api/testing/cases');
    var b = await call('/api/testing/results');
    /* ⭐ which cases were written against wording that has since changed. A green case whose clause has
       moved is the most misleading thing a board can show, so it is read every time, not on request. */
    var st = await call('/api/testing/stale');
    STALE = {};
    ((st && st.stale) || []).forEach(function (x) { STALE[x.case_key] = x; });
    CASES = a.cases || [];
    LAST = {};
    (b.results || []).forEach(function(r){
      /* ⭐ ONE HEADLINE PER CASE. A case may hold results at two layers; the board shows the WORST of them,
         because a green unit test beside a red counter is not a green case. */
      var cur = LAST[r.case_key];
      var rank = { fail: 4, blocked: 3, skipped: 2, pass: 1 };
      if (!cur || rank[r.status] > rank[cur.status] ||
          (rank[r.status] === rank[cur.status] && new Date(r.at) > new Date(cur.at))) LAST[r.case_key] = r;
    });
    if (!CASES.length) {
      document.getElementById('main').innerHTML =
        '<div class="say"><b>No test cases on this board yet.</b>'
        + '<button class="btn pri" onclick="seed()" style="margin:6px 0">Load the test cases</button>'
        + '<div style="font-size:var(--fs-1);color:var(--grey-2);margin-top:5px;line-height:1.55">The documented cases '
        + 'for the counter, the bill, the queue, suppliers and the offer lab. Safe to press again later — it reloads '
        + 'the wording and leaves every result exactly where it is.</div></div>';
      return;
    }
    /* ⚠️ the summary is derived from the same two reads — refresh it here or it shows yesterday */
    await loadSummary();
    if (VIEW === 'summary') { paintSummary(); return; }
    fillModules();
    paint();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="say"><b>Could not read the board.</b>' + esc(e.message) + '</div>';
  }
}

function fillModules(){
  var sel = document.getElementById('f_mod'), seen = {};
  CASES.forEach(function(c){ if (!seen[c.module_key]) { seen[c.module_key] = c.module_name || c.module_key;
    var o = document.createElement('option'); o.value = c.module_key;
    o.textContent = c.module_key + ' · ' + (c.module_name || ''); sel.appendChild(o); } });
}

function shown(){
  var mod = document.getElementById('f_mod').value;
  var st = document.getElementById('f_state').value;
  var q = document.getElementById('f_q').value.trim().toLowerCase();
  return CASES.filter(function(c){
    if (mod && c.module_key !== mod) return false;
    var last = LAST[c.case_key];
    if (st === 'todo' && last) return false;
    if (st === 'pass' && (!last || last.status !== 'pass')) return false;
    if (st === 'fail' && (!last || (last.status !== 'fail' && last.status !== 'blocked'))) return false;
    if (q && (c.case_key + ' ' + (c.title || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function tally(){
  var n = { pass:0, fail:0, blocked:0, skipped:0, todo:0 };
  CASES.forEach(function(c){ var l = LAST[c.case_key]; if (!l) n.todo++; else n[l.status]++; });
  var h = '';
  if (n.pass)    h += '<span class="t pass"><b>' + n.pass + '</b> passed</span>';
  if (n.fail)    h += '<span class="t fail"><b>' + n.fail + '</b> failed</span>';
  if (n.blocked) h += '<span class="t blocked"><b>' + n.blocked + '</b> blocked</span>';
  if (n.skipped) h += '<span class="t"><b>' + n.skipped + '</b> skipped</span>';
  if (n.todo)    h += '<span class="t todo"><b>' + n.todo + '</b> not yet tested</span>';
  var staleN = CASES.filter(function (c) { return STALE[c.case_key]; }).length;
  if (staleN) h += '<span class="t blocked"><b>' + staleN + '</b> spec moved</span>';
  h += '<span class="t">' + CASES.length + ' cases</span>';
  document.getElementById('tally').innerHTML = h;
}

var VIEW = 'cases', COVER = [], RUNS = [];

/**
 * ⭐⭐ THE SUMMARY. Two questions, and they are not the same one:
 *
 *   COVERAGE — has this area been tested at all? A property of the BOARD, and the one that decides what to
 *              do next. It is what somebody asking "are we ready" actually wants.
 *   SITTINGS — what happened in one run. A property of an EVENT, and the one you read after an automated
 *              suite has just finished, or when you want to know what somebody covered on Tuesday.
 *
 * ⚠️ Showing only the second is the common mistake: a wall of green runs says nothing about the module
 * nobody has opened.
 */
function setView(v){
  VIEW = v;
  document.getElementById('t_cases').className = (v === 'cases') ? 'on' : '';
  document.getElementById('t_sum').className = (v === 'summary') ? 'on' : '';
  /* the case filters mean nothing on either of the other two views */
  /* the case filters mean nothing on the summary — hide them rather than leave them inert */
  var bars = document.querySelectorAll('.bar');
  for (var i = 1; i < bars.length; i++) bars[i].className = (v === 'cases') ? 'bar' : 'bar hide';
  document.getElementById('t_rep').className = (v === 'report') ? 'on' : '';
  if (v === 'summary') paintSummary();
  else if (v === 'report') paintReport();
  else paint();
}

async function loadSummary(){
  try {
    var a = await call('/api/testing/coverage');
    var b = await call('/api/testing/runs');
    COVER = (a && a.areas) || [];
    RUNS = (b && b.runs) || [];
  } catch (e) { say('Could not read the summary: ' + e.message, true); }
}

function pct(a, b){ return b ? Math.round((a / b) * 100) : 0; }

/**
 * ⭐⭐⭐ THE TEST COMPLETION REPORT, on ISO/IEC/IEEE 29119-3's own template.
 *
 * Athi: *"is there any report available… standard report template?"* — 29119-3 is the current one, and it
 * superseded IEEE 829, which is the name most people still reach for and which was withdrawn in 2013.
 *
 * ⚠️⚠️ HALF OF A COMPLETION REPORT IS JUDGEMENT. Whether the exit criteria were met, what risk is left, who
 * accepts it — no database holds any of that. A generator that fills those headings with plausible prose
 * produces a document that LOOKS signed off and is not, and a report is read by people who were not in the
 * room and cannot tell invented text from evidence.
 *
 * ⭐ So the measured sections and the judgement sections are rendered DIFFERENTLY on purpose, and the ones
 * that need a person carry the question rather than an answer.
 */
async function paintReport(){
  document.getElementById('main').innerHTML = '<div class="say">Building the report…</div>';
  var r;
  try { r = await call('/api/testing/report'); }
  catch (e) { say('Could not build the report: ' + e.message, true); return; }

  var sec = function (s, inner) {
    var ask = s.source !== 'measured';
    return '<h2><span class="num-s">' + esc(s.id) + '</span>' + esc(s.title) + '</h2>'
      + '<div class="sec' + (ask ? ' ask' : '') + '">'
      + '<span class="tag ' + (ask ? 'a' : 'm') + '">' + (ask ? 'Needs a person' : 'Measured') + '</span>'
      + inner + '</div>';
  };

  var h = '<div class="rep">'
    + '<div class="noprint" style="margin-bottom:14px;display:flex;gap:7px;flex-wrap:wrap">'
    +   '<button class="btn pri" onclick="window.print()">Print / save as PDF</button>'
    +   '<button class="btn" onclick="paintSummary();setView(\'summary\')">\u2190 Summary</button></div>'
    + '<div style="font-size:var(--fs-1);color:var(--grey-2);letter-spacing:.06em;text-transform:uppercase;'
    +   'font-weight:700">' + esc(r.standard) + '</div>'
    + '<div style="font-size:var(--fs-1);color:var(--grey-2);margin-top:3px">supersedes ' + esc(r.supersedes)
    +   ' \u00b7 generated ' + new Date(r.generated_at).toLocaleString()
    +   ' \u00b7 scope: ' + esc(r.scope) + '</div>'
    /* ⭐ our words mapped onto the standard's, so a reader can look ours up in theirs rather than learning ours */
    + (r.names ? '<div style="font-size:var(--fs-1);color:var(--grey-2);margin-top:7px;line-height:1.6">'
        + 'A case is a <b>' + esc(r.names.case) + '</b> \u00b7 a sitting is a <b>' + esc(r.names.run) + '</b>'
        + ' \u00b7 a failure is an <b>' + esc(r.names.incident) + '</b></div>' : '');

  r.sections.forEach(function (s) {
    var b = s.body || {};
    var inner;

    if (s.id === '1') {
      inner = '<dl class="kv">'
        + '<dt>Tested by</dt><dd>' + esc(b.tested_by || '\u2014') + '</dd>'
        + '<dt>Period</dt><dd>' + (b.period ? new Date(b.period.from).toLocaleString() + ' \u2014 '
            + new Date(b.period.to).toLocaleString() : 'nothing recorded yet') + '</dd>'
        + '<dt>Sittings</dt><dd>' + b.runs + '</dd>'
        + '<dt>How</dt><dd>' + esc((b.kinds || []).join(', ') || '\u2014') + '</dd>'
        + '<dt>Levels</dt><dd>' + esc((b.layers || []).join(', ') || '\u2014') + '</dd>'
        + '<dt>Build</dt><dd>' + esc((b.builds || []).join(', ') || 'not recorded') + '</dd>'
        + '</dl>';
    } else if (s.id === '2') {
      var t = b.totals || {};
      inner = '<div class="big-n">'
        + '<div><b>' + b.coverage_pct + '%</b><span>covered</span></div>'
        + '<div><b class="big">' + b.pass_pct + '%</b><span>of those, passed</span></div>'
        + '<div><b>' + t.total + '</b><span>cases</span></div>'
        + '<div><b class="bad">' + t.failed + '</b><span>failed</span></div>'
        + '<div><b class="warnn">' + t.blocked + '</b><span>blocked</span></div>'
        + '<div><b class="warnn">' + t.untested + '</b><span>never run</span></div></div>'
        + '<div class="scroll"><table class="sum" style="margin:0"><tr><th>Feature</th>'
        + '<th class="num">Cases</th><th class="num">Passed</th><th class="num">Failed</th>'
        + '<th class="num">Blocked</th><th class="num">Never run</th></tr>'
        + (b.by_feature || []).map(function (f) {
            return '<tr><td><span class="area">' + esc(f.module_key) + '</span>'
              + '<span class="sub">' + esc(f.module_name || '') + '</span></td>'
              + '<td class="num">' + f.total + '</td>'
              + '<td class="num big">' + f.passed + '</td>'
              + '<td class="num' + (Number(f.failed) ? ' bad' : ' dim') + '">' + f.failed + '</td>'
              + '<td class="num' + (Number(f.blocked) ? ' warnn' : ' dim') + '">' + f.blocked + '</td>'
              + '<td class="num' + (Number(f.untested) ? ' warnn' : ' dim') + '">' + f.untested
              + (Number(f.high_untested) ? ' \u26a0' : '') + '</td></tr>'; }).join('')
        + '</table></div>';
    } else if (s.id === '3' || s.id === '4') {
      var items = b.items || [];
      inner = items.length
        ? items.map(function (x) {
            return '<div class="inc"><span class="k2">' + esc(x.case_key) + '</span> '
              + '<span class="' + (x.status === 'fail' ? 'bad' : 'warnn') + '">' + esc(x.status.toUpperCase())
              + '</span> <span class="dim">' + esc(x.tester_name || '') + ' \u00b7 '
              + new Date(x.at).toLocaleString() + '</span>'
              + (x.note ? '<div style="margin-top:3px">' + esc(x.note) + '</div>' : '')
              + (x.evidence ? '<div class="sub">' + esc(x.evidence) + '</div>' : '') + '</div>'; }).join('')
        : '<span class="dim">None.</span>';
    } else if (s.id === '8') {
      inner = '<dl class="kv"><dt>Cases</dt><dd>' + b.cases + '</dd>'
        + '<dt>Features</dt><dd>' + b.features + '</dd></dl>'
        + '<div class="sub" style="margin-top:7px">' + esc(b.note || '') + '</div>';
    } else if (s.id === '10') {
      inner = '<div>' + esc(s.asks) + '</div>'
        + '<div class="sign"><div>Name and role</div><div>Date</div></div>';
    } else {
      inner = '<div>' + esc(s.asks || '') + '</div>'
        + ((s.caveats || []).length
            ? '<ul class="caveat">' + s.caveats.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('')
              + '</ul>' : '');
    }
    h += sec(s, inner);
  });

  h += '</div>';
  document.getElementById('main').innerHTML = h;
}

async function paintSummary(){
  if (!COVER.length && !RUNS.length) {
    document.getElementById('main').innerHTML = '<div class="say">Reading the summary…</div>';
    await loadSummary();
  }
  tally();

  var h = '<h2 style="font-size:var(--fs-3);margin:4px 0 9px">Coverage by area</h2>'
    + '<div style="color:var(--grey-2);font-size:var(--fs-1);margin-bottom:10px;line-height:1.5">'
    + 'The latest word on every case. \u26a0 An area with cases nobody has run is the one to do next \u2014 a wall '
    + 'of green runs says nothing about a module nobody has opened.</div>'
    + '<div class="scroll"><table class="sum"><tr><th>Area</th><th>Covered</th>'
    + '<th class="num">Passed</th><th class="num">Failed</th><th class="num">Blocked</th>'
    + '<th class="num">Not run</th></tr>';

  if (!COVER.length) {
    h += '<tr><td colspan="6" class="dim">No cases on the board yet.</td></tr>';
  } else {
    COVER.forEach(function(a){
      var done = a.total - a.untested;
      h += '<tr class="clickable" onclick="jumpTo(\'' + esc(a.module_key) + '\')">'
        + '<td><span class="area">' + esc(a.module_key) + '</span>'
        +   '<span class="sub">' + esc(a.module_name || '') + '</span></td>'
        + '<td style="min-width:140px"><div class="bar-cov">'
        +   '<i style="width:' + pct(a.passed, a.total) + '%;background:var(--ok)"></i>'
        +   '<i style="width:' + pct(a.failed, a.total) + '%;background:var(--bad)"></i>'
        +   '<i style="width:' + pct(a.blocked, a.total) + '%;background:var(--warn)"></i>'
        + '</div><span class="sub">' + done + ' of ' + a.total + '</span></td>'
        + '<td class="num">' + (a.passed ? '<span class="big">' + a.passed + '</span>' : '<span class="dim">0</span>') + '</td>'
        + '<td class="num">' + (a.failed ? '<span class="bad">' + a.failed + '</span>' : '<span class="dim">0</span>') + '</td>'
        + '<td class="num">' + (a.blocked ? '<span class="warnn">' + a.blocked + '</span>' : '<span class="dim">0</span>') + '</td>'
        /* \u26a0 the \u26a0 marks High-priority cases nobody has run \u2014 the number that should pull somebody in */
        + '<td class="num">' + (a.untested ? '<span class="warnn">' + a.untested
            + (a.high_untested ? ' \u26a0' : '') + '</span>' : '<span class="dim">\u2014</span>') + '</td></tr>';
    });
  }
  h += '</table></div>';

  h += '<h2 style="font-size:var(--fs-3);margin:4px 0 9px">Sittings</h2>'
    + '<div style="color:var(--grey-2);font-size:var(--fs-1);margin-bottom:10px;line-height:1.5">'
    + 'Each run, newest first \u2014 a person working through a module, or an automated suite reporting itself. '
    + 'Click one to read what it recorded.</div>'
    + '<div class="scroll"><table class="sum"><tr><th>Run</th><th>Who</th><th>When</th>'
    + '<th class="num">Pass</th><th class="num">Fail</th><th class="num">Blocked</th><th class="num">Total</th></tr>';

  if (!RUNS.length) {
    h += '<tr><td colspan="7" class="dim">Nothing recorded yet.</td></tr>';
  } else {
    RUNS.forEach(function(r){
      h += '<tr class="clickable" onclick="openRun(\'' + esc(r.run_id) + '\')">'
        + '<td><b>' + esc(r.run_label || 'unlabelled') + '</b>'
        +   '<span class="sub">' + esc(r.kinds || '') + (r.build ? ' \u00b7 ' + esc(r.build) : '') + '</span></td>'
        + '<td>' + esc(r.testers || '') + '</td>'
        + '<td class="dim">' + ago(r.finished) + '</td>'
        + '<td class="num">' + (Number(r.passed) ? '<span class="big">' + r.passed + '</span>' : '<span class="dim">0</span>') + '</td>'
        + '<td class="num">' + (Number(r.failed) ? '<span class="bad">' + r.failed + '</span>' : '<span class="dim">0</span>') + '</td>'
        + '<td class="num">' + (Number(r.blocked) ? '<span class="warnn">' + r.blocked + '</span>' : '<span class="dim">0</span>') + '</td>'
        + '<td class="num"><b>' + r.total + '</b></td></tr>';
    });
  }
  h += '</table></div>';
  document.getElementById('main').innerHTML = h;
}

/** a row in the coverage table takes you to that area, on the Cases tab — the summary is for deciding, the cases are for doing */
function jumpTo(mod){
  document.getElementById('f_mod').value = mod;
  document.getElementById('f_state').value = 'todo';
  setView('cases');
}

/**
 * ⭐ WHAT ONE SITTING RECORDED — the answer to "the suite just ran, what happened?"
 * ⚠️ Failures first. A run of 174 results is not read top to bottom; the four that failed are the whole point,
 * and putting them after 170 passes is the same as not showing them.
 */
async function openRun(id){
  try {
    var r = await call('/api/testing/results?run_id=' + encodeURIComponent(id));
    var rows = (r.results || []).slice();
    var rank = { fail:0, blocked:1, skipped:2, pass:3 };
    rows.sort(function(a,b){ return (rank[a.status] - rank[b.status]) || (a.case_key < b.case_key ? -1 : 1); });
    var first = rows[0] || {};
    var h = '<div style="margin-bottom:12px"><button class="btn" onclick="paintSummary()">\u2190 Back to the summary</button></div>'
      + '<h2 style="font-size:var(--fs-3);margin:0 0 9px">' + esc(first.run_label || 'This sitting') + '</h2>'
      + '<div class="scroll"><table class="sum"><tr><th>Case</th><th>Verdict</th><th>Who</th><th>What they saw</th></tr>';
    rows.forEach(function(x){
      var cls = x.status === 'pass' ? 'big' : (x.status === 'fail' ? 'bad' : (x.status === 'blocked' ? 'warnn' : 'dim'));
      h += '<tr><td><span class="area">' + esc(x.case_key) + '</span>'
        +   '<span class="sub">' + esc(x.run_kind || '') + (x.layer ? ' \u00b7 ' + esc(x.layer) : '') + '</span></td>'
        + '<td><span class="' + cls + '">' + esc(x.status.toUpperCase()) + '</span></td>'
        + '<td class="dim">' + esc(x.tester_name || '') + '</td>'
        + '<td>' + esc(x.note || '') 
        +   (x.evidence ? '<span class="sub">' + esc(x.evidence) + '</span>' : '') + '</td></tr>';
    });
    h += '</table></div>';
    document.getElementById('main').innerHTML = h;
  } catch (e) { say('Could not read that run: ' + e.message, true); }
}

function paint(){
  tally();
  var list = shown(), byMod = {}, order = [];
  list.forEach(function(c){ if (!byMod[c.module_key]) { byMod[c.module_key] = []; order.push(c.module_key); }
    byMod[c.module_key].push(c); });

  if (!list.length) { document.getElementById('main').innerHTML =
    '<div class="say"><b>Nothing matches.</b>Clear the search or choose a different filter.</div>'; return; }

  var h = '';
  order.forEach(function(k){
    var first = byMod[k][0];
    h += '<section class="mod"><div class="modhead"><span class="k">' + esc(k) + '</span>'
       + '<h2>' + esc(first.module_name || '') + '</h2>'
       + (first.intro ? '<div class="intro">' + esc(first.intro) + '</div>' : '') + '</div>';
    byMod[k].forEach(function(c){ h += caseHTML(c); });
    h += '</section>';
  });
  document.getElementById('main').innerHTML = h;
}

function caseHTML(c){
  var l = LAST[c.case_key], st = l ? l.status : '';
  var open = !!OPEN[c.case_key];
  var last = l
    ? '<span class="last ' + (st === 'fail' ? 'fail' : '') + '">' + st.toUpperCase()
      + ' · ' + esc(l.tester_name || '') + ' · ' + ago(l.at)
      + (l.run_kind ? ' · ' + esc(l.run_kind) : '') + (l.note ? ' — ' + esc(l.note) : '') + '</span>'
    : '<span class="last">not tested yet</span>';

  var h = '<article class="case ' + st + '" id="c_' + esc(c.case_key) + '">'
    + '<div class="chead" onclick="toggle(\'' + esc(c.case_key) + '\')">'
    +   '<span class="key">' + esc(c.case_key) + '</span>'
    +   '<span class="ttl">' + esc(c.title || '') + last + '</span>'
    /* ⚠️ ON THE ROW, not behind a filter — a tester must see it without going looking for it. */
    +   (STALE[c.case_key]
          ? '<span class="lay" style="background:#fbf3e3;border-color:#e8d7ae;color:#8a5a1e" title="'
            + esc('Clause ' + STALE[c.case_key].clause + ' is now v' + STALE[c.case_key].clause_now
                  + '; this case cites v' + STALE[c.case_key].cited_version + '.')
            + '">spec moved</span>'
          : '')
    +   (c.layer ? '<span class="lay">' + esc(c.layer) + '</span>' : '')
    +   '<span class="pri">' + esc(c.priority || '') + '</span>'
    + '</div>';

  if (open) {
    h += '<div class="body">';
    if (c.pre)  h += '<div class="meta"><b>Before you start:</b> ' + esc(c.pre) + '</div>';
    if (c.data) h += '<div class="meta"><b>Use:</b> ' + esc(c.data) + '</div>';
    if ((c.steps || []).length) {
      h += '<table class="steps"><tr><th></th><th>Do this</th><th>You should see</th></tr>';
      c.steps.forEach(function(s, i){
        h += '<tr><td class="n">' + (i+1) + '</td><td>' + esc(s[0]) + '</td><td>' + esc(s[1]) + '</td></tr>'; });
      h += '</table>';
    }
    if (c.note) h += '<div class="note">' + esc(c.note) + '</div>';

    h += '<div class="acts">'
      +  '<input type="text" id="n_' + esc(c.case_key) + '" placeholder="What did you see? (kept with the result)">'
      +  '<button class="btn pass"    onclick="mark(\'' + esc(c.case_key) + '\',\'pass\')">Pass</button>'
      +  '<button class="btn fail"    onclick="mark(\'' + esc(c.case_key) + '\',\'fail\')">Fail</button>'
      +  '<button class="btn blocked" onclick="mark(\'' + esc(c.case_key) + '\',\'blocked\')">Blocked</button>'
      +  '<button class="btn"         onclick="mark(\'' + esc(c.case_key) + '\',\'skipped\')">Skip</button>'
      +  '<button class="btn"         onclick="caseHistory(\'' + esc(c.case_key) + '\')">History</button>'
      + '</div>'
      + '<div class="hist" id="h_' + esc(c.case_key) + '"></div>'
      + '</div>';
  }
  return h + '</article>';
}

function toggle(k){ OPEN[k] = !OPEN[k]; repaintCase(k); }

/**
 * ⭐⭐ REPAINT THE ROW, NEVER THE PAGE. Standing rule, and it matters most here: repainting the board would
 * collapse every case a tester had open and scroll them back to the top, in the middle of working through a
 * module. One card changes, everything else stays exactly where it was.
 */
function repaintCase(k){
  var el = document.getElementById('c_' + k);
  var c = CASES.filter(function(x){ return x.case_key === k; })[0];
  if (!el || !c) { paint(); return; }
  var tmp = document.createElement('div');
  tmp.innerHTML = caseHTML(c);
  el.parentNode.replaceChild(tmp.firstChild, el);
  tally();
}

async function mark(k, status){
  var box = document.getElementById('n_' + k);
  var note = box ? box.value.trim() : '';
  var c = CASES.filter(function(x){ return x.case_key === k; })[0] || {};
  saveRun();
  try {
    var r = await call('/api/testing/results', { method:'POST', body: {
      run_id: RUN.id, run_label: RUN.label || null,
      results: [{ case_key: k, module_key: c.module_key, status: status, tester_name: who() || undefined,
                  run_kind: RUN.kind || 'manual', layer: c.layer || null, note: note || null }] }});
    /* ⚠️ take the row the SERVER wrote, not the one we hoped it would — the time and the tester come from it */
    var saved = (r.results || [])[0];
    LAST[k] = Object.assign({ case_key:k, status:status, note:note, run_kind:RUN.kind,
                              tester_name:(sess()||{}).name || 'you', at:new Date().toISOString() }, saved || {});
    OPEN[k] = (status === 'fail' || status === 'blocked');   /* a failure stays open — you are about to write a note */
    repaintCase(k);
  } catch (e) { say('Not recorded: ' + e.message, true); }
}

/* ⚠ NOT `history` — a top-level function of that name writes to `window.history`, which is a read-only
   accessor on Window. The assignment fails silently in strict-ish contexts and the button does nothing. */
async function caseHistory(k){
  var box = document.getElementById('h_' + k);
  if (!box) return;
  box.textContent = 'reading…';
  try {
    var r = await call('/api/testing/results?case_key=' + encodeURIComponent(k));
    var rows = r.results || [];
    if (!rows.length) { box.textContent = 'Nothing recorded for this case yet.'; return; }
    /* ⭐ every row, oldest at the bottom — a flaky case is only visible as a sequence */
    box.innerHTML = rows.map(function(x){
      return '<span class="r">' + esc(x.status.toUpperCase()) + ' · ' + esc(x.tester_name || '')
        + ' · ' + esc(x.run_kind) + (x.layer ? ' · ' + esc(x.layer) : '')
        + ' · ' + new Date(x.at).toLocaleString()
        + (x.run_label ? ' · ' + esc(x.run_label) : '')
        + (x.note ? ' — ' + esc(x.note) : '')
        + (x.case_version ? ' <i>(case v' + x.case_version + ')</i>' : '') + '</span>'; }).join('');
  } catch (e) { box.textContent = e.message; }
}

/* ⭐ the lab links straight here — /testing.html#report opens the report rather than the case list */
if (location.hash === '#report') { setTimeout(function(){ setView('report'); }, 0); }
else if (location.hash === '#summary') { setTimeout(function(){ setView('summary'); }, 0); }
loadRun();
load();
