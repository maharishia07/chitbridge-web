<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgers – Chart of Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM9 7h6M9 11h6M9 15h4"/></svg></div>
      <div class="brand-text label"><span class="tag">BUS014</span><span class="brand-name">Ledger</span></div>
    </div>
    <nav class="nav scroll" id="nav" aria-label="Books"></nav>
    <div class="side-foot">
      <button type="button" class="nav-btn" id="toggleNav" aria-label="Collapse sidebar" aria-expanded="true">
        <svg class="nav-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span class="label">Collapse</span>
      </button>
    </div>
  </aside>

  <main class="main scroll">
    <header class="top">
      <div class="top-row">
        <div class="titles">
          <div class="crumb">BOOKS / LEDGERS</div>
          <h1>Chart of accounts</h1>
          <div class="summary" id="summary"></div>
        </div>
        <div class="reports">
          <button type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 21h14M4 8h16M7 8l-3 7h6zM17 8l-3 7h6z"/></svg>Trial balance</button>
          <button type="button" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16M8 15l4-4 3 3 5-6"/></svg>P&amp;L</button>
          <button type="button" class="btn btn-primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/></svg>Balance sheet</button>
        </div>
      </div>
      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="sr-only">Search ledgers</span>
          <input type="search" id="q" placeholder="Search by code or name — e.g. 6010 or GST">
        </label>
        <div class="chips" id="chips"></div>
        <div class="bulk">
          <button type="button" class="link-btn" id="expandAll">Expand all</button>
          <button type="button" class="link-btn" id="collapseAll">Collapse all</button>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>

  <button type="button" class="assistant">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    Assistant <span class="online"><i></i>Online</span>
  </button>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
